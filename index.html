\nOscar guided FY26 revenue to $18.9 billion against $18.6 billion expected with operating income of $600 million versus $399 million, on a Q2 medical loss ratio of 79.2%. Datadog raised FY26 revenue to $4.46 billion and counted 4,720 customers above $100,000 ARR, up 23%. Unity's management called it \"arguably the best quarter in Unity's history as a public company,\" guiding Q3 EBITDA to $188 million against a $152 million estimate.\n\nCelsius was the ugly one. WOLF Financial broke it by brand: Celsius brand revenue down about 11.7% on trade and promo spend, inventory rebalancing and club channel softness, Alani Nu at $364.4 million as its largest customer moved into PepsiCo's distribution system, Rockstar Energy at $66.5 million. GAAP net income fell 45% to $55.3 million and gross margin slipped to 48.1% from 51.5%.\n\n## The memory desks capitulated on targets\n\nTipRanks summarized the post-June-quarter reset on SanDisk. Jefferies made the largest cut, to $1,750 from $3,000, while keeping Buy. Citi moved to $2,100, Mizuho to $1,900, and RBC raised to $1,300 from $1,000 while staying Sector Perform. The concern was the September quarter specifically: moderating NAND pricing, weaker average selling price gains, lower gross margin guidance, and Jefferies flagging that Edge inventory builds could pressure bit growth. Longer term, Mizuho still models roughly 70% growth in 2027. LuxAlgo pointed at the one name ignoring all of it, posting that \"$MU didn't get the memory selloff memo.\"\n\n## Capital, capex and the macro print\n\nAlphabet started marketing a ten-part investment grade bond sale of up to $25 billion, maturities from two to 40 years, initial talk on the longest tranche about 1.55% over Treasuries. That matches what Amazon raised last month and is Alphabet's third trip to debt markets since November. Microsoft opened its largest India data center and a fourth AI region there inside a roughly $20.5 billion country commitment, with Adani and HDFC Bank already customers. The UAE is weighing as much as $6.3 billion for an AI data center in Japan.\n\nInitial jobless claims came in at 199,000 against 203,000 expected and 198,000 prior. Shay Boloor relayed the Financial Times story that Fed Chair Kevin Warsh is open to a September hike if inflation runs hot, the same report Polymarket Money pushed at 11:38AM.\n\nSmaller names delivered real milestones. $OKLO hit first criticality at its Groves Test Reactor under a year after breaking ground, the first DoE Reactor Pilot Program project to do so on a private greenfield site. $ASTS began integration testing across eight European countries with Vodafone, Orange, Telef\u00f3nica, Deutsche Telekom and Vodafone Ukraine. $IONQ won a $28 million DARPA extension for 125 optical atomic clocks plus an NRO commercial radar imagery contract. $RKLB flew its 13th Electron of 2026 for Japan's iQPS, who have booked ten more dedicated missions through 2030. In China, Unitree priced its Shanghai STAR Market IPO at $22.35 a share to raise about $904 million after shipping more than 5,500 humanoid robots last year on revenue of $251.9 million, up from $58.2 million, with net profit of $41.2 million.\n\nWhether Terafab is a genuine capex commitment or a narrative to carry $SPCX through six months of scheduled selling comes down to one observable. Civil work in Grimes County was promised within months, so the ground either breaks on schedule or the terawatt target moves.\n", "01kzbqp3bc9hsn20jd3c2sh4pp": "# Real-World Assets Tripled to $7.4 Billion While the Rest of DeFi Shrank 15%\n\n**Source:** Token Terminal and CoinShares (Jean-Marie Mognetti, @jlb_CS), Lookonchain, K A L E O (@CryptoKaleo), On-Chain Mind, Melvin (@MelvinInvests), aixbt, Ignas (@DefiIgnas) and BitQuant ([open original](https://read.readwise.io/read/01kzbqp3bc9hsn20jd3c2sh4pp))\n\nCrypto twitter spent the morning on cat coins while the single most load-bearing document of the day was a joint CoinShares and Token Terminal report showing tokenized real-world assets growing straight through a bear market that took everything else down with it.\n\n## The divergence that defines the cycle\n\nBetween Q2 2025 and Q2 2026, total DeFi deposits fell roughly 15%. Over the same window, RWA deposits across lending platforms and decentralized exchanges more than tripled, from $2.3 billion to $7.4 billion. Spot DEX volumes, still overwhelmingly crypto-native, fell about 70%. RWA spot volumes rose about 220%.\n\nCoinShares CEO Jean-Marie Mognetti gave the reason to care: \"When an asset class grows through a downturn in its host ecosystem, demand is being driven by financial utility, not by market cycles.\"\n\n| Metric | Q2 2025 | Q2 2026 |\n|---|---|---|\n| RWA deposits into DeFi | $2.3B | $7.4B |\n| Total DeFi deposits | baseline | down ~15% |\n| Crypto-native spot DEX volume | baseline | down ~70% |\n| RWA spot DEX volume | baseline | up ~220% |\n\nThe composition matters more than the headline. Tokenized Treasury and multi-strategy funds lead, naming JTRSY, BUIDL and sUSDS, followed by private credit in JAAA, syrupUSDT, syrupUSDC and PRIME, then delta-neutral sUSDe. Almost 70% of all RWA deposits sit on Ethereum lending venues, with Plasma second on Aave's expansion and Solana third through Kamino. On perpetuals, tradeXYZ on Hyperliquid has grown roughly 20x since launch, with open interest concentrated in equity indexes and semiconductor stocks. SK Hynix became one of its largest markets shortly after listing.\n\nYields across the category run 3.2% to 5.5%. Token Terminal counts 118 issuers and $43.9 billion in tokenized asset market cap, with Securitize and Sky each at 10.3% and nobody else above 10%, plus 640 tokenized ETF products where no single fund exceeds 11.6% of market cap. BNB Chain took the top spot by tokenized ETF holder count, ahead of Solana and Base. The scale check that keeps it honest: only about $2.2 billion of a global equity market above $100 trillion has been tokenized, a position Mognetti compares to stablecoins in 2019.\n\n## The trenches moved on Robinhood Chain\n\nLookonchain tracked the actual money. One newly created wallet spent 424 ETH, about $791,000, on 13.14 million $CASHCAT and is now up $956,000 on a position worth $1.75 million. Another trader put roughly $985,000 of ETH into 9.96 million tokens twelve hours later. K A L E O, who had been posting Cash Cats while they were still free, said the floor is thin and sweeps are constant, calling it one of the most obvious blue chip NFT plays he has seen. He has been pushing $YOLO and $HMM for weeks as the two main runners in the PONS ecosystem, and framed the whole thing with the line that matters for sizing: \"Insane part is this is literally the heart of the bear market.\"\n\nThe mechanics underneath came from aixbt. TradePools on Robinhood Chain routes 5 basis points of the 25 basis point LP layer to the creator with 20 accruing for compounding, and the chain's 4 basis point static-pool charge lifts the combined fee to 28.99 basis points. High-turnover pairs deepen faster while thin ones leave locked inventory exposed to stale-price adverse selection. Separately, Tyler_Did_It noted Pump is now beating Hyperliquid on weekly revenue and running neck and neck on the month.\n\n## The on-chain bear case is specific and dated\n\nOn-Chain Mind posted two numbers that do not agree with the mood. Investors who bought Bitcoin's top have spent 70% of the past year selling at a loss, seven days in every ten. More usefully, in the previous three Bitcoin bear markets the six-month to one-year holder cohort stayed underwater for an average of thirteen months, and each time their return to profitability marked the resumption of the bull. This cycle's cohort went underwater in November. That clock points at December.\n\naixbt added the Strategy read: STRC is grinding toward par while Bitcoin absorbs Strategy's selling, giving Michael Saylor room to keep supporting STRC without rattling spot.\n\n## Ethereum argues with itself about issuance\n\nBarnab\u00e9 Monnot proposed faster slots for inclusion in Hegot\u00e1 to All Core Devs, arguing the value accrues to users, the network and ETH, and that Hegot\u00e1 is likely the last sensible window to pay the one-time cost before fast finality, post-quantum and zk work lands. Ethlabs backed it in four words: \"We want to make Ethereum faster.\" Ignas pushed back on the parallel EIP-8361 tapered issuance burn, arguing the Foundation should hunt new burn mechanisms rather than cut staking yield, and pointing at Tron's bandwidth and energy model as the uncomfortable working example. Lookonchain caught whale 0x1A72 pulling 10,500 ETH, about $20.06 million, off OKX inside an hour.\n\n## Regulation and the power trade\n\nPutin signed Russia's first comprehensive crypto law, licensing exchanges, capping retail purchases near $3,700 a year and keeping the ban on crypto as payment. BitQuant's read: \"It's funny how a crypto ban can be portrayed as progress for crypto.\" France has proposed a strategic Bitcoin reserve bill to acquire 2% of total supply.\n\nMelvin published the neocloud math that ties crypto balance sheets to AI. SpaceX generates $30 million to $50 million in annualized revenue per active megawatt of compute. CoreWeave, Nebius and IREN sit at $9.4 million to $10.4 million. Digital Realty and Equinix trail at $3.5 million to $4.4 million. One-year H100 contract rates climbed roughly 40%, from $1.70 per GPU hour in October 2025 to $2.60, with Blackwell B200 running $4.99 to $18 depending on provider. Lambda moved published rates from $2.99 to as high as $4.29 and Verda from $2.29 to $3.25. Gartner expects power constraints to limit 40% of AI data centers by 2027 while GPU lead times run 36 to 52 weeks.\n\nEverything in the RWA thesis holds as long as growth keeps outrunning the crypto cycle. The report is candid that it has not yet: application revenues at lending and trading venues fell year over year, with Hyperliquid still the only venue capturing value at both the application and settlement layer. If RWA volume scales without lifting venue revenue, the tokenization story stays real and the tokens that were supposed to monetize it do not.\n", "01kzbwnynyz2cn7xfb6e0mww55": "# Why the 30 Percent Memory Drawdown Is Not the Cycle Turning\n\n**Source:** Milk Road AI, host LG with analyst Melvin, recorded August 5 and published August 6, 2026 ([open original](https://read.readwise.io/read/01kzbwnynyz2cn7xfb6e0mww55))\n\nMicron, SK Hynix and Samsung all fell 30 to 40 percent in six weeks and the semiconductor index posted its worst monthly drop since 2022. The case made here is that the mechanism that used to end memory cycles has been physically removed.\n\n## The numbers the three of them just printed\n\nMelvin's frame is that memory is the foundational layer of every AI system, and that **Samsung, SK Hynix and Micron control 89 percent of the global market**.\n\n| Company | Latest quarter | Margin |\n|---|---|---|\n| SK Hynix | Q1 2026 revenue tripled year over year, first time crossing 50 trillion won, operating profit up fivefold in a single quarter | 72 to 75 percent, HBM sold out |\n| Samsung | Q2 2026 operating profit of 89.5 trillion won, 19 times where it sat a year ago | inside the 70 to 80 percent band |\n| Micron | $41.6 billion in a single quarter, beating Wall Street by 16 percent, free cash flow guided to $30 billion next quarter | 81.2 percent operating margin |\n\nThe total addressable market he shows runs **$214 billion in 2025, $896 billion in 2026, $1.34 trillion in 2027 and $1.68 trillion in 2028**. An 8x move in three years.\n\n## The reason the old cycle cannot repeat\n\nThe classic memory bust worked like this. Demand rises, manufacturers build fabs, supply arrives 18 months later, prices collapse, investors lose money, repeat every four years.\n\nHigh bandwidth memory breaks that loop mechanically. **One gigabyte of HBM consumes roughly three times the wafer capacity of one gigabyte of standard DRAM.** So every line converted to HBM removes conventional DRAM supply at the same time it adds HBM supply. Shortages appear in both categories at once, and consumer prices for phones, laptops and consoles rise as collateral damage.\n\nThe escape hatch is gone too. In previous cycles a manufacturer under pressure could flood the market with commodity DRAM to cool prices. Doing that now means abandoning **70 to 80 percent HBM margins for roughly 20 percent commodity margins**. Nobody will.\n\nThe forecasts follow. **Goldman Sachs revised DRAM pricing up 250 to 300 percent for 2026 with another 300 to 350 percent in 2027.** Jefferies calls for a further 40 to 50 percent. **Bernstein models average selling prices at $2.23 per gigabyte by end of 2027, nearly five times 2025.**\n\n## The demand side, sized\n\nHyperscaler memory spend goes **$72.8 billion in 2025 to $335.7 billion in 2026, a 361 percent increase in one year, then $761.3 billion in 2027**. Morgan Stanley puts total capex at **$1.3 to $1.4 trillion**.\n\nMade concrete: a single Nvidia **GB200 requires 192 GB of HBM3e**, and one **NVL72 rack requires 13,824 GB**. Google, Meta and Anthropic deploy those by the thousand, and the GB200 is already two years old with Rubin and Feynman behind it. **HBM demand runs from roughly 400,000 gigabytes in 2023 to nearly 5.8 million by 2027, a 15x move.** Nomura's forecast for AI-server memory alone goes **$60 billion in 2024 to $107 billion in 2025 to $1.18 trillion in 2029 and $1.4 trillion by 2030**.\n\nMelvin's framing of what changed: the industry left the training era and entered the inference era. Every query, every chat log, every agent running in parallel needs memory, and robotics and autonomous vehicles are queued behind that.\n\n## Supply relief is not arriving before late 2028\n\nEvery major fab expansion he maps lands too late. **Micron's Hiroshima fab does not produce HBM wafer output until the second half of 2028. Singapore is also second half. Idaho reaches meaningful volume around mid-2027. New York is 2030. Samsung's expansions arrive 2028 to 2029.**\n\nEven a finished building does not deliver chips. **HBM requires precision stacking tools that take 12 months to manufacture and deliver.** That equipment bottleneck is why only three suppliers exist.\n\n## The structural change: take-or-pay contracts\n\nThis is the load-bearing argument. Bernstein modelled it and found **roughly 35 percent of all memory bits shipped between 2027 and 2029, about 160,000 million gigabytes, already locked into long-term agreements at a floor price of $0.26 per gigabyte against a current spot price of $0.29.** The floor sits only about 10 percent below today's market.\n\nThe terms are take-or-pay, structured like a commercial lease. The landlord gets paid whether or not the tenant had a slow quarter. **Micron alone has signed 16 strategic agreements and collected $22 billion in customer prepayments for chips it has not manufactured yet.** No prior memory cycle had any of this.\n\n## The names, including the ones with less hair on them\n\n**Micron** is his favourite despite holding third place in HBM at 20 to 21 percent share, because it is the only American producer and this administration favours American companies. CEO Sanjay Mehrotra is close to Nvidia and to Elon Musk. The stock ran from the $300s to $1,200 and now sits near $900 to $950.\n\n**Samsung** is his value setup. Korean equities are up 80 to 90 percent year to date, yet investors pay **less per dollar of forward earnings today than at the start of the year**. The June sell-off was mechanical rather than fundamental: **foreign investors sold a net $32.37 billion of Korean equities**, the largest outflow on record, because Samsung and SK Hynix together are nearly half the KOSPI and had breached active portfolio limits. Single-stock leveraged ETFs amplified it, and a forced liquidation of Leopold Aschenbrenner's FX-leveraged SK Hynix position into Citadel added to the cascade. Meanwhile **Samsung passed final HBM4 qualification with both Nvidia and AMD and shipped globally first, ahead of SK Hynix and Micron**, at **11.7 GB per second against Nvidia's 8 to 10 GB requirement**. It also has a Broadcom partnership at 2 nanometers and below, reports of Anthropic routing custom silicon through it, and an active buyback.\n\nOn the equipment side he names **Lam Research** first, where memory has grown to roughly 39 percent of systems revenue in a year and management raised the 2026 wafer fab equipment industry forecast to **$140 billion** while saying demand is no longer the constraint. Clean room and installation capacity are. **Applied Materials** and **KLA** follow. For broad exposure he points at the DRAM ETF, and notes Samsung shares require Interactive Brokers.\n\n## The bear case he takes seriously and the one he does not\n\n**CXMT**, China's largest DRAM maker, raised **$9.8 billion** in its IPO and closed up **466 percent** on debut, doubling share from 4 percent to 7.8 percent of DRAM in under a year. He dismisses it because those gains sit entirely in commodity DDR5 and LPDDR5, and because export controls on stacking tools mean CXMT's yields waste enough that **its prices are reportedly higher than Micron, Samsung and SK Hynix**.\n\nThe one he respects is algorithmic. The TurboQuant paper compressing KV cache already caused a sell-off. A genuine step change in memory efficiency is the thing he says would worry him.\n\n## The one variable that would change the call\n\nWhether hyperscaler capex actually clears the **$1.3 to $1.4 trillion** Morgan Stanley models. The take-or-pay contracts protect the memory makers through 2029 only if the counterparties keep funding the buildout that justified them. If the AI capex cycle breaks before those floors mature, 35 percent of bits are locked at $0.26 and the other 65 percent reprice to whatever the spot market will bear, and the 81 percent operating margin goes with it.\n", "01kzbwnysyhaqgf01r9ys41kqw": "# SpaceX Beat Consensus by a Billion and the Stock Fell 13 Percent Anyway\n\n**Source:** Milk Road, hosted by Kyle, live on August 5 covering SpaceX, Galaxy Digital and Eli Lilly ([open original](https://read.readwise.io/read/01kzbwnysyhaqgf01r9ys41kqw))\n\nThree earnings reports in one sitting, and one argument runs through all of them. Demand for compute is not the constraint. Capital, power and permitting are.\n\n## The print was good and the tape did not care\n\nSpaceX did **$7.8 billion of revenue against analyst consensus near $6.9 billion**, a beat of almost a billion dollars. The operating detail behind it: **78 launches so far this year, 1,041 tonnes to orbit, 12 million Starlink subscribers, 10,200 satellites in service, and 1.4 gigawatts of AI compute** with **2 gigawatts** guided by year end.\n\n| Segment | Q2 2026 | First half 2026 |\n|---|---|---|\n| Connectivity (Starlink) | about $4.25 billion | $7.5 billion |\n| Space | close to $1 billion | $1.5 billion |\n| Compute and AI | $2.5 billion | $3.4 billion |\n\nCapex is what broke the stock. **Total capex came in at $18 billion, with the $15.8 billion line the street actually watches against an expectation near $11 billion.** Shares fell roughly **13 percent to $108.74** at a valuation of about **$1.45 to $1.5 trillion**. Kyle bought the morning before the run-up, sat on a 10 percent gain, and says he keeps accumulating under $100.\n\nThe cash position blunts the capex fear. SpaceX holds **over $100 billion**, built from the **$85 billion raised at the IPO** plus other sources including a Bitcoin position.\n\n## The compute line carries the whole thesis\n\nThe compute segment already books revenue from **Anthropic, Google and Reflection AI at roughly $2.5 billion a month**, with about **$6 billion of fresh contracts signed in recent weeks**. Ten percent of capacity is reserved internally for Grok and the other 90 percent is leased out.\n\nThe CFO gave the number that separates SpaceX from the hyperscalers. **It takes them one year to become profitable off a data centre build.** Microsoft and Amazon have both recently said three. The stated reason is engineering culture carried over from rockets.\n\nElon Musk's guidance stacks on top. **$100 billion ARR by the end of 2026 \"if we do nothing.\"** The trillion-dollar revenue year moved from **2031 to 2030, with a nonzero chance of 2029**. Capacity lands **closer to 10 gigawatts than 5 by the end of 2027**, with line of sight to 20. At **$30 to $50 billion of annual revenue per gigawatt**, Kyle builds toward **$100 to $150 billion from compute in 2027** plus **$40 to $50 billion from Starlink**, or near **$200 billion of revenue** against today's $1.5 trillion.\n\nTwo second-order effects landed the same night. SpaceX committed to buying **only Nvidia GPUs going forward** and Nvidia closed up 4 percent. The direct-to-device announcement knocked **AT&T and T-Mobile down about 5 percent** in after-hours trade.\n\n## Galaxy Digital is the cheapest thing on the board, on his math\n\nGalaxy fell 13 percent to **$19 a share, a $7.5 billion market cap**, on an **$85 million net loss**. The bear read is that the crypto arm was supposed to fund the data centre buildout and no longer can.\n\nHelios carries **1.63 gigawatts**. Phase one, **200 megawatts**, is live and leased to **CoreWeave on a 15-year lease** at about **$80 million of revenue per quarter**, rising to **$1 billion to $1.2 billion a year** once fully online. The full **5.7 gigawatt pipeline out to 2030** values at **$17 to $30 billion** on his model. The Helios 2 block that could be contracted today is worth **$3 to $6 billion** on its own.\n\nTwo things spooked the market. Mike Novogratz promised a tenant by end of summer and has not announced one, and **Texas just paused new data centre power connections pending a review**. Kyle reads the delay as pricing power rather than failure.\n\nBalance sheet: **$2.5 billion in cash and stablecoins**, roughly **$3.6 billion of digital assets and investments** offset by a loan of similar size against the data centres, so the market prices both at zero. **Bitcoin at 75,000 turns the crypto business profitable and worth about $3 billion. At 85,000 it is $4.5 billion.** Bitcoin sits near 65,000. Full bull case sums to **$45 billion**.\n\n## Eli Lilly is a pharma company building an AI platform\n\nLilly did **$23 billion in Q2 against $20.7 billion expected, up 48 percent year over year**, with **$9.9 billion of that from Mounjaro alone**. On the oral form, Novo Nordisk sold **$495 million in Q2 against Lilly's roughly $90 million**, but Lilly only got the drug into doctors' hands in June and began advertising in July. **Prescriptions doubled in the final week of July versus the first week.**\n\nThe part nobody is paying for: Lilly has partnered with Nvidia on a pharmaceutical R&D platform running on its own GPUs and data centres, using the largest patient dataset in the industry. **AI was not mentioned once on the earnings call.**\n\n## The macro read behind it\n\nThe Nasdaq broke a downtrend line that had held since early June, then eased 0.3 percent. Oil is at **$75 against a $120 peak**. **ISM above 56.** September hike odds sit **below 55 percent** and Polymarket puts a hold at 60 percent. Gold up 4 percent. Google fell 4 percent on **Demis Hassabis moving to Alphabet chief scientist** and Jeff Dean's departure, which Kyle calls a buying opportunity. On memory he stays long **Micron in the $800s** after a run from the $700s, citing Musk naming memory the single biggest bottleneck on the call.\n\n## The one variable that would change the call\n\nThe unlock schedule. Only **5 percent of SpaceX supply trades today, 20 percent frees up tomorrow, and roughly 40 percent is loose by December**, much of it held by employees with life-changing gains and no reason to wait. Every bullish number above assumes the 2027 revenue ramp arrives before that supply clears. If the unlocks absorb cleanly and the stock holds above $100, the compute math gets a chance to prove itself. If it breaks toward a trillion-dollar valuation on employee selling alone, the entry Kyle is waiting for arrives before the revenue does.\n", "01kzbx1756p8grqnqd7ef4jd36": "# Benjamin Cowen Ranks Coldcard Worse Than October 10, And The Chart Has Not Priced It\n\n**Source:** Benjamin Cowen on NFA Live, with his co-host standing in for an absent Rob ([open original](https://read.readwise.io/read/01kzbx1756p8grqnqd7ef4jd36))\n\nCowen almost never calls an event fundamentally damaging. He does here, and the reasoning is a comparison that should bother anyone holding Bitcoin through this midterm year.\n\n## Two disasters, and only one of them moved price\n\nThe Coldcard failure took north of $100 million of Bitcoin from people who had done everything the industry told them to do. Cowen's co-host opens by calling it the worst thing to happen to crypto since October 10 and asks whether that is hyperbole. Cowen says the opposite. Fundamentally this is worse.\n\nHis case rests on what October 10 actually was. From open to close that day Bitcoin fell only 7 percent. The carnage sat in altcoins, and it exposed a weakness that had been there the whole time. Bitcoin dominance rose through 2023, 2024 and 2025, and the same pattern ran in 2019 under higher rates and quantitative tightening. Bitcoin tops out, and the altcoin fragility that was always present becomes visible. Nothing new was created that day.\n\nColdcard is different in kind. These holders did not buy the ETFs and did not leave coins on an exchange. They took the harder path, learned about air gapping and random number generators, and lost anyway. Cowen is explicit that this is not a failure of Bitcoin but an implementation failure by another party, and equally explicit that the distinction will not survive contact with the public. People do not separate Bitcoin from the wallet they used to hold Bitcoin. They conclude the whole thing is a scam.\n\n## The comparison that does the real damage\n\nThe most uncomfortable number in the conversation has nothing to do with the wallet. Bitcoin sits at the same valuation against the S&P 500 that it held five years ago, possibly closer to six. Holders took on custody risk, key management risk and now vendor entropy risk, and have not outperformed an index fund over that stretch.\n\nCowen puts himself in the position of somebody who just lost a stack built over several years and says he does not know what he would do, but there is a good chance he would put money elsewhere and stop worrying about it. The price effect he describes is not a crash. It is drift. Bitcoin sitting humdrum around 60K while the S&P prints new all-time highs is itself the effect, and the fact that Bitcoin is not breaking down does not mean much when it is not breaking up either.\n\n## Where the cycle framework puts this\n\nEverything he says next is midterm-year mechanics. Retail interest fades through the summer, disappears by year end, and one final drop scares people before the next bull market starts. In 2022 the catalyst was FTX. In 2018 it was a roughly 50 percent drop at the end of the year. He does not know what supplies the capitulation this time, and he lists candidates without ranking them: the AI hacking theme, the BIP 110 controversy, treasury companies that look sketchy. He expects to find out within two months.\n\nOn stocks he has been calling for a correction starting around September, which in the last three midterm years landed twice in September and once in August. His pushback to the objection that AI is still fine: nothing was wrong with AI last month either and you still got a correction.\n\n## SpaceX is a normal post-IPO digestion\n\nThe stock beat expectations in its first earnings as a public company and sold off anyway on capital expenditure commitments. Cowen calls this ordinary. Tesla rallied 50 to 60 percent out of its launch and then went nowhere for the rest of that midterm year, and he believes both SpaceX and Tesla listed in June of midterm years. Apple did the same after listing, and Warren Buffett's crew has not bought an IPO since something like the 1950s for exactly this reason. Lockups are still unwinding. He expects the stock subdued for the rest of the year while staying long-term bullish, and his co-host would be interested below $100.\n\n## He does not care about CLARITY\n\nAsked whether the bill might squeeze through before the recess, Cowen gives the least commercial answer available. He has no idea, and he does not really care. The ETFs and the strategic reserve were supposed to be game changers and were not, and this past cycle was the weakest in the asset's history. His memory is that last Q4 they predicted the early 2026 drop would be blamed on CLARITY failing, and that is exactly what happened before the blame rotated to Jane Street, and nobody remembers that either now. His summary is that everything genuinely fun about crypto happened before governments got involved.\n\n## The one variable that would change the call\n\nWhether the Coldcard damage shows up in the next capitulation candle or gets absorbed without one. Cowen's framework needs a final flush before the next bull market, and he says that flush always gets blamed on whatever is in the headlines at the time. If Bitcoin grinds through September and October without a scare, holding the 60K area while the S&P keeps making highs, then the midterm-year template he is trading has broken and the Coldcard event was priced the moment it happened.\n", "01kzc0pz4p7gw3bvc10x1qvxbm": "# Treasury Says It Will Borrow $1.36 Trillion In Six Months And Interest Now Outranks Defense\n\n**Source:** ClearValue Tax, reading the US Treasury's August 3 borrowing statement line by line against the Treasury's own deficit and interest charts ([open original](https://read.readwise.io/read/01kzc0pz4p7gw3bvc10x1qvxbm))\n\nThis is a numbers walkthrough rather than an argument, and every figure comes off a government page the presenter shows on screen. The forecast at the end is his own and he says so.\n\n## The borrowing estimate, and the revision inside it\n\nTreasury's statement released **August 3** reads that during the July through September 2026 quarter it expects to borrow **$739 billion in privately held net marketable debt**. Marketable means bills, notes, bonds and TIPS. Privately held means the lenders are individuals, banks, pension funds, foreign governments and foreign investors. Net means some maturing debt gets repaid, and the balance still grows by $739 billion.\n\nThe revision matters more than the level. That estimate is **$68 billion higher than the same forecast made in May 2026**, three months earlier. Treasury's stated reason is less cash flow than initially projected. Treasury also expects to borrow another **$628 billion in the October through December quarter**.\n\n| Item | Amount |\n|---|---|\n| Q3 2026 borrowing estimate | $739 billion |\n| Revision above the May estimate | $68 billion |\n| Q4 2026 borrowing estimate | $628 billion |\n| Six-month total | roughly $1.36 trillion |\n\n## Where the stock stands\n\nThe national debt is **$39.7 trillion** right now, taken off the government's own site, and does not count unfunded liabilities. It stood at **$37.64 trillion at the end of fiscal 2025**. On the borrowing schedule above it reaches roughly **$41 trillion before the end of this year**.\n\nThe mechanism is not complicated and he refuses to dress it up. In fiscal 2025 the government spent **$7 trillion**, collected **$5.23 trillion** mostly in taxes, and borrowed the **$1.78 trillion** difference. Repeat that annually and you arrive where the counter now sits.\n\nFiscal 2026 is not over so it does not appear on Treasury's completed charts, but the deficit tracker through the end of June shows **$1.37 trillion**, running slightly worse than the same point in 2025.\n\n## Interest is now the largest single line\n\nThrough the end of June this fiscal year, the government has paid **$827 billion in interest expense**. At the same point in fiscal 2025 it had paid **$749 billion**.\n\nThat $827 billion is more than Medicare, more than national defense, more than Medicaid, and more than all welfare programs combined. Each year since 2020 the figure has grown.\n\n## Why next year's interest bill is close to arithmetic rather than forecast\n\nThe presenter's own claim is that the published projections for future interest costs are too low, and his reasoning runs on two published numbers.\n\n| Fiscal year | Average interest rate on federal debt |\n|---|---|\n| 2025 | 3.36% |\n| 2026 | approximately 3.42% |\n\nMore debt at a higher average rate. He then pre-empts the obvious objection. A higher market rate does not change the coupon on debt already issued. What it changes is refinancing, and the refinancing schedule is already set: the average maturity of the debt is roughly **5.5 years**, and **33% of it matures in less than 12 months**. A third of $39.7 trillion has to be reissued inside a year at whatever the market charges then.\n\n## The prediction, labelled as one\n\nFrom here he leaves the documents and says so. His view is that when the next economic crisis arrives the government borrows another **$2 to $3 trillion in one move**, because a recession collapses tax receipts and widens the deficit, and the government cannot afford that. His stated high-confidence call is that the **Federal Reserve steps in as buyer of last resort and prints trillions**.\n\nThe distributional consequence he draws from it: inflation accelerates, wages fail to keep up, and holders of assets keep pace better than people without them. He names the assets specifically, a primary residence, stocks, a retirement plan holding stocks, precious metals. The gap widens and the middle class keeps shrinking. His closing framing is that the fight is not Republicans against Democrats but the political class against everybody else.\n\nThat last section is opinion resting on a pattern rather than on a Treasury document, and it should be read at a different weight than the borrowing figures above it.\n\n## What is solid and what is not\n\nSolid: the August 3 statement, the $739 billion and $628 billion estimates, the $68 billion revision, the $827 billion of interest paid through June, the 3.36% and 3.42% average rates, the 5.5-year average maturity and the 33% maturing inside a year. Every one of those is retrievable from Treasury.\n\nSofter: the $41 trillion year-end figure is his extrapolation of the published borrowing plan rather than a Treasury projection. The claim that interest expense exceeds each named program is stated against the fiscal-year-to-date spending chart and depends on that comparison staying apples to apples through September. The crisis scenario is unbacked by anything on screen.\n\n## The one variable that would change the call\n\nThe rate at which the 33% refinances. Every other number in this walkthrough is already fixed by law or by statement. The interest bill for fiscal 2027 turns almost entirely on where the front end sits when roughly $13 trillion of the stock rolls, and that is set by whether the Fed cuts into the fall. Front-end yields falling meaningfully takes the compounding out and the projections he calls too low become adequate. Front-end yields holding or rising means the $827 billion through June was the low print, and the interest line pulls further ahead of defense, Medicare and Medicaid with no vote taken on any of it.\n", "01kzc13aqkt8575adknpd5w6tb": "# The 101 Call Is Why STRC Is Free to Short, and Parker White Says Strategy Can Fix It\n\n**Source:** Parker White, founding contributor at Apyx, interviewed by DeFi Dad on the Edge podcast ([open original](https://read.readwise.io/read/01kzc13aqkt8575adknpd5w6tb))\n\nStrategy's STRC preferred spent the past six weeks well below its $100 par, and the DeFi products built on top of it wobbled with it. White, a CFA who ran fixed income at a roughly $2 billion investment firm before six years at Kraken, lays out the structural reason shorting it costs almost nothing and names the two changes that would end that.\n\n## Why Strategy is issuing credit at all\n\nThe argument starts with mandates. Investment policy statements ratified by boards and trustees at large pensions, governmental agencies, groups like CalPERS and sovereign wealth funds carve capital into buckets, and the credit bucket dwarfs the equity bucket and dwarfs the alternatives bucket that holds Bitcoin, gold and commodities.\n\nCredit investors cannot touch Bitcoin at all. Strategy's convertible bonds were the first credit instruments of any kind that traditional investors could access, and the convertible market is niche, roughly 100 to 150 players trading a crossover equity-debt instrument. Saylor's stated end point is a AAA rating that would let Strategy issue 30-year corporate bonds at maybe a 200 basis point spread to the 30-year Treasury.\n\nThe preferreds are the intermediate step. They are retail-accessible, they have a ticker, and a buyer can hold one in a Robinhood or Schwab account. White frames Strategy as a quasi-bank, with the other digital asset treasury companies following into the same credit stack.\n\n## What actually broke\n\nSTRC launched around June 2025 and was pitched as low volatility, trading close to par. Saylor's own framing was to park cash you might need in 6 to 12 months, which sets it apart from money market cash you might need tomorrow.\n\nWhite will not call the vision dead. The current drawdown is the deepest and longest STRC has had, and it has run about a month and a half. His threshold for declaring the narrative broken is 6 to 12 months of trading below 98 or 99. His comparison is Strive's variable rate preferred, sitting around 97 to 98 despite Strive carrying half the Bitcoin coverage Strategy has, a far less liquid instrument and a far less known company. He concedes Strategy's marketing gave buyers wrong expectations. Calling it money-market-like invited people to skip the fine print.\n\n## The structural short\n\nTwo features make STRC unusually cheap to attack.\n\nThe dividend gap. Even moving to monthly or semi-monthly dividends leaves a two week window in which a short can push the price and cover before the dividend is paid. The borrow rate is around 60 basis points. White calls that a rounding error to zero, so shorting between dividends is effectively free.\n\nThe company call. Strategy can buy the preferred back at 101, so the instrument should never trade above 101 even if the company stopped running its at-the-market offering. That is a hard ceiling on a short's maximum loss, reinforced by the company flooring the ATM at 100 and selling as much as possible there. White's analogy runs the other way. If the US government committed to buying all the Bitcoin in existence at $61,000, you would max-lever long above that price, because the floor is guaranteed. STRC gives a short the same guarantee inverted.\n\n## The two fixes, and the third pillar\n\n| Fix | Mechanism | Precedent |\n|---|---|---|\n| Daily dividends | Removes the two week free window and raises the cost to short | Strive already does it |\n| Lift the company call to 110 or 120 | Removes the guaranteed ceiling on short losses and inserts upside volatility | Strive's level is 110 or 120 |\n| Suspend the ATM in abnormal conditions | Injects uncertainty about whether the 100 supply wall will be there | Strive has stated this policy |\n\nWhite's view is that Strategy should say publicly that it is raising the call level and that there may be periods where it does not run the ATM. The cost is more upside volatility, and nobody objects to upside volatility.\n\nThe third pillar is time and marketing. He estimates somewhere between $500 million and $1 billion of capital simply wants out, people who bought in May at an 11.5% to 13% yield believing it could never fall. Strategy has to find new buyers to absorb that supply rather than buy it back itself. On the confidence metric everyone watches, Strategy's USD dividend reserve fell to 9 months, then to 6 months, and now sits near 18 months. DeFi Dad wants to see 24 months. Separately, a buyer who paid 100 and holds at around 85 gets back to principal on yield alone in roughly 15 months.\n\n## Apyx, the tokenized wrapper\n\nApyx packages variable rate non-convertible preferreds into a two token, points-driven, permissionless structure rather than the KYC whitelist most RWA platforms use. It holds STRC, has held Strive's preferred, and expects most major DATs to eventually issue variable rate versions, noting BitMine's fixed rate issue is not trading much. The product added about $400 million of assets in a month and a half and TVL went north of $500 million.\n\nThe pitch against incumbents is transparency. White contrasts fully liquid assets behind a dashboard with the basis trade at Ethena, where balance snapshots are self-attested with no auditor, with Tether's partial audits, and with reinsurance and private credit that are opaque and sometimes illiquid. Apyx runs monthly attestations with Wolf.\n\nWhat failed was the liquidity mismatch every RWA hits. Tokenized equities settle against a market open seven and a half to eight hours a day while crypto runs 24/7/365, so overnight and weekend mint and redeem broke down and APXUSD traded a couple percent from underlying value. Engineering pivoted from new chains and new products to operational resiliency. Redundant market making, overnight market making capability, a significant number of new market making partners, STRC perps now live on Lighter and Hyperliquid for hedging, and in-kind redemptions through the xStocks partnership that hand the redeemer actual STRC and remove Apyx's price risk. He puts the work at 75% done with a couple more releases to reach 95 to 100%.\n\n## The convert overhang is not the problem people think\n\nMost put dates land in mid-2028, with the schedule starting to matter around September 2027. White lists five outs.\n\n- Wait. Bitcoin is historically higher at that point in the cycle, and converts trading above par mean holders do not exercise the put.\n- Refinance at a lower strike, moving conversion from say $300 to $100 or $80. That dilutes on a fully converted basis and costs no cash.\n- Buy converts back early, as Strategy already did with $1.3 billion from the reserve, with a stated goal of retiring all of them.\n- Raise on the common ATM. At peak panic, with the stock trading down to 1x NAV, they still pulled $1 billion in a single week, and seven more such weeks retires roughly $7 billion.\n- Sell Bitcoin, as they did with about $200 million last week while Bitcoin rose.\n\nThe refinancing route only fails if MSTR volatility compresses to nothing, and it has not. Convertible arbitrage funds like Jane Street buy the bond and short the shares against it, making money in both directions on a delta neutral book. That is why they accept a zero coupon. On depth, White called an OTC desk for a live executable quote on $2 billion of Bitcoin and got roughly 2% to 2.5% off spot, against a market that recently cleared $1.7 billion to $2 billion of IBIT in a single dark pool print.\n\nOn composability, STRC alone is one Lego block. Inside DeFi it becomes Pendle interest rate stripping that converts the floating rate to fixed plus points farming, Royco tranching where the senior tranche came through this event completely protected, a payment rail and a derivatives underlying.\n\n## The one variable\n\nIt is the 101 call. Every other fix is secondary, because as long as Strategy can repurchase the preferred at 101, a short knows its maximum loss to the dollar and pays 60 basis points to carry the position between dividends. Lift that level to 110 or 120 and pair it with daily dividends and the free trade stops being free. Leave it at 101 and no amount of dividend reserve, marketing or Bitcoin recovery removes the ceiling that makes STRC the cheapest structural short in the digital credit stack.\n", "01kzc20bg9w598cbvtpqbj8fa7": "# The Coldcard Seeds Were Weak At Birth, Not Cracked In The Field\n\n**Source:** Adam Livingston, on Swan Bitcoin's \"On Time\" ([open original](https://read.readwise.io/read/01kzc20bg9w598cbvtpqbj8fa7))\n\nLivingston concedes the engineering failure in full and still refuses the conclusion the timeline drew from it. The concession is precise, and the numbers he cites carry the entire argument.\n\n## What broke, and how far short it fell\n\nDuring a 2021 software integration, Coldcard seed generation began reaching a MicroPython pseudo-random fallback instead of the intended hardware random number generator. That is the whole defect. No remote intrusion, no cracked air gap, no stolen firmware key. Coinkite, the company that builds Coldcard, has published its own estimate of the damage.\n\n| Device generation | Effective seed search space | Design target |\n|---|---|---|\n| MK2 and MK3 | roughly 40 bits | 128 bits |\n| MK4, MK5 and Q | roughly 72 bits | 128 bits |\n\nThe later devices received extra secure element entropy, and that is why they land at 72 rather than 40. Both numbers sit far under the 128-bit target. Every missing bit halves the work an attacker has to do, so a 40-bit space is around 2 to the 88th power smaller than the design intent. Affected holders still need fresh seeds and careful fund migration, and Livingston credits the volunteers across the Bitcoin community who have been doing that migration work unpaid.\n\nHis summary of the failure mode is the sentence to keep. The weakness existed when the seed itself was born. A wallet can guard a secret beautifully while generating that secret very poorly. His picture for it is a bank that builds a titanium vault, rings it with lasers, hires ex-special-forces guards, and then selects the combination from a children's placemat.\n\n## He gives Coinkite no cover\n\n\"Coldcard deserves accountability. Customers bought a security product, and they received an invisible defect buried beneath lots of technical sophistication.\" He goes further and names the cultural problem directly. Maximalist branding cannot turn weak entropy into acceptable engineering. Vendors deserve scrutiny proportional to the trust placed in their engineering, and he wants influencers to start separating technical facts from brand allegiance.\n\n## The category error he is attacking\n\nMost of the episode is aimed at the people declaring Bitcoin self-custody dead. Livingston calls that a category error. Self-custody describes a relationship between a person and an asset. The holder controls the keys required to authorize movement. Coldcard is one tool built to facilitate that relationship. Confusing the tool with the relationship, in his framing, is like watching a locksmith cut a defective key and then declaring private property obsolete.\n\nThe analogies come fast. A Boeing crash does not end aviation. A poisoned gas station burrito does not end Mexican cuisine. Car crashes have not abolished mobility, and password manager breaches have not eliminated privacy. Implementation layers fail because humans are fallible. The purposes they serve outlast them.\n\n## What the failure actually reprices\n\nBy his own account the bug does change something real. It changes the risk assessment around devices, firmware, seed generation and vendor concentration. It forces a risk framework the community had been avoiding. What it does not do is supply any evidence that direct ownership has lost value.\n\nHe is also careful that trust does not vanish when you self-custody. It moves. The question becomes whether you trust yourself more than you trust the institution running an ETF wrapper. One is owning Bitcoin and one is owning the wrapper, and he notes he would not trust somebody with dementia to memorize a seed phrase. Threat models are not interchangeable. A political dissident faces different dangers than a retiree holding exposure inside a tax-advantaged account, and a corporate treasurer operates under governance rules that do not apply to a software engineer with three laptops.\n\nHis close is that self-custody preserves an enforceable exit. Conventional assets exist as claims recorded by institutions, and those institutions can change their minds. Handing every coin to one custodian because one wallet failed resembles responding to a bank collapse by moving every deposit into one larger bank.\n\n## The commercial interest attached\n\nRead all of it with the last ninety seconds in view. Livingston closes by opening Swan Sovereign, Swan's guided self-custody service, to everyone. It launched to clients a few weeks earlier and it keeps 100 percent key control with the client while a Swan expert assists. The argument that self-custody survives this is also the argument that sells the product he is announcing. That does not make the entropy numbers wrong. It does mean the framing was never neutral.\n\n## The one variable that would change the call\n\nWhether a second independent vendor is found to have fallen through to the same class of software fallback. Livingston's whole defence rests on Coldcard being one defective tool inside a healthy category. If the audit wave he is celebrating turns up weak seed generation at Trezor, Ledger or any other maker, the failure stops being one company's negligence and becomes a property of the hardware wallet supply chain itself. At that point the people writing the obituary are no longer committing a category error.\n", "01kzc2t9fv6g37pvvg4enqdeaw": "# $160 Billion Of Yen Defense Has Not Held, And The Rest Of The Chain Comes From An AI Explainer\n\n**Source:** Trader Mayne, speaking on stream about Japan ([open original](https://read.readwise.io/read/01kzc2t9fv6g37pvvg4enqdeaw))\n\nThis is a short clip with two very different halves inside it. The intervention figures are specific and checkable. The causal chain that follows them is Mayne reading a Grok explainer aloud on stream, and he says so as he does it.\n\n## What he actually sources\n\nJapan has been spending to stop the yen from falling.\n\n| Intervention | Amount |\n|---|---|\n| This year, total | $160 billion |\n| Last Thursday | $53 billion |\n| Last Friday | $34 billion |\n\nTwo back-to-back days accounting for **$87 billion** of a $160 billion annual total tells you the defense has moved from occasional to continuous. His description of the result is the load-bearing part: every time the yen strengthens it holds for a few days and then goes right back down.\n\nHe draws the correct conclusion from that pattern, and it is the one piece of analysis in the clip that stands on the numbers alone. Reserve sales cannot fix this. Only raising rates can. Selling dollars to buy yen is a finite operation against an infinite one, because the thing pushing the yen down is a rate differential that no amount of reserve spending narrows. Spend the reserves and the differential is unchanged. Spend them again and it is still unchanged, and now the reserves are smaller.\n\nHe also notes the US is helping. That is the detail that makes this more than a domestic Japanese problem.\n\n## Where the sourcing changes\n\nFrom that point on he is reading. His words: \"that brings in this entire Grock explanation here,\" and he then narrates the chain off the screen. What follows is not reporting, not a bank note, and not his own model. It is an AI-generated explainer that he is relaying live, and the honest thing to do is grade it as such.\n\nThe chain runs like this. Japan cannot spend its way out even with US help. So it has to raise interest rates. Raising rates unwinds the yen carry trade, because you can no longer borrow yen cheaply and the loans have to be repaid at higher rates. That unwind means selling of US debt. That selling pushes American interest rates up. And that, in his telling, is why the US is helping in the first place, because Washington does not want its own rates to rise.\n\n## What holds and what does not\n\nThe mechanics of a carry unwind are real and well understood. Borrowing in a low-rate currency to hold higher-yielding assets elsewhere works until the funding currency's rate rises or its exchange rate moves against you, and then the exit is crowded because everyone put the trade on for the same reason.\n\nThe weak joint is the specific claim that a BOJ hike leads to Japanese selling of US Treasuries at a scale that moves American yields. That step needs to be sized and the clip never sizes it. Who sells, how much, over what period, and against what offsetting demand are all left open. An explainer can assert a directional link. A position needs a number.\n\nThe second weak joint is the motive attributed to Washington. That the US is helping is stated. That the US is helping specifically to protect its own borrowing costs is inference, and it arrives from the same generated text as the rest of the chain.\n\n## Why the honest version is still worth having\n\nStrip the speculative chain away and something real remains. A central bank spending **$53 billion and $34 billion on consecutive days** and getting a few days of strength for it is announcing that its tools are not working. That is the fact, and it does not require the Treasury-selling story to matter.\n\nWhat it does require is a decision, and the decision is the Bank of Japan's. Every path out of a failing currency defense runs through the policy rate. Keep spending and the reserve stock falls while the yen goes back down. Stop spending and the yen goes down faster. Raise rates and the currency stabilises at the cost of everything that was financed cheaply on the assumption Japanese rates stay near zero.\n\nThe third option is the one Mayne is pointing at without saying it plainly. Japan may not get to choose the timing, because the intervention arithmetic chooses it for them.\n\n## The one variable that would change the call\n\nWhether the Bank of Japan hikes, and how far. Every downstream claim in the clip, sourced or generated, hangs off that single decision. No hike and the $160 billion becomes $200 billion and the yen keeps sliding while everything else stays theoretical. A hike, and the carry unwind stops being an explainer's assertion and becomes a position to size. The number to demand at that point is the one nobody in this clip supplies: how much US Treasury paper actually gets sold, by whom, and over what timeframe.\n", "01kzc32ez9ge1rcc9pqqg2g91e": "# CLARITY's Deadline Math: 53 Seats, 60 Votes, And Cloture Filed On Something Else\n\n**Source:** VirtualBacon, live stream ([open original](https://read.readwise.io/read/01kzc32ez9ge1rcc9pqqg2g91e))\n\nThis is the most procedurally careful read of the CLARITY endgame available from a crypto channel, and the framework it lays out is falsifiable within the week rather than vague.\n\n## The clock, stated exactly\n\nThe bill cleared the House 294 to 134 and got through Senate Banking 15 to 9. On the floor it needs 60 votes. Republicans hold 53 seats. Majority Leader John Thune promised cloture this week, and if cloture is filed, the floor vote lands Friday August 7.\n\nThat did not happen. This morning Thune filed cloture on a different motion entirely, and VirtualBacon reads that as the signal that no agreement exists on CLARITY. If nothing is filed, the Senate leaves for recess and returns September 14, and he puts the chance of passage after that date under 10 percent. The reason is not procedural. It is the midterm calendar. Final results land in November, appetite for crypto bills drains as the year runs out, and a reshuffled House and Senate sends the bill back to square one. His conclusion is roughly 90 percent that it does not pass this year, and a high probability that a failure this year pushes the next real attempt to late 2027.\n\n## The three doors\n\n| Scenario | Mechanics | His read |\n|---|---|---|\n| 1. Cloture filed, Friday vote passes | Goes to the White House and becomes law | Best case, lowest probability |\n| 2. Cloture filed, Friday vote fails | Produces a recorded roll call naming every senator | Beats no vote, fast-tracks September |\n| 3. Nothing filed at all | Dead until September 14 at the earliest | Most likely, worst case |\n\nThe argument for scenario two being genuinely better than scenario three is the part most coverage skips. A failed vote is a named roll call, which tells the industry exactly who to work on, and it puts CLARITY first in line when the Senate returns.\n\n## The odds, with their sources kept separate\n\nOn Polymarket the probability ran between 50 and 70 percent in January, decayed from around May, and sits at 15 percent as he speaks. He notes that number already excludes this week's deadline. Across prediction markets and analyst desks generally he puts the range at 15 to 20 percent, and expects it under 10 percent if the week ends without a vote. Milk Road's newsletter, citing the same Polymarket contract on the question of the bill becoming law in 2026, shows 17 percent.\n\nHe also gives both sides of the price argument by name. Bitwise chief investment officer Matt Hougan argues it is survivable, because the SEC and CFTC can regulate through guidance without Congress. Digital commodity classification, open DeFi access for US investors and more lenient ICO rules already exist in the SEC's rule book. They simply would not be law, so they are less defensible in court, and the agencies that could sue are the same agencies choosing not to. Against that, Bernstein says failure could trigger the final leg down in crypto valuations, and JP Morgan calls the fading odds a running headwind. He adds James Seyffart's point that Wall Street treats CLARITY as a Bitcoin catalyst on sentiment alone, not just an altcoin issue.\n\n## The rest of his board\n\nCircle missed Q2 revenue estimates and USDC circulation fell, and the stock rallied anyway. Offsetting that, Samsung Wallet will support USDC across 61 countries out of the gate, and Dinari launched 724 tokenized stocks buyable with USDC directly from a self-custody wallet, in partnership with Circle.\n\nBitGo is moving all $7.7 billion of wrapped Bitcoin cross-chain messaging from LayerZero to Chainlink CCIP under an exclusive deal. Six Ethereum researchers including Justin Drake published a draft Tuesday for tapered issuance burn, which would burn a rising share of validator rewards as staking grows until net issuance reaches zero, against a current staking reward rate of 3 to 4 percent.\n\nBlackRock is running a one-for-three reverse split on ETHA, over $5 billion in assets, effective October 6, taking the share price from about 14 to about 42 to tighten spreads. Uniswap appears to be deploying its continuous clearing auction launchpad on the Robinhood chain under the name pools.trade, a four-hour crowd launch rather than a pump.fun bonding curve.\n\n## His levels\n\nBitcoin is up 3.6 percent over four days, which he points out is the same size as the single down candle on July 31. The daily downtrend has run since May. Resistance is 66.7K, already tested once and rejected, and a break there opens 76K at the 50-week exponential moving average. He is short-term bearish, medium and long-term bullish, and calls current prices the value zone at the 200-week SMA.\n\nHis probability split is the useful part: roughly 90 percent that Bitcoin makes a new high next cycle, roughly 50 percent that any given blue chip altcoin outperforms it. On equities, the Nasdaq added $3.5 trillion in four days and the S&P broke to all-time highs. His sell trigger is a weekly close below the 50-week SMA on both the Nasdaq and the semiconductor index, and he expects that drawdown only after the OpenAI and Anthropic IPOs clear.\n\n## The one variable that would change the call\n\nWhether the Senate works the weekend. His entire 90 percent rests on the recess starting cleanly after Friday. Senator Cynthia Lummis has said publicly that the chamber may sit Saturday and Sunday before the recess begins Monday. If that happens and CLARITY gets a roll call, scenario three collapses into scenario two, September becomes live rather than decorative, and the 15 percent he is quoting is stale the moment the gavel falls.\n", "01kzc3473ctcvhamhgq1j44j9m": "# SPY Cleared 686. Below It, the Chart Points at 629\n\n**Source:** Stocks with Josh, a short technical read on SPY and QQQ ([open original](https://read.readwise.io/read/01kzc3473ctcvhamhgq1j44j9m))\n\nA two-level framework set in advance, then checked against what price actually did. The value is that the levels were published before the move rather than fitted afterward.\n\n## The two levels, set a week early\n\nThe setup was a diamond pattern on both **QQQ** and **SPY**, with two prices marked out: **686 and 674**. The call at the time was conditional rather than directional. Price sat between them, and whichever side broke first would set the following week's regime.\n\n**Price cleared 686**, and Monday opened bullish. The upper level is confirmed for now.\n\nThe distances are worth holding in mind. **674 sits about 1.75 percent below 686**, so the two levels bracket a narrow band. The downside target below that band is much further away.\n\n## The QQQ warning underneath the SPY strength\n\nThe index that broke higher is not the one carrying the risk. **QQQ ascended for months on end and then lost the 9 EMA on the weekly time frame**, and has since come back and back-tested it from underneath.\n\nThat is a regime signal, not a wiggle. A weekly moving average that held through a months-long advance and then failed marks the trend structure changing. The threshold for repair is specific: **it takes a couple of candles above the weekly 9 EMA to put the market back in a bullish regime.** One reclaim bar does not do it.\n\nSo the two indices are saying different things at the same time. SPY has cleared its upper trigger. QQQ is below the moving average that defined its whole run and is testing it from the wrong side.\n\n## The downside, if 686 fails\n\nThe conditional is explicit. **A fall back beneath 686 implies a far bigger descent, most likely finishing around 629.**\n\n| Level | Distance from 686 |\n|---|---|\n| 674, the lower bracket | about 1.75 percent below |\n| 629, the downside target | about 8.3 percent below |\n\nThat asymmetry is the whole point of the framework. Holding 686 buys a bullish week. Losing it does not deliver a slow drift down to 674. It opens a move roughly five times larger.\n\nThe framing offered for the current tape is that this is normal and expected. **When markets are neutral, you get rotation** rather than a single directional trend, and money moves between sectors instead of lifting everything at once.\n\n## The one variable that would change the call\n\nWhether QQQ can put two consecutive weekly candles above the 9 EMA. SPY holding 686 is the near-term condition, but the weekly moving average on the Nasdaq proxy is the structural one. Reclaim it and the months-long ascent resumes with 686 as support beneath it. Fail to reclaim it, and the back-test from underneath becomes the rejection that sends SPY back through 686 toward 629.\n", "01kzc37w7ffrdb12g72r9sn8g8": "# SpaceX Guided to $1 Trillion of Revenue by 2030 and Sold Off 9 Percent\n\n**Source:** Limitless Podcast, hosts Josh and EJ, recorded the day after SpaceX's Q2 report and the day $100 billion of stock unlocked ([open original](https://read.readwise.io/read/01kzc37w7ffrdb12g72r9sn8g8))\n\nWall Street went into August 4 bearish and called SpaceX a money vacuum. The print beat on every line and the stock fell anyway. This episode works the gap between those two facts.\n\n## What actually printed\n\n| Line | Expected | Actual |\n|---|---|---|\n| Revenue | $6.93 billion | **$7.81 billion, up 92 percent year over year** |\n| Earnings per share | loss of $0.26 | **gain of $0.09** |\n| Net income | $2 billion loss | **$500 million loss** |\n| Capex | consensus | **just under $18.5 billion, 39 percent above expectations** |\n\nJosh's frame on that capex: NASA's entire annual budget is $25 billion, so SpaceX spent close to the whole of NASA in a single quarter, and **$2.35 for every dollar of revenue it earned**.\n\nSegment growth ran **connectivity, AI up 250 percent year over year, and space up 30 percent**. For a company at roughly $30 billion of annualised revenue, typical growth is 5 to 10 percent.\n\n## The trillion-dollar claim, put in scale\n\nOn the call Musk pulled the trillion-dollar revenue year forward from 2031 to **2030**. EJ's reference point is that the largest company on Earth by annual revenue is not a technology company at all. **Walmart does $680 billion.** A trillion is 47 percent above that.\n\nNear term, Musk said SpaceX is on track for **$100 billion ARR by the end of 2026**. The only other company the hosts have heard that projection made for is Anthropic.\n\n## The compute pillar and the Nvidia commitment\n\nThe unlock the hosts care about is the backlog. **$50 billion of revenue is already signed** before anyone picks up a phone.\n\nCFO Bret Johnson gave the number that reframes the capex. An apartment building takes 15 to 20 years to pay itself back. **SpaceX data centres pay back inside a single calendar year.** Musk's line on competing terrestrial builds was \"this is like the New York Yankees playing in a little league.\"\n\nThen the exclusivity announcement, verbatim: **\"Going forward, we've decided to build exclusively on Nvidia because we think that the Vera Rubin architecture is the best architecture.\"** SpaceX committed to roughly doubling its GPU fleet by the end of next year. The hosts run the money on that: **10 gigawatts cumulative by end of 2027 is $200 billion into Nvidia's pocket from SpaceX alone.** On a realistic path of about 6 gigawatts, call it an extra $100 billion. Either way SpaceX becomes Nvidia's largest customer. Anthropic had signed a major deal with AMD days earlier, the other side of that same trade.\n\nPushed on the longer horizon, Musk guided to roughly **20 gigawatts by 2030 with a floor of 15**. For scale, one gigawatt powers about 800,000 homes. Applying Jensen Huang's own rule of thumb of **$40 to $50 billion of annual revenue per gigawatt**, 15 gigawatts alone implies **$600 to $750 billion of revenue** before counting space or connectivity.\n\nThe hosts also fold Grok into the same company, with Grok 4.6 and 4.7 shipped and **Grok 5 due by end of year trained on SpaceX engineering data**. That model roadmap is their read of where the internal 10 percent of compute goes rather than anything the earnings lines separate out.\n\n## Starlink is the part they think is underrated\n\n**Subscribers doubled year over year to 12 million, with 1.7 million of those added this quarter alone.** Gwynne Shotwell would only say the direct-to-cell business has a \"foundational competitive advantage\" and declined to detail it. The addressable number the hosts anchor to is **5.5 billion internet users worldwide**, with dead zones removed.\n\nStarship supports it. The heat shield, the hardest part of reusability, worked for the first time on the last launch, and the next flight deploys **Starlink V3 satellites** into orbit and switches them on.\n\n## The bear case, stated honestly\n\n**911 million shares unlocked today, roughly $100 billion of potential sell-side pressure**, with **25 to 36 percent of total share supply freeing up over the coming months**. SpaceX is among the most shorted names in the market. At the time of recording it traded down about 9 percent to **$115**, against a valuation near **$1.5 trillion**.\n\nThree more items the hosts flag against themselves. They guided capex 39 percent higher this year and **gave no capex guidance at all for next year**. **Starlink revenue per user fell 22 percent** even as subscribers doubled, because growth is coming from cheaper international markets. And there is key man risk, one person driving five companies' worth of execution, with rumours of a Tesla merger that would concentrate it further.\n\nJosh's counter is the Tesla analogue. Tesla was the most shorted company on the exchange for two to three years, then repriced 13x between 2020 and 2021 in the largest short squeeze on record, once the world accepted the thesis had played out.\n\n## The one variable that would change the call\n\nWhether 15 gigawatts of compute is actually online by 2030. Every revenue path here, the trillion by 2030, the $600 to $750 billion from compute alone, the payback-in-a-year arbitrage, runs through gigawatts delivered on schedule. Josh concedes the point directly. If the buildout lands fractionally short the trajectory still holds. If it slips by years, the capex is already spent, the depreciation still rolls through the income statement, and the $100 billion of unlocked stock has no revenue ramp arriving to absorb it.\n", "01kzc3p6qysps43ynpwm5vhkfk": "# Austin Arnold Has Not Bought An Altcoin In Twelve Months And Still Says The Bottom Is Forming\n\n**Source:** John Gillen of Milk Road in conversation with Austin Arnold of Altcoin Daily, recorded Wednesday August 5 ([open original](https://read.readwise.io/read/01kzc3p6qysps43ynpwm5vhkfk))\n\nArnold runs Altcoin Daily with his twin brother Aaron, 1.56 million subscribers on YouTube and more than 3.5 million across every platform, and the useful thing here is the gap between what he says about the market and what he has actually done with money.\n\n## The three signals he uses to call a bottoming process\n\nHe will not say the bottom is in. He says Bitcoin is in the bottoming process, and he names the checks.\n\nFirst, the net buyers of the last top become forced sellers. The digital asset treasuries kept buying higher and now Michael Sailor is a seller, which nobody would have predicted 12 or 18 months ago. Second, Bitcoin acts as a magnet to the 200-week moving average, and it has been sitting around it for several weeks after touching it in February. Third, Bitcoin stops being the first thing sold. The Nasdaq is selling off now while Bitcoin holds or grinds slightly higher, a reversal of the pattern where Bitcoin was the easiest liquidity to hit.\n\nHis timing arithmetic comes from the last cycle. After the 200-week touch it took eight months to wash out and finish the process. Applied from February, that lands in October.\n\n## Where he splits from the rest of the field on CLARITY\n\nArnold thinks the prediction markets are too pessimistic. He cites them at around 30 percent for passage by year end and says he would take the over at closer to 50 percent, on the specific ground that Senator Cynthia Lummis announced that morning that the Senate will work past Friday, into Saturday and Sunday, before recess begins Monday. His expectation is a vote before the week is out, which at minimum tells everyone where each senator stands.\n\nHe prices both outcomes. Failure gives him a lower low for Bitcoin, and he names the two easiest support levels as the 50s and possibly 48. That would be the final rung of the bottoming process rather than a new bear leg, and his reasoning is that Bitcoin has ground higher for 16 years with no regulatory clarity at all. Passage, in his framing, is a 1933 or 1934 moment comparable to the formation of the SEC, after which big money finally knows the rules.\n\n## The portfolio, disclosed\n\nThe honest part of the interview is the answer to whether he has been buying. He has not bought an altcoin in the last 12 months. He has been accumulating, and the mechanism is staking rather than purchase, on Solana, Ethereum and Bittensor. His rules, offered as general advice: do not put money into Bitcoin you are not willing to hold four years, and do not put money into altcoins you are not willing to watch go to zero. His base assumption is that 99 percent of altcoins trend to zero or to zombie status.\n\n## What he is bullish on, and the caveat attached to each\n\n| Asset | The thesis | The caveat he names |\n|---|---|---|\n| Ethereum | Most decentralized smart contract platform, deepest liquidity, largest network effect, Robinhood chose an Ethereum L2 | Fee accrual to mainnet still unproven |\n| Solana | Memecoin cycle worked as a stress test Wall Street watched, now pivoting to real world assets | Prior-cycle gems usually need an extra cycle, as XRP did after 2017 and Cardano after 2021 |\n| Hyperliquid | Real earnings institutions can underwrite, buys back with 90 percent of revenue, used for weekend hedging during the Iran conflict | US regulatory status is unresolved, and Lighter is taking share |\n| Chainlink | Adopted by the largest institutions, added a reserve buyback | Accrual to the token is still a hope, not a mechanism |\n| Bittensor | 21 million cap, fair launch with no insider seed rounds, subnets let failed AI startups get culled | Bet on decentralized AI taking even 1 to 5 percent of the trend |\n\nHis Ethereum defence doubles as his Chainlink defence. Get global network adoption first, then turn on the fee generation whenever you want. His analogy is Uber handing out $20 credits until the network existed and charging properly afterward.\n\nThe XRP answer is the one his audience will dislike. He owns none and has never owned it at scale, because he is more bullish on Ripple the company than the coin, and the fiduciary duty of Brad Garlinghouse runs to shareholders. If bank adoption were real at scale, he argues, XRP would already be at $5 or $10 rather than struggling to hold a dollar. The coin's biggest asset is the community, and he says so without condescension.\n\n## The DeFi sequence\n\nHis path runs stablecoins first. The GENIUS Act gets stablecoins regulated and adopted, the United States gets buyers for its treasuries, and holders of all that stablecoin float want yield. DeFi is where the yield lives. He calls that the institutional version of the retail DeFi summer of 2020. He names Aave as the survivor, back around $100 after a rough year for the sector including the Kelp incident, and his hesitation is a real one. Protocols valued on revenue get a ceiling that protocols valued on narrative do not.\n\n## The one variable that would change the call\n\nWhether the October date holds. Every part of Arnold's construction hangs off the eight-month wash-out from the February touch of the 200-week moving average, and the CLARITY failure he expects is supposed to supply the last flush into the 50s or 48. If Bitcoin is still ranging above 60 in November with the bill dead and Sailor still selling, the analogue has broken and the bottoming process he is describing becomes a bear market he is sitting inside.\n", "01kzc41yfb5fbpzcvpc5hc9sxa": "# Steve Eisman Will Not Call the Top Until He Sees a Price War\n\n**Source:** Prof G Markets, host Ed Elson, with Steve Eisman of The Real Eisman Playbook and Ryan Petersen of Flexport, August 6 ([open original](https://read.readwise.io/read/01kzc41yfb5fbpzcvpc5hc9sxa))\n\nMichael Burry says a 1987-style fall is possible. The other man who called 2008 sat down and explained, in specific terms, exactly what evidence he would need before he agreed. He does not have it.\n\n## The setup\n\nThe S&P 500 hit a fresh intraday record after Tuesday's near 2 percent rise to its first record close since June. The Nasdaq gained nearly 3 percent that day and **the Dow crossed 54,000 for the first time**. Google fell nearly 4 percent on DeepMind's chief scientist leaving and Demis Hassabis stepping aside.\n\nAgainst that, **Burry published a note on Tuesday holding his shorts against Nvidia, Micron, Tesla, Palantir and the semiconductor index**, writing \"I continue to believe it is possible we are near a major top\" and raising the prospect of \"a 1987 type fall.\"\n\n## Eisman's bull case is the economy, not the story\n\nEisman's starting position is that the data does not support a top. All the banks reported mid-July and **credit statistics were as benign as they could possibly be**. Strong M&A cycle, a decent IPO calendar, robust payment volumes at Visa and Mastercard. He grants a K-shaped economy and points at Procter and Gamble with no revenue growth, but notes that is not what drives the tape. Employment remains very strong despite the noise about AI destroying jobs.\n\nHis comparison to 2008 is the heart of it. He and Burry both had the securitisation data. **Every single month, data came out on hundreds of billions of dollars of mortgages showing credit quality deteriorating.** The thesis reinforced itself monthly. There is no equivalent database for AI, so Burry, by Eisman's read, has no data point that anyone else lacks. His verdict is blunt. Burry is putting a finger in the air, and he might be right, but he cannot show his work.\n\n## What Eisman does think has changed\n\nTwo things. First, capital intensity nobody imagined. **Microsoft, Google and Amazon, companies that once threw off cash like water, now run negative cash flow.**\n\nSecond, the LLM business has no moat. Users switch models freely, Chinese open models are much cheaper, and a price war is plausible. That is the trigger he is waiting for.\n\nThe dependency numbers make the trigger matter:\n\n| Source | Finding |\n|---|---|\n| Bloomberg | roughly **70 percent of Microsoft's AI revenue** came from OpenAI last year |\n| Barclays | approximately **75 percent of Amazon's AI revenue** came from OpenAI and Anthropic |\n| UBS | **30 percent of Google's cloud revenue** from the same two, closer to 75 percent of AI-specific revenue |\n| Prof G estimates | **OpenAI lost $21 billion last year**, Anthropic roughly $11 billion |\n\nElson's summary is that if OpenAI and Anthropic did not exist, big tech would not have an AI business at all. Eisman's condition follows directly. If a price war broke out and those two got into trouble, they would spend less, fewer chips would be bought, and the trade would unwind. Until then, **Amazon is spending $225 billion on capex this year** and Nvidia reports around August 26, and he cannot see how that quarter comes in bad.\n\nTwo markers he offers. He expected the 10-year above 4.5 percent to act as a demarcation line and it did not, so he now thinks a rate-driven correction needs the 10-year **above 5 percent**. And he found **Meta's numbers hellacious: 28 percent revenue growth against 55 percent expense growth, and $785 million of free cash flow**. That last figure is basically nothing for a company that used to throw off cash like water. Chip depreciation hit roughly **$6 billion in the quarter, up from about $4 billion three months earlier**, as capex that sat on the balance sheet starts rolling through the income statement. The stock fell for one day and climbed back.\n\n## Ryan Petersen on the tariff regime nobody can file against\n\nAt the end of July, Trump invoked **Section 301 of the Trade Act of 1974** to impose tariffs on **60 economies covering 99 percent of US imports**. On Monday **25 states sued**, arguing the administration is using Section 301 to replace the IEEPA tariffs the Supreme Court struck down earlier this year.\n\nPetersen thinks these survive. IEEPA was blanket authority a president could fire on a bad morning. Section 301 requires process, and Commerce has done the country and sector studies. The rates are also manageable at **10 percent or 12.5 percent depending on country**, and importers say a stable predictable rate they can plan around is workable.\n\nThe chaos is in compliance, not in the rate. **In 2025 there were 53 changes to the tariff code in 52 weeks.** Section 122 expired at midnight on July 24, Section 301 kicked in at 12:01 a.m., and it was announced hours beforehand.\n\nThe refunds show

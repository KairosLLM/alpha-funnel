RAM supply prices including LPDDR5X to ease iPhone cost pressure, and CXMT rejected the request, insisting on prices higher than or comparable to Samsung and SK Hynix. Single-sourced to South Korean media and publicly disputed by The AI Investor as not passing the smell test.", "direction": "long", "levels": null, "due": "2026-10-31", "attribution": "South Korean media via Jukan, contested by The AI Investor", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-AMD-1", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "stocks", "ticker": "$AMD", "name": "AMD", "kind": "thesis", "call": "AMD trades above today's after-hours level in a month, at 60/40. It beat and fell about 10 percent after hours having closed up 7 percent, with capex rising and free cash flow falling, in a name up 140 percent year to date. Futurum reiterated Buy at an $800 target on a 2027 forecast of $90 billion revenue and $17.50 EPS including up to 14 gigawatts of committed accelerator deployments.", "direction": "long", "levels": "60/40", "due": "2026-09-05", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-04-PM-token-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "crypto", "ticker": null, "name": "Tokenization plumbing", "kind": "catalyst", "call": "Wells Fargo is rolling out tokenized deposits for enterprises and corporates with 24/7 onchain access, and Polymarket is seeking investment above a $20 billion valuation while taking exclusive US streaming rights to Serie A.", "direction": "long", "levels": null, "due": "2026-12-31", "attribution": "Andy via the Crypto list, zerohedge", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-04-PM-miners-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "crypto", "ticker": null, "name": "Miners decouple", "kind": "thesis", "call": "The miners have stopped being a Bitcoin proxy and now trade on lease duration and counterparty credit. Twelve of thirteen constituents rose over the week led by CIFR at 24.9 percent, IREN at 20.8 and HUT at 19.3, on IREN's $2.8 billion of AI-cloud deals and Hut 8's second $9.8 billion lease, while Bitdeer jumped 23 percent on a 16-year AI and HPC data centre lease.", "direction": "long", "levels": null, "due": "2026-12-31", "attribution": "0xResearch", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-04-PM-hormuz-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "macro", "ticker": null, "name": "Hormuz deal", "kind": "thesis", "call": "A Hormuz agreement is announced inside two weeks, at 60/40, up from roughly even. Qatar has prepared draft text and the US Treasury Secretary has put a date on it. The 40 is that Iran has denied three separate reopening reports in four days.", "direction": "event", "levels": "60/40", "due": "2026-08-18", "attribution": "house", "status": "hit", "resolution": "Iran and Oman agreed the route geography and a joint announcement is in its final stage, inside two days rather than two weeks. The channel was Oman rather than the Qatari draft text I relayed.", "resolved_edition": "2026-08-05-PM"}, {"id": "2026-08-04-PM-fima-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "macro", "ticker": null, "name": "FIMA repo facility", "kind": "policy", "call": "Treasury publicly asked for a Federal Reserve facility to be enlarged. Bessent: we will not hesitate to participate in further joint intervention, the FIMA Repo Facility is an important backstop, we would encourage it to be upsized in the coming months. Jeff Park: FIMA is entirely a Fed tool, not a Treasury tool.", "direction": "event", "levels": null, "due": "2026-12-31", "attribution": "Scott Bessent, framing from Jeff Park", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-04-PM-coldcard-2", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "crypto", "ticker": null, "name": "Coldcard to ETFs", "kind": "thesis", "call": "The Coldcard hack drives migration to ETFs and third-party custody. Balchunas: what used to be seen as a bug by coiners, dorky boomer TradFi, may suddenly seem like a feature, especially versus a Canadian company with five employees. Dave Weisberger reached the same conclusion independently.", "direction": "long", "levels": null, "due": "2026-12-31", "attribution": "Eric Balchunas and Dave Weisberger", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-04-PM-clarity-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "macro", "ticker": null, "name": "CLARITY Act", "kind": "catalyst", "call": "No CLARITY floor vote happens before the August recess, at 85/15. The bill cleared the House and Senate Banking and sits on the legislative calendar with no scheduled vote, cloture needs 60 votes meaning roughly seven Democrats, and talks are stalled on ethics provisions covering officials' own crypto activity, consumer protection language and stablecoin banking concerns.", "direction": "event", "levels": "85/15", "due": "2026-08-08", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-04-PM-breadth-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "macro", "ticker": null, "name": "Breadth blocker", "kind": "thesis", "call": "July ISM at 55.6 percent was the best since May 2022 and GDPNow went to 6.2 percent, but market breadth fell 0.46 on the week to 0.18 and is the only thing holding the posture at caution. Three conditions to clear it: breadth stops falling, August 7 payrolls confirm the labour market, and August 12 CPI leaves six-month core flat against ISM Prices Paid at 71.1.", "direction": "neutral", "levels": null, "due": "2026-09-30", "attribution": "Milk Road Macro Index", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-04-PM-bessent-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "macro", "ticker": null, "name": "Bessent on Hormuz", "kind": "catalyst", "call": "Scott Bessent said there is a chance of a deal today or tomorrow to open the Strait of Hormuz, and Qatar has prepared draft text. Futures hit a record high on it, oil rose 2 percent then fell 2 percent, Brent October at $81.50.", "direction": "event", "levels": null, "due": "2026-08-31", "attribution": "Scott Bessent via the Financial Markets list", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-04-PM-SPX-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "stocks", "ticker": null, "name": "S&P levels", "kind": "level", "call": "The S&P cleared the 7448 buy line and pushed to 7610, and may be leaving a ten-week range. Hold above 7448, with 7620 the bigger level overhead. Cappelleri's 7,680 target from late April is still live and Societe Generale carries 8,000.", "direction": "long", "levels": "7448 support, 7620 resistance, 7680 and 8000 targets", "due": "2026-10-31", "attribution": "Scott Redler, Frank Cappelleri via Ryan Detrick, Societe Generale", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-04-PM-SPCXnum-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "stocks", "ticker": "$SPCX", "name": "SpaceX print", "kind": "catalyst", "call": "SpaceX's first earnings report expects $6.8 billion of revenue and $10.9 billion of cash burn. Starlink ARPU fell from $99 in 2023 to $66 last quarter against a $65.50 street number, AI capex was $7.7 billion last quarter or 76 percent of all company spending, the Anthropic compute deal runs $1.25 billion a month through 2029, and 2026 X revenue consensus is about $2.9 billion.", "direction": "event", "levels": null, "due": "2026-08-05", "attribution": "Kyle Reidhead of Milk Road", "status": "hit", "resolution": "SpaceX reported $7.8 billion of June-quarter revenue against the $6.8 billion expectation and guided to a $100 billion exiting run rate, implying a December quarter near $22 billion. December revenue estimates rose about 17 percent.", "resolved_edition": "2026-08-05-PM"}, {"id": "2026-08-04-PM-SPCX-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "stocks", "ticker": "$SPCX", "name": "SpaceX squeeze", "kind": "thesis", "call": "SpaceX trades higher on Thursday than it closes tonight, at 55/45, on mechanics rather than fundamentals. S3 has 95 percent of borrowable stock out on loan and short interest at 34 percent of float, and consensus EPS spans a $1.26 loss to a $0.33 profit. The lockup of more than $100 billion begins Thursday.", "direction": "long", "levels": "55/45", "due": "2026-08-06", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-04-PM-MSTR-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "crypto", "ticker": "$MSTR", "name": "Strategy turns seller", "kind": "thesis", "call": "Strategy sold 1,638 Bitcoin last week to fund preferred dividends and STRC buybacks, after four straight weeks without a purchase. The token market has lost its most reliable structural buyer and gained a seller with a dollar obligation, and the treadmill speeds up as the discount to net asset value widens.", "direction": "short", "levels": null, "due": "2026-12-31", "attribution": "0xResearch", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-04-PM-CAT-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "stocks", "ticker": "$CAT", "name": "Caterpillar", "kind": "catalyst", "call": "Caterpillar quarterly sales topped $20 billion for the first time in company history, driven by AI data centre demand. It books revenue on delivery and carries none of the GPU residual-value risk the neoclouds do.", "direction": "long", "levels": null, "due": "2026-12-31", "attribution": "Polymarket Money via the Financial Markets list", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-04-PM-AAPL-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "stocks", "ticker": "$AAPL", "name": "Apple bounce", "kind": "thesis", "call": "Apple is a tradable bounce candidate holding $300 after five down days and more than 13 percent peak to trough, inversely tracking the Nasdaq proxy. Once the Nasdaq breathes after its five-day run, defensive money rotates back in.", "direction": "long", "levels": "300", "due": "2026-09-30", "attribution": "Heisenberg", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-03-PM-yen-1", "date": "2026-08-03", "edition": "2026-08-03-PM", "channel": "macro", "ticker": null, "name": "Yen intervention", "kind": "catalyst", "call": "The yen hit its weakest level since 1986, Japan reportedly spent more than $50 billion in a single day defending it in likely the largest intervention ever recorded, and the next day the US Treasury and New York Fed bought yen alongside Tokyo. Bessent then said the yen seems very undervalued and excess volatility is not healthy. This resolves the July 31 Bessent notepad reading buy Japanese yen $5-10 billion as deliberate rather than accidental.", "direction": "event", "levels": null, "due": "2026-09-30", "attribution": "Capital Flows", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-03-PM-warsh-1", "date": "2026-08-03", "edition": "2026-08-03-PM", "channel": "macro", "ticker": null, "name": "Warsh and Bessent", "kind": "thesis", "call": "Warsh and Bessent are coordinating to fund the AI buildout as a national-security priority. Warsh called the surge in high-tech capex the most striking feature of the economy, put AI-related equipment and software growth near 20 percent four-quarter, told Congress that what is called AI investment will soon be called just investment, and said the Fed has not done much in 42 days while the markets have done quite a bit. Bessent is defending the yen carry pipe that funds it.", "direction": "long", "levels": null, "due": "2026-12-31", "attribution": "Capital Flows", "status": "hit", "resolution": "Confirmed from both sides. The New York Fed, acting for Treasury, sold euros to buy yen on Friday, both governments acknowledged it Monday, and USD/JPY fell from above 163 to around 156.", "resolved_edition": "2026-08-04-PM"}, {"id": "2026-08-03-PM-hyper-1", "date": "2026-08-03", "edition": "2026-08-03-PM", "channel": "macro", "ticker": null, "name": "Memory margins and hyperscalers", "kind": "thesis", "call": "Memory margin compression is bullish for the hyperscalers rather than bearish for AI. Memory is now roughly 35 percent of hyperscaler hardware spend against 8 percent in 2023, AWS says server investments break even in under three years at today's inflated component prices, and cheaper inputs mean the $860 billion of 2026 capex buys more compute per dollar. Falling input costs speed the buildout up.", "direction": "long", "levels": null, "due": "2027-06-30", "attribution": "Kyle Reidhead of Milk Road", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-03-PM-generals-1", "date": "2026-08-03", "edition": "2026-08-03-PM", "channel": "stocks", "ticker": null, "name": "Lag 7 to Mag 7", "kind": "thesis", "call": "The Lag 7 turns back into the Mag 7 and the megacap generals lead again, leaving the bottleneck and second-derivative names without a bid. Oracle is the biggest wild card on its OpenAI bet, and physical AI takes Nvidia to a $10 trillion market cap.", "direction": "long", "levels": null, "due": "2027-06-30", "attribution": "Shay Boloor", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-03-PM-flows-1", "date": "2026-08-03", "edition": "2026-08-03-PM", "channel": "stocks", "ticker": null, "name": "Tech re-grossing", "kind": "thesis", "call": "Hedge funds bought tech stocks at the fastest pace since 2022 and tech funds took their largest five-week inflow on record, one week after Goldman's crowded-position index had its worst month against the S&P since 2001. Against it, Bank of America's Bull and Bear indicator hit one of the strongest sell signals of the century.", "direction": "neutral", "levels": null, "due": "2026-09-30", "attribution": "Kalshi relaying BofA and prime-brokerage data", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-03-PM-coldcard-1", "date": "2026-08-03", "edition": "2026-08-03-PM", "channel": "crypto", "ticker": "$BTC", "name": "Coldcard hack", "kind": "catalyst", "call": "More than $100 million of Bitcoin stolen from over 5,000 Coldcard wallets in an ongoing attack, caused by a flaw in Coinkite's random number generator rather than anything in the Bitcoin protocol. This drives renewed interest in Bitcoin ETFs and third-party multi-sig arrangements.", "direction": "event", "levels": null, "due": "2026-12-31", "attribution": "Anthony Pompliano", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-03-PM-SPCX-1", "date": "2026-08-03", "edition": "2026-08-03-PM", "channel": "crypto", "ticker": "$SPCX", "name": "SpaceX", "kind": "catalyst", "call": "SpaceX printed an all-time low the session before its first earnings report in company history, trading 20 percent below an offer price set seven weeks ago and nearly half off its peak, with the insider unlock two days after the print. Asked whether the stock is a big opportunity here, Elon Musk answered I think so.", "direction": "event", "levels": null, "due": "2026-08-31", "attribution": "Elon Musk via Sawyer Merritt", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-03-PM-EPS-1", "date": "2026-08-03", "edition": "2026-08-03-PM", "channel": "macro", "ticker": null, "name": "S&P earnings quality", "kind": "thesis", "call": "S&P 500 EPS growth is tracking 45 percent year over year in Q2 against a 22 percent consensus coming into the quarter, but 19 points of that is Alphabet and Amazon's combined $151 billion of other income on equity investments. Excluding those gains growth is still tracking 26 percent, an acceleration versus Q1 and the fastest pace since 2021.", "direction": "long", "levels": null, "due": "2026-09-30", "attribution": "Goldman Sachs via zerohedge", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-03-PM-CXMT-1", "date": "2026-08-03", "edition": "2026-08-03-PM", "channel": "stocks", "ticker": "$MU", "name": "CXMT capacity", "kind": "catalyst", "call": "Reuters reports CXMT is considering a second Beijing DRAM fab in the Yizhuang district on top of the Shanghai and Hefei plants under construction, taking total capacity to more than double current levels and past 600,000 wafers a month. The new supply is commodity DRAM rather than high-bandwidth memory, which is sold out through 2026.", "direction": "short", "levels": null, "due": "2027-06-30", "attribution": "Reuters via Jukan", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-03-PM-BTC-1", "date": "2026-08-03", "edition": "2026-08-03-PM", "channel": "crypto", "ticker": "$BTC", "name": "Bitcoin", "kind": "level", "call": "Bitcoin sees $58,000 before it sees $75,000, revised UP to 60/40 on 2026-08-04 after Strategy sold 1,638 coins and confirmed it is now a seller rather than the structural bid. Originally 55/45. Saylor's Strategy sold $102 million of Bitcoin and Jim Cramer capitulated on quantum risk the same day the legislative catalyst died, which is a sentiment washout worth looking at rather than buying.", "direction": "short", "levels": "60/40, 58000 before 75000", "due": "2026-10-31", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null, "revised_edition": "2026-08-04-PM"}, {"id": "2026-08-03-PM-AMD-1", "date": "2026-08-03", "edition": "2026-08-03-PM", "channel": "stocks", "ticker": "$AMD", "name": "MI355x throughput", "kind": "thesis", "call": "Kimi K3 serves at 3.8 times higher throughput and 71 percent lower cost on AMD MI355x than on Nvidia B200, per an independent inference shop. AMD reports the next session.", "direction": "long", "levels": null, "due": "2026-09-30", "attribution": "wafer.ai via zerohedge", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-software-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "stocks", "ticker": "$ADBE", "name": "Software over buildout", "kind": "thesis", "call": "Asset-light application software beats the second-derivative AI buildout names over the next six months, at 60/40. Adobe trades near 11 times trailing earnings, Salesforce 13 and Intuit 14, on operating margins of 36.6 and 28.7 percent with capex around 1 percent of revenue, while Microsoft's contracted backlog is $678 billion, up 84 percent, on 30 million paid Copilot seats against 15 million in January.", "direction": "long", "levels": "60/40", "due": "2027-02-02", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-sacks-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "macro", "ticker": null, "name": "AI correction", "kind": "thesis", "call": "The chip selloff is momentum and leverage rather than fundamentals. Memory chip stocks ran roughly tenfold in a year, the Nasdaq fell about 10 percent from its peak while the momentum trade fell 30 to 40, and there will be a return on the AI capex.", "direction": "long", "levels": null, "due": "2027-06-30", "attribution": "David Sacks", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-rotation-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "macro", "ticker": null, "name": "The rotation", "kind": "thesis", "call": "July was not an AI crash but a rotation out of the leveraged capital-hungry end of the complex into the profitable asset-light end. From the June 30 to July 29 close, SanDisk fell 55.32 percent, Nebius 46.33, Bloom Energy 45.90, CoreWeave 38.90, Micron 35.98 and IREN 35.91, while Workday rose 37.24, Adobe 28.49, Intuit 27.64, Salesforce 20.25 and Veeva 17.15. QQQ fell 10.14, SPY 2.32, and Nvidia fell 5.04 while finishing July up 0.33. The money gets made by the toll booths riding on somebody else's capital expenditure, as in 1874 and 2004.", "direction": "long", "levels": null, "due": "2027-06-30", "attribution": "Porter Stansberry", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-oil-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "macro", "ticker": null, "name": "Crude oil", "kind": "thesis", "call": "Oil is higher two weeks from now than it is today, at 65/30, raised from roughly even. Iran denies agreeing to reopen the Strait of Hormuz, the strait stays closed, CENTCOM has redirected 35 vessels, and the de-escalation the tape traded was about strikes rather than about transit. The 35 is that Iran has reopened before under this much pressure.", "direction": "long", "levels": "65/35", "due": "2026-08-16", "attribution": "house", "status": "miss", "resolution": "Wrong and called early. Iran and Oman agreed the Hormuz route three sessions later, the risk premium came out of crude, and Brent fell rather than rose.", "resolved_edition": "2026-08-05-PM"}, {"id": "2026-08-02-PM-iran-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "macro", "ticker": null, "name": "Iran strikes", "kind": "catalyst", "call": "The strikes on Iranian energy targets reported as ordered on July 31 did not happen over the weekend. GOP Senator James Lankford says Trump has no desire to bomb Iran.", "direction": "event", "levels": null, "due": "2026-08-31", "attribution": "James Lankford via Kalshi", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-hormuz-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "macro", "ticker": null, "name": "Strait of Hormuz", "kind": "catalyst", "call": "Iran says reports it agreed to reopen the Strait of Hormuz are false and the strait remains closed while the US continues what Iran calls hostile actions, with ships passing only via Iran's designated route and IRGC Navy permission. CENTCOM has redirected 35 vessels. Iran is contradicting Trump's claim directly.", "direction": "event", "levels": null, "due": "2026-09-30", "attribution": "Fars News via Walter Bloomberg, CENTCOM via Polymarket", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-hedgefunds-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "stocks", "ticker": null, "name": "The unwind", "kind": "thesis", "call": "The July hedge fund unwind was a cleansing event at high probability rather than the start of something. Goldman's VIP crowded-position index fell 12 percent against the S&P for the month, the worst since the index began in 2001 and worse than the month of Lehman, with seven of those points in the worst four-day stretch ever measured. Hedge funds are still up more than 10 percent on the year, so they hedge rather than liquidate.", "direction": "long", "levels": null, "due": "2026-09-30", "attribution": "Jordi Visser", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-crypto-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "crypto", "ticker": null, "name": "Bessent on digital assets", "kind": "catalyst", "call": "Treasury Secretary Scott Bessent made digital assets the third principle of his economic strategy speech: digital assets, stablecoins, tokenization and new payment systems will help shape the future of money, and the United States should not consign itself to the sidelines. Mohamed El-Erian called it a remarkably important speech. No legislative mechanism or date was attached.", "direction": "event", "levels": null, "due": "2026-12-31", "attribution": "Scott Bessent via Lark Davis", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-capex-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "stocks", "ticker": null, "name": "The funding gap", "kind": "thesis", "call": "Capex at Microsoft, Alphabet, Amazon and Meta rose from $150 billion in 2022 to $358 billion in 2025 while their combined free cash flow fell 15 percent to $199 billion. Big Tech now spends more on AI than it generates and the gap gets more extreme from here.", "direction": "short", "levels": null, "due": "2026-12-31", "attribution": "Phil Rosen", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-TSLA-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "investing", "ticker": "$TSLA", "name": "Tesla", "kind": "thesis", "call": "Tesla finished last week with its entire weekly candle including wicks outside the lower weekly Bollinger band, only the second time in company history. The first was February 2016, after which the stock ran 80 percent in eight weeks. Expect at least a mini bounce.", "direction": "long", "levels": null, "due": "2026-09-30", "attribution": "Heisenberg", "status": "hit", "resolution": "Tesla opened up 4 percent the next session, delivering the mini bounce as stated. The larger 80 percent in eight weeks analogue from February 2016 remains untested.", "resolved_edition": "2026-08-03-PM"}, {"id": "2026-08-02-PM-SPX-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "macro", "ticker": null, "name": "DeMark bottom", "kind": "thesis", "call": "The S&P 500 is probably at the end of the sell-off and a big rally may be near. DeMark 13 countdowns marked local tops in January, late May and June, while 9 countdowns have flagged bottoms, and the last 9 bottom appeared during a geopolitical escalation and was followed by a 21 percent rally.", "direction": "long", "levels": null, "due": "2026-10-31", "attribution": "Tom Lee", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-SOX-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "stocks", "ticker": null, "name": "Semiconductor drawdown", "kind": "thesis", "call": "This is not even a real pullback. The semiconductor index had two separate drawdowns above 50 percent in the 1990s, in late 1995 and late 1997, and this one is about 25 percent off the peak. From the end of 1994 to its March 2000 peak the index still ran 850 percent.", "direction": "long", "levels": null, "due": "2027-06-30", "attribution": "Dan Niles", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-SNDK-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "stocks", "ticker": "$SNDK", "name": "Memory lows", "kind": "level", "call": "No confirmation of a low yet in Micron or SanDisk. The action is choppier and the MACD histogram shows seller exhaustion, but a few more marginal lows are likely first to build better bullish divergences.", "direction": "neutral", "levels": null, "due": "2026-08-31", "attribution": "AskLivermore", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-RKLB-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "stocks", "ticker": "$RKLB", "name": "Rocket Lab", "kind": "thesis", "call": "Rocket Lab turns profitable by 2027 following the Iridium acquisition, with the combined company projected to earn about $140 million that year. Iridium's network offsets Rocket Lab's burn and creates a vertically integrated challenger to SpaceX.", "direction": "long", "levels": null, "due": "2027-12-31", "attribution": "Shay Boloor", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-MU-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "stocks", "ticker": "$MU", "name": "Memory re-rating", "kind": "thesis", "call": "Hyperscaler memory spending more than doubles to $761 billion in 2027, roughly 75 percent of total capex, with shortages extending into summer 2028 and only three suppliers. If that means years of elevated earnings, memory re-rates from about 5 times earnings to nearly 12 across Micron, SK Hynix and Samsung.", "direction": "long", "levels": null, "due": "2027-12-31", "attribution": "UBS via Shay Boloor", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-GOOGL-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "stocks", "ticker": "$GOOGL", "name": "TPU-as-a-service", "kind": "thesis", "call": "Alphabet could build a $50 billion annual TPU-as-a-service business by 2028. Barclays estimates external TPU sales could generate about $22 billion of revenue per gigawatt at a 25 percent gross margin, opening a major new revenue pool for Broadcom, at just over 2 gigawatts of deployments.", "direction": "long", "levels": null, "due": "2028-12-31", "attribution": "Barclays via Shay Boloor", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-COIN-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "crypto", "ticker": "$COIN", "name": "Coinbase", "kind": "thesis", "call": "Coinbase is a call on the CLARITY Act plus the crypto rebound, with the agentic payment rails as free upside. More than 99 percent of onchain agentic commerce settled in USDC, more than 97 percent through x402 and more than 90 percent over Base, and none of it carries revenue or guidance yet.", "direction": "long", "levels": null, "due": "2026-12-31", "attribution": "Kyle Reidhead of Milk Road", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-BTC-2", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "crypto", "ticker": "$BTC", "name": "Bitcoin", "kind": "thesis", "call": "Bitcoin sits further below its fair-value logarithmic regression trend than at any time since 2010 and stays weak for at least a few more months, likely becoming more undervalued before year end in line with the four-year cycle, before a fresh bull market. Long run the asset class reaches roughly $10 trillion.", "direction": "short", "levels": null, "due": "2026-12-31", "attribution": "Benjamin Cowen", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-BTC-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "crypto", "ticker": "$BTC", "name": "Bitcoin", "kind": "thesis", "call": "Bitcoin crashes to $50,000 at some point this year, per Kalshi's traders.", "direction": "short", "levels": "50000", "due": "2026-12-31", "attribution": "Kalshi", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-AAPL-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "stocks", "ticker": "$AAPL", "name": "Apple supply", "kind": "catalyst", "call": "Apple is dealing with major MacBook Air shortages amid the memory and silicon crunch, with many new orders not arriving until September.", "direction": "short", "levels": null, "due": "2026-09-30", "attribution": "Bloomberg via StockMKTNewz", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-31-AM-robots-1", "date": "2026-07-31", "edition": "2026-07-31-AM", "channel": "macro", "ticker": null, "name": "Robot vacuum ban", "kind": "catalyst", "call": "The administration is banning all new foreign-made robot vacuums on national security grounds, two days after the FCC restricted new foreign humanoid and quadruped robots under its equipment-authorisation power. The instrument reaches any connected imported device, and no public boundary has been drawn.", "direction": "event", "levels": null, "due": "2026-12-31", "attribution": "Polymarket relaying the administration", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-31-AM-clarity-1", "date": "2026-07-31", "edition": "2026-07-31-AM", "channel": "macro", "ticker": null, "name": "CLARITY odds", "kind": "catalyst", "call": "Kalshi's odds that the CLARITY Act passes this year fell from 40 percent to 33 inside about two and a half hours on Thursday, with Treasury Secretary Scott Bessent naming Senate Democrats as the blocker. The Tillis-Gallego ethics compromise is at the White House and Cynthia Lummis has rejected the latest rewrite from the other side.", "direction": "event", "levels": "40 to 33 percent", "due": "2026-08-31", "attribution": "Kalshi", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-31-AM-boj-1", "date": "2026-07-31", "edition": "2026-07-31-AM", "channel": "crypto", "ticker": null, "name": "Bank of Japan", "kind": "catalyst", "call": "The Bank of Japan held at 1.00 percent on an 8-1 vote, read as unhawkish given at least two known hawks on the board. The Ministry of Finance intervened in the yen ahead of the decision, and one FX desk argues that without it USDJPY would have broken through 164 and openly asks whether the ministry front-ran a hold it already knew was coming.", "direction": "event", "levels": "1.00 percent, 8-1 vote, USDJPY 160.50 pre-decision", "due": "2026-09-30", "attribution": "Bank of Japan", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-31-AM-SNDK-1", "date": "2026-07-31", "edition": "2026-07-31-AM", "channel": "stocks", "ticker": "$SNDK", "name": "SanDisk", "kind": "level", "call": "SanDisk's line in the sand is $1,350 to $1,450. A failed breakout there makes Thursday's move a dead cat and sets up a retest of the 200-day average.", "direction": "neutral", "levels": "1350-1450 line, 200dma below", "due": "2026-09-30", "attribution": "Heisenberg", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-31-AM-SA-1", "date": "2026-07-31", "edition": "2026-07-31-AM", "channel": "stocks", "ticker": null, "name": "Situational Awareness drawdown", "kind": "catalyst", "call": "The Wall Street Journal puts Situational Awareness down 67 percent in July, against a fund that was up 439 percent after fees through June 30 and carried a $45 billion net asset value on July 1. Citadel Securities reportedly paid around $10 billion for most of the public book, the Anthropic stake was retained, and Aschenbrenner was seeking new capital inside 24 hours.", "direction": "event", "levels": "-67 percent July, $45bn NAV July 1", "due": "2026-09-30", "attribution": "Wall Street Journal", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-31-AM-MU-1", "date": "2026-07-31", "edition": "2026-07-31-AM", "channel": "stocks", "ticker": "$MU", "name": "Micron confirmation", "kind": "level", "call": "Micron needs a 906 close to confirm the reclaim, with 932, 955, 973 and 991 mapped above. Michael Burry added to his Micron short at $880 and to a semiconductor index short at $506 into the same move, so the level and the short are a clean two-sided disagreement.", "direction": "neutral", "levels": "confirm 906, targets 932/955/973/991, Burry short from 880", "due": "2026-09-30", "attribution": "MentoviaX and Michael Burry", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-31-AM-AMZN-1", "date": "2026-07-31", "edition": "2026-07-31-AM", "channel": "stocks", "ticker": "$AMZN", "name": "Amazon capex", "kind": "thesis", "call": "Amazon raised 2026 cash capex to $220 billion and named higher memory prices as the reason for roughly $20 billion of it. Trailing free cash flow has swung to negative $7.6 billion from positive $18.2 billion and long-term debt has nearly doubled since December to $128.9 billion, against AWS at $42.2 billion growing 37 percent with a $496 billion backlog.", "direction": "neutral", "levels": "capex 220bn, FCF -7.6bn, LTD 128.9bn", "due": "2027-02-28", "attribution": "Amazon", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-31-AM-AAPL-1", "date": "2026-07-31", "edition": "2026-07-31-AM", "channel": "stocks", "ticker": "$AAPL", "name": "Apple September quarter", "kind": "catalyst", "call": "Apple guided September revenue to $111.7 billion to $113.8 billion, growth of 9 to 11 percent against the 16 percent just delivered, with gross margin stepping down to 47 to 48 percent from 50.1. The June beat included $600 million of tariff refunds worth $0.11 of earnings and about two points of margin, and Services and Greater China both missed.", "direction": "short", "levels": "Sept rev 111.7-113.8bn, GM 47-48 percent", "due": "2026-11-30", "attribution": "Apple", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-30-PM-samsung-1", "date": "2026-07-30", "edition": "2026-07-30-PM", "channel": "stocks", "ticker": null, "name": "Memory supply through 2028", "kind": "thesis", "call": "Samsung guides that no meaningful industry supply increase arrives before 2028 and that the 2027 memory shortage will be more severe than 2026, with tight conditions persisting into 2028. Samsung and SK Hynix have both stopped signing multi-year contracts, betting on higher prices through 2027, and SK Hynix describes HBM, DRAM and NAND as sold out for 2026 with lines booked through 2027.", "direction": "long", "levels": null, "due": "2027-12-31", "attribution": "Samsung and SK Hynix", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-30-PM-robots-1", "date": "2026-07-30", "edition": "2026-07-30-PM", "channel": "macro", "ticker": null, "name": "FCC robot import rule", "kind": "catalyst", "call": "The FCC announced restrictions on new foreign-made humanoid and quadruped robots as a published rule under statutory authority, with a waiver process and judicial review, and no stated effective date. Scope may extend beyond China to all foreign countries. China holds roughly 85 percent of a market that shipped about 15,000 humanoids in 2025.", "direction": "event", "levels": null, "due": "2026-12-31", "attribution": "FCC via Diet TBPN", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-30-PM-lows-1", "date": "2026-07-30", "edition": "2026-07-30-PM", "channel": "stocks", "ticker": null, "name": "July low", "kind": "thesis", "call": "The July low holds into mid-August, revised back DOWN to 60/40 on 2026-08-03 after hedge funds re-grossed into tech at the fastest pace since 2022 and tech funds took their largest five-week inflow on record, which is a weaker setup than the slow-rebuild the upgrade assumed. Was revised UP to 70/30 on 2026-08-02 from 60/40. The mechanical seller is out of ammunition: Goldman's crowded-position index had its worst month against the S&P since 2001 and hedge funds are still up more than 10 percent on the year, so they hedge rather than liquidate. The 30 is Phil Rosen's funding gap, which no bounce fixes.", "direction": "long", "levels": "70/30", "due": "2026-08-15", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null, "revised_edition": "2026-08-02-PM"}, {"id": "2026-07-30-PM-korea-1", "date": "2026-07-30", "edition": "2026-07-30-PM", "channel": "investing", "ticker": null, "name": "Korea deleveraging", "kind": "thesis", "call": "Korea-focused leveraged ETF assets have fallen from a $53 billion peak on June 22, then 3.2 percent of Korean free float, to $15 to $16 billion at about 1.5 percent, so more than seventy percent of the exposure is gone. JPMorgan puts the deleveraging 75 to 90 percent complete. From July 31 the minimum cash deposit on new leveraged ETF purchases rises to 30 million won.", "direction": "long", "levels": null, "due": "2026-09-30", "attribution": "Goldman Sachs and JPMorgan", "status": "hit", "resolution": "The deleveraging finished and the bid returned. Foreign investors made a record $5.4 billion purchase of Korean equities, with capital flooding back into Seoul.", "resolved_edition": "2026-08-02-PM"}, {"id": "2026-07-30-PM-fed-1", "date": "2026-07-30", "edition": "2026-07-30-PM", "channel": "macro", "ticker": null, "name": "Fed path", "kind": "catalyst", "call": "Kalshi prices a 69 percent chance the Fed hikes at some point in 2026 and an 89 percent chance it does not cut. For September specifically Polymarket sits near 56 percent and CME FedWatch splits it 60/40, consistent with the house 55/45.", "direction": "event", "levels": "hike 2026 69 percent, September 56-60 percent", "due": "2026-12-31", "attribution": "Kalshi, Polymarket and CME", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-30-PM-citadel-1", "date": "2026-07-30", "edition": "2026-07-30-PM", "channel": "macro", "ticker": null, "name": "Citadel sequence", "kind": "thesis", "call": "Citadel publicly forecast a surprise Fed hike on Tuesday, the semiconductor complex sold off, the Fed held Wednesday, Situational Awareness was margin called, and Citadel bought its book Thursday. Multiple named accounts infer the call was positioning. The sequence is documented, the intent is not, and no evidence has been produced.", "direction": "neutral", "levels": null, "due": "2026-12-31", "attribution": "InvestorsLive, ThinkingUSD and others, inference only", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-30-PM-SKHY-1", "date": "2026-07-30", "edition": "2026-07-30-PM", "channel": "stocks", "ticker": null, "name": "SK Hynix", "kind": "level", "call": "UBS initiated SK Hynix at a $204 target, arguing the price does not reflect structurally higher memory profitability against return on equity above 40 percent through 2031, with agentic AI lifting 2027 DRAM bit growth to 36 percent and NAND to 23 percent. Chairman Choi Tae-won bought more than $3 million of stock in the open market.", "direction": "long", "levels": "target 204", "due": "2026-12-31", "attribution": "UBS", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-30-PM-SA-1", "date": "2026-07-30", "edition": "2026-07-30-PM", "channel": "stocks", "ticker": null, "name": "Situational Awareness unwind", "kind": "catalyst", "call": "Situational Awareness was forced to unwind its entire public equity book, longs and shorts, in one block to Citadel after margin calls. Reported by Bloomberg and the Financial Times on Wednesday night, CNBC at 6:05am and the Wall Street Journal at 8:39am Thursday. Holdings then rose 13 to 33 percent the same session. No drawdown figure has been confirmed by anyone, and the reported assets under management range from $20 billion to $45 billion.", "direction": "event", "levels": null, "due": "2026-09-30", "attribution": "Bloomberg, FT, CNBC and WSJ", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-30-PM-HOOD-1", "date": "2026-07-30", "edition": "2026-07-30-PM", "channel": "crypto", "ticker": "$HOOD", "name": "Robinhood deposits", "kind": "thesis", "call": "July net deposits are tracking toward $4 billion against $10.1 billion in June, which is why Barclays cut to $105, Goldman to $118 and Needham to $120 days after raising those same targets. Robinhood counters that July daily volumes match a record second quarter and that the $4 billion excludes Trump Accounts.", "direction": "short", "levels": "PTs 105 / 118 / 120", "due": "2026-08-31", "attribution": "Barclays, Goldman and Needham", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-30-PM-AAPL-1", "date": "2026-07-30", "edition": "2026-07-30-PM", "channel": "stocks", "ticker": "$AAPL", "name": "Apple", "kind": "level", "call": "344 is the top on Apple, a full hundred-percent measured move off the impulse leg, with a slight overshoot possible. The expression is selling December calls at the 360 to 365 strikes for around $50 rather than buying puts.", "direction": "short", "levels": "top 344, short calls 360-365", "due": "2026-09-30", "attribution": "Stocks with Josh", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-29-PM-ust30-1", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "macro", "ticker": null, "name": "Thirty-year Treasury", "kind": "level", "call": "The thirty-year yield broke through the 5.2 percent ceiling it had been testing since October 2023, its highest since July 31 2007. The long end is now the constraint on equities rather than the funds rate.", "direction": "short", "levels": "30-year above 5.2 percent", "due": "2026-10-31", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-29-PM-interceptors-1", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "macro", "ticker": null, "name": "US interceptor stockpiles", "kind": "thesis", "call": "More than half of US Patriot and THAAD interceptor stockpiles have been consumed in the Iran war. Patriots are under 1,000 from 2,330 and THAAD near 250 from 360, with more than 1,000 Tomahawks and 1,100 JASSMs fired and a rebuild of three years or more, which constrains transfers to Ukraine and Gulf allies.", "direction": "neutral", "levels": null, "due": "2026-12-31", "attribution": "CSIS", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-29-PM-gpu-1", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "macro", "ticker": null, "name": "GPU rental spread", "kind": "thesis", "call": "Spot GPU rental prices run at least twice contracted rates, so hyperscalers are underearning and whoever signed compute contracts in 2024 or 2025 is overearning. Google is reportedly paying $900 million a month for 110,000 GPUs rented from SpaceX at roughly twice spot.", "direction": "long", "levels": null, "due": "2026-12-31", "attribution": "Gavin Baker and Dwarkesh Patel", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-29-PM-fed-1", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "macro", "ticker": null, "name": "Next Fed move", "kind": "thesis", "call": "The next Fed move is a hike at 60/40, and it lands in September at 55/45 rather than later, revised down from the near-certainty the odds implied on Monday. The reason to fade September is that Warsh accepted three dissents rather than move early, so a chair tolerating that much internal disagreement is not being rushed by it.", "direction": "neutral", "levels": "hike 60/40, September 55/45", "due": "2026-09-30", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-29-PM-credit-1", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "stocks", "ticker": null, "name": "Hyperscaler credit", "kind": "thesis", "call": "Credit default swap prices at record highs on Oracle, SpaceX, Google, Amazon and Nvidia are the market repricing when the AI payoff arrives rather than default risk, so the trade is non-AI value, the S&P 400, private credit and commodities off the AI trade.", "direction": "short", "levels": null, "due": "2026-12-31", "attribution": "Torsten Slok of Apollo", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-29-PM-clarity-3", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "macro", "ticker": null, "name": "CLARITY footnote", "kind": "thesis", "call": "On Commodity Futures Modernization Act precedent, the consequential provision in CLARITY will read as a footnote and will involve offshore derivatives, the way the Enron loophole did in 2000.", "direction": "neutral", "levels": null, "due": "2026-12-31", "attribution": "Jeff Park", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-29-PM-clarity-2", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "macro", "ticker": null, "name": "CLARITY ethics compromise", "kind": "thesis", "call": "CLARITY passes in August through an ethics compromise modelled on the Laken Riley Act, letting state attorneys general sue the Justice Department but not the President directly. Ruben Gallego and Thom Tillis are finalising the language for the White House.", "direction": "event", "levels": null, "due": "2026-08-31", "attribution": "Mike Novogratz", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-29-PM-clarity-1", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "news", "ticker": null, "name": "CLARITY Act floor vote", "kind": "catalyst", "call": "John Thune confirmed on Fox News that the CLARITY Act gets a Senate floor vote before the August recess, with Russia sanctions ahead of it. Charles Schwab puts the hard deadline at August 10 and Bloomberg reports nearly ten Democrats in favour.", "direction": "event", "levels": null, "due": "2026-08-10", "attribution": "John Thune via Lark Davis", "status": "miss", "resolution": "Thune hedged it to depending on Democrats supplying the votes, and no vote was scheduled. Relayed as a confirmation and it was not one.", "resolved_edition": "2026-08-03-PM"}, {"id": "2026-07-29-PM-SPCX-1", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "stocks", "ticker": "$SPCX", "name": "SpaceX", "kind": "catalyst", "call": "SpaceX reports for the first time in early August with roughly a billion shares unlocking days later and 56 to 60 percent of supply free by year end, against about $60 billion of compute sold over nine to twelve months and Anthropic alone at $1.25 billion a month.", "direction": "event", "levels": "low 107, listing 135, Morningstar 63, Morgan Stanley bull 600", "due": "2026-08-31", "attribution": "Limitless", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-29-PM-NBIS-1", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "stocks", "ticker": "$NBIS", "name": "Nebius", "kind": "level", "call": "Nebius closing below $132 opens $85 to $100. Nvidia holds 9.3 percent after a $2 billion investment, and the September 11 warrant date plus $4.3 billion of convertibles are the dilution overhang.", "direction": "short", "levels": "trigger 132, targets 85-100", "due": "2026-09-30", "attribution": "AtlasShrug1", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-29-PM-MU-1", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "investing", "ticker": "$MU", "name": "Micron", "kind": "level", "call": "Micron filled the 751 gap and closed under 800. The map is 770 as the low still standing, 832 as the level lost, and 872 as the reclaim that makes a bounce real, with the 100-day average as the line.", "direction": "neutral", "levels": "770 low, 832 lost, 872 reclaim, gap fill 751", "due": "2026-08-31", "attribution": "MentoviaX", "status": "hit", "resolution": "The map held through a violent test. Micron closed above 872 on Thursday and traded 925 overnight, roughly 30 percent off its trough inside a day. The new confirmation level is a 906 close, with 932, 955, 973 and 991 mapped above it.", "resolved_edition": "2026-07-31-AM"}, {"id": "2026-07-29-PM-BTC-1", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "crypto", "ticker": "$BTC", "name": "Bitcoin", "kind": "level", "call": "Bitcoin does not break $58,000 to $60,000, the top of the current range is $85,000, and $40,000 is the invalidation that would mean SOL near $40 and another four to six months of waiting.", "direction": "long", "levels": "floor 58000-60000, range top 85000, invalidation 40000", "due": "2026-09-30", "attribution": "Ansem", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-29-PM-BE-1", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "stocks", "ticker": "$BE", "name": "Bloom Energy", "kind": "thesis", "call": "Bloom Energy's five-gigawatt production ambition needs close to 220 tons of scandium oxide a year against global supply estimated near 240 tons. Bloom calls the claim false and misleading and has published no counter-number.", "direction": "short", "levels": null, "due": "2026-12-31", "attribution": "Hunterbrook Media", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-yanbu-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "macro", "ticker": null, "name": "Yanbu pipeline route", "kind": "thesis", "call": "A Houthi Telegram statement claims drones struck targets related to crude transport from Eastern Saudi Arabia to Yanbu, the Red Sea terminus of the pipeline that exists to bypass Hormuz. A credible threat to that route is what would make a closed strait matter.", "direction": "bearish", "levels": null, "due": "2026-09-30", "attribution": "Houthi Telegram via the threadguy digest", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-semis-east-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "stocks", "ticker": null, "name": "East versus West semis", "kind": "thesis", "call": "Long Eastern semis, short Western semis, on China beginning mass production of homegrown DUV lithography tools. ASML fell 2.5 percent on the headline.", "direction": "neutral", "levels": null, "due": "2026-12-31", "attribution": "Tulip King via the threadguy digest", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-neocloud-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "crypto", "ticker": null, "name": "NeoCloud residual value", "kind": "thesis", "call": "The entire NeoCloud equity return sits in unobserved 2032 GPU residual value, because chips, customer contracts and debt all mature together. One megawatt: $30M build, 75/25 debt/equity, $10.5M revenue, negative $6M after year one, cash breakeven year five, six-year cumulative $3.5M on $7.5M equity for 6 to 7 percent annualised. At a 60 percent residual that becomes 23 percent annualised; at 30 percent the trade is over.", "direction": "bearish", "levels": {"residual_bull": 0.6, "residual_break": 0.3}, "due": "2032-12-31", "attribution": "Milk Road AI", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-hormuz-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "macro", "ticker": null, "name": "Oil prices the negotiation", "kind": "thesis", "call": "Crude fell 5 percent on a Times of Israel report about what mediators believe, published an hour after Tehran denied that talks exist, while physical Hormuz transit was zero tankers in either direction. The oil price is trading the negotiation rather than the flow.", "direction": "neutral", "levels": null, "due": "2026-08-31", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-cowen-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "macro", "ticker": null, "name": "Fed sequencing", "kind": "thesis", "call": "A hold on July 29 is what triggers the hike. The two-year already sits at 4.1 to 4.2 percent above the funds rate, so a hold pushes the thirty-year through 5.2 percent and the ten-year toward 5, and the bond market forces a September hike. Paired with a 10 to 20 percent equity drawdown, precedents August 2022, September 2018 and September 2014.", "direction": "bearish", "levels": {"ust30": 5.2, "ust10": 5.0}, "due": "2026-09-30", "attribution": "Benjamin Cowen", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-clarity-2", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "macro", "ticker": null, "name": "CLARITY Senate votes, competing count", "kind": "thesis", "call": "CLARITY comes down to about three or four Democratic senators, and passage is anyone's guess. Directly contradicts Gillan's seven-vote count from the same network on the same day, and neither cites a whip count.", "direction": "neutral", "levels": {"dem_votes_needed": 3.5}, "due": "2026-08-10", "attribution": "Josh Ryman of GSR", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-clarity-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "news", "ticker": null, "name": "CLARITY Senate votes", "kind": "thesis", "call": "CLARITY needs seven Democratic Senate votes and does not get them. The blockage is who enforces roughly 600 pages of Trump-family ethics provisions, currently the Attorney General, Trump's former personal lawyer Todd Blanche, where Democrats want state attorneys general instead.", "direction": "bearish", "levels": {"dem_votes_needed": 7}, "due": "2026-08-10", "attribution": "John Gillan of Milk Road", "status": "hit", "resolution": "Correct and early. The bill needs 60 votes and does not have them, the ethics package is where it broke, and no vote was scheduled before recess.", "resolved_edition": "2026-08-03-PM"}, {"id": "2026-07-28-PM-SSI-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "stocks", "ticker": null, "name": "Nvidia and Safe Superintelligence", "kind": "catalyst", "call": "Nvidia takes roughly $5 billion of equity in Safe Superintelligence plus priority access to Vera Rubin, and SSI moves off Google TPUs, which it had primarily relied on. A frontier lab switching silicon platforms mid-flight, bought with capital and queue position.", "direction": "bullish", "levels": {"equity_bn": 5}, "due": "2026-12-31", "attribution": "Diet TBPN, multiple sources on the equity figure", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-SPCX-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "stocks", "ticker": "$SPCX", "name": "SpaceX", "kind": "catalyst", "call": "SPCX fell 5.5 percent to 47 percent below its June 16 high with roughly $1.2 trillion of market value gone, trades below its $135 listing price, and faces its first major shareholder unlock on August 6.", "direction": "bearish", "levels": {"listing": 135, "off_high_pct": 47}, "due": "2026-08-06", "attribution": "Market list and VirtualBacon", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-SMCI-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "stocks", "ticker": "$SMCI", "name": "Supermicro", "kind": "catalyst", "call": "Supermicro carries a second criminal probe in Taiwan, a $7 billion raise whose 45 million shares at $27.50 are underwater, 7 percent mandatory convertible preferred, $6.6 billion quarterly cash use, trailing free cash flow of negative $6.9 billion, and short interest of 103.2 million shares or 20 percent of float into August 11 earnings.", "direction": "bearish", "levels": {"raise_px": 27.5, "ttm_fcf_bn": -6.9, "short_pct_float": 20}, "due": "2026-08-11", "attribution": "Rick Orford", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-ORCL-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "stocks", "ticker": "$ORCL", "name": "AI credit", "kind": "thesis", "call": "The AI ecosystem's weight in the investment-grade index goes from under 3 percent to over 6. Hyperscaler capex revised for 2026 from 600 to above 800 billion, 2027 from 850 to 1,300, 2028 near 1,300. Oracle sits one notch above junk with CDS at 2008 levels and spreads beyond 220bps. The CDO analogy for late-1990s telecom is rejected on issuer credit quality.", "direction": "bearish", "levels": {"ig_weight_pct": 6, "orcl_spread_bps": 220}, "due": "2026-12-31", "attribution": "Vishy Tirupattur of Morgan Stanley", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-NVDA-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "stocks", "ticker": "$NVDA", "name": "Nvidia", "kind": "level", "call": "Nvidia bottomed near $192 and bounced off its 200-day moving average for the third time in 21 sessions. A level tested three times in a month is a queue rather than support.", "direction": "bearish", "levels": {"low": 192}, "due": "2026-08-29", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-MU-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "stocks", "ticker": "$MU", "name": "Micron", "kind": "level", "call": "Micron broke below $800, leaving a gap fill at 751 underneath and 872 then 891 above.", "direction": "bearish", "levels": {"gap_fill": 751, "up1": 872, "up2": 891}, "due": "2026-08-29", "attribution": "Stocks list", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-KOSPI-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "investing", "ticker": null, "name": "KOSPI", "kind": "catalyst", "call": "The KOSPI was halted after falling 10.84 percent to 6,023.66, its second-largest single-day drop on record, leaving it down nearly 29 percent for the month.", "direction": "bearish", "levels": {"close": 6023.66, "day_pct": -10.84, "month_pct": -29}, "due": "2026-07-31", "attribution": "Market list", "status": "hit", "resolution": "The crash ran further than the call described, with the index down roughly 33 to 40 percent for July depending on the measure, then snapped back about 14 percent in Friday's session on a $13.9 billion sovereign wealth injection for AI data centres. Around 3.4 percent of South Korean adults were hit with margin calls.", "resolved_edition": "2026-07-31-AM"}, {"id": "2026-07-28-PM-ISRG-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "stocks", "ticker": "$ISRG", "name": "Memory cost pass-through", "kind": "thesis", "call": "Memory pricing has appeared as a named cost line in Intuitive Surgical's results, putting the DRAM cycle into surgical robotics rather than only hyperscaler capex.", "direction": "bearish", "levels": null, "due": "2026-10-31", "attribution": "Chip Stock Investor", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-IREN-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "crypto", "ticker": "$IREN", "name": "IREN funding model", "kind": "thesis", "call": "IREN's buildout is described as phase-funding-phase, which cannot be reconciled with negative $6 million per megawatt in year one unless a third party is funding the phase.", "direction":

what that costs. Of **$166 billion owed from the IEEPA tariffs, $122 billion has been filed for**, with roughly **$42 to $44 billion not yet eligible** and about **$20 billion filed but unpaid**. Petersen credits Customs and Border Protection, which built the CAPE refund module in two or three months on top of ACE, a system that took 10 to 15 years to deliver. The failure is in the brokerage community. Steel and aluminium duties broke the old model where value, country of origin and HS code were enough to compute duty. Now filers must break out **what percent of an object's value is steel and aluminium, and the country of smelt**. Many did not have that data and simply transmitted a duty figure, so their entries have to be corrected through a legal process before any refund flows.\n\nPetersen sees the trend continuing and names the case that makes the point. **Europe now requires GPS coordinates of where a tree was grown for imported wood**, plus a trucker's receipt proving that truck carried it from that forest to that sawmill.\n\n## Hormuz is effectively shut\n\nOn container shipping, Petersen calls the strait **pretty much closed. One or two transits a day against almost 100 at peak.** Tankers are down heavily but still moving more than boxes. **Jebel Ali in Dubai was the ninth largest container port in the world** before the war, and its transshipment traffic has rerouted, much of it to India. The Red Sea has been closed since December 2023, so almost everything routes around the southern tip of Africa.\n\nInsurance is the binding constraint. **It costs 10 to 15 percent of the value of the ship to insure a single voyage through**, and Petersen says he does not know how anyone underwrote it, since a **$200 million ship can be carrying a billion dollars of merchandise**. Iran and Oman have agreed a new route, but Iran will not open the strait until the US lifts its blockade, and past peace deals were followed the next day by attacks on ships.\n\n## The one variable that would change the call\n\nA price war between OpenAI, Anthropic and the Chinese open models. Eisman names it as his single condition and admits nobody knows the timing. If it lands in two months, the AI trade unwinds while the capex commitments are still live. If it lands a year out, another four quarters of $225 billion capex runs first and the same story keeps compounding. Everything else on the board, benign credit, strong employment, record indices, is consistent with either.\n", "01kzc41yt0c2tay3819ncp8tq5": "# The US Is Reportedly Defending The Yen With Euros, And Nobody Has Seen This Before\n\n**Source:** Prof G Markets, a guest whose name the clip does not give ([open original](https://read.readwise.io/read/01kzc41yt0c2tay3819ncp8tq5))\n\nOne claim, delivered in under two minutes, and it is a mechanism nobody on the show has encountered: the United States is intervening in the yen market using euros, and it has been in touch with the European Central Bank about it.\n\n## The claim, in his words\n\n\"I have never heard of any country intervening in anyone else's market using a third party currency before. This is a new one on me, a new one to everyone I've spoken to about it.\"\n\nThe explanation he gives for why is deflationary rather than dramatic. It is not a strategy. It is inventory. \"It's a function of the fact that the pot of money that the US has stored away for these sorts of instances is predominantly in euros and yen. So, this is what they've got available to sell for these sorts of purposes.\"\n\nRead that carefully. The US reserve holdings are not dollars, because a country does not hold reserves in its own currency. When Washington wants to buy yen to support it, the assets on hand to sell are euros. The euro leg is not a signal being sent to Europe. It is what happens to be in the drawer.\n\n## What he says about the European Central Bank\n\n\"The US authorities have been in touch with the European Central Bank. This didn't come as a total surprise. I don't think, to the European Central Bank.\"\n\nThat is the full extent of it. He does not name an official on either side. He does not say when the contact happened, what form it took, or whether the ECB consented, objected or merely acknowledged. He also does not give a size for the intervention. No figure appears anywhere in the clip, and inventing one to make the story land would be dishonest.\n\nWhat he does establish is that this was not sprung on Frankfurt. The ECB knew.\n\n## The consequence he actually flags\n\nThe interesting part is not the transaction. It is the second-order effect he draws out, and he draws it as a conditional rather than a forecast.\n\n\"If this carries on and if the US ends up in a situation where it's selling shedloads of euros against the yen and you start to get exchange rate distortions in the euro as a result of what the US is doing to help out Japan, we are not in Kansas anymore.\"\n\nUnpack the mechanism. Sustained selling of euros to buy yen is, in currency terms, downward pressure on the euro. The ECB sets policy for the eurozone based on conditions inside the eurozone, and one of the transmission channels it manages is the exchange rate. If a third party pushes that rate around at volume for reasons that have nothing to do with European inflation or European growth, the ECB is managing a currency it no longer fully controls, on account of a Japanese problem.\n\nThat is the part with no precedent. Intervention normally involves two currencies and at most two central banks with a shared interest in the pair. Here there are three currencies and a third central bank carrying the side effects of a policy it did not choose.\n\n## What the clip deliberately does not resolve\n\nHe ends on an admission rather than a conclusion: \"I don't know how that pencils.\" That is the honest position and it should be preserved rather than filled in.\n\nThree things are open and stay open. There is no stated size, so nobody can judge whether euro-selling pressure is a rounding error or a real distortion. There is no stated duration, and his whole conditional turns on the phrase \"if this carries on.\" And there is no stated arrangement with the ECB beyond contact having occurred, so whether Frankfurt has any recourse is unaddressed.\n\n## Why this belongs next to the intervention numbers\n\nThe scale of Japan's defense is the context that makes the euro leg plausible rather than exotic. A currency defense large enough to require reaching into a reserve pot that holds mostly euros is a defense that has run past the easy options. The choice of instrument is evidence about the size of the problem.\n\nIt also reframes what \"the US is helping Japan\" means. Helping is not a statement about goodwill here. It is a balance-sheet operation with a third-party cost, and the party bearing that cost was informed rather than consulted.\n\n## The one variable that would change the call\n\nThe size. Everything in this clip turns on a number that does not exist yet. Small and occasional, and the euro leg is a quirk of what the reserve pot happened to hold, with no European consequence at all. Sustained and large, and the ECB is running policy against an exchange rate being moved by a foreign treasury for a foreign purpose. That is a genuinely new problem for the euro. Until someone puts a figure on the euro-yen intervention, this is a mechanism worth understanding and not yet a position to hold.\n", "01kzc42tnassb5pxq247gz49f3": "# The Arithmetic Behind a $750 AMD Target, Shown in Full\n\n**Source:** Jose Najarro on What the Chip Happened, covering the AMD Q2 call and Lisa Su's guidance ([open original](https://read.readwise.io/read/01kzc42tnassb5pxq247gz49f3))\n\nAMD fell nearly 9 percent on an earnings report Najarro calls great, and he raised his target from $600 to $750 on the same print. The value here is that he shows every step of the math rather than asserting the number.\n\n## The quarter, and why the drop was about expectations\n\nRevenue rose **50 percent year over year**, driven by the data centre segment growing **over 105 percent**. AMD beat analyst estimates, but only by **2 percent**, which Najarro shows is the historical pattern. AMD beats, never by a large margin.\n\nGuidance was the better number. Analysts modelled roughly **$12.5 billion** and Lisa Su gave **$13 billion at the midpoint**. Najarro reads that as sandbagging, since AMD is only expected to begin selling the **Helios rack**, its full rack-scale system, in the final month of the quarter.\n\nHis framing of the whole print: the AMD story was never Q1 or Q2. It was always the second half of 2026, when Helios opens a rack-scale market AMD has never competed in. The only question the quarter had to answer was whether that remained intact, and it did.\n\n## The data centre ramp\n\n| Period | Data centre revenue |\n|---|---|\n| Q1 2026 | $5.7 billion |\n| Q2 2026 | $6.7 billion, up 107 percent year over year |\n| First half 2026 | roughly $12.4 billion, call it $12.5 billion |\n| Second half 2026, Najarro's estimate | about $15 billion |\n| Full year 2026, implied | roughly $27.5 billion |\n| Full year 2027, at 110 to 115 percent growth | roughly $60 billion |\n\nThe 2027 figure comes from Su's own language. On server CPUs she guided to **more than 80 percent year-over-year growth in the second half of 2026 and more than 70 percent for full year 2027**. On the whole data centre segment she said revenue would **more than double year over year in 2027**.\n\nShe also pushed back on analysts directly. To CJ: \"what we're trying to tell you is your data center AI number is probably too low.\" To Stacy, on the over-100-percent 2027 growth figure: \"this notion of over 100 percent should be considered well over 100 percent.\" Najarro takes that as a hint at 130 to 140 percent rather than the 110 to 115 percent he modelled.\n\n## The $750, step by step\n\nThe load-bearing statement is that AMD is now **tracking materially ahead of the long-term financial model** presented at its November financial analyst day. Revenue growth will run **substantially above the prior target of greater than 35 percent**, and the company expects to **\"significantly exceed\" its $20 annual earnings per share target within its strategic time frame**, defined as three to five years.\n\nNajarro's arithmetic from there:\n\n- Original target: **$20 of EPS** within three to five years, which he already assumed AMD would hit closer to three\n- \"Significantly exceed\" taken conservatively as **$25 of EPS**\n- **A 30x forward multiple**, which he notes is not unusual for semiconductor names\n- **$25 \u00d7 30 = $750**\n\nBecause the multiple is forward-looking against a three-to-five-year earnings horizon, he pulls the price timeline in to **two to four years**. Against a stock at **$472**, that is his upside case. He also gives the sensitivity honestly. At **$30 of EPS the same 30x multiple produces $900**, and he asks his audience directly whether $25 is too aggressive or too conservative.\n\nHe is explicit about what the number depends on. Everything has to fall into line, the market has to keep evolving as it has, and the path will be volatile rather than linear. He is not adding heavily on this dip because he already bought heavily on the prior drawdown.\n\n## The Elon problem for AMD bulls\n\nNajarro opens with something from the SpaceX earnings call that he thinks bears will use. **Elon Musk said SpaceX has committed to using Nvidia GPUs exclusively because they are the best.**\n\nTwo consequences for AMD. First, if exclusive-Nvidia becomes the norm among neocloud and AI players rather than an exception, the market will read it as a structural problem. Second, and more specific: **xAI, described in this clip as now folded into SpaceX, was previously an AMD customer running MI300 and taking part in the MI325 and MI350 programmes.** A customer today is not a customer tomorrow. Najarro notes the reverse can also hold as AMD's silicon improves, but he says investors should track it closely.\n\n## Where he criticises Lisa Su\n\nHis one complaint is disclosure quality. Asked what AMD earns per gigawatt of deployed capacity, Su answered **\"in terms of revenue per gigawatt, I think we've said double-digit billions. We're still in that range.\"**\n\nDouble-digit billions covers $10 billion to $99 billion. Nvidia by contrast has been specific and sequential: **about $40 billion per gigawatt previously, closer to $60 billion now, expected to reach $80 billion and eventually $100 billion.** Najarro's ask is modest. Give a range like $20 to $40 billion, or give a conservative floor, but give investors something they can build a model against.\n\nHis broader position is that both can win. He remains primarily an Nvidia investor and thinks the market is large enough that AMD and Nvidia both take meaningful share, and he expects analysts to raise AMD price targets and revenue estimates within 24 hours of the call. That resets the bar to $13 billion for next quarter. That is why he expects a genuine beat three months out.\n\n## The one variable that would change the call\n\nWhether \"significantly exceed $20\" actually means $25. The entire $750 rests on that single interpretation of a single phrase, multiplied by a multiple Najarro chose. If Su means $22, the same 30x gives $660 and the stock is roughly fairly valued today. If she means $30, it gives $900. Nothing in the quarter resolves it, and AMD has never once given a number when a range would do.\n", "01kzc78a2wpbr01y047nqjg9fg": "# Milk Road's John Gillen Has A Resting Bid At $55,000 And Three Doors To Trade\n\n**Source:** Milk Road, written by Chevy Cassar from a PRO note by in-house analyst John Gillen ([open original](https://read.readwise.io/read/01kzc78a2wpbr01y047nqjg9fg))\n\nGillen opened a recent note with a line that would have drawn laughter three months ago. If you are in AI, pivot to crypto. What makes it usable is that he shows the ladder rather than the thesis.\n\n## The rotation he is calling, and the damage he is calling it after\n\nBitcoin topped at $126,198 last October and trades roughly 49 percent below that high. The one thing in its favor this time is what did not happen. No exchange failed, no stablecoin snapped its peg. Money simply left, and a lot of it went into AI equities.\n\nThen July arrived. Chip stocks shed more than $1 trillion in market value over a few weeks, Korean chipmakers took damage, and the Nasdaq 100 fell more than 10 percent. Investors started asking whether the capital expenditure on chips, buildings and data centers will ever earn its keep.\n\nGillen is not calling a top. He thinks the AI trade still works and goes higher. His claim is narrower. The easy part is done. The 1,000 percent gains are behind, and what was a flood of capital is now a knife fight over market share at every layer of the stack. His personal signal for lateness has nothing to do with valuation. Regular people in his life have started asking him about the VanEck Semiconductor ETF.\n\n## The CLARITY mechanics, kept precise\n\nCLARITY would write into US law which crypto assets count as commodities under the CFTC and which count as securities under the SEC. Today that split gets decided case by case in court, and that is why nobody wants to build in the United States.\n\nThe bill cleared the House 294 to 134 last July and got through Senate Banking 15 to 9 in May. It needs 60 votes on the Senate floor. Majority Leader John Thune promised a vote before recess but had not filed for cloture as of yesterday, and a cloture motion has to sit a full day before anyone can act on it. Tomorrow is the last scheduled working day before summer recess. Unless the Senate works into the weekend, an outcome the newsletter says is not strictly off the table, the arithmetic does not close.\n\nPunchbowl reports Democrats have settled on voting no unless Republicans move on ethics, illicit finance and stablecoin yield. Polymarket puts the odds of the bill becoming law in 2026 at 17 percent.\n\n## Three doors\n\n| Outcome | What it does to price | Gillen's exposure |\n|---|---|---|\n| It passes | A market positioned for failure gets shocked upward | Already long |\n| It dies on the floor | Crypto tests bear market lows, bill waits for the midterms | Resting bid fills lower |\n| Nothing happens | Senate leaves Friday, returns to 14 working days in September and a government to fund | Keeps accumulating on schedule |\n\nDoor three is the one the newsletter thinks most likely. The reason to read the table rather than the forecast is that Gillen is set up so all three outcomes are survivable, and that is a different thing from being right about the vote.\n\n## The ladder itself\n\nHe bought at $58,074 on July 1, filling a bid he had set back in February. His next bid sits at $55,000, and he will add under $60,000 on general principle. That is the whole system. Nothing about it requires knowing what Thune does this week.\n\nThe debate he reports among larger investors is whether to allocate this month or wait until fall, and either way he expects the smart money fully positioned by Q4. He is careful that none of this means the bottom is in. The instruction is not to dump everything into Bitcoin this week but to use the window to decide which crypto assets you want to hold before the next cycle starts without you. His phrasing: \"Don't miss a generational entry on the apex assets of finance, just because you're revenge trading electric sand.\"\n\n## The three lines further down the page\n\nThe short items at the bottom carry more macro than the lead. Lyn Alden puts US debt at $39 trillion, rising roughly $2 trillion a year, and says there is really no way out other than default. For a reserve currency, default means debasement. Tom Lee's second-half outlook notes the market's price to earnings multiple fell from 19.4 times to 18.4 times on 2027 earnings, meaning it got cheaper while going up. Kyle Reidhead says the Fed will not raise in September because inflation is cooling rather than heating.\n\nRead together with the lead, those three make the pivot argument better than the pivot argument does. Debasement without a rate hike is the condition under which a 49 percent drawdown in a fixed-supply asset looks like a mispricing rather than a verdict.\n\n## The one variable that would change the call\n\nWhether $55,000 actually trades. Gillen's plan is built for a failure that pushes Bitcoin lower and fills him better, and door two and door three both point that way. If CLARITY dies on the floor or quietly expires on Friday and Bitcoin holds above $60,000 into September anyway, then the bill was never the marginal buyer's reason and his ladder sits unfilled while the rotation he is calling happens above him.\n"}, "deepDives": ["01kz6cqnpq9dmp04b2bmsam265", "01kz6dcw3j4czybzarfkcqnb4g", "01kz6h7hmswmxrpz3s7z05cfc3", "01kz6vgs8kn7y01yk3amk43kcp", "01kz72dyx6b3k68vqx4mkdkqf6", "01kz7qwryy365s4awdkprvf8zb", "01kz9b2cvxwx0npaq44jby364v", "01kz9b9cmjc3ff1h5mx6ar8msj", "01kz9mthc8c5ydpyk9fmaavswg", "01kza18t1xeqr4gy547yy2e7x5", "01kza9xv6c6gz5yxwqf58nqayg", "01kzacm25f6fx739hbmb6873s3", "01kzbpcf59wvj2mjf5e1grs7zz", "01kzbpzyzjw6z36caxbw4yy9dc", "01kzbq20xvf0kjr4sp863kwry8", "01kzbq27hdvemwev13pnc9srvg", "01kzbq3p5gvd9vnt9hzj5xypfk", "01kzbq85c6ezqertgbvvkqz3j8", "01kzbqjkx1eb2sp2xdsad03msh", "01kzbqp3bc9hsn20jd3c2sh4pp", "01kzbwnynyz2cn7xfb6e0mww55", "01kzbwnysyhaqgf01r9ys41kqw", "01kzbx1756p8grqnqd7ef4jd36", "01kzc0pz4p7gw3bvc10x1qvxbm", "01kzc13aqkt8575adknpd5w6tb", "01kzc20bg9w598cbvtpqbj8fa7", "01kzc2t9fv6g37pvvg4enqdeaw", "01kzc32ez9ge1rcc9pqqg2g91e", "01kzc3473ctcvhamhgq1j44j9m", "01kzc37w7ffrdb12g72r9sn8g8", "01kzc3p6qysps43ynpwm5vhkfk", "01kzc41yfb5fbpzcvpc5hc9sxa", "01kzc41yt0c2tay3819ncp8tq5", "01kzc42tnassb5pxq247gz49f3", "01kzc78a2wpbr01y047nqjg9fg"], "calls": [{"id": "2026-08-06-PM-yen-1", "date": "2026-08-06", "edition": "2026-08-06-PM", "channel": "macro", "ticker": null, "name": "Yen intervention in euros", "kind": "thesis", "call": "The US is intervening in the yen market using euros, because its reserve pot is held predominantly in euros and yen, and has been in touch with the European Central Bank about it. Japan has spent $160 billion this year including $53 billion and $34 billion on consecutive days, and the yen keeps falling back.", "direction": "neutral", "levels": "DXY at a seven-week low", "due": "2026-10-06", "attribution": "Prof G Markets", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-06-PM-warsh-1", "date": "2026-08-06", "edition": "2026-08-06-PM", "channel": "macro", "ticker": null, "name": "Warsh September hike", "kind": "thesis", "call": "Kevin Warsh is prepared to raise rates in September if inflation prints run hot and markets price in higher borrowing costs. The second condition is self-referential, so a market pricing a hike helps satisfy the trigger for one.", "direction": "neutral", "levels": "Kalshi 65 percent for a hike this year", "due": "2026-09-30", "attribution": "Financial Times", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-06-PM-treasury-1", "date": "2026-08-06", "edition": "2026-08-06-PM", "channel": "macro", "ticker": null, "name": "Treasury borrowing", "kind": "catalyst", "call": "Treasury guides to $739 billion of privately held net marketable borrowing for July through September, $68 billion above the May estimate, and $628 billion for October through December. Interest expense ran $827 billion through June against $749 billion a year earlier, with 33 percent of the debt maturing inside twelve months.", "direction": "event", "levels": "$739bn Q3, $628bn Q4, $39.7tn total debt", "due": "2026-12-31", "attribution": "Treasury", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-06-PM-payrolls-1", "date": "2026-08-06", "edition": "2026-08-06-PM", "channel": "macro", "ticker": null, "name": "August payrolls", "kind": "catalyst", "call": "Payrolls land Friday August 7 and decide whether Warsh's inflation condition is met or postponed. Kathy Lien reads jobless claims at a two-year low and accelerating manufacturing hiring against weaker ADP and softer services employment, and calls stronger payrolls but probably not a blowout.", "direction": "event", "levels": "claims 199,000 vs 204,000 expected", "due": "2026-08-07", "attribution": "Kathy Lien", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-06-PM-mem-1", "date": "2026-08-06", "edition": "2026-08-06-PM", "channel": "stocks", "ticker": "$MU", "name": "Memory take-or-pay floor", "kind": "thesis", "call": "Memory multiples expand before they compress, held at 60/40. Bernstein models roughly 35 percent of all bits shipped 2027 to 2029 as take-or-pay at a $0.26 per gigabyte floor against a $0.29 spot, and Micron holds $22 billion of customer prepayments across 16 agreements.", "direction": "long", "levels": "60/40; $0.26/GB floor vs $0.29 spot", "due": "2026-10-06", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-06-PM-hormuz-1", "date": "2026-08-06", "edition": "2026-08-06-PM", "channel": "macro", "ticker": null, "name": "Hormuz shipping traffic", "kind": "thesis", "call": "An agreed transit corridor does not restore traffic. Container shipping through the strait runs one or two transits a day against almost 100 at the peak, with war-risk insurance at 10 to 15 percent of a ship's value per voyage.", "direction": "neutral", "levels": "1-2 transits/day vs ~100", "due": "2026-09-06", "attribution": "Ryan Petersen", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-06-PM-eisman-1", "date": "2026-08-06", "edition": "2026-08-06-PM", "channel": "stocks", "ticker": null, "name": "AI capex holds", "kind": "thesis", "call": "I am 60/40 with Steve Eisman against Burry. Eisman will not turn bearish without a price war in the LLM world. The 40 is customer concentration: 70 percent of Microsoft's AI revenue is OpenAI, 75 percent of Amazon's is OpenAI plus Anthropic, 30 percent of Google Cloud is the same pair, and those two lost $21 billion and roughly $11 billion last year.", "direction": "long", "levels": "60/40", "due": "2026-12-31", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-06-PM-cpi-1", "date": "2026-08-06", "edition": "2026-08-06-PM", "channel": "macro", "ticker": null, "name": "August CPI", "kind": "catalyst", "call": "CPI on August 12 is the print Warsh explicitly named as his trigger, so it settles September more than payrolls does.", "direction": "event", "levels": null, "due": "2026-08-12", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-06-PM-coldcard-1", "date": "2026-08-06", "edition": "2026-08-06-PM", "channel": "crypto", "ticker": null, "name": "Coldcard entropy failure", "kind": "thesis", "call": "Bitcoin ETF inflows tick up three, six and nine months out as burned self-custody holders move to a custodian. A 2021 MicroPython fallback left Coldcard MK2 and MK3 seeds at roughly 40 bits of search space against a 128-bit target, draining more than 5,000 holders and over $100 million, and Coinbase and BitGo carry roughly $5 million of insurance.", "direction": "long", "levels": "40 bits MK2/MK3, 72 bits MK4/MK5/Q", "due": "2027-05-06", "attribution": "Tilman Holloway", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-06-PM-clarity-crypto-1", "date": "2026-08-06", "edition": "2026-08-06-PM", "channel": "crypto", "ticker": null, "name": "CLARITY priced in", "kind": "thesis", "call": "CLARITY's failure is already priced, at 65/35. Polymarket went from 50 to 70 percent in January to 15 percent now, and an asset that ignored a $100 million theft is not carrying a legislative premium. Bitwise's Matt Hougan notes the SEC and CFTC can supply the same path by rule rather than law, against Bernstein calling failure the final leg down.", "direction": "long", "levels": "65/35", "due": "2026-09-30", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-06-PM-clarity-2", "date": "2026-08-06", "edition": "2026-08-06-PM", "channel": "macro", "ticker": null, "name": "CLARITY Act, rest of year", "kind": "thesis", "call": "CLARITY does not become law this year, at 80/20. The Senate returns September 14 into a handful of working days and a government to fund, against a Fed meeting that just went live. Kalshi has it at 20 percent and Polymarket at 15 to 17.", "direction": "event", "levels": "80/20", "due": "2026-12-31", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-06-PM-burry-1", "date": "2026-08-06", "edition": "2026-08-06-PM", "channel": "stocks", "ticker": null, "name": "Burry short book", "kind": "level", "call": "Michael Burry is short Nvidia at $198, Micron at $1,051, Applied Materials at $729, Tesla at $416, the semiconductor index at $642 and Palantir at $161, calling a major top and possibly a 1987-type fall.", "direction": "short", "levels": "NVDA 198, MU 1051, AMAT 729, TSLA 416, SOXX 642, PLTR 161", "due": "2026-12-31", "attribution": "Michael Burry", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-06-PM-SPY-1", "date": "2026-08-06", "edition": "2026-08-06-PM", "channel": "stocks", "ticker": "$SPY", "name": "SPY decision level", "kind": "level", "call": "$SPY holding 686 keeps the bullish regime intact and a loss of 686 opens a move toward 629, with the $QQQ weekly 9 EMA as the confirming tell.", "direction": "neutral", "levels": "686 support, 629 downside, 674 prior pivot", "due": "2026-09-06", "attribution": "Stocks with Josh", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-06-PM-SPCX-1", "date": "2026-08-06", "edition": "2026-08-06-PM", "channel": "stocks", "ticker": "$SPCX", "name": "SpaceX unlock schedule", "kind": "catalyst", "call": "SpaceX tradable float goes from 20 percent today to about 40 percent by December 9 across tranches on August 21, September 10, September 25, October 10, October 25 and November, with Musk eligible at about 46 percent in June 2027.", "direction": "short", "levels": "20 percent now, 40 percent by December 9", "due": "2026-12-09", "attribution": "People to follow list", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-06-PM-LLY-1", "date": "2026-08-06", "edition": "2026-08-06-PM", "channel": "stocks", "ticker": "$LLY", "name": "Eli Lilly oral GLP-1", "kind": "thesis", "call": "Lilly closes the oral GLP-1 gap on Novo Nordisk, at 60/40. Novo sold roughly $495 million of its pill in the quarter against Lilly's $90 million, but Lilly says prescriptions doubled in the last week of July, and it prints $23 billion a quarter to buy distribution with.", "direction": "long", "levels": "60/40", "due": "2026-11-06", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-06-PM-GLXY-1", "date": "2026-08-06", "edition": "2026-08-06-PM", "channel": "crypto", "ticker": "$GLXY", "name": "Galaxy Helios tenant", "kind": "thesis", "call": "Galaxy lands a Helios tenant before the Texas audit clears, at 60/40. It fell 13 percent to $19 because Novogratz promised a tenant by the end of summer and did not deliver, while its Caspian and Selene capacity is grandfathered and Merlin's first phase sits at 74 megawatts, one under the 75 megawatt audit threshold.", "direction": "long", "levels": "60/40", "due": "2026-11-06", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-06-PM-ERCOT-1", "date": "2026-08-06", "edition": "2026-08-06-PM", "channel": "crypto", "ticker": null, "name": "ERCOT Batch Zero", "kind": "catalyst", "call": "ERCOT's next Batch Zero study round was due August 7 and the Texas data centre audit ordered on August 3 suspended it, with no completion deadline announced.", "direction": "event", "levels": "5.7 GW Galaxy pipeline, 4.3 GW eligible", "due": "2026-08-07", "attribution": "m0xt", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-06-PM-CCJ-1", "date": "2026-08-06", "edition": "2026-08-06-PM", "channel": "stocks", "ticker": "$CCJ", "name": "Uranium", "kind": "thesis", "call": "Bank of America raised its 2027 uranium forecast to $130 a pound, roughly 52 percent above spot, on utility contract coverage falling to 48 percent from 56 percent, and cut the Cameco target 5 percent to $133 while keeping the Buy.", "direction": "long", "levels": "$130/lb 2027 uranium, $CCJ PT $133", "due": "2027-12-31", "attribution": "Bank of America", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-06-PM-BTCbottom-1", "date": "2026-08-06", "edition": "2026-08-06-PM", "channel": "crypto", "ticker": "$BTC", "name": "Bitcoin cycle low", "kind": "thesis", "call": "Three independent clocks put the Bitcoin low in the fourth quarter. Cowen expects a capitulation event before the bear ends, OnChainMind's 6-month-to-1-year cohort went underwater last November against a 13-month average pointing to December, and Altcoin Daily's 200-week analogue points to October.", "direction": "short", "levels": "66.7K resistance, 76K on a break, 200-week SMA support", "due": "2026-12-31", "attribution": "Benjamin Cowen, OnChainMind, Altcoin Daily", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-06-PM-APP-1", "date": "2026-08-06", "edition": "2026-08-06-PM", "channel": "stocks", "ticker": "$APP", "name": "AppLovin", "kind": "thesis", "call": "AppLovin is higher in three months, at 60/40. It grew 53 percent at an 84 percent EBITDA margin and fell a fifth on decelerating guidance rather than a miss, trades at 24 times forward on a 0.5 PEG, and lost its SEC overhang in the same quarter.", "direction": "long", "levels": "60/40", "due": "2026-11-06", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-sockpuppet-1", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "crypto", "ticker": "$BTC", "name": "No independent bid", "kind": "thesis", "call": "Copper, gold and Bitcoin are all sock puppets to the S&P 500 right now, so Bitcoin has no independent bid. A fourth consecutive session of the equity complex rising without it supports the reading. Mandelbrot expects a knee-jerk move over 24 to 48 hours, probably a fakeout with the first move up, invalidation at 65.8.", "direction": "neutral", "levels": "65.8 invalidation", "due": "2026-09-30", "attribution": "Mike McGlone, positioning from Mandelbrot", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-kashkari-1", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "macro", "ticker": null, "name": "Kashkari", "kind": "policy", "call": "Neel Kashkari said the Fed should begin raising rates now, backing 25 basis points and warning that delay could force more aggressive tightening if inflation becomes entrenched. He was one of three dissenters last week. BofA forecasts hikes in September, October and December; Citi forecasts a September hold then cuts in October, December and January.", "direction": "event", "levels": null, "due": "2026-12-31", "attribution": "Neel Kashkari via Walter Bloomberg", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-humanoid-1", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "stocks", "ticker": "$CCXI", "name": "Humanoid supply chain", "kind": "thesis", "call": "The humanoid constraint has moved to idle precision-manufacturing capacity. Mitsubishi is converting an idle engine plant to roughly 1,000 humanoids a month, Unitree lists within weeks holding 85 percent of 2025 shipments with more than $20 billion of subsidies, Hyundai targets a few thousand a year via Boston Dynamics, and Tesla is ramping Optimus. CCXI and Agility are the only US-listed pure-play, via a higher-risk SPAC structure.", "direction": "long", "levels": null, "due": "2027-06-30", "attribution": "Wayne Liang", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-hormuz-2", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "macro", "ticker": null, "name": "Hormuz announcement", "kind": "catalyst", "call": "A joint Iran-Oman announcement on the Strait of Hormuz is made inside a week, at 70/30, up from 60/40 on the route agreement. Iran's foreign ministry says the route geography is agreed and the announcement is in its final stage if certain third parties do not interfere, while adding the agreement in itself does not mean the strait is secure. The 30 is the third-party clause.", "direction": "event", "levels": "70/30", "due": "2026-08-12", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-gold-1", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "macro", "ticker": null, "name": "Gold", "kind": "thesis", "call": "Gold's bid is monetary rather than risk appetite, at 60/40 against Mike McGlone's view that copper, gold and Bitcoin are all sock puppets to the S&P 500. Gold futures rose more than 4 percent above $4,300 while the war premium left oil, equities printed records and margins hit a FactSet record. Equities and gold rising together for two sessions while oil falls is a monetary story.", "direction": "long", "levels": "60/40", "due": "2026-10-31", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-fed-1", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "macro", "ticker": null, "name": "September FOMC", "kind": "thesis", "call": "September is a hold at 55/45, down from near-certainty a month ago. Kashkari is publicly campaigning for an immediate 25bp hike after dissenting last week, Kalshi has hold at 49 and a hike at 47, and the hike looks like a question of timing rather than direction. Citi's cut scenario requires something to break that has not broken.", "direction": "neutral", "levels": "45/55 against a hold, revised 2026-08-06 from 55/45 for a hold", "due": "2026-09-30", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null, "revised_edition": "2026-08-06-PM", "revision": "Reversed to 45/55 AGAINST a hold. The Financial Times reports Warsh is prepared to raise in September if inflation prints run hot and markets price higher borrowing costs, Governor Lisa Cook said she is ready to raise, and Kashkari said it is slowly time. Kalshi prices a hike at some point this year at 65 percent. The Chair, a governor and a regional president moved the same way inside 48 hours."}, {"id": "2026-08-05-PM-disp-1", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "stocks", "ticker": null, "name": "Leadership dispersion", "kind": "thesis", "call": "Leadership is not tech despite a 3 percent Nasdaq day. Year to date SPY is up 2.59 percent while QQQ is down 1.93, XLK down 2.34 and SMH down 11.03. Next buys named are homebuilders, education providers, micro and small-business enablers and aging-population REITs, after selling Mastercard for a 13 percent gain and adding Arm and Marvell.", "direction": "neutral", "levels": null, "due": "2026-10-31", "attribution": "AskLivermore", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-cuban-1", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "crypto", "ticker": "$BTC", "name": "Digital gold thesis", "kind": "thesis", "call": "Mark Cuban sold the majority of his Bitcoin because the debasement hedge failed its test. During the Iran war geopolitical risk spiked and the dollar slid, and Bitcoin fell while gold went to records. He is reportedly more disappointed in Bitcoin than Ethereum. The digital-gold framing is the backbone of institutional adoption, so the next marginal buyer needs a different reason.", "direction": "short", "levels": null, "due": "2026-12-31", "attribution": "Mark Cuban via Milk Road", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-SPX-1", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "stocks", "ticker": null, "name": "S&P extension", "kind": "level", "call": "Bank of America says the S&P has hit its 2026 target of 7,741, with technicals pointing to 8,000, then 8,234 and potentially 8,541, and 7,500 as key support. It warns weak August-to-October seasonality, stretched momentum and Friday's payrolls could cap it. The entire S&P candle closed outside the upper Bollinger band for the first time since March 2024.", "direction": "long", "levels": "7500 support, 8000/8234/8541 targets", "due": "2026-12-31", "attribution": "Bank of America, Heisenberg on the Bollinger reading", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-SPCX-3", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "stocks", "ticker": "$SPCX", "name": "SpaceX 2027 revenue", "kind": "thesis", "call": "SpaceX 2027 revenue reaches about $135 billion against a Street near $100 billion, assuming 5 percent month-over-month growth off the guided $8.5 billion December month. The risk is that cloud contracts carry 90-day cancellation provisions, which Munster dismisses on the grounds that inference is in the top of the first.", "direction": "long", "levels": null, "due": "2028-03-31", "attribution": "Gene Munster", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-SPCX-2", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "stocks", "ticker": "$SPCX", "name": "SpaceX funding gap", "kind": "thesis", "call": "SpaceX has a roughly $350 billion funding gap and Nvidia customer financing has to fill it. Capacity goes from about 1.4GW today to 2GW by end-2026 and close to 10GW in 2027, all Nvidia, implying roughly $500 billion of capex at $50-60bn per gigawatt against $100 billion of cash and just $3 billion of first-half operating cash flow. Anthropic and Google spot GPU deals run about $26 billion of annual recurring revenue.", "direction": "short", "levels": null, "due": "2027-06-30", "attribution": "SouthernValue", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-GLXY-1", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "crypto", "ticker": "$GLXY", "name": "Galaxy Helios", "kind": "catalyst", "call": "Galaxy reported an $85 million net loss driven almost entirely by $78 million of negative adjusted EBITDA in Treasury and Corporate from unrealised markdowns, while the data centre segment turned profitable for the first time. Helios billed $18.9 million of first-ever leasing revenue, adjusted gross profit went from $3.1 million to $20.1 million, segment EBITDA was positive $11.5 million, and all 133MW of Phase I is in service. Guidance is roughly $80 million a quarter from Q3 at above 90 percent project margin.", "direction": "long", "levels": null, "due": "2026-11-30", "attribution": "Galaxy Digital via Milk Road", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-ERCOT-1", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "crypto", "ticker": null, "name": "Texas queue freeze", "kind": "catalyst", "call": "Governor Abbott ordered Texas regulators on August 3 to audit every data centre in the ERCOT interconnection queue before any more advance, with no completion deadline, and ERCOT paused its Batch Zero study the same day. There are 474 gigawatts of connection requests against a grid whose record peak demand is roughly 91 gigawatts. This caps pipeline growth and makes already-approved capacity scarce, including Galaxy's 830MW at Helios.", "direction": "event", "levels": null, "due": "2026-12-31", "attribution": "Milk Road relaying Abbott and ERCOT", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-CXMT-1", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "stocks", "ticker": "$MU", "name": "CXMT pricing", "kind": "catalyst", "call": "Apple negotiated with CXMT over mobile DRAM supply prices including LPDDR5X to ease iPhone cost pressure, and CXMT rejected the request, insisting on prices higher than or comparable to Samsung and SK Hynix. Single-sourced to South Korean media and publicly disputed by The AI Investor as not passing the smell test.", "direction": "long", "levels": null, "due": "2026-10-31", "attribution": "South Korean media via Jukan, contested by The AI Investor", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-AMD-1", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "stocks", "ticker": "$AMD", "name": "AMD", "kind": "thesis", "call": "AMD trades above today's after-hours level in a month, at 60/40. It beat and fell about 10 percent after hours having closed up 7 percent, with capex rising and free cash flow falling, in a name up 140 percent year to date. Futurum reiterated Buy at an $800 target on a 2027 forecast of $90 billion revenue and $17.50 EPS including up to 14 gigawatts of committed accelerator deployments.", "direction": "long", "levels": "60/40", "due": "2026-09-05", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-04-PM-token-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "crypto", "ticker": null, "name": "Tokenization plumbing", "kind": "catalyst", "call": "Wells Fargo is rolling out tokenized deposits for enterprises and corporates with 24/7 onchain access, and Polymarket is seeking investment above a $20 billion valuation while taking exclusive US streaming rights to Serie A.", "direction": "long", "levels": null, "due": "2026-12-31", "attribution": "Andy via the Crypto list, zerohedge", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-04-PM-miners-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "crypto", "ticker": null, "name": "Miners decouple", "kind": "thesis", "call": "The miners have stopped being a Bitcoin proxy and now trade on lease duration and counterparty credit. Twelve of thirteen constituents rose over the week led by CIFR at 24.9 percent, IREN at 20.8 and HUT at 19.3, on IREN's $2.8 billion of AI-cloud deals and Hut 8's second $9.8 billion lease, while Bitdeer jumped 23 percent on a 16-year AI and HPC data centre lease.", "direction": "long", "levels": null, "due": "2026-12-31", "attribution": "0xResearch", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-04-PM-hormuz-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "macro", "ticker": null, "name": "Hormuz deal", "kind": "thesis", "call": "A Hormuz agreement is announced inside two weeks, at 60/40, up from roughly even. Qatar has prepared draft text and the US Treasury Secretary has put a date on it. The 40 is that Iran has denied three separate reopening reports in four days.", "direction": "event", "levels": "60/40", "due": "2026-08-18", "attribution": "house", "status": "hit", "resolution": "Iran and Oman agreed the route geography and a joint announcement is in its final stage, inside two days rather than two weeks. The channel was Oman rather than the Qatari draft text I relayed.", "resolved_edition": "2026-08-05-PM"}, {"id": "2026-08-04-PM-fima-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "macro", "ticker": null, "name": "FIMA repo facility", "kind": "policy", "call": "Treasury publicly asked for a Federal Reserve facility to be enlarged. Bessent: we will not hesitate to participate in further joint intervention, the FIMA Repo Facility is an important backstop, we would encourage it to be upsized in the coming months. Jeff Park: FIMA is entirely a Fed tool, not a Treasury tool.", "direction": "event", "levels": null, "due": "2026-12-31", "attribution": "Scott Bessent, framing from Jeff Park", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-04-PM-coldcard-2", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "crypto", "ticker": null, "name": "Coldcard to ETFs", "kind": "thesis", "call": "The Coldcard hack drives migration to ETFs and third-party custody. Balchunas: what used to be seen as a bug by coiners, dorky boomer TradFi, may suddenly seem like a feature, especially versus a Canadian company with five employees. Dave Weisberger reached the same conclusion independently.", "direction": "long", "levels": null, "due": "2026-12-31", "attribution": "Eric Balchunas and Dave Weisberger", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-04-PM-clarity-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "macro", "ticker": null, "name": "CLARITY Act", "kind": "catalyst", "call": "No CLARITY floor vote happens before the August recess, at 85/15. The bill cleared the House and Senate Banking and sits on the legislative calendar with no scheduled vote, cloture needs 60 votes meaning roughly seven Democrats, and talks are stalled on ethics provisions covering officials' own crypto activity, consumer protection language and stablecoin banking concerns.", "direction": "event", "levels": "85/15", "due": "2026-08-08", "attribution": "house", "status": "hit", "resolution": "Resolved two days early because the mechanism is gone. Cloture had to be filed today to ripen for a Friday vote and Thune filed on a different motion, so Kalshi prices a pre-recess vote at 3 percent against my 85/15. The ethics, consumer-protection and stablecoin blockers I named are exactly what Punchbowl reports Democrats are holding out on.", "resolved_edition": "2026-08-06-PM"}, {"id": "2026-08-04-PM-breadth-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "macro", "ticker": null, "name": "Breadth blocker", "kind": "thesis", "call": "July ISM at 55.6 percent was the best since May 2022 and GDPNow went to 6.2 percent, but market breadth fell 0.46 on the week to 0.18 and is the only thing holding the posture at caution. Three conditions to clear it: breadth stops falling, August 7 payrolls confirm the labour market, and August 12 CPI leaves six-month core flat against ISM Prices Paid at 71.1.", "direction": "neutral", "levels": null, "due": "2026-09-30", "attribution": "Milk Road Macro Index", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-04-PM-bessent-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "macro", "ticker": null, "name": "Bessent on Hormuz", "kind": "catalyst", "call": "Scott Bessent said there is a chance of a deal today or tomorrow to open the Strait of Hormuz, and Qatar has prepared draft text. Futures hit a record high on it, oil rose 2 percent then fell 2 percent, Brent October at $81.50.", "direction": "event", "levels": null, "due": "2026-08-31", "attribution": "Scott Bessent via the Financial Markets list", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-04-PM-SPX-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "stocks", "ticker": null, "name": "S&P levels", "kind": "level", "call": "The S&P cleared the 7448 buy line and pushed to 7610, and may be leaving a ten-week range. Hold above 7448, with 7620 the bigger level overhead. Cappelleri's 7,680 target from late April is still live and Societe Generale carries 8,000.", "direction": "long", "levels": "7448 support, 7620 resistance, 7680 and 8000 targets", "due": "2026-10-31", "attribution": "Scott Redler, Frank Cappelleri via Ryan Detrick, Societe Generale", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-04-PM-SPCXnum-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "stocks", "ticker": "$SPCX", "name": "SpaceX print", "kind": "catalyst", "call": "SpaceX's first earnings report expects $6.8 billion of revenue and $10.9 billion of cash burn. Starlink ARPU fell from $99 in 2023 to $66 last quarter against a $65.50 street number, AI capex was $7.7 billion last quarter or 76 percent of all company spending, the Anthropic compute deal runs $1.25 billion a month through 2029, and 2026 X revenue consensus is about $2.9 billion.", "direction": "event", "levels": null, "due": "2026-08-05", "attribution": "Kyle Reidhead of Milk Road", "status": "hit", "resolution": "SpaceX reported $7.8 billion of June-quarter revenue against the $6.8 billion expectation and guided to a $100 billion exiting run rate, implying a December quarter near $22 billion. December revenue estimates rose about 17 percent.", "resolved_edition": "2026-08-05-PM"}, {"id": "2026-08-04-PM-SPCX-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "stocks", "ticker": "$SPCX", "name": "SpaceX squeeze", "kind": "thesis", "call": "SpaceX trades higher on Thursday than it closes tonight, at 55/45, on mechanics rather than fundamentals. S3 has 95 percent of borrowable stock out on loan and short interest at 34 percent of float, and consensus EPS spans a $1.26 loss to a $0.33 profit. The lockup of more than $100 billion begins Thursday.", "direction": "long", "levels": "55/45", "due": "2026-08-06", "attribution": "house", "status": "miss", "resolution": "Wrong, and wrong on the thing I said I was trading. I bet the squeeze mechanics would beat the supply, and the supply won. SpaceX fell double digits again into the unlock. A 34 percent short interest does not squeeze when 140 percent of the float arrives on the same morning.", "resolved_edition": "2026-08-06-PM"}, {"id": "2026-08-04-PM-MSTR-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "crypto", "ticker": "$MSTR", "name": "Strategy turns seller", "kind": "thesis", "call": "Strategy sold 1,638 Bitcoin last week to fund preferred dividends and STRC buybacks, after four straight weeks without a purchase. The token market has lost its most reliable structural buyer and gained a seller with a dollar obligation, and the treadmill speeds up as the discount to net asset value widens.", "direction": "short", "levels": null, "due": "2026-12-31", "attribution": "0xResearch", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-04-PM-CAT-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "stocks", "ticker": "$CAT", "name": "Caterpillar", "kind": "catalyst", "call": "Caterpillar quarterly sales topped $20 billion for the first time in company history, driven by AI data centre demand. It books revenue on delivery and carries none of the GPU residual-value risk the neoclouds do.", "direction": "long", "levels": null, "due": "2026-12-31", "attribution": "Polymarket Money via the Financial Markets list", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-04-PM-AAPL-1", "date": "2026-08-04", "edition": "2026-08-04-PM", "channel": "stocks", "ticker": "$AAPL", "name": "Apple bounce", "kind": "thesis", "call": "Apple is a tradable bounce candidate holding $300 after five down days and more than 13 percent peak to trough, inversely tracking the Nasdaq proxy. Once the Nasdaq breathes after its five-day run, defensive money rotates back in.", "direction": "long", "levels": "300", "due": "2026-09-30", "attribution": "Heisenberg", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-03-PM-yen-1", "date": "2026-08-03", "edition": "2026-08-03-PM", "channel": "macro", "ticker": null, "name": "Yen intervention", "kind": "catalyst", "call": "The yen hit its weakest level since 1986, Japan reportedly spent more than $50 billion in a single day defending it in likely the largest intervention ever recorded, and the next day the US Treasury and New York Fed bought yen alongside Tokyo. Bessent then said the yen seems very undervalued and excess volatility is not healthy. This resolves the July 31 Bessent notepad reading buy Japanese yen $5-10 billion as deliberate rather than accidental.", "direction": "event", "levels": null, "due": "2026-09-30", "attribution": "Capital Flows", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-03-PM-warsh-1", "date": "2026-08-03", "edition": "2026-08-03-PM", "channel": "macro", "ticker": null, "name": "Warsh and Bessent", "kind": "thesis", "call": "Warsh and Bessent are coordinating to fund the AI buildout as a national-security priority. Warsh called the surge in high-tech capex the most striking feature of the economy, put AI-related equipment and software growth near 20 percent four-quarter, told Congress that what is called AI investment will soon be called just investment, and said the Fed has not done much in 42 days while the markets have done quite a bit. Bessent is defending the yen carry pipe that funds it.", "direction": "long", "levels": null, "due": "2026-12-31", "attribution": "Capital Flows", "status": "hit", "resolution": "Confirmed from both sides. The New York Fed, acting for Treasury, sold euros to buy yen on Friday, both governments acknowledged it Monday, and USD/JPY fell from above 163 to around 156.", "resolved_edition": "2026-08-04-PM"}, {"id": "2026-08-03-PM-hyper-1", "date": "2026-08-03", "edition": "2026-08-03-PM", "channel": "macro", "ticker": null, "name": "Memory margins and hyperscalers", "kind": "thesis", "call": "Memory margin compression is bullish for the hyperscalers rather than bearish for AI. Memory is now roughly 35 percent of hyperscaler hardware spend against 8 percent in 2023, AWS says server investments break even in under three years at today's inflated component prices, and cheaper inputs mean the $860 billion of 2026 capex buys more compute per dollar. Falling input costs speed the buildout up.", "direction": "long", "levels": null, "due": "2027-06-30", "attribution": "Kyle Reidhead of Milk Road", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-03-PM-generals-1", "date": "2026-08-03", "edition": "2026-08-03-PM", "channel": "stocks", "ticker": null, "name": "Lag 7 to Mag 7", "kind": "thesis", "call": "The Lag 7 turns back into the Mag 7 and the megacap generals lead again, leaving the bottleneck and second-derivative names without a bid. Oracle is the biggest wild card on its OpenAI bet, and physical AI takes Nvidia to a $10 trillion market cap.", "direction": "long", "levels": null, "due": "2027-06-30", "attribution": "Shay Boloor", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-03-PM-flows-1", "date": "2026-08-03", "edition": "2026-08-03-PM", "channel": "stocks", "ticker": null, "name": "Tech re-grossing", "kind": "thesis", "call": "Hedge funds bought tech stocks at the fastest pace since 2022 and tech funds took their largest five-week inflow on record, one week after Goldman's crowded-position index had its worst month against the S&P since 2001. Against it, Bank of America's Bull and Bear indicator hit one of the strongest sell signals of the century.", "direction": "neutral", "levels": null, "due": "2026-09-30", "attribution": "Kalshi relaying BofA and prime-brokerage data", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-03-PM-coldcard-1", "date": "2026-08-03", "edition": "2026-08-03-PM", "channel": "crypto", "ticker": "$BTC", "name": "Coldcard hack", "kind": "catalyst", "call": "More than $100 million of Bitcoin stolen from over 5,000 Coldcard wallets in an ongoing attack, caused by a flaw in Coinkite's random number generator rather than anything in the Bitcoin protocol. This drives renewed interest in Bitcoin ETFs and third-party multi-sig arrangements.", "direction": "event", "levels": null, "due": "2026-12-31", "attribution": "Anthony Pompliano", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-03-PM-SPCX-1", "date": "2026-08-03", "edition": "2026-08-03-PM", "channel": "crypto", "ticker": "$SPCX", "name": "SpaceX", "kind": "catalyst", "call": "SpaceX printed an all-time low the session before its first earnings report in company history, trading 20 percent below an offer price set seven weeks ago and nearly half off its peak, with the insider unlock two days after the print. Asked whether the stock is a big opportunity here, Elon Musk answered I think so.", "direction": "event", "levels": null, "due": "2026-08-31", "attribution": "Elon Musk via Sawyer Merritt", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-03-PM-EPS-1", "date": "2026-08-03", "edition": "2026-08-03-PM", "channel": "macro", "ticker": null, "name": "S&P earnings quality", "kind": "thesis", "call": "S&P 500 EPS growth is tracking 45 percent year over year in Q2 against a 22 percent consensus coming into the quarter, but 19 points of that is Alphabet and Amazon's combined $151 billion of other income on equity investments. Excluding those gains growth is still tracking 26 percent, an acceleration versus Q1 and the fastest pace since 2021.", "direction": "long", "levels": null, "due": "2026-09-30", "attribution": "Goldman Sachs via zerohedge", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-03-PM-CXMT-1", "date": "2026-08-03", "edition": "2026-08-03-PM", "channel": "stocks", "ticker": "$MU", "name": "CXMT capacity", "kind": "catalyst", "call": "Reuters reports CXMT is considering a second Beijing DRAM fab in the Yizhuang district on top of the Shanghai and Hefei plants under construction, taking total capacity to more than double current levels and past 600,000 wafers a month. The new supply is commodity DRAM rather than high-bandwidth memory, which is sold out through 2026.", "direction": "short", "levels": null, "due": "2027-06-30", "attribution": "Reuters via Jukan", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-03-PM-BTC-1", "date": "2026-08-03", "edition": "2026-08-03-PM", "channel": "crypto", "ticker": "$BTC", "name": "Bitcoin", "kind": "level", "call": "Bitcoin sees $58,000 before it sees $75,000, revised UP to 60/40 on 2026-08-04 after Strategy sold 1,638 coins and confirmed it is now a seller rather than the structural bid. Originally 55/45. Saylor's Strategy sold $102 million of Bitcoin and Jim Cramer capitulated on quantum risk the same day the legislative catalyst died, which is a sentiment washout worth looking at rather than buying.", "direction": "short", "levels": "60/40, 58000 before 75000", "due": "2026-10-31", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null, "revised_edition": "2026-08-04-PM"}, {"id": "2026-08-03-PM-AMD-1", "date": "2026-08-03", "edition": "2026-08-03-PM", "channel": "stocks", "ticker": "$AMD", "name": "MI355x throughput", "kind": "thesis", "call": "Kimi K3 serves at 3.8 times higher throughput and 71 percent lower cost on AMD MI355x than on Nvidia B200, per an independent inference shop. AMD reports the next session.", "direction": "long", "levels": null, "due": "2026-09-30", "attribution": "wafer.ai via zerohedge", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-software-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "stocks", "ticker": "$ADBE", "name": "Software over buildout", "kind": "thesis", "call": "Asset-light application software beats the second-derivative AI buildout names over the next six months, at 60/40. Adobe trades near 11 times trailing earnings, Salesforce 13 and Intuit 14, on operating margins of 36.6 and 28.7 percent with capex around 1 percent of revenue, while Microsoft's contracted backlog is $678 billion, up 84 percent, on 30 million paid Copilot seats against 15 million in January.", "direction": "long", "levels": "60/40", "due": "2027-02-02", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-sacks-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "macro", "ticker": null, "name": "AI correction", "kind": "thesis", "call": "The chip selloff is momentum and leverage rather than fundamentals. Memory chip stocks ran roughly tenfold in a year, the Nasdaq fell about 10 percent from its peak while the momentum trade fell 30 to 40, and there will be a return on the AI capex.", "direction": "long", "levels": null, "due": "2027-06-30", "attribution": "David Sacks", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-rotation-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "macro", "ticker": null, "name": "The rotation", "kind": "thesis", "call": "July was not an AI crash but a rotation out of the leveraged capital-hungry end of the complex into the profitable asset-light end. From the June 30 to July 29 close, SanDisk fell 55.32 percent, Nebius 46.33, Bloom Energy 45.90, CoreWeave 38.90, Micron 35.98 and IREN 35.91, while Workday rose 37.24, Adobe 28.49, Intuit 27.64, Salesforce 20.25 and Veeva 17.15. QQQ fell 10.14, SPY 2.32, and Nvidia fell 5.04 while finishing July up 0.33. The money gets made by the toll booths riding on somebody else's capital expenditure, as in 1874 and 2004.", "direction": "long", "levels": null, "due": "2027-06-30", "attribution": "Porter Stansberry", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-oil-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "macro", "ticker": null, "name": "Crude oil", "kind": "thesis", "call": "Oil is higher two weeks from now than it is today, at 65/30, raised from roughly even. Iran denies agreeing to reopen the Strait of Hormuz, the strait stays closed, CENTCOM has redirected 35 vessels, and the de-escalation the tape traded was about strikes rather than about transit. The 35 is that Iran has reopened before under this much pressure.", "direction": "long", "levels": "65/35", "due": "2026-08-16", "attribution": "house", "status": "miss", "resolution": "Wrong and called early. Iran and Oman agreed the Hormuz route three sessions later, the risk premium came out of crude, and Brent fell rather than rose.", "resolved_edition": "2026-08-05-PM"}, {"id": "2026-08-02-PM-iran-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "macro", "ticker": null, "name": "Iran strikes", "kind": "catalyst", "call": "The strikes on Iranian energy targets reported as ordered on July 31 did not happen over the weekend. GOP Senator James Lankford says Trump has no desire to bomb Iran.", "direction": "event", "levels": null, "due": "2026-08-31", "attribution": "James Lankford via Kalshi", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-hormuz-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "macro", "ticker": null, "name": "Strait of Hormuz", "kind": "catalyst", "call": "Iran says reports it agreed to reopen the Strait of Hormuz are false and the strait remains closed while the US continues what Iran calls hostile actions, with ships passing only via Iran's designated route and IRGC Navy permission. CENTCOM has redirected 35 vessels. Iran is contradicting Trump's claim directly.", "direction": "event", "levels": null, "due": "2026-09-30", "attribution": "Fars News via Walter Bloomberg, CENTCOM via Polymarket", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-hedgefunds-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "stocks", "ticker": null, "name": "The unwind", "kind": "thesis", "call": "The July hedge fund unwind was a cleansing event at high probability rather than the start of something. Goldman's VIP crowded-position index fell 12 percent against the S&P for the month, the worst since the index began in 2001 and worse than the month of Lehman, with seven of those points in the worst four-day stretch ever measured. Hedge funds are still up more than 10 percent on the year, so they hedge rather than liquidate.", "direction": "long", "levels": null, "due": "2026-09-30", "attribution": "Jordi Visser", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-crypto-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "crypto", "ticker": null, "name": "Bessent on digital assets", "kind": "catalyst", "call": "Treasury Secretary Scott Bessent made digital assets the third principle of his economic strategy speech: digital assets, stablecoins, tokenization and new payment systems will help shape the future of money, and the United States should not consign itself to the sidelines. Mohamed El-Erian called it a remarkably important speech. No legislative mechanism or date was attached.", "direction": "event", "levels": null, "due": "2026-12-31", "attribution": "Scott Bessent via Lark Davis", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-capex-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "stocks", "ticker": null, "name": "The funding gap", "kind": "thesis", "call": "Capex at Microsoft, Alphabet, Amazon and Meta rose from $150 billion in 2022 to $358 billion in 2025 while their combined free cash flow fell 15 percent to $199 billion. Big Tech now spends more on AI than it generates and the gap gets more extreme from here.", "direction": "short", "levels": null, "due": "2026-12-31", "attribution": "Phil Rosen", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-TSLA-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "investing", "ticker": "$TSLA", "name": "Tesla", "kind": "thesis", "call": "Tesla finished last week with its entire weekly candle including wicks outside the lower weekly Bollinger band, only the second time in company history. The first was February 2016, after which the stock ran 80 percent in eight weeks. Expect at least a mini bounce.", "direction": "long", "levels": null, "due": "2026-09-30", "attribution": "Heisenberg", "status": "hit", "resolution": "Tesla opened up 4 percent the next session, delivering the mini bounce as stated. The larger 80 percent in eight weeks analogue from February 2016 remains untested.", "resolved_edition": "2026-08-03-PM"}, {"id": "2026-08-02-PM-SPX-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "macro", "ticker": null, "name": "DeMark bottom", "kind": "thesis", "call": "The S&P 500 is probably at the end of the sell-off and a big rally may be near. DeMark 13 countdowns marked local tops in January, late May and June, while 9 countdowns have flagged bottoms, and the last 9 bottom appeared during a geopolitical escalation and was followed by a 21 percent rally.", "direction": "long", "levels": null, "due": "2026-10-31", "attribution": "Tom Lee", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-SOX-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "stocks", "ticker": null, "name": "Semiconductor drawdown", "kind": "thesis", "call": "This is not even a real pullback. The semiconductor index had two separate drawdowns above 50 percent in the 1990s, in late 1995 and late 1997, and this one is about 25 percent off the peak. From the end of 1994 to its March 2000 peak the index still ran 850 percent.", "direction": "long", "levels": null, "due": "2027-06-30", "attribution": "Dan Niles", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-SNDK-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "stocks", "ticker": "$SNDK", "name": "Memory lows", "kind": "level", "call": "No confirmation of a low yet in Micron or SanDisk. The action is choppier and the MACD histogram shows seller exhaustion, but a few more marginal lows are likely first to build better bullish divergences.", "direction": "neutral", "levels": null, "due": "2026-08-31", "attribution": "AskLivermore", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-RKLB-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "stocks", "ticker": "$RKLB", "name": "Rocket Lab", "kind": "thesis", "call": "Rocket Lab turns profitable by 2027 following the Iridium acquisition, with the combined company projected to earn about $140 million that year. Iridium's network offsets Rocket Lab's burn and creates a vertically integrated challenger to SpaceX.", "direction": "long", "levels": null, "due": "2027-12-31", "attribution": "Shay Boloor", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-MU-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "stocks", "ticker": "$MU", "name": "Memory re-rating", "kind": "thesis", "call": "Hyperscaler memory spending more than doubles to $761 billion in 2027, roughly 75 percent of total capex, with shortages extending into summer 2028 and only three suppliers. If that means years of elevated earnings, memory re-rates from about 5 times earnings to nearly 12 across Micron, SK Hynix and Samsung.", "direction": "long", "levels": null, "due": "2027-12-31", "attribution": "UBS via Shay Boloor", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-GOOGL-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "stocks", "ticker": "$GOOGL", "name": "TPU-as-a-service", "kind": "thesis", "call": "Alphabet could build a $50 billion annual TPU-as-a-service business by 2028. Barclays estimates external TPU sales could generate about $22 billion of revenue per gigawatt at a 25 percent gross margin, opening a major new revenue pool for Broadcom, at just over 2 gigawatts of deployments.", "direction": "long", "levels": null, "due": "2028-12-31", "attribution": "Barclays via Shay Boloor", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-COIN-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "crypto", "ticker": "$COIN", "name": "Coinbase", "kind": "thesis", "call": "Coinbase is a call on the CLARITY Act plus the crypto rebound, with the agentic payment rails as free upside. More than 99 percent of onchain agentic commerce settled in USDC, more than 97 percent through x402 and more than 90 percent over Base, and none of it carries revenue or guidance yet.", "direction": "long", "levels": null, "due": "2026-12-31", "attribution": "Kyle Reidhead of Milk Road", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-BTC-2", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "crypto", "ticker": "$BTC", "name": "Bitcoin", "kind": "thesis", "call": "Bitcoin sits further below its fair-value logarithmic regression trend than at any time since 2010 and stays weak for at least a few more months, likely becoming more undervalued before year end in line with the four-year cycle, before a fresh bull market. Long run the asset class reaches roughly $10 trillion.", "direction": "short", "levels": null, "due": "2026-12-31", "attribution": "Benjamin Cowen", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-BTC-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "crypto", "ticker": "$BTC", "name": "Bitcoin", "kind": "thesis", "call": "Bitcoin crashes to $50,000 at some point this year, per Kalshi's traders.", "direction": "short", "levels": "50000", "due": "2026-12-31", "attribution": "Kalshi", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-02-PM-AAPL-1", "date": "2026-08-02", "edition": "2026-08-02-PM", "channel": "stocks", "ticker": "$AAPL", "name": "Apple supply", "kind": "catalyst", "call": "Apple is dealing with major MacBook Air shortages amid the memory and silicon crunch, with many new orders not arriving until September.", "direction": "short", "levels": null, "due": "2026-09-30", "attribution": "Bloomberg via StockMKTNewz", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-31-AM-robots-1", "date": "2026-07-31", "edition": "2026-07-31-AM", "channel": "macro", "ticker": null, "name": "Robot vacuum ban", "kind": "catalyst", "call": "The administration is banning all new foreign-made robot vacuums on national security grounds, two days after the FCC restricted new foreign humanoid and quadruped robots under its equipment-authorisation power. The instrument reaches any connected imported device, and no public boundary has been drawn.", "direction": "event", "levels": null, "due": "2026-12-31", "attribution": "Polymarket relaying the administration", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-31-AM-clarity-1", "date": "2026-07-31", "edition": "2026-07-31-AM", "channel": "macro", "ticker": null, "name": "CLARITY odds", "kind": "catalyst", "call": "Kalshi's odds that the CLARITY Act passes this year fell from 40 percent to 33 inside about two and a half hours on Thursday, with Treasury Secretary Scott Bessent naming Senate Democrats as the blocker. The Tillis-Gallego ethics compromise is at the White House and Cynthia Lummis has rejected the latest rewrite from the other side.", "direction": "event", "levels": "40 to 33 percent", "due": "2026-08-31", "attribution": "Kalshi", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-31-AM-boj-1", "date": "2026-07-31", "edition": "2026-07-31-AM", "channel": "crypto", "ticker": null, "name": "Bank of Japan", "kind": "catalyst", "call": "The Bank of Japan held at 1.00 percent on an 8-1 vote, read as unhawkish given at least two known hawks on the board. The Ministry of Finance intervened in the yen ahead of the decision, and one FX desk argues that without it USDJPY would have broken through 164 and openly asks whether the ministry front-ran a hold it already knew was coming.", "direction": "event", "levels": "1.00 percent, 8-1 vote, USDJPY 160.50 pre-decision", "due": "2026-09-30", "attribution": "Bank of Japan", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-31-AM-SNDK-1", "date": "2026-07-31", "edition": "2026-07-31-AM", "channel": "stocks", "ticker": "$SNDK", "name": "SanDisk", "kind": "level", "call": "SanDisk's line in the sand is $1,350 to $1,450. A failed breakout there makes Thursday's move a dead cat and sets up a retest of the 200-day average.", "direction": "neutral", "levels": "1350-1450 line, 200dma below", "due": "2026-09-30", "attribution": "Heisenberg", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-31-AM-SA-1", "date": "2026-07-31", "edition": "2026-07-31-AM", "channel": "stocks", "ticker": null, "name": "Situational Awareness drawdown", "kind": "catalyst", "call": "The Wall Street Journal puts Situational Awareness down 67 percent in July, against a fund that was up 439 percent after fees through June 30 and carried a $45 billion net asset value on July 1. Citadel Securities reportedly paid around $10 billion for most of the public book, the Anthropic stake was retained, and Aschenbrenner was seeking new capital inside 24 hours.", "direction": "event", "levels": "-67 percent July, $45bn NAV July 1", "due": "2026-09-30", "attribution": "Wall Street Journal", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-31-AM-MU-1", "date": "2026-07-31", "edition": "2026-07-31-AM", "channel": "stocks", "ticker": "$MU", "name": "Micron confirmation", "kind": "level", "call": "Micron needs a 906 close to confirm the reclaim, with 932, 955, 973 and 991 mapped above. Michael Burry added to his Micron short at $880 and to a semiconductor index short at $506 into the same move, so the level and the short are a clean two-sided disagreement.", "direction": "neutral", "levels": "confirm 906, targets 932/955/973/991, Burry short from 880", "due": "2026-09-30", "attribution": "MentoviaX and Michael Burry", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-31-AM-AMZN-1", "date": "2026-07-31", "edition": "2026-07-31-AM", "channel": "stocks", "ticker": "$AMZN", "name": "Amazon capex", "kind": "thesis", "call": "Amazon raised 2026 cash capex to $220 billion and named higher memory prices as the reason for roughly $20 billion of it. Trailing free cash flow has swung to negative $7.6 billion from positive $18.2 billion and long-term debt has nearly doubled since December to $128.9 billion, against AWS at $42.2 billion growing 37 percent with a $496 billion backlog.", "direction": "neutral", "levels": "capex 220bn, FCF -7.6bn, LTD 128.9bn", "due": "2027-02-28", "attribution": "Amazon", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-31-AM-AAPL-1", "date": "2026-07-31", "edition": "2026-07-31-AM", "channel": "stocks", "ticker": "$AAPL", "name": "Apple September quarter", "kind": "catalyst", "call": "Apple guided September revenue to $111.7 billion to $113.8 billion, growth of 9 to 11 percent against the 16 percent just delivered, with gross margin stepping down to 47 to 48 percent from 50.1. The June beat included $600 million of tariff refunds worth $0.11 of earnings and about two points of margin, and Services and Greater China both missed.", "direction": "short", "levels": "Sept rev 111.7-113.8bn, GM 47-48 percent", "due": "2026-11-30", "attribution": "Apple", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-30-PM-samsung-1", "date": "2026-07-30", "edition": "2026-07-30-PM", "channel": "stocks", "ticker": null, "name": "Memory supply through 2028", "kind": "thesis", "call": "Samsung guides that no meaningful industry supply increase arrives before 2028 and that the 2027 memory sh

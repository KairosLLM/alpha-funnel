ortage will be more severe than 2026, with tight conditions persisting into 2028. Samsung and SK Hynix have both stopped signing multi-year contracts, betting on higher prices through 2027, and SK Hynix describes HBM, DRAM and NAND as sold out for 2026 with lines booked through 2027.", "direction": "long", "levels": null, "due": "2027-12-31", "attribution": "Samsung and SK Hynix", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-30-PM-robots-1", "date": "2026-07-30", "edition": "2026-07-30-PM", "channel": "macro", "ticker": null, "name": "FCC robot import rule", "kind": "catalyst", "call": "The FCC announced restrictions on new foreign-made humanoid and quadruped robots as a published rule under statutory authority, with a waiver process and judicial review, and no stated effective date. Scope may extend beyond China to all foreign countries. China holds roughly 85 percent of a market that shipped about 15,000 humanoids in 2025.", "direction": "event", "levels": null, "due": "2026-12-31", "attribution": "FCC via Diet TBPN", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-30-PM-lows-1", "date": "2026-07-30", "edition": "2026-07-30-PM", "channel": "stocks", "ticker": null, "name": "July low", "kind": "thesis", "call": "The July low holds into mid-August, revised back DOWN to 60/40 on 2026-08-03 after hedge funds re-grossed into tech at the fastest pace since 2022 and tech funds took their largest five-week inflow on record, which is a weaker setup than the slow-rebuild the upgrade assumed. Was revised UP to 70/30 on 2026-08-02 from 60/40. The mechanical seller is out of ammunition: Goldman's crowded-position index had its worst month against the S&P since 2001 and hedge funds are still up more than 10 percent on the year, so they hedge rather than liquidate. The 30 is Phil Rosen's funding gap, which no bounce fixes.", "direction": "long", "levels": "70/30", "due": "2026-08-15", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null, "revised_edition": "2026-08-02-PM"}, {"id": "2026-07-30-PM-korea-1", "date": "2026-07-30", "edition": "2026-07-30-PM", "channel": "investing", "ticker": null, "name": "Korea deleveraging", "kind": "thesis", "call": "Korea-focused leveraged ETF assets have fallen from a $53 billion peak on June 22, then 3.2 percent of Korean free float, to $15 to $16 billion at about 1.5 percent, so more than seventy percent of the exposure is gone. JPMorgan puts the deleveraging 75 to 90 percent complete. From July 31 the minimum cash deposit on new leveraged ETF purchases rises to 30 million won.", "direction": "long", "levels": null, "due": "2026-09-30", "attribution": "Goldman Sachs and JPMorgan", "status": "hit", "resolution": "The deleveraging finished and the bid returned. Foreign investors made a record $5.4 billion purchase of Korean equities, with capital flooding back into Seoul.", "resolved_edition": "2026-08-02-PM"}, {"id": "2026-07-30-PM-fed-1", "date": "2026-07-30", "edition": "2026-07-30-PM", "channel": "macro", "ticker": null, "name": "Fed path", "kind": "catalyst", "call": "Kalshi prices a 69 percent chance the Fed hikes at some point in 2026 and an 89 percent chance it does not cut. For September specifically Polymarket sits near 56 percent and CME FedWatch splits it 60/40, consistent with the house 55/45.", "direction": "event", "levels": "hike 2026 69 percent, September 56-60 percent", "due": "2026-12-31", "attribution": "Kalshi, Polymarket and CME", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-30-PM-citadel-1", "date": "2026-07-30", "edition": "2026-07-30-PM", "channel": "macro", "ticker": null, "name": "Citadel sequence", "kind": "thesis", "call": "Citadel publicly forecast a surprise Fed hike on Tuesday, the semiconductor complex sold off, the Fed held Wednesday, Situational Awareness was margin called, and Citadel bought its book Thursday. Multiple named accounts infer the call was positioning. The sequence is documented, the intent is not, and no evidence has been produced.", "direction": "neutral", "levels": null, "due": "2026-12-31", "attribution": "InvestorsLive, ThinkingUSD and others, inference only", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-30-PM-SKHY-1", "date": "2026-07-30", "edition": "2026-07-30-PM", "channel": "stocks", "ticker": null, "name": "SK Hynix", "kind": "level", "call": "UBS initiated SK Hynix at a $204 target, arguing the price does not reflect structurally higher memory profitability against return on equity above 40 percent through 2031, with agentic AI lifting 2027 DRAM bit growth to 36 percent and NAND to 23 percent. Chairman Choi Tae-won bought more than $3 million of stock in the open market.", "direction": "long", "levels": "target 204", "due": "2026-12-31", "attribution": "UBS", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-30-PM-SA-1", "date": "2026-07-30", "edition": "2026-07-30-PM", "channel": "stocks", "ticker": null, "name": "Situational Awareness unwind", "kind": "catalyst", "call": "Situational Awareness was forced to unwind its entire public equity book, longs and shorts, in one block to Citadel after margin calls. Reported by Bloomberg and the Financial Times on Wednesday night, CNBC at 6:05am and the Wall Street Journal at 8:39am Thursday. Holdings then rose 13 to 33 percent the same session. No drawdown figure has been confirmed by anyone, and the reported assets under management range from $20 billion to $45 billion.", "direction": "event", "levels": null, "due": "2026-09-30", "attribution": "Bloomberg, FT, CNBC and WSJ", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-30-PM-HOOD-1", "date": "2026-07-30", "edition": "2026-07-30-PM", "channel": "crypto", "ticker": "$HOOD", "name": "Robinhood deposits", "kind": "thesis", "call": "July net deposits are tracking toward $4 billion against $10.1 billion in June, which is why Barclays cut to $105, Goldman to $118 and Needham to $120 days after raising those same targets. Robinhood counters that July daily volumes match a record second quarter and that the $4 billion excludes Trump Accounts.", "direction": "short", "levels": "PTs 105 / 118 / 120", "due": "2026-08-31", "attribution": "Barclays, Goldman and Needham", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-30-PM-AAPL-1", "date": "2026-07-30", "edition": "2026-07-30-PM", "channel": "stocks", "ticker": "$AAPL", "name": "Apple", "kind": "level", "call": "344 is the top on Apple, a full hundred-percent measured move off the impulse leg, with a slight overshoot possible. The expression is selling December calls at the 360 to 365 strikes for around $50 rather than buying puts.", "direction": "short", "levels": "top 344, short calls 360-365", "due": "2026-09-30", "attribution": "Stocks with Josh", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-29-PM-ust30-1", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "macro", "ticker": null, "name": "Thirty-year Treasury", "kind": "level", "call": "The thirty-year yield broke through the 5.2 percent ceiling it had been testing since October 2023, its highest since July 31 2007. The long end is now the constraint on equities rather than the funds rate.", "direction": "short", "levels": "30-year above 5.2 percent", "due": "2026-10-31", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-29-PM-interceptors-1", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "macro", "ticker": null, "name": "US interceptor stockpiles", "kind": "thesis", "call": "More than half of US Patriot and THAAD interceptor stockpiles have been consumed in the Iran war. Patriots are under 1,000 from 2,330 and THAAD near 250 from 360, with more than 1,000 Tomahawks and 1,100 JASSMs fired and a rebuild of three years or more, which constrains transfers to Ukraine and Gulf allies.", "direction": "neutral", "levels": null, "due": "2026-12-31", "attribution": "CSIS", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-29-PM-gpu-1", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "macro", "ticker": null, "name": "GPU rental spread", "kind": "thesis", "call": "Spot GPU rental prices run at least twice contracted rates, so hyperscalers are underearning and whoever signed compute contracts in 2024 or 2025 is overearning. Google is reportedly paying $900 million a month for 110,000 GPUs rented from SpaceX at roughly twice spot.", "direction": "long", "levels": null, "due": "2026-12-31", "attribution": "Gavin Baker and Dwarkesh Patel", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-29-PM-fed-1", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "macro", "ticker": null, "name": "Next Fed move", "kind": "thesis", "call": "The next Fed move is a hike at 60/40, and it lands in September at 55/45 rather than later, revised down from the near-certainty the odds implied on Monday. The reason to fade September is that Warsh accepted three dissents rather than move early, so a chair tolerating that much internal disagreement is not being rushed by it.", "direction": "neutral", "levels": "hike 60/40, September 55/45", "due": "2026-09-30", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-29-PM-credit-1", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "stocks", "ticker": null, "name": "Hyperscaler credit", "kind": "thesis", "call": "Credit default swap prices at record highs on Oracle, SpaceX, Google, Amazon and Nvidia are the market repricing when the AI payoff arrives rather than default risk, so the trade is non-AI value, the S&P 400, private credit and commodities off the AI trade.", "direction": "short", "levels": null, "due": "2026-12-31", "attribution": "Torsten Slok of Apollo", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-29-PM-clarity-3", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "macro", "ticker": null, "name": "CLARITY footnote", "kind": "thesis", "call": "On Commodity Futures Modernization Act precedent, the consequential provision in CLARITY will read as a footnote and will involve offshore derivatives, the way the Enron loophole did in 2000.", "direction": "neutral", "levels": null, "due": "2026-12-31", "attribution": "Jeff Park", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-29-PM-clarity-2", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "macro", "ticker": null, "name": "CLARITY ethics compromise", "kind": "thesis", "call": "CLARITY passes in August through an ethics compromise modelled on the Laken Riley Act, letting state attorneys general sue the Justice Department but not the President directly. Ruben Gallego and Thom Tillis are finalising the language for the White House.", "direction": "event", "levels": null, "due": "2026-08-31", "attribution": "Mike Novogratz", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-29-PM-clarity-1", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "news", "ticker": null, "name": "CLARITY Act floor vote", "kind": "catalyst", "call": "John Thune confirmed on Fox News that the CLARITY Act gets a Senate floor vote before the August recess, with Russia sanctions ahead of it. Charles Schwab puts the hard deadline at August 10 and Bloomberg reports nearly ten Democrats in favour.", "direction": "event", "levels": null, "due": "2026-08-10", "attribution": "John Thune via Lark Davis", "status": "miss", "resolution": "Thune hedged it to depending on Democrats supplying the votes, and no vote was scheduled. Relayed as a confirmation and it was not one.", "resolved_edition": "2026-08-03-PM"}, {"id": "2026-07-29-PM-SPCX-1", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "stocks", "ticker": "$SPCX", "name": "SpaceX", "kind": "catalyst", "call": "SpaceX reports for the first time in early August with roughly a billion shares unlocking days later and 56 to 60 percent of supply free by year end, against about $60 billion of compute sold over nine to twelve months and Anthropic alone at $1.25 billion a month.", "direction": "event", "levels": "low 107, listing 135, Morningstar 63, Morgan Stanley bull 600", "due": "2026-08-31", "attribution": "Limitless", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-29-PM-NBIS-1", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "stocks", "ticker": "$NBIS", "name": "Nebius", "kind": "level", "call": "Nebius closing below $132 opens $85 to $100. Nvidia holds 9.3 percent after a $2 billion investment, and the September 11 warrant date plus $4.3 billion of convertibles are the dilution overhang.", "direction": "short", "levels": "trigger 132, targets 85-100", "due": "2026-09-30", "attribution": "AtlasShrug1", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-29-PM-MU-1", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "investing", "ticker": "$MU", "name": "Micron", "kind": "level", "call": "Micron filled the 751 gap and closed under 800. The map is 770 as the low still standing, 832 as the level lost, and 872 as the reclaim that makes a bounce real, with the 100-day average as the line.", "direction": "neutral", "levels": "770 low, 832 lost, 872 reclaim, gap fill 751", "due": "2026-08-31", "attribution": "MentoviaX", "status": "hit", "resolution": "The map held through a violent test. Micron closed above 872 on Thursday and traded 925 overnight, roughly 30 percent off its trough inside a day. The new confirmation level is a 906 close, with 932, 955, 973 and 991 mapped above it.", "resolved_edition": "2026-07-31-AM"}, {"id": "2026-07-29-PM-BTC-1", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "crypto", "ticker": "$BTC", "name": "Bitcoin", "kind": "level", "call": "Bitcoin does not break $58,000 to $60,000, the top of the current range is $85,000, and $40,000 is the invalidation that would mean SOL near $40 and another four to six months of waiting.", "direction": "long", "levels": "floor 58000-60000, range top 85000, invalidation 40000", "due": "2026-09-30", "attribution": "Ansem", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-29-PM-BE-1", "date": "2026-07-29", "edition": "2026-07-29-PM", "channel": "stocks", "ticker": "$BE", "name": "Bloom Energy", "kind": "thesis", "call": "Bloom Energy's five-gigawatt production ambition needs close to 220 tons of scandium oxide a year against global supply estimated near 240 tons. Bloom calls the claim false and misleading and has published no counter-number.", "direction": "short", "levels": null, "due": "2026-12-31", "attribution": "Hunterbrook Media", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-yanbu-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "macro", "ticker": null, "name": "Yanbu pipeline route", "kind": "thesis", "call": "A Houthi Telegram statement claims drones struck targets related to crude transport from Eastern Saudi Arabia to Yanbu, the Red Sea terminus of the pipeline that exists to bypass Hormuz. A credible threat to that route is what would make a closed strait matter.", "direction": "bearish", "levels": null, "due": "2026-09-30", "attribution": "Houthi Telegram via the threadguy digest", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-semis-east-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "stocks", "ticker": null, "name": "East versus West semis", "kind": "thesis", "call": "Long Eastern semis, short Western semis, on China beginning mass production of homegrown DUV lithography tools. ASML fell 2.5 percent on the headline.", "direction": "neutral", "levels": null, "due": "2026-12-31", "attribution": "Tulip King via the threadguy digest", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-neocloud-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "crypto", "ticker": null, "name": "NeoCloud residual value", "kind": "thesis", "call": "The entire NeoCloud equity return sits in unobserved 2032 GPU residual value, because chips, customer contracts and debt all mature together. One megawatt: $30M build, 75/25 debt/equity, $10.5M revenue, negative $6M after year one, cash breakeven year five, six-year cumulative $3.5M on $7.5M equity for 6 to 7 percent annualised. At a 60 percent residual that becomes 23 percent annualised; at 30 percent the trade is over.", "direction": "bearish", "levels": {"residual_bull": 0.6, "residual_break": 0.3}, "due": "2032-12-31", "attribution": "Milk Road AI", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-hormuz-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "macro", "ticker": null, "name": "Oil prices the negotiation", "kind": "thesis", "call": "Crude fell 5 percent on a Times of Israel report about what mediators believe, published an hour after Tehran denied that talks exist, while physical Hormuz transit was zero tankers in either direction. The oil price is trading the negotiation rather than the flow.", "direction": "neutral", "levels": null, "due": "2026-08-31", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-cowen-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "macro", "ticker": null, "name": "Fed sequencing", "kind": "thesis", "call": "A hold on July 29 is what triggers the hike. The two-year already sits at 4.1 to 4.2 percent above the funds rate, so a hold pushes the thirty-year through 5.2 percent and the ten-year toward 5, and the bond market forces a September hike. Paired with a 10 to 20 percent equity drawdown, precedents August 2022, September 2018 and September 2014.", "direction": "bearish", "levels": {"ust30": 5.2, "ust10": 5.0}, "due": "2026-09-30", "attribution": "Benjamin Cowen", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-clarity-2", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "macro", "ticker": null, "name": "CLARITY Senate votes, competing count", "kind": "thesis", "call": "CLARITY comes down to about three or four Democratic senators, and passage is anyone's guess. Directly contradicts Gillan's seven-vote count from the same network on the same day, and neither cites a whip count.", "direction": "neutral", "levels": {"dem_votes_needed": 3.5}, "due": "2026-08-10", "attribution": "Josh Ryman of GSR", "status": "expired", "resolution": "Never tested. The bill did not reach a floor vote before recess, so neither his three-to-four count nor Gillan's seven ever got a roll call to settle them. Punchbowl instead reports Democrats settled on a bloc no pending ethics, illicit finance and stablecoin yield.", "resolved_edition": "2026-08-06-PM"}, {"id": "2026-07-28-PM-clarity-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "news", "ticker": null, "name": "CLARITY Senate votes", "kind": "thesis", "call": "CLARITY needs seven Democratic Senate votes and does not get them. The blockage is who enforces roughly 600 pages of Trump-family ethics provisions, currently the Attorney General, Trump's former personal lawyer Todd Blanche, where Democrats want state attorneys general instead.", "direction": "bearish", "levels": {"dem_votes_needed": 7}, "due": "2026-08-10", "attribution": "John Gillan of Milk Road", "status": "hit", "resolution": "Correct and early. The bill needs 60 votes and does not have them, the ethics package is where it broke, and no vote was scheduled before recess.", "resolved_edition": "2026-08-03-PM"}, {"id": "2026-07-28-PM-SSI-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "stocks", "ticker": null, "name": "Nvidia and Safe Superintelligence", "kind": "catalyst", "call": "Nvidia takes roughly $5 billion of equity in Safe Superintelligence plus priority access to Vera Rubin, and SSI moves off Google TPUs, which it had primarily relied on. A frontier lab switching silicon platforms mid-flight, bought with capital and queue position.", "direction": "bullish", "levels": {"equity_bn": 5}, "due": "2026-12-31", "attribution": "Diet TBPN, multiple sources on the equity figure", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-SPCX-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "stocks", "ticker": "$SPCX", "name": "SpaceX", "kind": "catalyst", "call": "SPCX fell 5.5 percent to 47 percent below its June 16 high with roughly $1.2 trillion of market value gone, trades below its $135 listing price, and faces its first major shareholder unlock on August 6.", "direction": "bearish", "levels": {"listing": 135, "off_high_pct": 47}, "due": "2026-08-06", "attribution": "Market list and VirtualBacon", "status": "hit", "resolution": "It got worse on every leg. The unlock arrived August 6 at 911.5 million shares, the stock still trades far below the $135 listing at roughly $108, and the loss since the June high widened from $1.2 trillion to about $1.6 trillion.", "resolved_edition": "2026-08-06-PM"}, {"id": "2026-07-28-PM-SMCI-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "stocks", "ticker": "$SMCI", "name": "Supermicro", "kind": "catalyst", "call": "Supermicro carries a second criminal probe in Taiwan, a $7 billion raise whose 45 million shares at $27.50 are underwater, 7 percent mandatory convertible preferred, $6.6 billion quarterly cash use, trailing free cash flow of negative $6.9 billion, and short interest of 103.2 million shares or 20 percent of float into August 11 earnings.", "direction": "bearish", "levels": {"raise_px": 27.5, "ttm_fcf_bn": -6.9, "short_pct_float": 20}, "due": "2026-08-11", "attribution": "Rick Orford", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-ORCL-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "stocks", "ticker": "$ORCL", "name": "AI credit", "kind": "thesis", "call": "The AI ecosystem's weight in the investment-grade index goes from under 3 percent to over 6. Hyperscaler capex revised for 2026 from 600 to above 800 billion, 2027 from 850 to 1,300, 2028 near 1,300. Oracle sits one notch above junk with CDS at 2008 levels and spreads beyond 220bps. The CDO analogy for late-1990s telecom is rejected on issuer credit quality.", "direction": "bearish", "levels": {"ig_weight_pct": 6, "orcl_spread_bps": 220}, "due": "2026-12-31", "attribution": "Vishy Tirupattur of Morgan Stanley", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-NVDA-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "stocks", "ticker": "$NVDA", "name": "Nvidia", "kind": "level", "call": "Nvidia bottomed near $192 and bounced off its 200-day moving average for the third time in 21 sessions. A level tested three times in a month is a queue rather than support.", "direction": "bearish", "levels": {"low": 192}, "due": "2026-08-29", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-MU-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "stocks", "ticker": "$MU", "name": "Micron", "kind": "level", "call": "Micron broke below $800, leaving a gap fill at 751 underneath and 872 then 891 above.", "direction": "bearish", "levels": {"gap_fill": 751, "up1": 872, "up2": 891}, "due": "2026-08-29", "attribution": "Stocks list", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-KOSPI-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "investing", "ticker": null, "name": "KOSPI", "kind": "catalyst", "call": "The KOSPI was halted after falling 10.84 percent to 6,023.66, its second-largest single-day drop on record, leaving it down nearly 29 percent for the month.", "direction": "bearish", "levels": {"close": 6023.66, "day_pct": -10.84, "month_pct": -29}, "due": "2026-07-31", "attribution": "Market list", "status": "hit", "resolution": "The crash ran further than the call described, with the index down roughly 33 to 40 percent for July depending on the measure, then snapped back about 14 percent in Friday's session on a $13.9 billion sovereign wealth injection for AI data centres. Around 3.4 percent of South Korean adults were hit with margin calls.", "resolved_edition": "2026-07-31-AM"}, {"id": "2026-07-28-PM-ISRG-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "stocks", "ticker": "$ISRG", "name": "Memory cost pass-through", "kind": "thesis", "call": "Memory pricing has appeared as a named cost line in Intuitive Surgical's results, putting the DRAM cycle into surgical robotics rather than only hyperscaler capex.", "direction": "bearish", "levels": null, "due": "2026-10-31", "attribution": "Chip Stock Investor", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-IREN-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "crypto", "ticker": "$IREN", "name": "IREN funding model", "kind": "thesis", "call": "IREN's buildout is described as phase-funding-phase, which cannot be reconciled with negative $6 million per megawatt in year one unless a third party is funding the phase.", "direction": "bearish", "levels": null, "due": "2026-12-31", "attribution": "house, against Rick Orford", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-CXMT-2", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "investing", "ticker": null, "name": "CXMT pre-IPO market accuracy", "kind": "catalyst", "call": "0xResearch's Hyperliquid CXMT pre-IPO market implied roughly RMB48.20 into a RMB49.50 opening print, 2.6 percent low, against public pre-listing forecasts spanning RMB45 to RMB75.", "direction": "neutral", "levels": {"implied": 48.2, "print": 49.5}, "due": "2026-07-28", "attribution": "0xResearch", "status": "hit", "resolution": "The pre-IPO market called the Shanghai debut to within 2.6 percent against public forecasts spanning RMB45 to RMB75, so a venue I had been sceptical of earned this one.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-28-PM-CXMT-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "stocks", "ticker": null, "name": "CXMT valuation", "kind": "thesis", "call": "CXMT priced its IPO at $85 billion and trades near $500 billion, roughly 1,600 times earnings with a payback year of 3626, and took 1.14 percent of all Shanghai Stock Exchange volume on day one ($234M of $20.5B).", "direction": "bearish", "levels": {"ipo_bn": 85, "mkt_bn": 500, "pe": 1600}, "due": "2026-12-31", "attribution": "Prof G Markets and the threadguy digest", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-PM-AAPL-1", "date": "2026-07-28", "edition": "2026-07-28-PM", "channel": "stocks", "ticker": "$AAPL", "name": "Apple", "kind": "catalyst", "call": "Apple briefly touched a $5 trillion market capitalisation, the second company ever after Nvidia, which itself peaked near $5.7 trillion. It did so on a session the Nasdaq 100 entered a correction.", "direction": "bullish", "levels": {"mcap_t": 5.0}, "due": "2026-08-31", "attribution": "Stocks list", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-AM-realrates-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "macro", "ticker": null, "name": "AI complex derating", "kind": "thesis", "call": "The proximate cause of the AI selloff is roughly 50 basis points of higher real rates driven by Warsh indicating hikes and planning balance-sheet runoff, and the market is ahead of analysts, who have not yet cut semis EPS estimates.", "direction": "short", "levels": "~50bps higher real rates", "due": "2026-10-31", "attribution": "Alex Corrino", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-AM-rates-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "macro", "ticker": null, "name": "Long-end yields", "kind": "catalyst", "call": "The 30-year Treasury ended last week at 5.17 percent, its highest weekly close since July 2007, and the hyperscaler CDS basket widened another 3bps to a record.", "direction": "short", "levels": "30-year 5.17 percent", "due": "2026-10-31", "attribution": "Charlie Bilello and zerohedge", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-AM-oil-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "macro", "ticker": null, "name": "Oil range", "kind": "thesis", "call": "Oil oscillates in a $70 to $110 range while mediated US-Iran talks continue with no real concessions on the Strait of Hormuz, against Macquarie modelling a glut on a deal before the midterms.", "direction": "neutral", "levels": "$70-110 range", "due": "2026-11-03", "attribution": "Anas Alhajji", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-AM-netanyahu-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "news", "ticker": null, "name": "Trump-Netanyahu meeting", "kind": "catalyst", "call": "Trump hosts Netanyahu today after praising Turkey and criticising Israel, with Netanyahu reportedly bringing intelligence on Iran's Pickaxe Mountain nuclear facility, and Polymarket pricing a hug at 31 percent.", "direction": "event", "levels": "hug at 31 percent", "due": "2026-07-28", "attribution": "zerohedge and Polymarket", "status": "hit", "resolution": "The meeting happened. Netanyahu arrived 11:01am ET; Trump's separate Zelensky talks had begun at 9:47am.", "resolved_edition": "2026-07-28-PM"}, {"id": "2026-07-28-AM-memory-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "stocks", "ticker": null, "name": "Memory supply", "kind": "thesis", "call": "The memory supply story is intact at 75/25, raised from 70/30, because contract prices ran up 90 to 95 percent quarter over quarter with capacity sold out for the year and no meaningful new fabs until late 2027.", "direction": "long", "levels": "DRAM +90-95 pct QoQ", "due": "2026-12-31", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-AM-industrials-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "macro", "ticker": null, "name": "Sector rotation", "kind": "thesis", "call": "The money leaving megacap tech since June went into industrials rather than financials or energy, with Caterpillar, GE Vernova, GE Aerospace, RTX, Eaton and Boeing named, and the Russell 2000 up since June while the Nasdaq topped.", "direction": "long", "levels": null, "due": "2026-12-31", "attribution": "BowTied Bull, corroborated by Yardeni Research", "status": "open", "resolution": "Marked against, not resolved. On July 28 XLI fell while the Dow rose one percent, and Caterpillar fell on data-centre exposure while Deere rose. One session does not settle a call dated to 2026-12-31, so it stays open.", "resolved_edition": null}, {"id": "2026-07-28-AM-fed-2", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "investing", "ticker": null, "name": "July FOMC", "kind": "catalyst", "call": "Four institutions on three sides of the same meeting: Kalshi 73 percent hold, aixbt reads 33 percent hike, Polymarket 73 percent no change and 26 percent hike, Citadel Securities expects a hike, Citigroup expects a hold.", "direction": "event", "levels": "Kalshi 73 hold, Polymarket 26 hike", "due": "2026-07-29", "attribution": "Kalshi, Polymarket, Citadel and Citigroup", "status": "hit", "resolution": "Kalshi, Polymarket and Citigroup were right on the hold. Citadel Securities, which had flipped its forecast to a hike, was wrong, and the hike price never got above 26 to 27 percent.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-28-AM-fed-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "investing", "ticker": null, "name": "July FOMC", "kind": "thesis", "call": "A hold is 78/22, revised UP from 75/25 this morning because Kalshi's hold leg recovered to 77 from an intraday 75 and Bespoke's hike odds fell to 29, which outweighs Citadel Securities' hike position and CME's just-under-40. A statement hawkish enough to move the tape is 55/45, revised down from 60/40. Revised in place across the 07-28 AM and PM editions rather than appended, to stop the six-entry pileup on one decision.", "direction": "neutral", "levels": "hold 75/25, hawkish statement 60/40", "due": "2026-07-29", "attribution": "house", "status": "hit", "resolution": "Both legs landed. The hold came in at 78/22 and the hawkish-statement leg at 55/45, and Warsh delivered the pause with none of the relief. Citadel Securities, whose hike position I weighed against, was wrong.", "resolved_edition": "2026-07-29-PM", "revised_edition": "2026-07-28-PM"}, {"id": "2026-07-28-AM-anthropic-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "stocks", "ticker": null, "name": "Anthropic IPO timing", "kind": "catalyst", "call": "Anthropic filed to go public on June 1 targeting an October Nasdaq listing near $965 billion, which places the open-weights position paper four months ahead of an offering whose valuation rests on a closed moat.", "direction": "event", "levels": "~$965B target", "due": "2026-10-31", "attribution": "sudoingX", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-AM-abqaiq-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "macro", "ticker": null, "name": "Abqaiq strike scale", "kind": "thesis", "call": "The Abqaiq strike reported on July 27 was inflated by two accounts recirculating September 14 2019 articles, photographs and Saudi Energy Minister statements as current. Attacks did occur and are nothing relative to 2019.", "direction": "event", "levels": null, "due": "2026-08-15", "attribution": "Anas Alhajji", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-AM-SPCX-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "stocks", "ticker": "$SPCX", "name": "SpaceX", "kind": "catalyst", "call": "SpaceX closed at its lowest price ever, red in 13 of its last 16 sessions, with earnings August 4 and a lockup on August 6 freeing 911 million insider shares.", "direction": "short", "levels": "lockup Aug 6, 911M shares", "due": "2026-08-06", "attribution": "Vest Exchange", "status": "hit", "resolution": "Both legs landed. The lockup freed up to 911.5 million shares on August 6, and the stock set another record low close the day before, having shed roughly $1.6 trillion of market value since the June high.", "resolved_edition": "2026-08-06-PM"}, {"id": "2026-07-28-AM-SKHY-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "stocks", "ticker": null, "name": "SK Hynix", "kind": "level", "call": "A decisive technical breakdown in SK Hynix points at 1 to 1.1 million won, another 35 to 40 percent lower, consistent with $SMH in the 335 to 400 range over the next several months.", "direction": "short", "levels": "target 1-1.1M won, SMH 335-400", "due": "2026-12-31", "attribution": "John Galt", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-AM-RKLB-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "stocks", "ticker": null, "name": "Starship reusability", "kind": "thesis", "call": "Mastering Starship reusability this year would raise ARK's 2031 revenue and EBIT expectations roughly threefold and 2036 by six to seven times, because reusable versus disposable is $100 against $570 per kilogram to orbit.", "direction": "long", "levels": "$100/kg vs $570/kg", "due": "2027-12-31", "attribution": "Brett Winton of ARK", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-AM-NVDA-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "stocks", "ticker": "$NVDA", "name": "Nvidia", "kind": "catalyst", "call": "The cost of insuring Nvidia's debt surged to a record after reports it is discussing more than $750 billion of AI infrastructure financing tied to OpenAI, triple the $250 billion Ohio figure previously reported.", "direction": "short", "levels": "CDS at record, financing >$750B", "due": "2026-10-31", "attribution": "Walter Bloomberg via the Market list", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-AM-MU-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "stocks", "ticker": "$MU", "name": "Micron", "kind": "level", "call": "Micron breached the 902 right shoulder and closed just under it, and needs 955 or better to repair the structure.", "direction": "neutral", "levels": "902 broken, 955 to repair", "due": "2026-08-29", "attribution": "MentoviaX", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-AM-HOOD-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "investing", "ticker": "$HOOD", "name": "Robinhood", "kind": "catalyst", "call": "Robinhood reports Wednesday after the close, with Bernstein and Piper Sandler both modelling roughly $150 million of event-contract revenue against about $104 million in the first quarter, enough to pass crypto as a revenue line for the first time.", "direction": "long", "levels": "$150M vs $104M, target $160", "due": "2026-07-29", "attribution": "Gautam Chhugani of Bernstein", "status": "hit", "resolution": "Event contracts printed $156 million on 13.6 billion contracts and became the second-largest transaction line, passing crypto at $100 million and equities at $129 million.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-28-AM-CXMT-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "stocks", "ticker": null, "name": "CXMT", "kind": "thesis", "call": "CXMT holds 6 to 9 percent of global DRAM shipments against Samsung's 36 and SK Hynix's 29, needs at least 15 percent to compete long term per Counterpoint, is not projected to reach it even by 2028, and runs costs more than 30 percent higher per bit.", "direction": "neutral", "levels": "6-9 pct share, 15 pct needed", "due": "2028-12-31", "attribution": "Melvin citing Counterpoint Research", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-oil-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "macro", "ticker": null, "name": "Oil", "kind": "thesis", "call": "The bombing pause does not fix supply, because countries other than America must dip deeper into shrinking stocks, pushing prices higher as thinning buffers make future shortages more likely. Goldman sees above $120 next quarter if Hormuz does not ease.", "direction": "long", "levels": "SPR at 311M barrels, above $120 target", "due": "2026-10-31", "attribution": "The Economist and Goldman Sachs", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-killswitch-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "macro", "ticker": null, "name": "AI Kill Switch Act", "kind": "catalyst", "call": "The AI Kill Switch Act, introduced July 23 by Ted Lieu and Nathaniel Moran, would let Homeland Security throttle or shut down systems above $100 million in training compute or $500 million in annual model revenue.", "direction": "event", "levels": "thresholds $100M compute, $500M revenue", "due": "2026-12-31", "attribution": "AI Central", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-iran-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "macro", "ticker": null, "name": "Iran talks", "kind": "catalyst", "call": "Trump says the United States is in very deep talks with Iran with not much time, and will return to very powerful military action if they fail.", "direction": "event", "levels": null, "due": "2026-08-31", "attribution": "Trump via Channel 12", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-fed-2", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "investing", "ticker": null, "name": "July FOMC", "kind": "catalyst", "call": "Hike odds sit near 36 percent for Wednesday with September above 50 percent, up from 18 percent a week ago, while Kalshi still calls a fifth straight hold at 3.50 to 3.75 percent without publishing a number.", "direction": "event", "levels": "36 percent hike, September above 50", "due": "2026-07-29", "attribution": "Barchart, Arbitrage Andy and Kalshi", "status": "hit", "resolution": "No hike, so the 36 percent price was wrong-side and Kalshi's fifth-straight-hold call at 3.50 to 3.75 percent was exactly right. September above 50 percent did not survive the meeting, falling to roughly 57 percent after the press conference.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-27-PM-fed-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "investing", "ticker": null, "name": "July FOMC", "kind": "thesis", "call": "A hold is 80/20, revised down from 85/15, and a statement hawkish enough to move the tape is 60/40, revised up from 45/55, because there is no dot plot this meeting so the statement and Warsh's first press conference are the only instruments.", "direction": "neutral", "levels": "hold 80/20, hawkish statement 60/40", "due": "2026-07-29", "attribution": "house", "status": "hit", "resolution": "Both legs landed. Hold at 80/20, and the hawkish-statement leg revised up to 60/40 was the right direction, since the statement and Warsh's first full press conference were the only instruments and both read hard.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-27-PM-datacenter-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "stocks", "ticker": null, "name": "Data centre overbuild", "kind": "thesis", "call": "If a price-performance curve minimises AI power requirements, a lot of data centres get turned into pickleball courts, the dark-fiber outcome, even though utilisation scales as expected.", "direction": "short", "levels": null, "due": "2029-12-31", "attribution": "Mark Cuban", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-clarity-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "macro", "ticker": null, "name": "CLARITY Act", "kind": "catalyst", "call": "Senate floor math already rules out passage before the August 10 recess absent time agreements that are not coming, though an initial vote is still expected before August 7. Kalshi prices passage into law this year at 40 percent.", "direction": "event", "levels": "Kalshi 40 percent, initial vote before Aug 7", "due": "2026-08-10", "attribution": "Brendan Pedersen", "status": "hit", "resolution": "Right on the floor math and wrong on the consolation. Passage before recess is dead at 3 percent on Kalshi, exactly as the time-agreement argument said. The initial vote he still expected before August 7 never got its cloture motion filed.", "resolved_edition": "2026-08-06-PM"}, {"id": "2026-07-27-PM-bigtech-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "macro", "ticker": null, "name": "Hyperscaler off-balance-sheet debt", "kind": "thesis", "call": "Nikkei Asia puts roughly $1.65 trillion of off-balance-sheet obligations across Alphabet, Microsoft, Amazon, Meta and Oracle against about $1.35 trillion of reported debt, with Meta's at $420 billion, three times what it reports.", "direction": "short", "levels": "$1.65T off balance sheet vs $1.35T reported", "due": "2027-06-30", "attribution": "Nikkei Asia via Prof G Markets", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-abqaiq-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "macro", "ticker": null, "name": "Abqaiq strike", "kind": "catalyst", "call": "Saudi Aramco's Abqaiq stabilisation plant, handling 5 to 7 percent of global oil supply, was struck by drones with fires at the facility and the East-West Pumping Station. Riyadh blamed Iran-backed groups in Iraq and reserves the right to respond.", "direction": "event", "levels": "5-7 percent of global supply", "due": "2026-08-15", "attribution": "The Hormuz Letter and zerohedge", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-XRP-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "crypto", "ticker": "$XRP", "name": "Ripple", "kind": "level", "call": "Kalshi traders forecast Ripple at $1.30 this year, against Ripple president Monica Long saying institutional demand is unlike anything ever seen with no figure attached.", "direction": "neutral", "levels": "$1.30", "due": "2026-12-31", "attribution": "Kalshi", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-SNDK-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "stocks", "ticker": "$SNDK", "name": "SanDisk", "kind": "thesis", "call": "Morgan Stanley warns memory contract prices peak in late 2026, and the rebuttal is $42 billion of remaining performance obligations on multiyear deals with price floors near $0.29 per gigabyte, so a pricing peak is not an earnings peak.", "direction": "long", "levels": "floors near $0.29/GB, $42B RPO", "due": "2026-12-31", "attribution": "Shay Boloor", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-NVDA-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "stocks", "ticker": "$NVDA", "name": "Nvidia", "kind": "catalyst", "call": "Nvidia's CDS spreads are widening on the reported $250 billion guarantee of OpenAI's Ohio campus, and the stock broke below $200.", "direction": "short", "levels": "below $200", "due": "2026-10-31", "attribution": "Kyle Reidhead", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-MU-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "stocks", "ticker": "$MU", "name": "Micron", "kind": "thesis", "call": "The memory shortage survives CXMT at 70/30 because frontier open models are a memory demand story, K3 needing roughly 1.4 terabytes to load at 4-bit against HBM sold out through 2027, but the multiple does not survive the Chinese supply narrative.", "direction": "long", "levels": "fell 6.1 percent below $1T market cap", "due": "2026-10-31", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-MSTR-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "investing", "ticker": "$MSTR", "name": "Strategy", "kind": "catalyst", "call": "Strategy sold $1.27 billion of stock over three weeks and bought zero bitcoin for a fourth straight week, trading near 0.6 times the coins behind it, with 843,775 coins at an average cost of $75,476 roughly $8.5 billion underwater. Q2 lands Thursday after the close.", "direction": "event", "levels": "0.6x NAV, avg cost $75,476", "due": "2026-07-30", "attribution": "Milk Road", "status": "hit", "resolution": "The quarter landed Thursday after the close. The zero-buying leg did not hold, since bitcoin holdings rose 11 percent on the quarter and dollar reserves rose 12. Reported figures are thin, with no revenue or earnings against the roughly $3.07 expected reaching anyone.", "resolved_edition": "2026-07-31-AM"}, {"id": "2026-07-27-PM-HOOD-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "investing", "ticker": "$HOOD", "name": "Robinhood", "kind": "thesis", "call": "Prediction markets pass crypto as a Robinhood revenue line for the first time in Q2, on roughly $150 million of event-contract revenue against about $104 million in Q1, with a $160 target.", "direction": "long", "levels": "$150M vs $104M, target $160", "due": "2026-07-29", "attribution": "Gautam Chhugani of Bernstein and Piper Sandler", "status": "hit", "resolution": "Event-contract revenue printed $156 million against the roughly $150 million modelled, up more than tenfold, and passed both crypto at $100 million and equities at $129 million.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-27-PM-GOOGL-2", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "stocks", "ticker": "$GOOGL", "name": "Alphabet", "kind": "thesis", "call": "Roughly half of Google Cloud's 82 percent growth is estimated to come from OpenAI and Anthropic, both venture-funded and cash-flow negative, which is a concentration risk nobody has disclosed a figure for.", "direction": "short", "levels": null, "due": "2027-01-31", "attribution": "Ed Elson", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-GOOGL-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "stocks", "ticker": "$GOOGL", "name": "Alphabet", "kind": "catalyst", "call": "Berkshire's latest 13F shows another $10 billion of Alphabet, nearly tripling the stake, as the stock crossed a $4 trillion market cap.", "direction": "long", "levels": "crossed $4T", "due": "2026-11-15", "attribution": "Berkshire 13F via Fin Tek", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-BTC-2", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "crypto", "ticker": "$BTC", "name": "Bitcoin", "kind": "thesis", "call": "Kalshi traders price a 55 percent chance Bitcoin hits $50,000 before $100,000.", "direction": "short", "levels": "55 percent, $50k before $100k", "due": "2026-12-31", "attribution": "Kalshi", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-BTC-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "crypto", "ticker": "$BTC", "name": "Bitcoin", "kind": "level", "call": "No durable bottom is confirmed and a retest of $52,000 to $58,000 is possible, with the Fed decision and Strategy's Q2 earnings as the catalysts.", "direction": "short", "levels": "retest band 52,000-58,000", "due": "2026-09-30", "attribution": "Nansen", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-AM-skhynix-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "investing", "ticker": null, "name": "SK Hynix", "kind": "catalyst", "call": "SK Hynix reports earnings Tuesday July 28 around 8pm ET, into a $500 billion-plus partnership with Nvidia and a stock down roughly 20 percent from its peak.", "direction": "event", "levels": null, "due": "2026-07-28", "attribution": "Jose Najarro", "status": "hit", "resolution": "SK Hynix reported revenue of $54.6 billion against $57.7 billion expected and operating profit of $41.6 billion against $44.2 billion, missing both lines while setting records at a 76 percent operating margin, revenue up 257 percent and profit up 557 percent. The stock fell 9 percent and took Micron and SanDisk with it.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-27-AM-samsung-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "investing", "ticker": null, "name": "Samsung", "kind": "catalyst", "call": "Samsung reports Wednesday July 29, days after signing roughly $200 billion with Broadcom across memory and foundry over five years including a 2-nanometer foundry commitment.", "direction": "event", "levels": null, "due": "2026-07-29", "attribution": "Jose Najarro", "status": "hit", "resolution": "Samsung reported revenue of $118.1 billion against $119.2 billion expected, a miss, with record operating profit of $61.7 billion against $60.8 billion expected, up 1,814 percent, and guided to strong second-half memory demand.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-27-AM-iran-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "news", "ticker": null, "name": "US-Iran ceasefire", "kind": "catalyst", "call": "Polymarket prices a signed US-Iran ceasefire this month at 55 percent after Omani officials travelled to Tehran and strikes halted.", "direction": "event", "levels": "55 percent", "due": "2026-07-31", "attribution": "Polymarket", "status": "miss", "resolution": "Missed. July ended with nothing signed. Trump ordered a fresh attack aimed at getting Tehran to surrender, with strikes possible over the weekend and Iran naming American energy infrastructure in its response plan.", "resolved_edition": "2026-07-31-PM"}, {"id": "2026-07-27-AM-fed-2", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "investing", "ticker": null, "name": "July FOMC", "kind": "thesis", "call": "A hold is 85/15 and a statement hawkish enough to move the tape is 45/55, revised down from 50/50 on Sunday because oil falling 7 percent removes the input that was forcing Warsh's hand.", "direction": "neutral", "levels": "hold 85/15, hawkish statement 45/55", "due": "2026-07-29", "attribution": "house", "status": "hit", "resolution": "The hold landed at 85/15. The second leg missed and I own it: I revised the hawkish-statement odds DOWN to 45/55 on Sunday because oil had fallen, and the statement read hawkish anyway.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-27-AM-fed-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "investing", "ticker": null, "name": "July FOMC", "kind": "catalyst", "call": "Three venues price the same July 29 decision differently: Kalshi 83 percent hold, Barchart 36 percent hike, Polymarket 17 percent hike.", "direction": "event", "levels": "Kalshi 83 hold / Barchart 36 hike / Polymarket 17 hike", "due": "2026-07-29", "attribution": "Kalshi, Barchart and Polymarket", "status": "hit", "resolution": "Kalshi's 83 percent hold was right. Barchart's 36 percent and Polymarket's 17 percent hike prices were both on the wrong side.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-27-AM-fauci-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "news", "ticker": null, "name": "Fauci testimony", "kind": "catalyst", "call": "Anthony Fauci is scheduled to testify before Senator Rand Paul on Wednesday July 29, the same day as the Fed decision.", "direction": "event", "levels": null, "due": "2026-07-29", "attribution": "Catherine Herridge", "status": "hit", "resolution": "Fauci appeared and invoked the Fifth Amendment rather than testify. Rand Paul says the committee will vote on contempt.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-27-AM-capex-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "stocks", "ticker": null, "name": "Hyperscaler capex", "kind": "thesis", "call": "The big five hyperscalers spend north of $600 billion on capex this year, up roughly a third from last year, most of it AI infrastructure.", "direction": "long", "levels": "$600B, up ~33 percent", "due": "2026-12-31", "attribution": "Nate B Jones", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-AM-TSLA-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "investing", "ticker": "$TSLA", "name": "Tesla", "kind": "level", "call": "Tesla hits 300 by Monday July 27, after two candles closed entirely outside the lower Bollinger band.", "direction": "short", "levels": "target 300", "due": "2026-07-27", "attribution": "Stocks with Josh", "status": "expired", "resolution": "Ungraded. The call came due and no Tesla price was reported anywhere, so there is no basis to settle it either way. A sourcing gap rather than a result.", "resolved_edition": "2026-07-27-PM"}, {"id": "2026-07-27-AM-NVDA-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "stocks", "ticker": "$NVDA", "name": "Nvidia", "kind": "thesis", "call": "Nvidia guaranteeing up to $250 billion of OpenAI's Ohio financing is a vendor underwriting its own order book, the Lucent and Nortel structure, so the demand signal stops being independent information.", "direction": "short", "levels": "guarantee up to $250B, project >$500B", "due": "2027-01-31", "attribution": "Douglas Swift", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-AM-MU-2", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "investing", "ticker": "$MU", "name": "Micron", "kind": "thesis", "call": "CXMT's debut does not touch the HBM shortage on any timeline that matters this quarter, so the memory thesis reprices on Samsung's Wednesday print rather than on the Chinese listing.", "direction": "long", "levels": null, "due": "2026-07-29", "attribution": "house", "status": "miss", "resolution": "The repricing did not wait for Samsung. Micron fell 6.1 percent below a trillion dollars on the CXMT debut plus China mass-producing domestic DUV tools, with ASML halted after an 8 percent drop and SanDisk down over 11 percent on a separate Morgan Stanley warning.", "resolved_edition": "2026-07-27-PM"}, {"id": "2026-07-27-AM-MU-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "investing", "ticker": "$MU", "name": "Micron", "kind": "level", "call": "Micron pivots on 906 and 972 after touching 960 overnight, with 991 the neckline to clear and stated targets of 1155 and 1186.", "direction": "long", "levels": "pivot 906/972, neckline 991, targets 1155/1186", "due": "2026-08-29", "attribution": "MentoviaX", "status": "miss", "resolution": "The breakdown invalidated the inverted head-and-shoulders setup outright, breaching the 902 right shoulder rather than triggering off the 991 neckline. The structure the levels described no longer exists, and the working frame is now 902 broken with 955 needed to repair.", "resolved_edition": "2026-07-28-AM"}, {"id": "2026-07-27-AM-MRVL-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "stocks", "ticker": "$MRVL", "name": "Marvell", "kind": "level", "call": "Marvell is down about 37 percent from its June 18 high and Melvin, who bought from $269 through $186, sees little room below $150 and expects earnings to reprice it.", "direction": "long", "levels": "floor ~150, bought 269 to 186", "due": "2026-09-30", "attribution": "Melvin", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-AM-LINK-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "crypto", "ticker": "$LINK", "name": "Chainlink", "kind": "thesis", "call": "Chainlink remains in tatters while its utility case has never been stronger, because price action lags utility in crypto.", "direction": "long", "levels": null, "due": "2026-10-31", "attribution": "Lark Davis", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-AM-GOOGL-2", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "stocks", "ticker": "$GOOGL", "name": "Alphabet", "kind": "catalyst", "call": "The SpaceX stake is marked at $94 billion as of June 30 with $80 billion unlocking in stages to December 8 and SpaceX down about 25 percent in a month, so the mark is stale in the wrong direction.", "direction": "event", "levels": "$94B mark, $80B unlock to Dec 8", "due": "2026-12-08", "attribution": "Ticker Symbol: YOU", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-AM-GOOGL-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "stocks", "ticker": "$GOOGL", "name": "Alphabet", "kind": "thesis", "call": "Alphabet signed $811 billion of future purchase agreements against $332 billion a quarter earlier, with about $200 billion due inside twelve months, and that obligation wall reprices the stock rather than merely worrying it.", "direction": "short", "levels": "obligations $811B, ~$200B due within 12 months", "due": "2026-10-31", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-AM-CXMT-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "macro", "ticker": null, "name": "CXMT", "kind": "thesis", "call": "The shortage driving DRAM and NAND up 60 percent or more per quarter does not end because a new Chinese supplier showed up, because CXMT's wafer output is capped near 290,000 to 320,000 against Samsung's 630,000 and its yields run about 42 percent below their mature process.", "direction": "long", "levels": "output 290-320k/mo, yields ~42 pct below", "due": "2026-12-31", "attribution": "Melvin", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-AM-BTC-2", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "crypto", "ticker": "$BTC", "name": "Bitcoin", "kind": "thesis", "call": "Whether Bitcoin bottoms at $58,000 or makes new lows turns on three factors: Strategy has stabilised, the Fed is open, the CLARITY Act is uncertain.", "direction": "neutral", "levels": "bottom vicinity 58,000", "due": "2026-09-30", "attribution": "Zach Pandl", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-AM-BTC-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "crypto", "ticker": "$BTC", "name": "Bitcoin", "kind": "thesis", "call": "Bitcoin gets rejected at the bear-market resistance band in late July or early August and then declines into an August-to-September window that was red in 2014, 2018 and 2022.", "direction": "short", "levels": "week range 63.7-67, weekly open 64.7", "due": "2026-09-30", "attribution": "Benjamin Cowen", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-AM-APP-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "stocks", "ticker": "$APP", "name": "AppLovin", "kind": "catalyst", "call": "AppLovin reports Q2 on August 5, the first real scorecard on the fully opened ad platform, with the stock down more than 40 percent from its highs.", "direction": "event", "levels": null, "due": "2026-08-05", "attribution": "Milk Road", "status": "hit", "resolution": "Same event as the July 25 entry. The quarter landed, free cash flow conversion fell to 54 percent, buybacks were nearly halved, management anchored long-term growth near 30 percent, and the stock lost a fifth.", "resolved_edition": "2026-08-06-PM"}, {"id": "2026-07-26-PM-oil-1", "date": "2026-07-26", "edition": "2026-07-26-PM", "channel": "macro", "ticker": null, "name": "Oil", "kind": "level", "call": "The oil fund hit $142.50 Thursday on its most overbought reading in three and a half months and should trade down toward roughly $130.", "direction": "short", "levels": "$142.50 high, target ~$130", "due": null, "attribution": "Heisenberg", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-26-PM-iran-1", "date": "2026-07-26", "edition": "2026-07-26-PM", "channel": "macro", "ticker": null, "name": "Patriot interceptor depletion", "kind": "thesis", "call": "The strike halt is a materiel constraint rather than diplomacy: more than 1,200 Patriot interceptors fired at over $4 million each, a stockpile the New York Times reports close to zero, and General Dan Caine warning that resuming major combat would fully deplete CENTCOM inventory.", "direction": "event", "levels": null, "due": "2026-09-30", "attribution": "New York Times via HormuzLetter", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-26-PM-hormuz-1", "date": "2026-07-26", "edition": "2026-07-26-PM", "channel": "stocks", "ticker": null, "name": "Hormuz normalisation", "kind": "catalyst", "call": "A wallet created yesterday put its entire $18,000 balance on Hormuz traffic returning to normal by August 31 for a payout above $121,000, pricing that outcome around 15 cents.", "direction": "event", "levels": "~15 cents", "due": "2026-08-31", "attribution": "Polymarket", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-26-PM-fed-3", "date": "2026-07-26", "edition": "2026-07-26-PM", "channel": "macro", "ticker": null, "name": "Warsh reaction function", "kind": "thesis", "call": "Warsh cannot cut into an oil shock and cannot hike hard into a weakening jobs market, so he holds and lets oil decide. The number that matters is the count of ships rather than the CPI print.", "direction": "neutral", "levels": "payrolls 57k vs 115k est; Sept hike odds ~82%", "due": "2026-09-30", "attribution": "BlackPantherCap", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-26-PM-fed-2", "date": "2026-07-26", "edition": "2026-07-26-PM", "channel": "investing", "ticker": null, "name": "July 29 FOMC statement", "kind": "thesis", "call": "A hold is 85/15 and the statement reading hawkish enough to move the tape is 50/50, revised up from this morning's 70/30 on the hold. The reason to trust the hold over the CME 35 percent is that both sources quoting that hike probability still predict a hold themselves.", "direction": "neutral", "levels": null, "due": "2026-07-29", "attribution": "house", "status": "hit", "resolution": "Hold landed at 85/15 and the statement read hawkish, with Warsh saying there is no soft inflation target because the target is 2 percent.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-26-PM-fed-1", "date": "2026-07-26", "edition": "2026-07-26-PM", "channel": "investing", "ticker": null, "name": "July 29 FOMC", "kind": "catalyst", "call": "Polymarket has 83 percent that the Fed holds Wednesday, up from 75 this morning, while CME futures put a hike at 35 percent against 12 a week ago and September at 80. Kalshi published no rate market.", "direction": "event", "levels": "Polymarket 83% hold vs CME 35% hike", "due": "2026-07-29", "attribution": "Polymarket and CME", "status": "hit", "resolution": "Polymarket's 83 percent hold was right and CME's 35 percent hike was not. Kalshi published a number in the end and had the hold at 74 to 75 on the morning.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-26-PM-clarity-1", "date": "2026-07-26", "edition": "2026-07-26-PM", "channel": "macro", "ticker": null, "name": "CLARITY Act floor vote", "kind": "catalyst", "call": "Representative Bryan Steil says he is optimistic the Senate gets it across the line next week, against Polymarket at 38 percent, and the named obstacle is Trump's own roughly $1.2 billion of crypto earnings with the Moreno bill barring officials but not family.", "direction": "event", "levels": "Steil next week vs Polymarket 38%", "due": "2026-08-07", "attribution": "Bryan Steil", "status": "miss", "resolution": "Steil's optimism did not survive the calendar. Cloture had to be filed today to ripen for a Friday vote and Thune filed on a different motion instead, so the Senate leaves for recess without a floor vote. Polymarket, which he was arguing against, was closer to right than he was.", "resolved_edition": "2026-08-06-PM"}, {"id": "2026-07-26-PM-btc-2", "date": "2026-07-26", "edition": "2026-07-26-PM", "channel": "crypto", "ticker": null, "name": "Bitcoin", "kind": "thesis", "call": "The bottom is good enough rather than confirmed: $57,000 to $58,000 put Bitcoin in the bottom fifth percentile of its valuation history and at total production cost, so accumulate rather than wait. Filmed July 14, and it disagrees with Lark Davis on where the 200-week average sits, roughly $63,000 against 68,500.", "direction": "long", "levels": "200-week ~63k per this source", "due": null, "attribution": "Bitcoin Magazine Pro", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-26-PM-btc-1", "date": "2026-07-26", "edition": "2026-07-26-PM", "channel": "crypto", "ticker": null, "name": "Bitcoin", "kind": "level", "call": "Bitcoin is not safe under $66,000, with a clear path to the realised cap near $54,000 and $58,000 the level that gets it there fast.", "direction": "short", "levels": "under 66k; 58k trigger; 54k target", "due": null, "attribution": "Sykodelic", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-26-PM-NBIS-1", "date": "2026-07-26", "edition": "2026-07-26-PM", "cha ", "resolution": null, "resolved_edition": null}, {"id": "2026-07-26-AM-HOOD-1", "date": "2026-07-26", "edition": "2026-07-26-AM", "channel": "investing", "ticker": "$HOOD", "name": "Robinhood", "kind": "thesis", "call": "Robinhood's chain passed 2 million monthly users and 150 million lifetime transactions, but only about $55 million of stock tokens traded in 24 hours with tokenized GameStop alone at $26.6 million, so the equity-token thesis is thinner than the chain growth.", "direction": "neutral", "levels": null, "due": "2026-07-29", "attribution": "aixbt", "status": "hit", "resolution": "Correct on the shape of it. Event contracts carried the quarter at $156 million while crypto fell 38 percent to $100 million, and no stock-token revenue line was broken out at all.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-26-AM-CXMT-1", "date": "2026-07-26", "edition": "2026-07-26-AM", "channel": "investing", "ticker": null, "name": "CXMT", "kind": "level", "call": "The only market-implied read on the Monday listing is a whale short of 2.10 million units worth $13.04 million, up about $502,000, with $4.32 million of further limit shorts queued and liquidation at $13.45.", "direction": "short", "levels": "liquidation $13.45", "due": "2026-07-27", "attribution": "lookonchain", "status": "miss", "resolution": "The listing ripped 470 percent. The whale went from up $502,000 to short 2.6 million units and down $1.7 million, liquidation reset to $16.91, and a second trader was fully liquidated for $249,000.", "resolved_edition": "2026-07-27-AM"}, {"id": "2026-07-26-AM-CEG-1", "date": "2026-07-26", "edition": "2026-07-26-AM", "channel": "stocks", "ticker": "$CEG", "name": "Constellation Energy", "kind": "thesis", "call": "Constellation is the nuclear AI-energy pick on being the largest US nuclear provider, the Calpine acquisition adding gas, and Microsoft's Three Mile Island restart.", "direction": "long", "levels": null, "due": null, "attribution": "Fin Tek", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-26-AM-AMD-1", "date": "2026-07-26", "edition": "2026-07-26-AM", "channel": "stocks", "ticker": "$AMD", "name": "AMD", "kind": "level", "call": "Baird's Tristan Gerra doubled his target to $1,250 from $625, modelling $147 billion of AI GPU revenue by 2030 at 15 percent share against a $1.4 trillion accelerator market.", "direction": "long", "levels": "target $1,250", "due": "2027-12-31", "attribution": "Baird", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-25-PM-supercycle-1", "date": "2026-07-25", "edition": "2026-07-25-PM", "channel": "stocks", "ticker": null, "name": "AI capex supercycle", "kind": "thesis", "call": "No capex slowdown until 2030, with robotics extending it, and the only kill switch is the agentic economy failing to broaden beyond coding.", "direction": "long", "levels": null, "due": "2030-12-31", "attribution": "Milk Road AI", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-25-PM-memory-1", "date": "2026-07-25", "edition": "2026-07-25-PM", "channel": "stocks", "ticker": "$MU", "name": "Memory complex", "kind": "thesis", "call": "Memory multiples expand before they compress, revised back UP to 60/40 on 2026-08-05 after South Korean media reported CXMT refused Apple's request for mobile DRAM price cuts and insisted on prices at or above Samsung and SK Hynix, which is margin-seeking rather than share-seeking behaviour. Note the report is single-sourced and publicly contested. Was revised DOWN to 55/45 on 2026-08-03 from 65/35 after Reuters reported CXMT is considering a second Beijing DRAM fab taking its capacity past 600,000 wafers a month. Originally at roughly 65/35, because Micron has 14 take-or-pay agreements worth about $100 billion at floor prices covering roughly 20 percent of DRAM volume, which is a structural answer to the cycle turning. Reaffirmed at 65/35 on 2026-07-29 after the Fed and CXMT both landed. The trigger that flips it is ASML order detail rather than price action. Original reasoning: CXMT and the Fed are catalysts this week while linear attention is a two-year mechanism.", "direction": "long", "levels": "$SKHY ~4x, $MU ~6x, $SNDK ~7x 2027 earnings", "due": "2026-12-31", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null, "revised_edition": "2026-07-29-PM"}, {"id": "2026-07-25-PM-medtech-1", "date": "2026-07-25", "edition": "2026-07-25-PM", "channel": "stocks", "ticker": null, "name": "Medical devices", "kind": "thesis", "call": "Five medical-device buys and one wait: ABT at 16 times, DHR after a 14 percent drop on a beat-and-raise, ISRG down 17 percent on delivering 18 percent growth against a 14 guide, BSX down 50 percent on an 8-versus-10 trim, EW at $84 targeting $100, and MDT a wait.", "direction": "long", "levels": "sector on 5-6% cash-flow yields at a 20-30% discount to the S&P", "due": "2027-07-25", "attribution": "Bill Alpert (Barron's)", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-25-PM-iran-1", "date": "2026-07-25", "edition": "2026-07-25-PM", "channel": "news", "ticker": null, "name": "Iran strike", "kind": "catalyst", "call": "Polymarket puts a US or Israeli strike on Iran by July 31 at 55 percent, with Bahrain and Kuwait having already sent jets into Iran.", "direction": "event", "levels": "55% by Jul 31", "due": "2026-07-31", "attribution": "Polymarket", "status": "miss", "resolution": "Trump approved strikes and then halted them, hours after Oman-mediated talks on reopening Hormuz resumed and reportedly made progress. The live market flipped to 54 percent that the two sides extend their 60-day negotiation window instead.", "resolved_edition": "2026-07-26-AM"}, {"id": "2026-07-25-PM-flash-1", "date": "2026-07-25", "edition": "2026-07-25-PM", "channel": "stocks", "ticker": null, "name": "Flash and Phison", "kind": "thesis", "call": "Long flash broadly and Phison specifically as the substitute for DRAM, with the trigger stated as selling DRAM once flash visibly takes DRAM's job.", "direction": "long", "levels": null, "due": null, "attribution": "Bubble Boi", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-25-PM-fed-2", "date": "2026-07-25", "edition": "2026-07-25-PM", "channel": "macro", "ticker": null, "name": "Waller hike path", "kind": "thesis", "call": "The risk is Waller rather than Warsh: one hike and done is survivable, a signalled series of hikes is not.", "direction": "short", "levels": null, "due": "2026-09-30", "attribution": "Milk Road", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-25-PM-fed-1", "date": "2026-07-25", "edition": "2026-07-25-PM", "channel": "investing", "ticker": null, "name": "July 29 FOMC", "kind": "catalyst", "call": "CME futures price a 38 percent chance of a quarter-point hike on July 29, up from 13 percent a week earlier, against Polymarket at 25 percent and a cut at zero in both.", "direction": "event", "levels": "CME 38% hike, Polymarket 25% hike, 0% cut", "due": "2026-07-29", "attribution": "CME via the Financial Times", "status": "hit", "resolution": "No hike. The zero cut probability was right and CME's 38 percent hike was on the wrong side of the outcome.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-25-PM-dram-1", "date": "2026-07-25", "edition": "2026-07-25-PM", "channel": "stocks", "ticker": "$MU", "name": "Commodity DRAM", "kind": "thesis", "call": "Kimi's linear attention makes the KV cache a fixed size instead of growing with context, so commodity DRAM demand per user falls and the incremental server rack loses its justification. HBM is exempt and the impact is about two years out.", "direction": "short", "levels": null, "due": "2028-07-25", "attribution": "Bubble Boi", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-25-PM-cxmt-1", "date": "2026-07-25", "edition": "2026-07-2 rgin, and the stock fell about 19 percent with five sell-side targets cut.", "resolved_edition": "2026-08-06-PM"}, {"id": "2026-07-24-PM-btc-1", "date": "2026-07-24", "edition": "2026-07-24-PM", "channel": "investing", "ticker": null, "name": "Bitcoin", "kind": "level", "call": "Bitcoin needs $66,000 held on the weekly or the $60,500 test comes into play.", "direction": "neutral", "levels": "hold 66,000 weekly; downside test 60,500", "due": null, "attribution": "Sykodelic", "status": "miss", "resolution": "Bitcoin traded near $64,100 into the weekend, already below the 66,000 line the call required, and the operative level has moved down to the ~63,000 moving averages.", "resolved_edition": "2026-07-25-AM"}, {"id": "2026-07-24-PM-TSLA-2", "date": "2026-07-24", "edition": "2026-07-24-PM", "channel": "stocks", "ticker": "$TSLA", "name": "Tesla", "kind": "level", "call": "Calling a low in Tesla at 300, on the argument that roughly 12 times sales is cheaper than Apple at the same multiple.", "direction": "long", "levels": "low call at 300", "due": null, "attribution": "TicTocTick", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-24-PM-TSLA-1", "date": "2026-07-24", "edition": "2026-07-24-PM", "channel": "stocks", "ticker": "$TSLA", "name": "Tesla", "kind": "level", "call": "Tesla breaking 321 was no good signal and the crash is accelerating, with 286-292 the technical destination and 321/332 flipped to resistance.", "direction": "short", "levels": "downside target 286-292; resistance 321/332", "due": null, "attribution": "Mentovia", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-24-PM-MU-2", "date": "2026-07-24", "edition": "2026-07-24-PM", "channel": "stocks", "ticker": "$MU", "name": "Micron", "kind": "thesis", "call": "Micron is the consensus dip-buy at 12 times trailing and roughly 6 times forward earnings with a 75 percent EBITDA margin, with hyperscaler earnings in the next one to two weeks the mom

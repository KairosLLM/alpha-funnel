/* Alpha Funnel — Investing reader. Light by default; dark via [data-theme="dark"]. */
:root{
  --bg:#fbfaf7; --card:#ffffff; --ink:#1b1b1a; --muted:#6f6c66; --faint:#767267;
  --line:#e7e4dd; --line2:#efece6; --accent:#1f5fa6; --accent-soft:#eaf1fa;
  --on-accent:#ffffff;
  --zoom:#9a6b00; --zoom-bg:#fbf2dc; --chip:#f1efe9; --chip-ink:#4a4843;
  --maxw:720px;
  --serif:"Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0f1115; --card:#161922; --ink:#e7e9ee; --muted:#9aa3b2; --faint:#838b9a;
  --line:#262b39; --line2:#20242f; --accent:#5b9cff; --accent-soft:#16243c;
  --on-accent:#0f1115;
  --zoom:#ffd479; --zoom-bg:#2a2414; --chip:#1c2030; --chip-ink:#aab2c2;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font:17px/1.65 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
/* visible keyboard focus for all interactive elements */
a:focus-visible,button:focus-visible,.chip:focus-visible,
.scard:focus-visible,.row:focus-visible,.featured:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  .scard:hover{transform:none}
}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px 140px}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:15px;line-height:1.7}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;padding:22px 0 16px;flex-wrap:wrap;
  position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
a.brand{font-weight:700;letter-spacing:.2px;color:var(--ink);cursor:pointer}
a.brand:hover{text-decoration:none;opacity:.62}
.brand-sub{color:var(--faint);font-weight:500}
/* the channel nav must never set the page width: on narrow screens it slides
   sideways (scrollbar hidden) while the article body fits the viewport */
.chan-nav{display:flex;align-items:center;gap:2px;min-width:0;max-width:100%;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chan-nav::-webkit-scrollbar{display:none}
.chan-nav .sep{color:var(--faint);font-weight:400;pointer-events:none;margin:0 1px}
.chan-nav .chan{font-size:14.5px;color:var(--muted);padding:2px 9px;border-radius:7px;cursor:pointer;white-space:nowrap}
.chan-nav .chan:hover{color:var(--ink);text-decoration:none;background:var(--chip)}
.chan-nav .chan.active{color:var(--ink);font-weight:600}
.back{display:inline-block;font-size:15px;color:var(--muted);margin:2px 0 4px}
.back:hover{color:var(--ink);text-decoration:none}
.spacer{flex:1}
.x-link{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
  border-radius:9px;color:var(--ink)}
.x-link:hover{opacity:.6;text-decoration:none}
.theme-toggle{border:1px solid var(--line);background:var(--card);color:var(--muted);
  width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:15px;line-height:1;padding:0}
.theme-toggle:hover{color:var(--ink);border-color:var(--faint)}
.t-ico::before{content:"☾"}
:root[data-theme="dark"] .t-ico::before{content:"☀"}
.topbar.minimal{border-bottom:none}

/* splash / home — three long full-width cards stacked vertically, filling one viewport
   (no scroll on desktop). Card: channel name + date on the left, full headline on the right. */
.wrap.splash{min-height:100dvh;display:flex;flex-direction:column;padding-bottom:22px;overflow:visible}
.splash-main{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center;padding:4px 0}
.splash-inner{width:100%}
.splash-cards{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.scard{display:flex;align-items:center;gap:26px;padding:20px 28px;
  border:1px solid var(--line);border-radius:16px;overflow:hidden;
  background:var(--card);color:var(--ink);
  transition:border-color .15s ease,transform .15s ease,box-shadow .15s ease}
.scard:hover{border-color:var(--faint);transform:translateY(-2px);text-decoration:none;
  box-shadow:0 12px 30px rgba(20,18,14,.09)}
:root[data-theme="dark"] .scard:hover{box-shadow:0 12px 30px rgba(0,0,0,.4)}
.scard .s-meta{flex:0 0 190px;display:flex;flex-direction:column;gap:3px}
.scard .s-name{font-weight:700;font-size:21px;letter-spacing:.2px}
.scard .s-date{color:var(--muted);font-size:13.5px;font-weight:500}
/* reserve 3 lines so every card is the same height regardless of headline length */
.scard .s-head{flex:1;min-width:0;font:400 22px/1.35 var(--serif);color:var(--ink);min-height:4.05em;overflow-wrap:break-word}
.scard-empty{opacity:.55;cursor:default}
/* splash: one-line link to the week's Deep-Dive, tucked under a channel card */
.scard-wrap{display:flex;flex-direction:column}
.s-dd{display:flex;align-items:center;gap:9px;margin:5px 6px 0;padding:2px 22px;
  font-size:13.5px;font-weight:500;color:var(--muted);min-width:0}
.s-dd:hover{text-decoration:none;color:var(--ink)}
.s-dd .s-dd-head{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.s-dd .s-dd-date{flex:0 0 auto;font-size:12px;color:var(--muted);white-space:nowrap}
.s-dd-arrow{color:var(--accent);flex:0 0 auto}
.splash-foot{display:flex;justify-content:flex-end;margin-top:12px}
.whatis{border:1px solid var(--line);background:var(--card);color:var(--muted);
  font:500 13px var(--sans);padding:7px 13px;border-radius:9px;cursor:pointer}
.whatis:hover{color:var(--ink);border-color:var(--faint)}
@media(max-width:640px){
  .wrap.splash{height:auto;min-height:100dvh;overflow:visible}
  .splash-main{padding:16px 0}
  .scard{flex-direction:column;align-items:flex-start;gap:10px;padding:16px 18px}
  .scard .s-meta{flex:none}
  .scard .s-head{font-size:19px;min-height:0}
}

/* week-long Deep-Dive pin: compact card under the featured daily (channel list) */
.pin-dd{display:flex;align-items:baseline;gap:16px;padding:14px 20px;margin:-4px 0 30px;
  border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit}
.pin-dd:hover{border-color:var(--faint);text-decoration:none}
.pin-dd:hover .pin-title{color:var(--accent)}
.pin-kicker{flex:0 0 auto;display:flex;align-items:center;gap:8px;color:var(--muted);
  font-size:13px;font-weight:500;white-space:nowrap}
.pin-title{flex:1;font:400 17.5px/1.4 var(--serif);color:var(--ink);
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pin-arrow{color:var(--accent);font-size:15px;flex:0 0 auto}
@media(max-width:640px){
  .pin-dd{flex-direction:column;gap:6px;padding:12px 14px}
  .pin-title{white-space:normal}
}

/* filters */
.filters{border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:16px 0 18px;margin-bottom:34px}
.filter-group{display:flex;align-items:baseline;gap:12px;margin:8px 0}
.filter-label{flex:0 0 58px;font-size:12px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--faint);padding-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:inherit;font-size:13px;padding:4px 11px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--chip);color:var(--chip-ink);white-space:nowrap}
.chip:hover{border-color:var(--faint);color:var(--ink)}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.active .ct{color:color-mix(in srgb,var(--on-accent) 72%,transparent)}
.chip .ct{color:var(--faint)}
.chip.more{background:transparent;border-style:dashed;color:var(--muted)}
.filter-note{margin-top:14px;font-size:14px;color:var(--muted)}
.filter-note strong{color:var(--ink)}
.clear{font:inherit;font-size:13px;margin-left:8px;border:none;background:none;color:var(--accent);cursor:pointer}
.clear:hover{text-decoration:underline}

/* featured (latest) */
.featured{display:block;color:inherit;padding:4px 0 30px;margin-bottom:28px;
  border-bottom:1px solid var(--line)}
.featured:hover{text-decoration:none}
.kicker{font-size:12.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--faint);margin-bottom:12px}
.f-title{font:600 33px/1.18 var(--serif);margin:0 0 14px;letter-spacing:-.01em}
.featured:hover .f-title{color:var(--accent)}
.f-sub{font-size:18px;line-height:1.55;color:var(--muted);margin:0 0 16px;max-width:62ch}
.f-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tg{font-size:12px;color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
a.tg:hover{color:var(--ink);border-color:var(--faint);text-decoration:none}
.keepreading{font-size:15px;color:var(--accent);font-weight:500}

/* the dated list */
.list{display:flex;flex-direction:column}
.row{display:flex;gap:18px;align-items:baseline;color:inherit;padding:13px 0;
  border-bottom:1px solid var(--line2)}
.row:hover{text-decoration:none}
.r-date{flex:0 0 92px;font-size:13.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.r-title{font:500 18px/1.4 var(--serif)}
.row:hover .r-title{color:var(--accent)}

/* reading view */
.read .topbar{margin-bottom:6px}
.article{padding-top:8px}
.a-title{font:600 32px/1.2 var(--serif);margin:6px 0 14px;letter-spacing:-.01em}
.a-sub{font-size:18px;line-height:1.55;color:var(--muted);margin:0 0 16px;max-width:62ch}
.a-tags{display:flex;flex-wrap:wrap;gap:6px}
.article hr{border:none;border-top:1px solid var(--line);margin:22px 0 6px}

/* "In this edition" jump list */
.toc{border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:2px 0 26px;background:var(--card)}
.toc-h{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint);margin-bottom:8px}
.toc ul{margin:0;padding-left:18px}
.toc li{margin:5px 0}
.toc a{color:var(--muted);font-size:15px}
.toc a:hover{color:var(--ink)}

/* rendered markdown body */
.body{font-size:17px;max-width:68ch}
.body > p[id]{scroll-margin-top:76px}   /* clear the sticky topbar when jumping to a section */
.body h2{font:600 21px/1.3 var(--serif);margin:34px 0 12px;padding-top:18px;border-top:1px solid var(--line)}
.body h3{font:600 17px/1.35 var(--sans);margin:22px 0 8px;color:var(--ink)}
.body p{margin:14px 0}
.body ul{padding-left:22px}.body li{margin:7px 0}
.body strong{color:var(--ink);font-weight:680}
.body em{color:var(--muted)}
.body hr{border:none;border-top:1px solid var(--line);margin:26px 0}
.body blockquote{border-left:3px solid var(--line);margin:14px 0;padding:2px 16px;color:var(--muted)}
.body code{background:var(--chip);padding:1px 6px;border-radius:5px;font-size:.9em}
.body table{border-collapse:collapse;margin:16px 0;font-size:15px;display:block;overflow-x:auto}
.body th{text-align:left;font:600 11.5px var(--sans);text-transform:uppercase;letter-spacing:.6px;
  color:var(--faint);padding:6px 14px 6px 0;border-bottom:1px solid var(--line)}
.body td{padding:7px 14px 7px 0;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums}

/* links inside the body */
.xlink{color:var(--accent);border-bottom:1px dashed var(--accent)}
a.cite-zoom{color:var(--zoom);border-bottom:1px dotted var(--zoom);cursor:zoom-in;padding:0 1px}
a.cite-zoom::after{content:"⊕";font-size:.72em;vertical-align:super;margin-left:2px;opacity:.85}
a.cite-zoom:hover{background:var(--zoom-bg);text-decoration:none}
a.cite-plain{color:var(--accent);text-decoration:underline;
  text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent);text-underline-offset:2px}
/* $CASHTAGs in the body — scannable, but distinct from links (no underline) */
.cashtag{font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums;
  background:var(--chip);border-radius:4px;padding:0 3px}

/* deep-dive drawer */
.drawer{position:fixed;top:0;right:0;height:100dvh;width:min(560px,94vw);z-index:40;
  background:var(--card);border-left:1px solid var(--line);transform:translateX(100%);
  transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-24px 0 60px rgba(0,0,0,.16)}
:root[data-theme="dark"] .drawer{box-shadow:-24px 0 60px rgba(0,0,0,.5)}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer-tag{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:var(--on-accent);background:var(--accent);padding:3px 9px;border-radius:6px}
.drawer-source{font-size:13px;color:var(--muted)}
.drawer-close{margin-left:auto;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
.drawer-close:hover{color:var(--ink)}
.drawer-body{overflow:auto;padding:20px 24px 70px;flex:1;font-size:16px}
.drawer-body h1{font:600 21px/1.3 var(--serif)}
.drawer-body h2{font:600 17px/1.35 var(--serif);margin:20px 0 8px}
.drawer-body h3{font-size:15px}
.drawer-body code{background:var(--chip);padding:2px 6px;border-radius:5px;color:var(--zoom);
  user-select:all;display:inline-block;margin-top:6px}
.scrim{position:fixed;inset:0;background:rgba(20,18,14,.32);z-index:35}
:root[data-theme="dark"] .scrim{background:rgba(0,0,0,.5)}

/* ---- Pass-3 features: a11y, search, shortcuts, markers, progress, share ---- */
/* skip link + screen-reader-only + no ugly ring on the focused main landmark */
.skip{position:fixed;top:-48px;left:10px;z-index:70;background:var(--accent);color:var(--on-accent);
  padding:8px 14px;border-radius:8px;font:600 14px var(--sans);transition:top .15s ease}
.skip:focus{top:10px;text-decoration:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
#main:focus{outline:none}
/* reading-progress bar */
#readbar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:60;transition:width .12s linear}
/* "new since last visit" dots */
.ndot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);vertical-align:middle}
.chan .ndot{width:6px;height:6px;margin-left:5px}
/* Deep-Dive edition badge (the week's featured Sunday memo) */
.dd-badge{display:inline-block;font:600 10px/1.7 var(--sans);letter-spacing:.7px;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:0 8px;
  vertical-align:middle;white-space:nowrap}
/* topbar icon button (search) matches the theme toggle */
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--muted);
  width:34px;height:34px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.icon-btn:hover{color:var(--ink);border-color:var(--faint)}
/* search drawer */
.search-input{width:100%;font:400 16px var(--sans);padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--bg);color:var(--ink)}
.search-input:focus{outline:none;border-color:var(--accent)}
.search-results{margin-top:12px;display:flex;flex-direction:column}
.sr-row{display:flex;flex-direction:column;gap:2px;padding:10px 2px;border-bottom:1px solid var(--line2);color:inherit}
.sr-row:hover{text-decoration:none}
.sr-row:hover .sr-title{color:var(--accent)}
.sr-meta{font-size:12px;color:var(--muted)}
.sr-title{font:500 15px/1.35 var(--serif)}
/* shortcuts help */
.kbd-list{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:baseline;margin:6px 0}
.kbd-list dt{margin:0}.kbd-list dd{margin:0;color:var(--muted);font-size:14px}
kbd{font:600 12px var(--sans);background:var(--chip);color:var(--ink);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:6px;padding:2px 7px;white-space:nowrap}
.wi-tip{font-size:13px;color:var(--muted)}
/* clickable body cashtags */
.cashtag.clickable{cursor:pointer}
.cashtag.clickable:hover{color:var(--accent)}
.cashtag.clickable:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* share button in the reading-view kicker */
.article .kicker{display:flex;align-items:center;gap:10px}
.share-btn{margin-left:auto;border:1px solid var(--line);background:var(--card);color:var(--muted);
  font:600 12px var(--sans);letter-spacing:normal;text-transform:none;padding:5px 12px;border-radius:8px;cursor:pointer}
.share-btn:hover{color:var(--ink);border-color:var(--faint)}
/* scroll-spy active TOC entry */
.toc a.active{color:var(--ink);font-weight:600}

/* print: strip the chrome, keep the article, surface citation URLs on paper */
@media print{
  .topbar,.chan-nav,.filters,.edition-nav,.toc,.sub-btn,.icon-btn,.theme-toggle,.x-link,
  .back,.drawer,.scrim,.skip,#readbar,.share-btn,.splash-foot{display:none!important}
  html,body{background:#fff;color:#000}
  .wrap{max-width:none;padding:0}
  a{color:#000}
  .body a[href^="http"]::after{content:" (" attr(href) ")";font-size:.82em;color:#444}
  .cashtag{background:none;padding:0}
  .body h2,.a-title{break-after:avoid}
}

/* subscribe button (topbar) */
.sub-btn{border:1px solid var(--line);background:var(--card);color:var(--muted);
  font:600 12.5px var(--sans);padding:6px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.sub-btn:hover{color:var(--ink);border-color:var(--faint)}

/* subscribe drawer contents */
.sub-list{display:flex;flex-direction:column;gap:8px;margin:16px 0 6px}
.sub-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);
  border-radius:10px;padding:10px 12px}
.sub-row-main{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.sub-name{font-weight:600;font-size:14px}
.sub-url{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub-copy{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--ink);
  font:600 12px var(--sans);padding:5px 12px;border-radius:8px;cursor:pointer}
.sub-copy:hover{border-color:var(--faint)}
.sub-copy.done{color:var(--accent);border-color:var(--accent)}
.sub-hint{font-size:13px;color:var(--muted);margin-top:12px}

/* prev/next edition nav (reading view) */
.edition-nav{display:flex;justify-content:space-between;gap:16px;margin:36px 0 0;
  padding-top:18px;border-top:1px solid var(--line)}
.edition-nav a{font-size:14px;color:var(--muted)}
.edition-nav a:hover{color:var(--ink);text-decoration:none}
.edition-nav .ed-next{margin-left:auto;text-align:right}

@media (max-width:560px){
  .f-title{font-size:27px}.a-title{font-size:26px}
  .r-date{flex-basis:78px}
  .filter-group{flex-direction:column;gap:6px}
}

/* ---------- entity thread (cross-channel history) ---------- */
.thread-head{margin:6px 0 18px}
.th-title{font:600 30px/1.2 var(--serif);color:var(--ink);margin:2px 0 6px;word-break:break-word}
.th-meta{font-size:13.5px;color:var(--muted)}
.thread-list{border-top:1px solid var(--line)}
.th-row{display:flex;gap:16px;align-items:baseline;color:inherit;padding:13px 2px;
  border-bottom:1px solid var(--line2)}
.th-row:hover{text-decoration:none}
.th-row:hover .th-head{color:var(--accent)}
.th-date{flex:0 0 118px;font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.th-ch{flex:0 0 84px;font:600 10.5px/1.6 var(--sans);letter-spacing:.5px;text-transform:uppercase;
  color:var(--muted)}
.th-ch-investing{color:var(--accent)}
.th-head{flex:1;min-width:0;font:500 17px/1.4 var(--serif)}
@media (max-width:560px){
  .th-row{flex-wrap:wrap;gap:4px 12px}
  .th-head{flex-basis:100%}
}

/* reading-view "Tracked" entity row */
.mentions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 0}
.mentions-label{font:600 10.5px/1 var(--sans);letter-spacing:.7px;text-transform:uppercase;color:var(--faint)}
.ment{font-size:12.5px;color:var(--accent);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.ment:hover{border-color:var(--accent);background:var(--accent-soft);text-decoration:none}

.thread-link{color:var(--accent);margin-left:2px}
.thread-link:hover{text-decoration:underline}

/* ---------- rising / cooling strip ---------- */
.rising{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 22px;
  padding:12px 0 0;border-top:1px solid var(--line2)}
.rising-label{font:600 10.5px/1 var(--sans);letter-spacing:.7px;text-transform:uppercase;color:var(--faint)}
.rising-label.cool{margin-left:10px}
.rise{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink);
  border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.rise:hover{border-color:var(--faint);text-decoration:none}
.rise-d{font:600 11px var(--sans);font-variant-numeric:tabular-nums}
.rise.up .rise-d{color:#2f8f4e}
.rise.dn{color:var(--muted)}
.rise.dn .rise-d{color:#b4553b}
:root[data-theme="dark"] .rise.up .rise-d{color:#57c07a}
:root[data-theme="dark"] .rise.dn .rise-d{color:#e0785c}

/* ---------- search snippets ---------- */
.sr-count{font-size:12px;color:var(--muted);margin:2px 0 8px}
.sr-snip{font-size:12.5px;line-height:1.5;color:var(--muted);margin-top:2px}
.sr-snip mark{background:var(--accent-soft);color:var(--ink);border-radius:3px;padding:0 2px}

/* ---------- entity thread excerpts (what was actually said) ---------- */
.th-ex{display:block;font:400 15.5px/1.5 var(--serif);color:var(--ink)}
.th-from{display:block;font:400 12.5px/1.5 var(--sans);color:var(--faint);margin-top:3px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.th-row:hover .th-ex{color:var(--accent)}
.th-row:hover .th-from{color:var(--muted)}

/* ---------- scoreboard (the calls ledger) ---------- */
.sc-stats{display:flex;flex-wrap:wrap;gap:18px;margin:14px 0 4px}
.sc-stat{font-size:14px;color:var(--muted)}
.sc-stat strong{color:var(--ink);font-variant-numeric:tabular-nums;font-size:16px;margin-right:5px}
.sc-section{margin:26px 0 0}
.sc-h{font:600 13px/1 var(--sans);letter-spacing:.8px;text-transform:uppercase;color:var(--faint);
  margin:0 0 4px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sc-row{padding:14px 2px;border-bottom:1px solid var(--line2)}
.sc-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.sc-badge{font:700 10px/1.7 var(--sans);letter-spacing:.7px;text-transform:uppercase;
  border-radius:999px;padding:0 8px;white-space:nowrap}
.sc-open{color:var(--accent);background:var(--accent-soft)}
.sc-hit{color:#2f8f4e;background:#e7f4ec}
.sc-miss{color:#b4553b;background:#f9ece7}
.sc-expired{color:var(--muted);background:var(--chip)}
:root[data-theme="dark"] .sc-hit{color:#57c07a;background:#15271c}
:root[data-theme="dark"] .sc-miss{color:#e0785c;background:#2b1a14}
.sc-tick{font:650 14px var(--sans);color:var(--ink);background:var(--chip);border-radius:4px;padding:0 5px}
a.sc-tick:hover{color:var(--accent);text-decoration:none}
.sc-date{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.sc-attr{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.sc-attr.sc-house{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.sc-due{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sc-due.soon{color:#b4553b;font-weight:600}
:root[data-theme="dark"] .sc-due.soon{color:#e0785c}
.sc-call{font:400 16.5px/1.5 var(--serif);color:var(--ink);margin-top:7px;max-width:66ch}
.sc-levels{display:inline-block;font:500 12.5px var(--sans);color:var(--muted);background:var(--chip);
  border-radius:6px;padding:2px 8px;margin-top:7px;font-variant-numeric:tabular-nums}
.sc-res{font-size:14px;line-height:1.55;color:var(--muted);margin-top:6px;max-width:66ch}
.sc-st-hit .sc-call,.sc-st-miss .sc-call,.sc-st-expired .sc-call{color:var(--muted)}
.sc-resed{color:var(--faint);font-size:12px}

SLA": "\u2026Michael Burry published his book with the levels attached: short $NVDA at $198, $MU at $1,051, $AMAT at $729, $TSLA at $416, $SOXX at $642 and $PLTR at $161, verdict \"WE ARE NEAR A MAJOR TOP AND POSSIBLY A 1987-TYPE FALL.\" Per NoLimitGains on the Stocks list, the S&P is up more than 100 percent since\u2026", "$WDC": "Then the tape reversed it. Per ripster47 on the Financial Markets list, $SNDK, $WDC and $MU were all bought at the open."}, "body": "**Headline:** SpaceX's tradable float tripled today, and AppLovin grew 53 percent and lost a fifth\n**Subtitle:** Up to 911.5 million shares came free at once, more than 140 percent of the public float, while the S&P printed another record high on the largest option-call volume ever recorded.\n**Topics:** ai-infra, semis, healthcare, consumer, etfs\n\nYesterday AMD beat and fell ten percent. Today AppLovin grew revenue 53 percent at an 84 percent margin and fell twenty. Two sessions, one verdict: beating stopped being the bar.\n\n**Market context.** The index does not know any of that. Per the [Kalshi list](https://read.readwise.io/read/01kzbpzyzjw6z36caxbw4yy9dc), the **S&P printed a new all-time high at 7,730** today, its twenty-fifth record of the year, and Kalshi puts 8,000 before year end at 70 percent. Tom Lee wants 7,900 to 8,000 this month, UBS 8,100 by December.\n\nHow it got there is the part to hold onto. Per the [Financial Markets list](https://read.readwise.io/read/01kzbq27hdvemwev13pnc9srvg), the Kobeissi Letter counted **a record 4.0 million S&P call contracts on Tuesday**, against a 700,000 daily average in 2020 and 2021. The put-to-call skew posted **its largest two-day decline since 2017**. Mr Derivatives supplied the necessary commentary: \"Wowzers! What can possssssibly go wrong here?!\"\n\nLeadership underneath is thin. $GOOGL fell about 3.5 percent on the DeepMind reshuffle, and per [Stocks with Josh](https://read.readwise.io/read/01kzc3473ctcvhamhgq1j44j9m) the level that matters is **$SPY 686**, which has held all week. A loss of it opens 629.\n\n**The scoreboard.**\n- **Miss, cleanly.** On Tuesday I went 55/45 that SpaceX trades higher today than it closed that night. It is down double digits into the unlock. I said I was trading the mechanics, and the mechanics are what beat me.\n- **Resolved on the date.** The August 6 lockup I have been flagging since July 16 arrived as advertised: **911.5 million shares, more than 140 percent of the public float.**\n- **Resolved, and the quarter was not the problem.** AppLovin reported August 5 as the scorecard I said it would be. Revenue grew 53 percent and the stock lost a fifth.\n- **Standing.** My 60/40 that AMD trades above yesterday's after-hours level in a month. It sits at $472, with [Jose Najarro](https://read.readwise.io/read/01kzc42tnassb5pxq247gz49f3) raising his target to $750 on $25 of EPS at 30 times forward, and Burry short the complex.\n\n**1. SpaceX's float went from 5 percent to 20 percent in one morning.** Per the [Financial Markets list](https://read.readwise.io/read/01kzbq27hdvemwev13pnc9srvg), **over $100 billion of $SPCX shares unlocked today.** Per the [People to follow list](https://read.readwise.io/read/01kzbqjkx1eb2sp2xdsad03msh), here is the rest of the queue.\n\n| $SPCX unlock schedule | Share of supply |\n|---|---|\n| August 6, from a 5 percent IPO float | about 7 percent, taking tradable to 20 percent |\n| August 21 through December 9 | about 29 percent more, reaching 40 percent |\n| June 2027 | Musk eligible, about 46 percent |\n\nThe print underneath was good and nobody cared. Per [Ticker Symbol YOU](https://read.readwise.io/read/01kzc37w7ffrdb12g72r9sn8g8), revenue was **$7.81 billion, up 92 percent, against a $6.93 billion estimate**, with EPS of $0.09 against an expected 26-cent loss. Then capex landed just under **$18.5 billion, 39 percent above expectations**, or $2.35 spent per dollar of revenue, with no 2027 guidance at all.\n\nThe stock closed at its lowest price in history yesterday, having shed roughly **$1.6 trillion of market value since June's high**, per Barchart on the [Financial Markets list](https://read.readwise.io/read/01kza9xv6c6gz5yxwqf58nqayg). Morgan Stanley still carries a $300 target.\n\nThe honest comparable is Meta in 2012, down about 50 percent at the 91-day lockup and still down 36 percent a year later. Own it as a compute business with a supply problem that runs four more months.\n\n**2. AppLovin grew 53 percent, printed an 84 percent margin, and lost a fifth of its value.** Per Daniel Koss on the [Stocks list](https://read.readwise.io/read/01kzbq85c6ezqertgbvvkqz3j8), the quarter was **$1.92 billion of revenue, up 53 percent, with $1.61 billion of adjusted EBITDA at an 84 percent margin**, and the stock fell 19 percent before the bell.\n\nWhat broke is smaller and more specific. Per VanquishTrader on the [People to follow list](https://read.readwise.io/read/01kzbqjkx1eb2sp2xdsad03msh), free cash flow conversion **fell to 54 percent**, buybacks were **nearly halved**, and management anchored long-term growth **closer to 30 percent** rather than the 50s. UBS blames a delayed ad-model upgrade and a slow nonendemic ramp, and kept a Buy.\n\nThe sell side did not.\n\n| $APP price target | From | To |\n|---|---|---|\n| Piper Sandler, to Neutral | $665 | $385 |\n| Scotiabank | $775 | $515 |\n| Jefferies, RBC and BTIG | $640 to $700 | $550 to $575 |\n\nAt 24 times forward earnings on a 0.5 PEG, this is a company repriced for decelerating rather than for missing, and the SEC overhang came off in the same quarter. I am 60/40 that $APP is higher in three months.\n\n**3. Memory got taken apart at 4am and bought back at the open.** Per the [Stocks list](https://read.readwise.io/read/01kzbq85c6ezqertgbvvkqz3j8), $MU fell 29 percent in July, its **worst month since June 2005**, after a 189 percent year, and sits under $900 with Korea down another 5 percent overnight. Jefferies cut $SNDK from **$3,000 to $1,750**, a 42 percent haircut, with Citi to $2,100 and Mizuho to $1,900. RBC went the other way, up to $1,300.\n\nThen the tape reversed it. Per ripster47 on the [Financial Markets list](https://read.readwise.io/read/01kzbq27hdvemwev13pnc9srvg), $SNDK, $WDC and $MU were all bought at the open.\n\nThe reason to fade the panic is contractual. Per [Milk Road AI](https://read.readwise.io/read/01kzbwnynyz2cn7xfb6e0mww55), Bernstein models roughly **35 percent of all memory bits shipped between 2027 and 2029 as locked into take-or-pay contracts** (the buyer pays whether or not it takes delivery) at a floor of **$0.26 per gigabyte against a $0.29 spot**. Micron has taken **$22 billion of customer prepayments for chips it has not made** across 16 agreements, and its last quarter was $41.6 billion at an **81.2 percent operating margin**.\n\nSpot can crack. A take-or-pay floor on a third of three years of supply cannot crack the same way, and I am holding 60/40 that multiples expand before they compress. Dylan Patel, on the [Hermes list](https://read.readwise.io/read/01kzbq20xvf0kjr4sp863kwry8), explains the premium better than any model: Micron trades above SK Hynix because \"corporate governance exists.\"\n\n**4. Eli Lilly put up $23 billion and is losing the pill race it invented.** Per [Milk Road](https://read.readwise.io/read/01kzbwnysyhaqgf01r9ys41kqw), $LLY reported **$23 billion of revenue against $20.7 billion expected, up 48 percent year over year**, with Mounjaro and the GLP-1 franchise at **$9.9 billion in the quarter**. Jefferies took its target to $1,440, Morgan Stanley to $1,419 and Leerink to $1,309.\n\nThe oral is where the fight is. Novo Nordisk sold roughly **$495 million** of its pill in the quarter against Lilly's **$90 million**, a five-to-one drubbing in the format that decides the next decade of this market. Lilly's answer is that prescriptions **doubled in the last week of July**.\n\nThat is one week of scripts against a quarter of sales, and I am taking it anyway at 60/40. Injectables were a manufacturing race and Lilly won it. Pills are a distribution race, and a company printing $23 billion a quarter can buy distribution.\n\n**5. Burry is short with entry prices, and Eisman will not follow him.** Per the [Financial Markets list](https://read.readwise.io/read/01kza9xv6c6gz5yxwqf58nqayg), Michael Burry published his book with the levels attached: short **$NVDA at $198, $MU at $1,051, $AMAT at $729, $TSLA at $416, $SOXX at $642 and $PLTR at $161**, verdict \"WE ARE NEAR A MAJOR TOP AND POSSIBLY A 1987-TYPE FALL.\" Per NoLimitGains on the [Stocks list](https://read.readwise.io/read/01kzbq85c6ezqertgbvvkqz3j8), the S&P is up more than 100 percent since he last told people to sell, in January 2023.\n\nSteve Eisman's refusal is the more useful position. Per [Prof G Markets](https://read.readwise.io/read/01kzc41yfb5fbpzcvpc5hc9sxa), Eisman says \"he doesn't have a data point that you and I don't have,\" and names his trigger precisely: **\"I need a price war in the LLM world.\"** Until inference pricing collapses, the capex holds.\n\nWhat sits against him is the customer base. Bloomberg puts **70 percent of Microsoft's AI revenue** on OpenAI, Barclays **75 percent of Amazon's** on OpenAI and Anthropic, UBS **30 percent of Google Cloud** on the same pair. OpenAI lost $21 billion last year, Anthropic roughly $11 billion. Meta meanwhile grew revenue 28 percent against **55 percent expense growth** and produced $785 million of free cash flow.\n\nI am 60/40 with Eisman, and the 40 is that concentration number. A price war is not the only way this breaks. One of two customers slowing its orders does it.\n\n**Single names worth your watchlist.**\n- **$SPCX.** Float tripled today and reaches 40 percent by December 9. The business beat by a billion and guided to $100 billion of run-rate revenue exiting 2026. Every buyer until Christmas fights a published supply schedule, so let the calendar work.\n- **$APP.** A 53 percent grower at 24 times forward with an 84 percent EBITDA margin, sold off because management stopped promising the 50s. Free cash flow conversion at 54 percent decides whether the deceleration is mix or model.\n- **$LLY.** $23 billion and 48 percent growth, and the next move is about a pill it sells at a fifth of Novo's rate. Three targets went up this week. September script data settles it.\n- **$SNDK.** Jefferies cut it 42 percent and RBC raised it inside the same 24 hours, and it bought back its premarket lows. Still the cleanest live read on whether NAND pricing is rolling over.\n- **$CCJ.** Bank of America raised its 2027 uranium forecast to **$130 a pound**, roughly 52 percent above spot, on utility contract coverage falling to 48 percent from 56. Target trimmed to $133, Buy kept. Oklo reaching first criticality at its Groves Test Reactor the same week is the demand side showing up.\n"}, {"id": "2026-08-05-PM", "date": "2026-08-05", "edition": "PM", "headline": "AMD beat and fell ten percent, and that is the whole market in one print", "subtitle": "Bank of America's 7,741 target for the year is done, the S&P closed an entire candle outside its upper Bollinger band for the first time since March 2024, and SpaceX guided to a $100 billion run rate.", "topics": ["ai-infra", "semis", "consumer", "industrials", "etfs"], "entities": ["$AAOI", "$AMD", "$ASYS", "$CCXI", "$GLD", "$MTSI", "$MU", "$NBIS", "$NET", "$QQQ", "$SMH", "$SNDK", "$SPCX", "$SPY", "$XHB", "$XLK"], "mentions": {"$AAOI": "\u2026and he is selling his AI enabler positions on it, naming resistance at $NBIS $220 to $230 and $MU $900, with $AAOI, $NET, $MTSI and $ASYS reporting within days and Nvidia, Marvell and Micron behind them.", "$AMD": "$AMD. Beat and fell 10 percent after hours on capex up and free cash flow down. Futurum's $800 target rests on 14 gigawatts of committed accelerator deployments, contracted rather than hoped\u2026", "$ASYS": "\u2026AI enabler positions on it, naming resistance at $NBIS $220 to $230 and $MU $900, with $AAOI, $NET, $MTSI and $ASYS reporting within days and Nvidia, Marvell and Micron behind them.", "$CCXI": "The tradeable part: downstream flow benefits $CCXI and Agility as the only US-listed pure-play, and he flags plainly that a SPAC merger is higher risk and higher reward.", "$GLD": "$GLD. Up four percent above $4,300 while equities printed records and oil fell. If gold is a monetary signal it is the most important chart on the board. If McGlone is right that it is a sock\u2026", "$MTSI": "\u2026selling his AI enabler positions on it, naming resistance at $NBIS $220 to $230 and $MU $900, with $AAOI, $NET, $MTSI and $ASYS reporting within days and Nvidia, Marvell and Micron behind them.", "$MU": "\u2026than merely beat, and he is selling his AI enabler positions on it, naming resistance at $NBIS $220 to $230 and $MU $900, with $AAOI, $NET, $MTSI and $ASYS reporting within days and Nvidia, Marvell and Micron behind them.", "$NBIS": "\u2026beat by a lot rather than merely beat, and he is selling his AI enabler positions on it, naming resistance at $NBIS $220 to $230 and $MU $900, with $AAOI, $NET, $MTSI and $ASYS reporting within days and Nvidia, Marvell and Micron behind them.", "$NET": "\u2026is selling his AI enabler positions on it, naming resistance at $NBIS $220 to $230 and $MU $900, with $AAOI, $NET, $MTSI and $ASYS reporting within days and Nvidia, Marvell and Micron behind them.", "$QQQ": "| Year to date | Move | |---|---| | $SPY | +2.59 percent | | $QQQ | -1.93 percent | | $XLK | -2.34 percent | | $SMH | -11.03 percent |", "$SMH": "\u2026Year to date | Move | |---|---| | $SPY | +2.59 percent | | $QQQ | -1.93 percent | | $XLK | -2.34 percent | | $SMH | -11.03 percent |", "$SNDK": "$SNDK. Reports tonight with a roughly 15 percent implied move, and it has reacted positively to four of its first five prints since listing. This is the cleanest read on whether commodity DRAM\u2026", "$SPCX": "$SPCX. Beat at $7.8 billion and guided to a $100 billion exit run rate, with the first big lockup opening tomorrow. The funding gap is roughly $350 billion and the answer is probably Nvidia's\u2026", "$SPY": "| Year to date | Move | |---|---| | $SPY | +2.59 percent | | $QQQ | -1.93 percent | | $XLK | -2.34 percent | | $SMH | -11.03 percent |", "$XHB": "$XHB. Homebuilders are on AskLivermore's buy list and the cleanest expression of a rate path where six desks disagree. They win on Citi's cut scenario and lose on Kashkari's.", "$XLK": "| Year to date | Move | |---|---| | $SPY | +2.59 percent | | $QQQ | -1.93 percent | | $XLK | -2.34 percent | | $SMH | -11.03 percent |"}, "body": "**Headline:** AMD beat and fell ten percent, and that is the whole market in one print\n**Subtitle:** Bank of America's 7,741 target for the year is done, the S&P closed an entire candle outside its upper Bollinger band for the first time since March 2024, and SpaceX guided to a $100 billion run rate.\n**Topics:** ai-infra, semis, industrials, consumer, etfs\n\nYesterday I said SpaceX reported into a 34 percent short interest and nobody had a model. It beat and guided to a $100 billion exit run rate. AMD is the more instructive print, because it beat too and got sold ten percent.\n\n**Market context.** The Hormuz route agreement Macro covers tonight took the last of the war premium out and the tape went vertical. The Nasdaq rose more than 3 percent.\n\nPer Walter Bloomberg on the [Market list](https://read.readwise.io/read/01kz9b2cvxwx0npaq44jby364v), **Bank of America says the S&P has reached its 2026 target of 7,741**, with technicals pointing to 8,000, then 8,234 and potentially 8,541. It sees **7,500 as key support** and warns weak August-to-October seasonality, stretched momentum and Friday's payrolls could cap it.\n\nHeisenberg has the stretched part measured. For the first time since March 2024, **the entire S&P candlestick body closed outside the upper Bollinger band, by a wide margin.** Sunday it was Tesla outside the lower band. Four sessions later the index is outside the upper one.\n\n**The scoreboard.**\n- **Resolved, and it beat.** SpaceX reported **$7.8 billion of June-quarter revenue against a $6.8 billion expectation** and guided to a $100 billion exiting run rate. Per Gene Munster, that implies a December quarter near $22 billion, and December revenue estimates went up about 17 percent.\n- **For, after being against.** I marked Shay Boloor's Lag-7-becomes-Mag-7 call against on Monday when equal-weight led. A 3 percent Nasdaq day is the other side of that, and the call is live again.\n- **Standing.** My 60/40 that the July low holds into mid-August runs to August 15 and is not in doubt at a record high.\n- **Due tonight.** SanDisk reports with an implied move of roughly 15 percent either way.\n\n**1. AMD beat, and the market decided that was not enough.** Per Con on the [Stocks list](https://read.readwise.io/read/01kz7qwryy365s4awdkprvf8zb), AMD produced good numbers and **fell about 10 percent after hours** having closed the regular session up 7 percent near its highs. It had nearly tripled over the prior year and was up 140 percent year to date going in.\n\nTwo things did it. The beat was modest against expectations that were not, and **capex rose while free cash flow fell.** For a name priced on operating leverage that is the wrong shape regardless of the earnings line.\n\nThe read-through is the point. Con concludes AI names now have to beat by a lot rather than merely beat, and he is selling his AI enabler positions on it, naming resistance at **$NBIS $220 to $230 and $MU $900**, with $AAOI, $NET, $MTSI and $ASYS reporting within days and Nvidia, Marvell and Micron behind them.\n\nThe other side is specific and worth holding. Per Shay Boloor on the [Market list](https://read.readwise.io/read/01kz9b2cvxwx0npaq44jby364v), Futurum reiterated a Buy with an **$800 target**, raising its 2027 forecast to **$90 billion of revenue and $17.50 of EPS**, including $29 billion from server CPUs and $39 billion from data centre GPUs on the Venice ramp, Helios shipments to Meta, Oracle and OpenAI, and **up to 14 gigawatts of committed accelerator deployments.** That last figure is contracted rather than modelled.\n\nMy lean is 60/40 that AMD trades above today's after-hours level in a month. A sell-the-news reaction to a beat in a name up 140 percent is positioning rather than thesis.\n\n**2. SpaceX guided to $100 billion and left a $350 billion funding gap.** The print was good. The arithmetic behind the guidance is the story.\n\nPer Gene Munster, guidance implies about **$8.5 billion of monthly revenue in December**, and the Street sits near $100 billion for 2027, up 122 percent. Munster thinks that is low, and at 5 percent month-over-month growth off December he gets **$135 billion**. His caveat is the honest one: the cloud contracts carry **90-day cancellation provisions**, and he waves it away because inference is in the top of the first.\n\nPer SouthernValue on the [Stocks list](https://read.readwise.io/read/01kz7qwryy365s4awdkprvf8zb), here is the part nobody guided.\n\n| SpaceX capacity and funding | Figure |\n|---|---|\n| Data centre capacity today | about 1.4 GW |\n| End of 2026 target | 2 GW |\n| 2027 target | close to 10 GW, all Nvidia |\n| Implied capex at $50-60bn per GW | roughly $500 billion |\n| Cash on hand | about $100 billion |\n| Cash from operations, first half 2026 | $3 billion |\n| Anthropic and Google spot GPU deals | about $26 billion of annual recurring revenue |\n| Estimated exit-2026 forward operating cash | about $50 billion |\n| Residual funding gap | about $350 billion |\n\nHis conclusion is the one to carry: **Nvidia customer financing has to come into play.** Which puts SpaceX in the same structure as the OpenAI campus, with the chip supplier underwriting the buyer.\n\n**3. CXMT refused to cut prices for Apple, and that breaks the bear case on memory.** Per Jukan on the [Market list](https://read.readwise.io/read/01kz9b2cvxwx0npaq44jby364v), South Korean media reports Apple negotiated with CXMT over mobile DRAM supply prices including LPDDR5X, to ease cost pressure on its next iPhone lineup, and **CXMT rejected the request.** It insisted on prices **higher than or comparable to Samsung and SK Hynix.**\n\nIf that holds it inverts the story I cut my memory call on. Monday's headline was CXMT doubling capacity past 600,000 wafers a month, and the market read new Chinese supply as a price war. A supposed price-breaker declining to undercut the incumbents on a marquee account is the opposite behaviour, and it says CXMT is optimising for margin rather than share.\n\nThe honest caveat is that The AI Investor, relaying the same report, called it **\"fake news to me, doesn't pass the smell test.\"** He may be right and the sourcing is one media report.\n\nSo I am raising the memory call back to 60/40 that multiples expand before they compress, from 55/45 Monday, and doing it on a single-sourced report I have flagged as contested. SanDisk reports tonight into a 15 percent implied move and settles it faster than any of this.\n\n**4. The humanoid race got a supply chain this week.** Per Wayne Liang on the [Market list](https://read.readwise.io/read/01kz9b2cvxwx0npaq44jby364v), four separate national efforts moved at once.\n\n- **Mitsubishi** is converting an idle engine plant to build roughly **1,000 humanoids a month**\n- **Unitree** lists in China in a couple of weeks, holding **85 percent of 2025 shipments** with more than **$20 billion of subsidies** behind it\n- **Hyundai** is targeting a few thousand a year through Boston Dynamics\n- **Tesla** is ramping Optimus\n\nThe tradeable part: downstream flow benefits **$CCXI and Agility as the only US-listed pure-play**, and he flags plainly that a SPAC merger is higher risk and higher reward.\n\nConverting an engine plant is the detail. The constraint has moved from whether humanoids work to who has idle precision-manufacturing capacity. That is an industrials question, and Japan has more of it than anyone.\n\n**5. Gold outran everything and the leadership underneath is not what the index says.** Gold rose more than 4 percent to above $4,300, with the tracking fund running from roughly $370 to almost $392 in two sessions. That is a record equity tape and a gold breakout in the same week.\n\nPer AskLivermore on the [Stocks list](https://read.readwise.io/read/01kz7qwryy365s4awdkprvf8zb), the dispersion underneath is severe.\n\n| Year to date | Move |\n|---|---|\n| $SPY | +2.59 percent |\n| $QQQ | -1.93 percent |\n| $XLK | -2.34 percent |\n| $SMH | -11.03 percent |\n\nSemis down 11 percent while the broad index is up is not a tech-led market, whatever a 3 percent Nasdaq day suggests. His own book is up 5.49 percent, he is staying cautious short term precisely because everyone turned bullish, and his next buys are **homebuilders, education providers, micro and small-business enablers, and aging-population REITs.** He recently sold Mastercard for a 13 percent gain and added Arm and Marvell.\n\n**Single names worth your watchlist.**\n- **$AMD.** Beat and fell 10 percent after hours on capex up and free cash flow down. Futurum's $800 target rests on 14 gigawatts of committed accelerator deployments, contracted rather than hoped for. This is a positioning reset in a name that had tripled, not a thesis break.\n- **$SNDK.** Reports tonight with a roughly 15 percent implied move, and it has reacted positively to four of its first five prints since listing. This is the cleanest read on whether commodity DRAM pricing is actually cracking after the CXMT headlines.\n- **$SPCX.** Beat at $7.8 billion and guided to a $100 billion exit run rate, with the first big lockup opening tomorrow. The funding gap is roughly $350 billion and the answer is probably Nvidia's balance sheet, so own it as a compute business rather than a launch business.\n- **$CCXI.** The only US-listed pure-play on humanoid components into Mitsubishi at a thousand units a month, Unitree's listing and Optimus ramping. A SPAC structure means size it like the option it is.\n- **$GLD.** Up four percent above $4,300 while equities printed records and oil fell. If gold is a monetary signal it is the most important chart on the board. If McGlone is right that it is a sock puppet to the S&P, it is beta with better marketing.\n- **$XHB.** Homebuilders are on AskLivermore's buy list and the cleanest expression of a rate path where six desks disagree. They win on Citi's cut scenario and lose on Kashkari's.\n"}, {"id": "2026-08-04-PM", "date": "2026-08-04", "edition": "PM", "headline": "SpaceX reports tonight with 34 percent of its float sold short", "subtitle": "Ninety-five percent of borrowable SpaceX stock is already out on loan, the first $100 billion lockup opens Thursday, and Caterpillar just cleared $20 billion of quarterly sales for the first time.", "topics": ["ai-infra", "semis", "energy", "consumer", "industrials"], "entities": ["$AAPL", "$CAT", "$FRO", "$SNDK", "$SPCX", "$VRT"], "mentions": {"$AAPL": "$AAPL. Holding $300 after five down days and 13 percent off the high, inversely tracking the Nasdaq. A defensive bounce candidate with a real memory-cost overhang into September, so size it as\u2026", "$CAT": "$CAT. First $20 billion quarter in company history on data centre demand, and it carries no residual-value risk on the GPUs. The cleanest non-AI way to own the AI build, and the one nobody argues\u2026", "$FRO": "$FRO. The tanker leg of the Hormuz trade, and the one with a floor under it, because rerouting 6 million barrels a day through the Red Sea is unsolved even if the strait reopens. Rates stay elevated\u2026", "$SNDK": "$SNDK. Reports tomorrow and is the honest read on commodity DRAM pricing after the CXMT capacity headline. High-bandwidth memory is sold out through 2026, so this print tells you about the other\u2026", "$SPCX": "$SPCX. Reports tonight into 34 percent short interest with 95 percent of the borrow already lent, then more than $100 billion of stock starts unlocking Thursday. The print and the supply cliff\u2026", "$VRT": "$VRT. Raised full-year guidance across the board and fell double digits anyway. Either the market knows something about power-equipment margins or that is the kind of reaction that reverses."}, "body": "**Headline:** SpaceX reports tonight with 34 percent of its float sold short\n**Subtitle:** Ninety-five percent of borrowable SpaceX stock is already out on loan, the first $100 billion lockup opens Thursday, and Caterpillar just cleared $20 billion of quarterly sales for the first time.\n**Topics:** ai-infra, semis, industrials, energy, consumer\n\nYesterday SpaceX printed an all-time low the session before its first earnings report. Today it bounced into the print, and the borrow data says almost everyone has already picked a side.\n\n**Market context.** The oil move Macro covers this evening did the work here. Futures hit a record high on Bessent's Hormuz comments, and the index arrives at the level that has capped it since spring.\n\nPer Scott Redler on the [Financial Markets list](https://read.readwise.io/read/01kz6cqnpq9dmp04b2bmsam265), the S&P cleared the 7448 line and pushed to 7610 in the prior session, and the index \"may be trying to leave its 10-plus week range.\" He wants it to hold above 7448, with **7620 the bigger level overhead**. Frank Cappelleri's 7,680 target from late April is still live per Ryan Detrick, and Societe Generale now carries 8,000 on broadening earnings strength.\n\nLeadership is the part that does not fit the record. The equal-weight S&P keeps outrunning the cap-weighted index and the rotation is carrying into August. That is not what a megacap-led tape looks like. Tonight's SpaceX and AMD prints land in tomorrow's edition.\n\n**The scoreboard.**\n- **Against, on day one.** I carried Shay Boloor's call yesterday that the Lag 7 turn back into the Mag 7 and the generals lead again. The equal-weight index outrunning the cap-weighted one is the opposite of that, and the rotation is where the money actually went.\n- **Standing, and improving.** My 60/40 that the July low holds into mid-August is intact with futures at a record. The call runs to August 15.\n- **Due tonight.** AMD reports, and SpaceX reports for the first time in company history.\n- **Due Thursday.** The first SpaceX lockup, more than $100 billion of stock, begins unlocking two days after the print.\n\n**1. The SpaceX print is the most crowded short in the market.** Per zerohedge on the [Financial Markets list](https://read.readwise.io/read/01kz6cqnpq9dmp04b2bmsam265), S3 data shows **95 percent of SpaceX stock available to borrow is out on loan, and short interest is 34 percent of the float.** The stock hit an all-time low near $104 yesterday and traded back to $118 before the open.\n\nPer Kyle Reidhead on the [Crypto list](https://read.readwise.io/read/01kz6dcw3j4czybzarfkcqnb4g), here is what the print actually turns on.\n\n| Line | Where it stands |\n|---|---|\n| Expected revenue | $6.8 billion |\n| Expected cash burn | $10.9 billion |\n| Starlink ARPU | $99 in 2023, $66 last quarter, street wants $65.50 |\n| AI capex last quarter | $7.7 billion, 76 percent of all company spending |\n| Anthropic compute deal | $1.25 billion a month through 2029 |\n| 2026 X revenue, consensus | about $2.9 billion |\n| Consensus EPS | a $1.26 loss to a $0.33 profit |\n\nThat last row is the tell. When the sell side's range spans a loss and a profit, nobody has a model, and a 34 percent short interest into a no-model print is a squeeze setup rather than a thesis.\n\nHeisenberg's framing is the honest one and it is worth quoting: it is so obvious the stock goes down tomorrow that it becomes obvious not to short it, because everyone thinks it is obvious. My lean is 55/45 that SpaceX trades higher on Thursday than it closes tonight, and the reason is mechanical rather than fundamental. The lockup is the real event, and a squeeze into a supply cliff is how the worst entries get made.\n\n**2. Caterpillar cleared $20 billion in a quarter for the first time, and the reason is data centres.** Per the [Financial Markets list](https://read.readwise.io/read/01kz6cqnpq9dmp04b2bmsam265), Caterpillar surged as quarterly sales topped $20 billion for the first time in company history, driven by the AI data centre build. Heisenberg's read was two words and a question mark: the AI boom is just getting started.\n\nThis is the cleanest version of a trade that keeps being mispriced. Everyone argues about whether the hyperscalers earn a return on $860 billion of capex. Caterpillar does not need them to. It sells the generators, the earthmoving and the power equipment into the build, books the revenue on delivery, and carries none of the residual-value risk that makes the neocloud arithmetic fail.\n\nThe same logic ran through Vertiv, which raised full-year guidance across the board and still fell double digits, and it is why the picks-and-shovels layer keeps being the least crowded way to own the theme.\n\n**3. Memory is being repriced on supply for the second session running.** Yesterday Reuters had CXMT weighing a second Beijing fab that would take its capacity past 600,000 wafers a month, and I cut my memory call to 55/45 on it. Today the complex is still working out what that means.\n\nPer the [Financial Markets list](https://read.readwise.io/read/01kz6cqnpq9dmp04b2bmsam265), Marvell is soaring, and Scott Redler had Nvidia, Micron, SpaceX and SanDisk as the four names on his premarket board. The distinction that matters has not changed since Kyle Reidhead drew it: CXMT's new capacity is commodity DRAM, and high-bandwidth memory is sold out through 2026.\n\nSo the right way to hold this is that a China supply headline hits the commodity end and the margin structure, while the AI-critical end stays contracted. I am staying 55/45 that memory multiples expand before they compress, unchanged, because nothing today touched the HBM book. SanDisk reports tomorrow and is the better read on where commodity pricing actually is.\n\n**4. The Hormuz war trades are unwinding before the war ends.** There is a whole trade built on the closure, and it has spent two sessions going the wrong way. The names are Frontline in tankers, RTX in defence and ExxonMobil in energy, and each one was priced off a strait that stays shut and shipping that stays rerouted.\n\nBessent's draft-text comment takes the top off all three at once. Brent at $81.50 after a 4.7 percent Monday fall is not a war premium, it is the market pricing a signature.\n\nThe asymmetry now runs the other way. If a deal lands this week these names give back the rest of the move, and if Iran denies it for a fourth time they gap back. Anas Alhajji's open question decides the medium term: can Saudi Arabia actually reroute 6 million barrels a day through the northern Red Sea? Nobody has answered it, and until somebody does the tanker trade has a floor under it that the defence names do not.\n\n**5. Apple is down five straight and starting to trade like a defensive.** Per Heisenberg on the [Financial Markets list](https://read.readwise.io/read/01kz6cqnpq9dmp04b2bmsam265), Apple is **holding $300 after five down days and a peak-to-trough fall of more than 13 percent**, and it has been inversely tracking the Nasdaq proxy.\n\nHis setup is the interesting part rather than the level. Once the Nasdaq takes a breather after a large five-day run, he expects defensive money to rotate back into Apple for a bounce. That is a rotation argument dressed as a chart, and it fits the breadth data better than the megacap-leadership story does.\n\nThe overhang is real and it is not priced out. Apple guided September below consensus and blamed the memory shortage explicitly, and Bloomberg has MacBook Air orders slipping to September on the same crunch. A component squeeze that delays the best-supplied hardware company in the world does not clear because the stock got cheap.\n\n**Single names worth your watchlist.**\n- **$SPCX.** Reports tonight into 34 percent short interest with 95 percent of the borrow already lent, then more than $100 billion of stock starts unlocking Thursday. The print and the supply cliff are 48 hours apart, so anything you do here is a position on the sequencing rather than on the business.\n- **$CAT.** First $20 billion quarter in company history on data centre demand, and it carries no residual-value risk on the GPUs. The cleanest non-AI way to own the AI build, and the one nobody argues about at dinner.\n- **$AAPL.** Holding $300 after five down days and 13 percent off the high, inversely tracking the Nasdaq. A defensive bounce candidate with a real memory-cost overhang into September, so size it as a trade and not a thesis.\n- **$FRO.** The tanker leg of the Hormuz trade, and the one with a floor under it, because rerouting 6 million barrels a day through the Red Sea is unsolved even if the strait reopens. Rates stay elevated on distance travelled rather than on risk.\n- **$SNDK.** Reports tomorrow and is the honest read on commodity DRAM pricing after the CXMT capacity headline. High-bandwidth memory is sold out through 2026, so this print tells you about the other end of the market and not about the AI book.\n- **$VRT.** Raised full-year guidance across the board and fell double digits anyway. Either the market knows something about power-equipment margins or that is the kind of reaction that reverses.\n"}]}, {"key": "crypto", "label": "Bitcoin & Crypto", "topicOrder": ["bitcoin", "ether", "alts", "etf-flows", "stablecoins", "treasuries", "miners", "equities"], "secondLabel": "Tickers", "days": [{"id": "2026-08-06-PM", "date": "2026-08-06", "edition": "PM", "headline": "$100 million walked out of Coldcard wallets and Bitcoin moved less than one percent", "subtitle": "A random-number bug from 2021 left older seeds guessable, more than 5,000 holders lost coins, and the only thing in crypto that reacted was Robinhood's memecoin chain.", "topics": ["bitcoin", "etf-flows", "treasuries", "equities"], "entities": ["$BTC", "$COIN", "$GLXY", "$HOOD", "$MSTR"], "mentions": {"$BTC": "$BTC. Roughly 49 percent below October's $126,198 and resting on the 200-week average, with 66.7K the line that matters. Three bottom clocks (Cowen's capitulation event, the 13-month underwater\u2026", "$COIN": "$COIN. The legislative catalyst is priced at 20 percent for the year and industry volumes fell double digits last quarter. Jack Mallers frames the split honestly: Coinbase cares more about its\u2026", "$GLXY": "3. Galaxy's missing tenant cost it 13 percent, and the frozen queue is why waiting is correct. Per Milk Road, $GLXY fell 13 percent to $19 on a $7.5 billion market cap, and none of it was the numbers. Helios phase one, 200 megawatts leased to CoreWeave for 15 years, is billing toward roughly $80 million\u2026", "$HOOD": "$HOOD. Its chain does $3 billion a week in DEX volume and keeps almost none of the fees. That is deliberate: the chain is the funnel, the brokerage is the business.", "$MSTR": "$MSTR. Sold 1,638 coins for roughly $105 million, raised $1 billion off the common at about one times net asset value, and spent $1.3 billion retiring converts. Per Apyx's Parker White, the dividend\u2026"}, "body": "**Headline:** $100 million walked out of Coldcard wallets and Bitcoin moved less than one percent\n**Subtitle:** A random-number bug from 2021 left older seeds guessable, more than 5,000 holders lost coins, and the only thing in crypto that reacted was Robinhood's memecoin chain.\n**Topics:** bitcoin, etf-flows, treasuries, equities\n\nYesterday Galaxy proved the miners had stopped being a Bitcoin trade. Today a hundred million dollars walked out of self-custody wallets and the price barely registered it. Nothing moves this asset anymore, and that is the read.\n\n**Market context.** Per [Milk Road](https://read.readwise.io/read/01kzc78a2wpbr01y047nqjg9fg), Bitcoin topped at **$126,198 last October and sits roughly 49 percent below it** this afternoon. Per [VirtualBacon](https://read.readwise.io/read/01kzc32ez9ge1rcc9pqqg2g91e), it is up 3.6 percent over four days and still in a daily downtrend that began in May, with **resistance at 66.7K** and a break opening **76K**. It sits on its 200-week average, the level that marked every prior cycle floor.\n\nBenjamin Cowen's framing on [NFA Live](https://read.readwise.io/read/01kzbx1756p8grqnqd7ef4jd36) is the one to carry: Bitcoin sits **at the same valuation against the S&P 500 as five to six years ago**, while the S&P makes new highs. Per [Blockworks](https://read.readwise.io/read/01kzbpcf59wvj2mjf5e1grs7zz), ETF net flows are **anemic in both directions** and Glassnode has options priced for no move. Miners were the worst asset on the board at **minus 6.2 percent**, with Cipher and Hut 8 both missing.\n\n**The scoreboard.**\n- **Hit, four days early.** On July 11 I said Robinhood Chain had to hold $400 million a day of DEX volume by August 10 or the migration was churn. Seven-day volume is near **$3 billion**, roughly $428 million a day. It cleared.\n- **Working.** My 60/40 that Bitcoin sees $58,000 before $75,000. Three independent clocks now point at a low between October and December, and none point up first.\n- **Called it, and it cost 13 percent.** I said yesterday Galaxy's 830 approved megawatts needed a tenant within days. Novogratz had promised one by the end of summer and did not deliver.\n- **Due tomorrow.** ERCOT's next Batch Zero round, which the Texas audit suspended.\n\n**1. The Coldcard bug was born in 2021, and the coins left this week.** Per [Swan](https://read.readwise.io/read/01kzc20bg9w598cbvtpqbj8fa7), a **2021 software integration** made Coldcard seed generation fall through to a MicroPython pseudo-random number generator instead of the hardware entropy source it was meant to use. Coinkite puts affected **MK2 and MK3 seeds at roughly 40 bits of effective search space**, with MK4, MK5 and Q near **72 bits**. The design target was 128.\n\nForty bits is not a lock somebody picked. It is a lock with a thousand keys.\n\nPer the [People to follow list](https://read.readwise.io/read/01kzbqjkx1eb2sp2xdsad03msh), one researcher mapped **4,312 drained addresses** with the exact block for each. Per [Anthony Pompliano's guests](https://read.readwise.io/read/01kzacm25f6fx739hbmb6873s3), the total is **more than 5,000 people and over $100 million**, concentrated among the holders least likely to ever use a custodian. **Bitcoin did not move more than about one percent on it.**\n\nThe position is not a price call. Tilman Holloway expects **ETF inflows to tick up three, six and nine months out** as burned self-custody holders move to a custodian, against Coinbase and BitGo carrying roughly **$5 million of insurance**. The remedy circulating on Spaces is generating your own entropy with **100 dice rolls**. That tells you how this ends.\n\nThe most damning line came from calle on the [Crypto list](https://read.readwise.io/read/01kzbqp3bc9hsn20jd3c2sh4pp): **\"not a single vulnerability was found by a US frontier model. Instead, we're spending $10k a day on open weights models like Kimi K3 and Qwen 3.8 to find vulnerabilities in Bitcoin infrastructure.\"**\n\n**2. CLARITY's death is a buy-the-news event, and I am taking the unpopular side.** Macro has the vote math tonight: 60 needed, 53 held, cloture filed on a different motion. Here it is a straight disagreement between desks. Per [VirtualBacon](https://read.readwise.io/read/01kzc32ez9ge1rcc9pqqg2g91e), **Bernstein** says failure could trigger the final leg down in crypto valuations and **JPMorgan** calls it another headwind. Bitwise's **Matt Hougan** says the SEC and CFTC can supply the same path by rule rather than law. [Altcoin Daily](https://read.readwise.io/read/01kzc3p6qysps43ynpwm5vhkfk) puts a failure at Bitcoin \"maybe into the 50s, maybe into 48.\"\n\nJames Seyffart's point decides it. Traditional finance treats CLARITY as a catalyst for **Bitcoin**, not only for alts, so the disappointment is broad rather than confined to tokens that need a legal wrapper.\n\nI am 65/35 that it is already priced. Polymarket went from 50 to 70 percent in January to 15 percent now, and an asset that ignored a $100 million theft is not holding a legislative premium. Hougan is the reason I lean that way. A rulemaking path does not need 60 votes.\n\n**3. Galaxy's missing tenant cost it 13 percent, and the frozen queue is why waiting is correct.** Per [Milk Road](https://read.readwise.io/read/01kzbwnysyhaqgf01r9ys41kqw), $GLXY fell **13 percent to $19** on a $7.5 billion market cap, and none of it was the numbers. Helios phase one, 200 megawatts leased to CoreWeave for 15 years, is billing toward roughly **$80 million a quarter**.\n\nPer m0xt on the [Stocks list](https://read.readwise.io/read/01kzbq85c6ezqertgbvvkqz3j8), the pipeline is **5.7 gigawatts with 4.3 contracted, contractable or Batch Zero eligible**, and the Texas audit ordered August 3 **suspended the next Batch Zero round, due tomorrow**. Merlin's first phase is **74 megawatts, one under the 75 megawatt threshold** that would have caught it. Caspian at 700 and Selene at 900 are grandfathered.\n\nSo the moat held and the announcement did not. I am 60/40 the tenant lands before the audit clears, because a landlord with grandfathered megawatts inside a frozen queue has the only product anyone can plug in.\n\n**4. The only live bid in crypto is on Robinhood's chain, and none of it is Bitcoin.** Per [0xSammy](https://read.readwise.io/read/01kza18t1xeqr4gy547yy2e7x5), Robinhood Chain carries **$411 million of DeFi value, $558 million of stablecoins, over $1 billion bridged and nearly $3 billion of seven-day DEX volume**, with perpetual futures up 130 percent.\n\nThe economics are the interesting part. Apps on the chain took **$1.6 million of gross fees in 24 hours** and the chain kept **$50 thousand**. Fat apps, thin chain, no token to dilute. Pons alone runs 64 percent of launchpad volume on a $20 million market cap, and Uniswap has now deployed pools.trade on the same chain to take it.\n\nThe other half of the flow is real-world assets, compounding while everything crypto-native shrinks.\n\n| On-chain | A year ago | Now |\n|---|---|---|\n| RWA deposits | $2.3 billion | $7.4 billion |\n| RWA perpetual notional, July | $1.3 billion | $150 billion |\n| Tokenized spot volume, monthly | $3.4 billion | $14 billion |\n\nCrypto-native spot DEX volume fell about 70 percent over the same stretch. That is where the money went. Not out of the sector, sideways within it.\n\n**Single names worth your watchlist.**\n- **$BTC.** Roughly 49 percent below October's $126,198 and resting on the 200-week average, with 66.7K the line that matters. Three bottom clocks (Cowen's capitulation event, the 13-month underwater cohort, Altcoin Daily's 200-week analogue) all land in the fourth quarter, none starting with a rally.\n- **$GLXY.** Down 13 percent for the absence of an announcement rather than a number, while its 830 approved megawatts got scarcer. Tomorrow's suspended Batch Zero round is the next marker.\n- **$HOOD.** Its chain does $3 billion a week in DEX volume and keeps almost none of the fees. That is deliberate: the chain is the funnel, the brokerage is the business.\n- **$MSTR.** Sold 1,638 coins for roughly $105 million, raised $1 billion off the common at about one times net asset value, and spent $1.3 billion retiring converts. Per [Apyx's Parker White](https://read.readwise.io/read/01kzc13aqkt8575adknpd5w6tb), the dividend reserve went from six months back to about 18 and nothing puts until September 2027. The deleveraging is working.\n- **$COIN.** The legislative catalyst is priced at 20 percent for the year and industry volumes fell double digits last quarter. Jack Mallers frames the split honestly: Coinbase cares more about its own chain and alts than about Bitcoin. That is the bull case now, because the chains have the volume.\n"}, {"id": "2026-08-05-PM", "date": "2026-08-05", "edition": "PM", "headline": "Galaxy lost $85 million and printed the best crypto earnings report of the cycle", "subtitle": "The Helios data centre billed its first rent and guided to $80 million a quarter at above 90 percent margins, while Mark Cuban sold most of his Bitcoin because the hedge did not hedge.", "topics": ["bitcoin", "treasuries", "miners", "equities"], "entities": ["$COIN", "$CRWV", "$GLXY", "$IREN", "$MSTR"], "mentions": {"$COIN": "$COIN. Macro has the CLARITY window closing with the recess on Saturday and no floor vote scheduled. Nothing today improved that, so the exchange keeps trading on volumes in a quarter when industry\u2026", "$CRWV": "$CRWV. The tenant on the other side of Galaxy's 15-year Helios lease, and the counterparty whose credit now underwrites someone else's utility economics. Its own numbers are worse than its landlord's,\u2026", "$GLXY": "$GLXY. An $85 million loss that is almost entirely paper markdowns, sitting on top of a data centre segment guiding to $80 million a quarter at above 90 percent margins. The three things to watch\u2026", "$IREN": "$IREN. Signed leases rather than hash, and now with the ERCOT queue frozen, already-approved capacity is the scarce asset. The Texas audit is a moat for whoever cleared it and a wall for everyone\u2026", "$MSTR": "$MSTR. Sold 1,638 coins after four weeks of not buying, and Cuban's exit removes the narrative that made corporate treasuries buyers at all. Watch the premium to net asset value, because it decides\u2026"}, "body": "**Headline:** Galaxy lost $85 million and printed the best crypto earnings report of the cycle\n**Subtitle:** The Helios data centre billed its first rent and guided to $80 million a quarter at above 90 percent margins, while Mark Cuban sold most of his Bitcoin because the hedge did not hedge.\n**Topics:** treasuries, miners, equities, bitcoin\n\nYesterday I said the miners had stopped being a Bitcoin trade. Galaxy Digital proved it with a net loss, a first rent cheque, and guidance that has nothing to do with the price of anything.\n\n**Market context.** The Nasdaq rose more than 3 percent on the Hormuz route agreement Macro covers tonight. Bitcoin did not lead it, the fourth session running where the equities did the work.\n\nMike McGlone's line, carried on the [Crypto list](https://read.readwise.io/read/01kz9b9cmjc3ff1h5mx6ar8msj), is the cleanest statement of the problem: **copper, gold and Bitcoin are all sock puppets to the S&P 500 right now.** Gold at least got paid for it, up more than 4 percent above $4,300.\n\nMandelbrot expects knee-jerk movement over the next 24 to 48 hours, thinks it is probably a fakeout with the first move up, and puts his invalidation at **65.8**. He has been pounding the table on the Nasdaq proxy over Bitcoin, and a 3 percent index day makes that uncomfortable rather than wrong.\n\n**The scoreboard.**\n- **Working.** I moved to 60/40 yesterday that Bitcoin sees $58,000 before $75,000. A fourth session of the equity complex ripping without it is the confirmation that call needs.\n- **Confirmed the hard way.** I have been carrying the Coldcard-drives-money-to-ETFs thread since Monday. Mark Cuban just sold most of his Bitcoin, and the reason was not custody.\n- **Due within days.** Galaxy's 830 megawatts at Helios needs a tenant, and the Texas queue that everything else depends on is now frozen.\n\n**1. Galaxy lost $85 million and the only number that mattered was $18.9 million.** Per [Milk Road](https://read.readwise.io/read/01kz9mthc8c5ydpyk9fmaavswg), the headline loss came almost entirely from the Treasury and Corporate segment, which ran **$78 million of negative adjusted EBITDA**, nearly all of it unrealised markdowns on tokens and investments Galaxy still holds. Crypto fell in the quarter, so the book fell with it. That is beta, not a business.\n\nThe business is Helios, an old West Texas mining site converted into an AI data centre campus and leased to CoreWeave for 15 years. In Q2 it started charging rent.\n\n| Galaxy data centre segment | Q2 |\n|---|---|\n| Leasing revenue | $18.9 million, the first ever billed |\n| Adjusted gross profit | $20.1 million, from $3.1 million in Q1 |\n| Adjusted EBITDA | $11.5 million, the first positive quarter ever |\n| Phase I critical IT load in service | all 133 MW |\n| Guided Phase I billing from Q3 | roughly $80 million per quarter |\n| Project-level adjusted EBITDA margin | above 90 percent |\n\nTheir analyst wanted Q3 framed near $60 million and got $80 million. A 90 percent margin on contracted rent is a utility, worth a different multiple from anything that mines.\n\nThe crypto business held up better than crypto did. **Digital Assets adjusted gross profit came in at $66 million, up 34 percent quarter over quarter**, while Galaxy's own volumes fell 7 percent and industry volumes fell double digits. Galaxy also signed a multi-year staking agreement with **BNY, a custodian overseeing more than $60 trillion**.\n\n**2. Texas just froze the pipeline, and that makes the approved megawatts more valuable.** This is the part with real consequence and almost nobody has priced it.\n\nGalaxy's power pipeline now sits at **5,730 megawatts across Texas** after adding three sites. Only **800 megawatts is contracted under an executed lease.** The other **4,930 megawatts is identified but uncontracted**, and most of it sits behind ERCOT's grid connection queue.\n\nThen, on August 3, **Governor Abbott ordered Texas regulators to audit every data centre in that queue before any more advance, with no completion deadline announced.** ERCOT paused its Batch Zero study the same day.\n\nThe scale of what is stuck: **474 gigawatts of connection requests, against a grid whose record peak demand is roughly 91 gigawatts.** Five times the entire peak load of Texas is sitting in a queue that just stopped moving.\n\nThat cuts two ways and the second way is the trade. It caps how fast anyone's pipeline can grow, which reprices every announced-but-unconnected megawatt in the state. And it makes the **830 megawatts already approved at Helios** scarce in a way it was not last week.\n\nTheir analyst goes against his own readers and he is right to. Investors want the next tenant announced immediately. He thinks waiting gets better terms on a 15-year-plus lease, and with the queue frozen, time is on the landlord's side.\n\nThe dilution worry is sized. Every phase needs an equity cheque on top of the debt, and working back from Phase II terms he puts the requirement near **$1 billion across all three phases against roughly $7 billion of levered free cash flow over the life of the leases**, about a **35 percent return** on committed equity.\n\n**3. Cuban sold because the hedge did not hedge.** Per Milk Road on the [Stocks list](https://read.readwise.io/read/01kz7qwryy365s4awdkprvf8zb), Mark Cuban has sold the majority of his Bitcoin, and the reasoning is more damaging than the sale.\n\nHe bought on one thesis: a better version of gold than gold, a hedge against fiat losing value. Then the test arrived. **During the Iran war, geopolitical risk spiked and the dollar slid, and Bitcoin fell while gold went to records.** Bitcoin is priced in dollars, so a weaker dollar should have pulled global demand in. It did not.\n\nHe is reportedly more disappointed in Bitcoin than in Ethereum. Why this matters past one portfolio: **the digital-gold framing is the backbone of institutional adoption.** It is the reason pension funds, family offices and corporate treasuries started buying at all. If the hedge does not hedge in the one month it was asked to, the next marginal buyer at these prices needs a different reason, and nobody has supplied one.\n\nSet it beside gold up 4 percent above $4,300 this week, and beside Strategy turning seller. The two largest structural arguments for owning Bitcoin, corporate treasury demand and the debasement hedge, both weakened inside five sessions. That is why I am comfortable at 60/40 even with the Nasdaq at a record.\n\n**Single names worth your watchlist.**\n- **$GLXY.** An $85 million loss that is almost entirely paper markdowns, sitting on top of a data centre segment guiding to $80 million a quarter at above 90 percent margins. The three things to watch are whether Q3 leasing actually lands near $80 million, whether a Phase I refinancing appears, and whether the 830 megawatts finds a tenant.\n- **$CRWV.** The tenant on the other side of Galaxy's 15-year Helios lease, and the counterparty whose credit now underwrites someone else's utility economics. Its own numbers are worse than its landlord's, and that is the whole point of the split.\n- **$MSTR.** Sold 1,638 coins after four weeks of not buying, and Cuban's exit removes the narrative that made corporate treasuries buyers at all. Watch the premium to net asset value, because it decides whether the coins keep funding the coupon.\n- **$IREN.** Signed leases rather than hash, and now with the ERCOT queue frozen, already-approved capacity is the scarce asset. The Texas audit is a moat for whoever cleared it and a wall for everyone who did not.\n- **$COIN.** Macro has the CLARITY window closing with the recess on Saturday and no floor vote scheduled. Nothing today improved that, so the exchange keeps trading on volumes in a quarter when industry volumes fell double digits.\n"}, {"id": "2026-08-04-PM", "date": "2026-08-04", "edition": "PM", "headline": "Strategy became a seller and Bitcoin sat out the best macro day in weeks", "subtitle": "Miners rallied 9.6 percent on data centre leases while Bitcoin finished flat against a Nasdaq up 1.4 percent, and the most reliable structural bid in the market spent last week selling.", "topics": ["bitcoin", "etf-flows", "treasuries", "miners", "equities"], "entities": ["$BTDR", "$COIN", "$HOOD", "$IREN", "$MSTR"], "mentions": {"$BTDR"

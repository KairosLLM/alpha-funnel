<script>
'use strict';
/* Alpha Funnel — multi-channel reader (Stocks & ETFs / Bitcoin & Crypto / Macro & Policy,
   plus the frozen Investing archive). The channel list is data, not code: it comes from
   manifest.json, which build_manifest.py fills from meta.CHANNELS.
   Works two ways from ONE codebase:
   - standalone briefings.html: a global `DATA` is embedded (days carry `body`, plus `deep`).
   - served site/: no DATA, so we fetch manifest.json and lazy-load bodies + deep-dives. */

const EMBEDDED = (typeof DATA !== 'undefined') ? DATA : null;

// labels for every topic across all channels (channel supplies its own order)
const TOPIC_LABEL = {
  // Stocks & ETFs
  'ai-infra': 'AI Infra', semis: 'Semis', software: 'Software', energy: 'Energy',
  healthcare: 'Healthcare', financials: 'Financials', consumer: 'Consumer',
  industrials: 'Industrials', etfs: 'ETFs',
  // Bitcoin & Crypto
  bitcoin: 'Bitcoin', ether: 'Ether', alts: 'Alts', 'etf-flows': 'ETF Flows',
  stablecoins: 'Stablecoins', treasuries: 'Treasury Cos', miners: 'Miners', equities: 'Equities',
  // Macro & Policy
  rates: 'Rates', inflation: 'Inflation', policy: 'Policy', geopolitics: 'Geopolitics',
  commodities: 'Commodities', dollar: 'Dollar', liquidity: 'Liquidity',
  // Investing archive (frozen) + retired News / AI & Tools archives
  macro: 'Macro', stocks: 'Stocks', crypto: 'Crypto', biotech: 'Biotech',
  models: 'Models', agents: 'Agents', tooling: 'Tooling', 'local-open': 'Local/Open',
  compute: 'Compute', pkm: 'PKM',
  politics: 'Politics', world: 'World', markets: 'Markets', health: 'Health', culture: 'Culture',
};
// label -> url key, derived from the manifest so it cannot drift from meta.CHANNELS
let LABEL_TO_KEY = {};
const TOP_ENTITIES = 15; // second-row chips shown before "show all"

let CHANNELS = [];             // [{key, label, topicOrder, secondLabel, days:[{id,date,edition,headline,subtitle,topics,entities,mentions?,path?,body?}]}]
let CALLS = [];                // calls ledger (state/calls.jsonl folded in by build_manifest.py)
let CH_BY_KEY = {};            // key -> channel object
let activeKey = null;          // current channel key
let DEEP_IDS = new Set();      // source ids that have a deep-dive available
let DEEP = null;               // standalone: {id: md}; served: null (fetch on demand)

let state = { filter: null, showAllEntities: false }; // filter = {kind:'topic'|'entity', value} | null
let SEEN = new Set();   // "key/id" of editions already opened (persisted to localStorage af-seen)
let ENTITY_INDEX = new Map();    // entity display name -> [{ch, d}] newest-first (built in init)
let SLUG_TO_ENTITY = new Map();  // url slug -> entity display name

const elDrawer = () => document.getElementById('drawer');
const elScrim = () => document.getElementById('scrim');

marked.setOptions({ breaks: false, gfm: true });

init();

async function init() {
  initTheme();
  try {
    let src;
    if (EMBEDDED) {
      src = EMBEDDED;
      DEEP = EMBEDDED.deep || {};
      DEEP_IDS = new Set(EMBEDDED.deepDives || Object.keys(DEEP));
    } else {
      src = await fetchJSON('manifest.json');
      DEEP_IDS = new Set(src.deepDives || []);
      DEEP = null;
    }
    CHANNELS = (src.channels || []).map(c => ({ ...c, days: (c.days || []).slice() }));
    CALLS = src.calls || [];
    // wikilinks name the channel by LABEL, routes use the key: build the map from the data
    LABEL_TO_KEY = Object.fromEntries(CHANNELS.map(c => [c.label, c.key]));
  } catch (e) {
    document.getElementById('app').innerHTML =
      `<div class="wrap"><p class="empty">Couldn't load the briefings. (${esc(String(e))})</p></div>`;
    return;
  }
  if (!CHANNELS.length) {
    document.getElementById('app').innerHTML =
      `<div class="wrap"><p class="empty">No channels found.</p></div>`;
    return;
  }
  // newest first within each channel: by date, then Deep-Dive (week's featured memo) > PM >
  // legacy all-day > AM. Mirrors meta.py SESSION_RANK — keep the two in lockstep.
  const RANK = { 'Deep-Dive': 4, PM: 3, '': 2, AM: 1 };
  CHANNELS.forEach(c => {
    c.days.sort((a, b) => b.date.localeCompare(a.date) || (RANK[b.edition] ?? 2) - (RANK[a.edition] ?? 2));
    CH_BY_KEY[c.key] = c;
  });
  buildEntityIndex();
  activeKey = CHANNELS[0].key; // default channel (Investing)
  loadSeen();

  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  elScrim().addEventListener('click', closeDrawer);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
  document.addEventListener('keydown', keyNav);
  document.addEventListener('keydown', trapTab);
  window.addEventListener('scroll', onReadScroll, { passive: true });
  const skip = document.querySelector('.skip');
  if (skip) skip.addEventListener('click', e => {
    e.preventDefault();
    const mn = document.getElementById('main');
    if (mn) { mn.focus(); mn.scrollIntoView(); }
  });
  window.addEventListener('hashchange', route);
  route();
}

/* ---------- "new since last visit" tracking (localStorage) ---------- */
function loadSeen() {
  let raw = null;
  try { raw = localStorage.getItem('af-seen'); } catch (e) {}
  if (raw == null) {
    // first ever visit: seed with every current edition so nothing shows as falsely "new"
    CHANNELS.forEach(c => c.days.forEach(d => SEEN.add(c.key + '/' + d.id)));
    persistSeen();
  } else {
    try { (JSON.parse(raw) || []).forEach(k => SEEN.add(k)); } catch (e) {}
  }
}
function persistSeen() { try { localStorage.setItem('af-seen', JSON.stringify([...SEEN])); } catch (e) {} }
function isNew(key, id) { return !SEEN.has(key + '/' + id); }
function markSeen(key, id) { if (isNew(key, id)) { SEEN.add(key + '/' + id); persistSeen(); } }
function channelHasNew(c) { return c.days.some(d => isNew(c.key, d.id)); }

function CH() { return CH_BY_KEY[activeKey] || CHANNELS[0]; }

/* ---------- routing ---------- */
// #/<channel>            -> that channel's list
// #/<channel>/<id>       -> a reading view (id = 2026-06-30 or 2026-06-30-PM)
function route() {
  closeDrawer();   // any open drawer (zoom / what-is-this / subscribe) shouldn't linger across nav
  // #/e/<slug> -> a cross-channel entity thread (all editions that mentioned it, chronological).
  const em = (location.hash || '').match(/^#\/e\/([a-z0-9-]+)$/);
  if (em && SLUG_TO_ENTITY.has(em[1])) {
    renderEntityThread(em[1]); window.scrollTo(0, 0);
    afterRoute(SLUG_TO_ENTITY.get(em[1]) + ' — all mentions'); return;
  }
  // #/calls -> the Scoreboard (open calls, catalyst calendar, settled calls with outcomes)
  if ((location.hash || '') === '#/calls') {
    renderScoreboard(); window.scrollTo(0, 0);
    afterRoute('Scoreboard'); return;
  }
  // Edition-token list mirrors meta.py edition_pattern — keep in lockstep (a token missing
  // here makes that edition's reading view silently fall back to the splash).
  const m = (location.hash || '').match(/^#\/([a-z-]+)(?:\/(\d{4}-\d{2}-\d{2}(?:-(?:AM|PM|Deep-Dive))?))?$/);
  if (m && CH_BY_KEY[m[1]]) {
    if (activeKey !== m[1]) { activeKey = m[1]; resetChannelState(); }
    if (m[2] && CH().days.some(d => d.id === m[2])) {
      renderRead(m[2]); window.scrollTo(0, 0);
      const d = CH().days.find(x => x.id === m[2]);
      afterRoute(d ? d.headline : 'Reading'); return;
    }
    renderList(); window.scrollTo(0, 0); afterRoute(CH().label + ' briefings'); return;
  }
  renderSplash();          // home / index is the splash landing
  window.scrollTo(0, 0);
  afterRoute('Alpha Funnel home');
}

// SPA a11y: announce the new view to screen readers and move focus to the main landmark
function afterRoute(label) {
  const live = document.getElementById('live');
  if (live) live.textContent = label;
  const bar = document.getElementById('readbar');   // reset progress bar when leaving a reading view
  if (bar && !/^#\/[a-z-]+\/.+/.test(location.hash || '')) bar.style.width = '0%';
  const mainEl = document.getElementById('main');
  if (mainEl) { try { mainEl.focus({ preventScroll: true }); } catch (e) { mainEl.focus(); } }
}

function resetChannelState() { state.filter = null; state.showAllEntities = false; }

// Edition suffix as HTML: Deep-Dive gets a styled badge (the week's featured memo), AM/PM stay
// plain text. Dates and edition tokens come from the build's own filename regex, so these label
// functions are HTML-safe by construction — call sites inject them WITHOUT esc().
function editionSuffixHtml(ed, sep) {
  if (!ed) return '';
  if (ed === 'Deep-Dive') return ' <span class="dd-badge">Deep-Dive</span>';
  return (sep || ' · ') + ed;
}

// "2026-06-30" + "PM" -> "2026-06-30 · PM"; legacy (no edition) -> just the date
function editionLabel(d, sep) { return d.date + editionSuffixHtml(d.edition, sep); }

// friendly splash date: "2026-07-01" + "PM" -> "Jul 1 · PM" (parsed manually to avoid TZ shifts)
// MONTHS is inlined (not a module const) because init() runs before top-level consts initialize.
function prettyDate(iso) {
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  return m ? MONTHS[+m[2] - 1] + ' ' + (+m[3]) : (iso || '');
}
function splashDateLabel(d) {
  return prettyDate(d.date) + editionSuffixHtml(d.edition);
}
// long friendly date for the reading-view kicker: "2026-07-01" + "PM" -> "July 1, 2026 · PM"
function prettyDateFull(iso) {
  const M = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
    'August', 'September', 'October', 'November', 'December'];
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  return m ? M[+m[2] - 1] + ' ' + (+m[3]) + ', ' + m[1] : (iso || '');
}
function readKicker(d) {
  return prettyDateFull(d.date) + editionSuffixHtml(d.edition);
}

function go(hash) { location.hash = hash; }
function goChannel(key) { if (key !== activeKey) go('#/' + key); }
function goHome() {
  if (location.hash === '' || location.hash === '#' || location.hash === '#/') {
    renderSplash(); window.scrollTo(0, 0);       // already home; just re-render
  } else {
    go('#/');                                     // hashchange -> route() -> renderSplash
  }
}
// Reading view: <- older edition, -> newer. List view: j/k move through editions (Enter opens natively).
function keyNav(e) {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable)) return;
  if (elDrawer().classList.contains('open')) return;

  if (e.key === '/') { e.preventDefault(); openSearch(); return; }
  if (e.key === '?') { e.preventDefault(); openShortcuts(); return; }

  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const m = (location.hash || '').match(/^#\/([a-z-]+)\/(.+)$/);
    if (!m || !CH_BY_KEY[m[1]]) return;
    const days = CH_BY_KEY[m[1]].days;
    const i = days.findIndex(x => x.id === m[2]);
    if (i < 0) return;
    if (e.key === 'ArrowLeft' && days[i + 1]) go('#/' + m[1] + '/' + days[i + 1].id);
    if (e.key === 'ArrowRight' && days[i - 1]) go('#/' + m[1] + '/' + days[i - 1].id);
    return;
  }

  if (e.key === 'j' || e.key === 'k') {
    if (!/^#\/[a-z-]+$/.test(location.hash || '')) return;   // list view only
    const items = Array.from(document.querySelectorAll('#app .featured, #app .row'));
    if (!items.length) return;
    const cur = items.indexOf(document.activeElement);
    let next = cur === -1 ? (e.key === 'j' ? 0 : items.length - 1) : cur + (e.key === 'j' ? 1 : -1);
    next = Math.max(0, Math.min(items.length - 1, next));
    items[next].focus();
    e.preventDefault();
  }
}

// keep Tab focus inside the drawer while it is open (a11y focus-trap)
function trapTab(e) {
  if (e.key !== 'Tab' || !elDrawer().classList.contains('open')) return;
  const list = Array.from(elDrawer().querySelectorAll('a[href], button, [tabindex]:not([tabindex="-1"])'))
    .filter(el => el.offsetParent !== null);
  if (!list.length) return;
  const first = list[0], last = list[list.length - 1];
  if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
  else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
}

/* ---------- counts & filtering ---------- */

function countDaysWith(days, key, value) {
  return days.reduce((n, d) => n + ((d[key] || []).includes(value) ? 1 : 0), 0);
}

function topicChips() {
  const days = CH().days;
  const order = CH().topicOrder || [];
  const present = new Set();
  days.forEach(d => (d.topics || []).forEach(t => present.add(t)));
  const ordered = order.filter(t => present.has(t))
    .concat([...present].filter(t => !order.includes(t)).sort());
  return ordered.map(t => ({ value: t, label: TOPIC_LABEL[t] || cap(t), n: countDaysWith(days, 'topics', t) }));
}

function entityChips() {
  const days = CH().days;
  const present = new Set();
  days.forEach(d => (d.entities || []).forEach(t => present.add(t)));
  return [...present]
    .map(t => ({ value: t, label: t, n: countDaysWith(days, 'entities', t) }))
    .sort((a, b) => b.n - a.n || a.value.localeCompare(b.value));
}

function filteredDays() {
  const days = CH().days;
  if (!state.filter) return days;
  const { kind, value } = state.filter;
  const key = kind === 'topic' ? 'topics' : 'entities';
  return days.filter(d => (d[key] || []).includes(value));
}

/* ---------- entity history index (cross-channel threads) ----------
   Built once in init() from the in-memory CHANNELS. Every tagged entity gets a
   chronological trail of the editions that mentioned it, across all channels —
   the "story so far" for a ticker or name. Pure metadata: no bodies needed.
   (ENTITY_INDEX / SLUG_TO_ENTITY are declared up top so init() can populate them.) */

// Slugify an entity for the hash route: "$MU" -> "mu", "Strait of Hormuz" -> "strait-of-hormuz".
function entitySlug(name) {
  return String(name).toLowerCase().replace(/\$/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

function buildEntityIndex() {
  ENTITY_INDEX = new Map();
  SLUG_TO_ENTITY = new Map();
  CHANNELS.forEach(c => c.days.forEach(d => (d.entities || []).forEach(name => {
    if (!ENTITY_INDEX.has(name)) ENTITY_INDEX.set(name, []);
    ENTITY_INDEX.get(name).push({ ch: c, d });
  })));
  const RANK = { 'Deep-Dive': 4, PM: 3, '': 2, AM: 1 };
  for (const [name, list] of ENTITY_INDEX) {
    list.sort((a, b) => b.d.date.localeCompare(a.d.date) || (RANK[b.d.edition] ?? 2) - (RANK[a.d.edition] ?? 2));
    const slug = entitySlug(name);
    if (slug && !SLUG_TO_ENTITY.has(slug)) SLUG_TO_ENTITY.set(slug, name);   // first name wins on rare slug clash
  }
}

// Reading-view "Tracked" row: entity chips that deep-link to each entity's thread.
function entityMentionsRow(d) {
  const ents = (d.entities || []).filter(e => SLUG_TO_ENTITY.has(entitySlug(e)));
  if (!ents.length) return '';
  return `<div class="mentions"><span class="mentions-label">Tracked</span>` +
    ents.map(e => `<a class="ment" href="#/e/${entitySlug(e)}">${esc(e)}</a>`).join('') + `</div>`;
}

/* ---------- rising / cooling (mention momentum) ----------
   Entity mention-count delta over the newest 7 days vs the prior 7, within a channel.
   Anchored to the newest edition date (not wall-clock) so it is stable and testable. */
function risingEntities(days) {
  if (!days.length) return [];
  const DAY = 86400000;
  const anchor = new Date(days[0].date + 'T12:00:00');   // days are newest-first
  const cutThis = new Date(anchor.getTime() - 7 * DAY);
  const cutPrior = new Date(anchor.getTime() - 14 * DAY);
  const count = (from, to) => {
    const m = new Map();
    days.forEach(d => {
      const t = new Date(d.date + 'T12:00:00');
      if (t > from && t <= to) (d.entities || []).forEach(e => m.set(e, (m.get(e) || 0) + 1));
    });
    return m;
  };
  const now = count(cutThis, anchor), prior = count(cutPrior, cutThis);
  const names = new Set([...now.keys(), ...prior.keys()]);
  return [...names].map(e => ({ e, delta: (now.get(e) || 0) - (prior.get(e) || 0), now: now.get(e) || 0 }));
}

// Search snippet: ~150-char window around the first matching token, tokens marked. Input is
// raw text; we escape the slice THEN inject <mark> so bodies can't break out into markup.
function searchSnippet(text, toks) {
  const low = text.toLowerCase();
  let pos = -1;
  for (const t of toks) { const i = low.indexOf(t); if (i >= 0 && (pos < 0 || i < pos)) pos = i; }
  if (pos < 0) return '';
  const start = Math.max(0, pos - 60), end = Math.min(text.length, pos + 90);
  let s = esc((start > 0 ? '…' : '') + text.slice(start, end).replace(/\s+/g, ' ').trim() + (end < text.length ? '…' : ''));
  toks.forEach(t => {
    const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    s = s.replace(re, '<mark>$1</mark>');
  });
  return s;
}

function setFilter(kind, value) {
  if (state.filter && state.filter.kind === kind && state.filter.value === value) state.filter = null;
  else state.filter = { kind, value };
  const listHash = '#/' + activeKey;
  if (location.hash && location.hash !== listHash) go(listHash); // leave read view; route() renders
  else renderList();
}

/* ---------- splash / home ---------- */
// Minimal landing: one card per channel, each linking to that channel's newest edition.
function renderSplash() {
  const cards = CHANNELS.map(c => {
    const d = c.days.find(x => x.edition !== 'Deep-Dive') || c.days[0];  // hero = newest non-Deep-Dive briefing
    if (!d) {
      return `<div class="scard scard-empty">
          <div class="s-meta"><span class="s-name">${esc(c.label)}</span>
          <span class="s-date">No editions yet</span></div></div>`;
    }
    const dd = latestDeepDive(c.days);
    const ddRow = dd && dd.id !== d.id
      ? `<a class="s-dd" href="#/${c.key}/${dd.id}">
           <span class="dd-badge">Deep-Dive</span>
           <span class="s-dd-head">${esc(dd.headline)}</span>
           <span class="s-dd-date">${prettyDate(dd.date)}</span>
           <span class="s-dd-arrow">→</span>
         </a>` : '';
    return `<div class="scard-wrap"><a class="scard" href="#/${c.key}/${d.id}">
        <div class="s-meta">
          <span class="s-name">${esc(c.label)}${isNew(c.key, d.id) ? ' <span class="ndot"></span>' : ''}</span>
          <span class="s-date">${splashDateLabel(d)}</span>
        </div>
        <div class="s-head">${esc(d.headline)}</div>
      </a>${ddRow}</div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div class="wrap splash">
      ${topbar({ minimal: true })}
      <main id="main" class="splash-main" tabindex="-1">
        <div class="splash-inner">
          <div class="splash-cards">${cards}</div>
          <div class="splash-foot">
            ${CALLS.length ? '<a class="whatis" href="#/calls">Scoreboard</a>' : ''}
            <button class="whatis" data-whatis>What is this?</button>
          </div>
        </div>
      </main>
    </div>`;

  wireTopbar();
  const wi = document.querySelector('#app [data-whatis]');
  if (wi) wi.addEventListener('click', openWhatIs);
}

    '<p>Opinionated on purpose. And accountable: every level, dated catalyst, and thesis the briefings put a name on lands on the <a href="#/calls">Scoreboard</a>, tracked to resolution, wins and losses both.</p>' +
    '<p>Read it here, or subscribe to any channel by RSS.</p>' +
    '<p class="wi-tip">Tip: press <kbd>/</kbd> to search every edition, <kbd>?</kbd> for keyboard shortcuts.</p>';

}

/* Subscribe drawer — lists the RSS feed URLs with copy buttons (reuses the drawer shell). */
function feedBase() {
  if (typeof FEED_BASE !== 'undefined' && FEED_BASE) return FEED_BASE.replace(/\/$/, '');
  return location.origin + location.pathname.replace(/\/[^/]*$/, '');
}
function openSubscribe() {
  const base = feedBase();
  // derived from the live channel list so a channel split/retirement never leaves a dead feed link
  const feeds = [{ label: 'All channels', file: 'feed.xml' }]
    .concat(CHANNELS.map(c => ({ label: c.label, file: `feed-${c.key}.xml` })));
  const tag = document.querySelector('#drawer .drawer-tag');
  if (tag) tag.textContent = 'Subscribe';
  const src = document.getElementById('drawerSource');
  if (src) src.style.display = 'none';
  const rows = feeds.map(f => {
    const url = base + '/' + f.file;
    return `<div class="sub-row">
        <div class="sub-row-main"><span class="sub-name">${esc(f.label)}</span>
          <span class="sub-url">${esc(url)}</span></div>
        <button class="sub-copy" data-copy="${esc(url)}">Copy</button>
      </div>`;
  }).join('');
  const body = document.getElementById('drawerBody');
  body.innerHTML =
    '<p>Alpha Funnel publishes as RSS. Paste a feed URL into Readwise Reader (or any RSS app) and every new edition shows up automatically.</p>' +
    '<div class="sub-list">' + rows + '</div>' +
    '<p class="sub-hint">Use a single channel feed to follow just one beat.</p>';
  body.querySelectorAll('[data-copy]').forEach(b => {
    b.addEventListener('click', () => {
      const url = b.getAttribute('data-copy');
      const done = () => { b.textContent = 'Copied'; b.classList.add('done'); setTimeout(() => { b.textContent = 'Copy'; b.classList.remove('done'); }, 1400); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, done);
      else done();
    });
  });
  openDrawerShell();
  body.scrollTop = 0;
}

/* Quick-find: search headlines/subtitles/topics/entities across ALL channels (data is in memory). */
function openSearch() {
  const tag = document.querySelector('#drawer .drawer-tag');
  if (tag) tag.textContent = 'Search';
  const src = document.getElementById('drawerSource');
  if (src) src.style.display = 'none';
  const body = document.getElementById('drawerBody');
  body.innerHTML =
    '<input class="search-input" type="search" placeholder="Search all editions…" aria-label="Search all editions" autocomplete="off" spellcheck="false">' +
    '<div class="search-results" id="searchResults"></div>';
  const input = body.querySelector('.search-input');
  const results = body.querySelector('#searchResults');
  // Full-text where bodies are in memory (published standalone embeds them); metadata-only otherwise.
  const all = CHANNELS.flatMap(c => c.days.map(d => {
    const text = [d.headline, d.subtitle || '', d.body || ''].join('  ');
    return {
      ch: c, d, text,
      hay: (text + ' ' + (d.topics || []).map(t => TOPIC_LABEL[t] || t).join(' ') + ' ' + (d.entities || []).join(' ')).toLowerCase()
    };
  }));
  const render = () => {
    const q = input.value.trim().toLowerCase();
    const toks = q ? q.split(/\s+/) : [];
    let list = toks.length ? all.filter(x => toks.every(t => x.hay.includes(t))) : all;
    const total = list.length;
    list = list.slice(0, 25);
    if (!list.length) { results.innerHTML = '<p class="empty">No editions match.</p>'; return; }
    const count = q ? `<div class="sr-count">${total} edition${total === 1 ? '' : 's'} match${total === 1 ? 'es' : ''}</div>` : '';
    results.innerHTML = count + list.map(x => {
      const snip = q ? searchSnippet(x.text, toks) : '';
      return `<a class="sr-row" href="#/${x.ch.key}/${x.d.id}" data-go="#/${x.ch.key}/${x.d.id}">` +
        `<span class="sr-meta">${esc(x.ch.label)} · ${splashDateLabel(x.d)}</span>` +
        `<span class="sr-title">${esc(x.d.headline)}</span>` +
        (snip ? `<span class="sr-snip">${snip}</span>` : '') + `</a>`;
    }).join('');
    results.querySelectorAll('[data-go]').forEach(a =>
      a.addEventListener('click', e => { e.preventDefault(); closeDrawer(); go(a.dataset.go); }));
  };
  input.addEventListener('input', render);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const first = results.querySelector('[data-go]'); if (first) { e.preventDefault(); closeDrawer(); go(first.dataset.go); } }
  });
  render();
  openDrawerShell();
  setTimeout(() => input.focus(), 30);   // override the shell's focus-on-close-button
}

/* Share the canonical (public, server-addressable) page for an edition. */
function shareEdition(d, btn) {
  const url = feedBase() + '/' + activeKey + '/' + d.id + '.html';
  if (navigator.share) { navigator.share({ title: d.headline, url }).catch(() => {}); return; }
  const done = () => { if (btn) { btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = 'Share'; }, 1400); } };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, done);
  else done();
}

/* Reading-progress bar (thin top bar); only active in a reading view. */
let _scrollRAF = 0;
function onReadScroll() {
  if (_scrollRAF) return;
  _scrollRAF = requestAnimationFrame(() => {
    _scrollRAF = 0;
    const bar = document.getElementById('readbar');
    if (!bar) return;
    const inRead = /^#\/[a-z-]+\/.+/.test(location.hash || '');
    if (!inRead) { bar.style.width = '0%'; return; }
    const h = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (h > 0 ? Math.min(100, (window.scrollY / h) * 100) : 0) + '%';
  });
}

/* ---------- list view ---------- */

function renderList() {
  const days = filteredDays();
  const f = state.filter;

  const topics = topicChips();
  const entities = entityChips();
  const shownEntities = state.showAllEntities ? entities : entities.slice(0, TOP_ENTITIES);

  const topicRow = topics.map(c => chip('topic', c, f)).join('');
  let entityRow = shownEntities.map(c => chip('entity', c, f)).join('');
  if (entities.length > TOP_ENTITIES) {
    entityRow += `<button class="chip more" data-act="toggleEntities">` +
      (state.showAllEntities ? 'show fewer' : `show all (${entities.length})`) + `</button>`;
  }

  const threadLink = f && f.kind === 'entity' && SLUG_TO_ENTITY.has(entitySlug(f.value))
    ? `<a class="thread-link" href="#/e/${entitySlug(f.value)}">full thread →</a> ` : '';
  const activeNote = f
    ? `<div class="filter-note">Filtered to <strong>${esc(f.kind === 'topic' ? (TOPIC_LABEL[f.value] || cap(f.value)) : f.value)}</strong>` +
      ` — ${days.length} briefing${days.length === 1 ? '' : 's'} ` +
      threadLink +
      `<button class="clear" data-act="clear">clear ✕</button></div>`
    : '';

  // Rising / cooling momentum strip (unfiltered view only).
  const mom = f ? [] : risingEntities(CH().days);
  const up = mom.filter(x => x.delta > 0).sort((a, b) => b.delta - a.delta || b.now - a.now).slice(0, 6);
  const down = mom.filter(x => x.delta < 0).sort((a, b) => a.delta - b.delta).slice(0, 3);
  const riseChip = (x, dir) =>
    `<a class="rise ${dir}" href="#/e/${entitySlug(x.e)}">${esc(x.e)}` +
    `<span class="rise-d">${dir === 'up' ? '▲' : '▼'}${Math.abs(x.delta)}</span></a>`;
  const risingHtml = up.length
    ? `<section class="rising" aria-label="Rising and cooling mentions this week">
        <span class="rising-label">Rising</span>${up.map(x => riseChip(x, 'up')).join('')}` +
      (down.length ? `<span class="rising-label cool">Cooling</span>${down.map(x => riseChip(x, 'dn')).join('')}` : '') +
      `</section>`
    : '';

  // Hero is the newest non-Deep-Dive edition, so a Sunday memo never displaces the day's AM/PM run.
  const heroDay = days.find(d => d.edition !== 'Deep-Dive') || days[0];
  // distinguish "your filter matched nothing" from "this channel has not published yet"
  // (all three new channels sit empty between the 2026-08-04 split and their first run)
  const emptyMsg = f ? 'No briefings match this filter.' : 'No editions on this channel yet. The first one lands with the next run.';
  const featured = heroDay ? featuredCard(heroDay) : `<p class="empty">${emptyMsg}</p>`;
  const dd = f ? null : latestDeepDive(CH().days);
  const pinned = dd && (!heroDay || dd.id !== heroDay.id) ? pinnedCard(dd) : '';
  const shown = new Set([heroDay && heroDay.id, pinned && dd.id].filter(Boolean));
  const rest = days.filter(d => !shown.has(d.id)).map(rowItem).join('');

  document.getElementById('app').innerHTML = `
    <main id="main" class="wrap" tabindex="-1">
      ${topbar()}
      <section class="filters">
        <div class="filter-group">
          <span class="filter-label">Topics</span>
          <div class="chips">${topicRow || '<span class="muted">—</span>'}</div>
        </div>
        <div class="filter-group">
          <span class="filter-label">${esc(CH().secondLabel || 'Tickers')}</span>
          <div class="chips">${entityRow || '<span class="muted">—</span>'}</div>
        </div>
        ${activeNote}
      </section>
      ${risingHtml}
      ${featured}
      ${pinned}
      ${rest ? `<div class="list">${rest}</div>` : ''}
    </main>`;

  wireTopbar();
  document.querySelectorAll('#app [data-act]').forEach(b => {
    b.addEventListener('click', () => {
      const act = b.dataset.act;
      if (act === 'toggleEntities') { state.showAllEntities = !state.showAllEntities; renderList(); }
      else if (act === 'clear') { state.filter = null; renderList(); }
    });
  });
  document.querySelectorAll('#app .chip[data-kind]').forEach(c => {
    c.addEventListener('click', () => setFilter(c.dataset.kind, c.dataset.value));
  });
  document.querySelectorAll('#app [data-id]').forEach(a => {
    a.addEventListener('click', e => { e.preventDefault(); go('#/' + activeKey + '/' + a.dataset.id); });
  });
}

function chip(kind, c, f) {
  const active = f && f.kind === kind && f.value === c.value;
  return `<button class="chip${active ? ' active' : ''}" data-kind="${kind}" data-value="${esc(c.value)}">` +
    `${esc(c.label)} <span class="ct">(${c.n})</span></button>`;
}

function featuredCard(d) {
  return `<a class="featured" href="#/${activeKey}/${d.id}" data-id="${d.id}">
      <div class="kicker">Latest briefing · ${editionLabel(d, ' ')}${isNew(activeKey, d.id) ? ' <span class="ndot"></span>' : ''}</div>
      <h1 class="f-title">${esc(d.headline)}</h1>
      ${d.subtitle ? `<p class="f-sub">${esc(d.subtitle)}</p>` : ''}
      <div class="f-tags">${(d.topics || []).map(t => `<span class="tg">${esc(TOPIC_LABEL[t] || cap(t))}</span>`).join('')}</div>
      <span class="keepreading">Keep reading →</span>
    </a>`;
}

// Week-long Deep-Dive pin: the latest weekly memo stays discoverable below the featured
// daily until the next Sunday memo replaces it (8-day freshness window). Callers skip it
// when the memo IS the newest edition, so it never double-shows with the featured card.
function latestDeepDive(days) {
  const dd = (days || []).find(d => d.edition === 'Deep-Dive');
  if (!dd) return null;
  const ageDays = (Date.now() - new Date(dd.date + 'T12:00:00')) / 86400000;
  return ageDays <= 8 ? dd : null;
}

function pinnedCard(d) {
  return `<a class="pin-dd" href="#/${activeKey}/${d.id}" data-id="${d.id}">
      <span class="pin-kicker"><span class="dd-badge">Deep-Dive</span> ${prettyDate(d.date)}</span>
      <span class="pin-title">${esc(d.headline)}</span>
      <span class="pin-arrow">→</span>
    </a>`;
}

function rowItem(d) {
  return `<a class="row" href="#/${activeKey}/${d.id}" data-id="${d.id}">
      <span class="r-date">${editionLabel(d)}${isNew(activeKey, d.id) ? ' <span class="ndot"></span>' : ''}</span>
      <span class="r-title">${esc(d.headline)}</span>
    </a>`;
}

/* ---------- entity thread (the story so far for one ticker / name) ---------- */
function renderEntityThread(slug) {
  const name = SLUG_TO_ENTITY.get(slug);
  const list = ENTITY_INDEX.get(name) || [];
  const dates = list.map(x => x.d.date);
  const span = dates.length
    ? (dates[dates.length - 1] === dates[0] ? prettyDate(dates[0])
       : `${prettyDate(dates[dates.length - 1])} – ${prettyDate(dates[0])}`) : '';
  const breakdown = CHANNELS
    .map(c => ({ c, n: list.filter(x => x.ch.key === c.key).length }))
    .filter(x => x.n)
    .map(x => `${esc(x.c.label)} ${x.n}`).join('  ·  ');
  const rows = list.map(x => {
    const d = x.d;
    // the passage that actually mentions the entity (build_manifest extracts it);
    // fall back to the edition headline for editions built before mentions existed
    const ex = (d.mentions || {})[name];
    return `<a class="th-row" href="#/${x.ch.key}/${d.id}">
        <span class="th-date">${prettyDate(d.date)}${editionSuffixHtml(d.edition)}</span>
        <span class="th-ch th-ch-${x.ch.key}">${esc(x.ch.label)}</span>
        <span class="th-head">${ex ? `<span class="th-ex">${esc(ex)}</span><span class="th-from">${esc(d.headline)}</span>` : esc(d.headline)}</span>
      </a>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <main id="main" class="wrap" tabindex="-1">
      ${topbar()}
      <a class="back" href="#/" data-home>← Home</a>
      <header class="thread-head">
        <div class="kicker">Thread</div>
        <h1 class="th-title">${esc(name)}</h1>
        <p class="th-meta">${list.length} mention${list.length === 1 ? '' : 's'}${breakdown ? ' · ' + breakdown : ''}${span ? ' · ' + span : ''}</p>
      </header>
      <div class="thread-list">${rows || '<p class="empty">No mentions.</p>'}</div>
    </main>`;

  wireTopbar();
}

/* ---------- scoreboard (the calls ledger, kept in public) ---------- */

// newest edition date across channels = "today" for the ledger (stable, not wall-clock)
function newestEditionDate() {
  let best = '';
  CHANNELS.forEach(c => { if (c.days[0] && c.days[0].date > best) best = c.days[0].date; });
  return best;
}

function callRow(c, anchor) {
  const label = c.ticker || c.name || '';
  const slug = entitySlug(c.ticker || c.name || '');
  const tick = slug && SLUG_TO_ENTITY.has(slug)
    ? `<a class="sc-tick" href="#/e/${slug}">${esc(label)}</a>`
    : (label ? `<span class="sc-tick">${esc(label)}</span>` : '');
  const attr = (c.attribution && c.attribution !== 'house')
    ? `<span class="sc-attr">${esc(c.attribution)}</span>`
    : `<span class="sc-attr sc-house">house</span>`;
  let due = '';
  if (c.due && c.status === 'open') {
    const soon = anchor && c.due <= addDays(anchor, 2);
    due = `<span class="sc-due${soon ? ' soon' : ''}">due ${prettyDate(c.due)}</span>`;
  }
  const levels = c.levels ? `<span class="sc-levels">${esc(c.levels)}</span>` : '';
  const res = c.resolution
    ? `<div class="sc-res">${esc(c.resolution)}${c.resolved_edition ? ` <span class="sc-resed">(${esc(c.resolved_edition)})</span>` : ''}</div>` : '';
  return `<div class="sc-row sc-st-${esc(c.status || 'open')}">
      <div class="sc-top">
        <span class="sc-badge sc-${esc(c.status || 'open')}">${esc(c.status || 'open')}</span>
        ${tick}
        <span class="sc-date">${prettyDate(c.date)}</span>
        ${attr}${due}
      </div>
      <div class="sc-call">${esc(c.call || '')}</div>
      ${levels}${res}</div>`;
}

function addDays(iso, n) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  if (!m) return iso;
  const t = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3] + n));
  return t.toISOString().slice(0, 10);
}

function renderScoreboard() {
  const anchor = newestEditionDate();
  const settled = CALLS.filter(c => c.status && c.status !== 'open');
  const decided = settled.filter(c => c.status === 'hit' || c.status === 'miss');
  const house = decided.filter(c => (c.attribution || '') === 'house');
  const rec = list => `${list.filter(c => c.status === 'hit').length}–${list.filter(c => c.status === 'miss').length}`;
  const openCalls = CALLS.filter(c => c.status === 'open' && c.kind !== 'catalyst');
  const calendar = CALLS.filter(c => c.status === 'open' && c.kind === 'catalyst')
    .slice().sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999'));
  const settledSorted = settled.slice().sort((a, b) =>
    ((b.resolved_edition || b.date)).localeCompare(a.resolved_edition || a.date));

  const stats = decided.length
    ? `<div class="sc-stats">
        <span class="sc-stat"><strong>${rec(house)}</strong> house record</span>
        <span class="sc-stat"><strong>${rec(decided)}</strong> all calls</span>
        <span class="sc-stat"><strong>${openCalls.length + calendar.length}</strong> open</span>
      </div>`
    : `<div class="sc-stats"><span class="sc-stat"><strong>${openCalls.length + calendar.length}</strong> open</span></div>`;

  const section = (title, list, empty) =>
    `<section class="sc-section"><h2 class="sc-h">${title}</h2>` +
    (list.length ? list.map(c => callRow(c, anchor)).join('') : `<p class="empty">${empty}</p>`) +
    `</section>`;

  document.getElementById('app').innerHTML = `
    <main id="main" class="wrap" tabindex="-1">
      ${topbar()}
      <header class="thread-head">
        <div class="kicker">Scoreboard</div>
        <h1 class="th-title">The calls, kept in public</h1>
        <p class="th-meta">Every level, dated catalyst, and thesis the briefings put a name on, tracked to
          resolution. Wins and losses both. Relayed calls stay credited to their source.</p>
        ${stats}
      </header>
      ${section('Open calls', openCalls, 'No open calls right now.')}
      ${section('On the calendar', calendar, 'Nothing dated on the calendar.')}
      ${section('Settled', settledSorted, 'Nothing settled yet. The ledger is young.')}
    </main>`;

  wireTopbar();
}

/* ---------- reading view ---------- */

async function renderRead(id) {
  const d = CH().days.find(x => x.id === id);
  markSeen(activeKey, id);
  const days = CH().days;
  const idx = days.findIndex(x => x.id === id);
  const older = idx >= 0 ? days[idx + 1] : null;   // older edition (further back)
  const newer = idx > 0 ? days[idx - 1] : null;    // newer edition
  const navHtml =
    (older ? `<a class="ed-prev" href="#/${activeKey}/${older.id}">← ${splashDateLabel(older)}</a>` : '<span></span>') +
    (newer ? `<a class="ed-next" href="#/${activeKey}/${newer.id}">${splashDateLabel(newer)} →</a>` : '<span></span>');

  document.getElementById('app').innerHTML = `
    <main id="main" class="wrap read" tabindex="-1">
      ${topbar()}
      <a class="back" href="#/${activeKey}" data-back>← All ${esc(CH().label)} briefings</a>
      <article class="article">
        <div class="kicker">${readKicker(d)}<span id="readtime"></span><button class="share-btn" data-share aria-label="Share this edition">Share</button></div>
        <h1 class="a-title">${esc(d.headline)}</h1>
        ${d.subtitle ? `<p class="a-sub">${esc(d.subtitle)}</p>` : ''}
        <div class="a-tags">${(d.topics || []).map(t => `<a class="tg" href="#" data-topic="${esc(t)}">${esc(TOPIC_LABEL[t] || cap(t))}</a>`).join('')}</div>
        ${entityMentionsRow(d)}
        <hr/>
        <div id="body" class="body"><p class="muted">loading…</p></div>
      </article>
      <nav class="edition-nav" aria-label="Editions in this channel">${navHtml}</nav>
    </main>`;

  wireTopbar();
  document.querySelectorAll('#app [data-topic]').forEach(a => {
    a.addEventListener('click', e => { e.preventDefault(); setFilter('topic', a.dataset.topic); });
  });
  const sb = document.querySelector('#app [data-share]');
  if (sb) sb.addEventListener('click', () => shareEdition(d, sb));

  let md;
  try { md = await getBody(d); }
  catch (e) { document.getElementById('body').innerHTML = `<p class="empty">Couldn't load this briefing. (${esc(String(e))})</p>`; return; }

  const body = document.getElementById('body');
  body.innerHTML = marked.parse(preprocess(stripTopMatter(md)));
  enhance(body);
  styleCashtags(body);
  buildTOC(body);
  // on ticker channels the cashtags ARE the entity filter, so make body cashtags click to filter
  if (CH() && CH().secondSource === 'cashtags') {
    body.querySelectorAll('.cashtag').forEach(s => {
      s.classList.add('clickable');
      s.setAttribute('role', 'button');
      s.setAttribute('tabindex', '0');
      s.addEventListener('click', () => setFilter('entity', s.dataset.cash));
      s.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setFilter('entity', s.dataset.cash); } });
    });
  }

  // reading time from the rendered text (~230 wpm)
  const words = (body.textContent || '').trim().split(/\s+/).filter(Boolean).length;
  const rt = document.getElementById('readtime');
  if (rt && words) rt.textContent = ` · ${Math.max(1, Math.round(words / 230))} min read`;
}

// drop the original H1, cross-channel nav line, and the meta lines we render ourselves
function stripTopMatter(md) {
  const lines = md.split('\n');
  const out = [];
  let h1Stripped = false;
  for (const ln of lines) {
    // drop the first H1 (the site shows the headline itself); also the legacy nav/provenance lines
    if (!h1Stripped && /^#\s+\S/.test(ln)) { h1Stripped = true; continue; }
    if (/^\*\*Part of the Alpha Funnel/.test(ln)) continue;
    if (/^\*\*(Headline|Subtitle|Topics|Entities|Date|Coverage window|Sources this edition|Scope):\*\*/.test(ln)) continue;
    out.push(ln);
  }
  // collapse any leading blank lines / orphan rule
  return out.join('\n').replace(/^\s*(?:---\s*)?\n+/, '');
}

// rewrite Obsidian wikilinks: briefing links become internal read-view links; others -> plain label
function preprocess(md) {
  md = md.replace(/\[\[Daily Briefing \(([^)]+)\) - (\d{4}-\d{2}-\d{2})(?: \((AM|PM|Deep-Dive)\))?\|([^\]]+)\]\]/g,
    (_, chan, date, ed, label) => {
      const key = LABEL_TO_KEY[chan.trim()] || activeKey;
      const id = ed ? date + '-' + ed : date;
      return `[${label}](#/${key}/${id})`;
    });
  md = md.replace(/\[\[[^|\]]*\|([^\]]+)\]\]/g, '$1');
  md = md.replace(/\[\[([^\]]+)\]\]/g, '$1');
  return md;
}

// build an "In this edition" jump list from the bold section lead-ins the briefings already use
// (e.g. "**The close.**", "**1. …**"). No change to how briefings are written; scroll by element ref
// (not a hash link) so it never collides with the app's hash router.
function buildTOC(body) {
  const secs = [];
  Array.from(body.children).forEach((el, i) => {
    if (el.tagName !== 'P') return;
    const strong = el.firstElementChild;
    if (!strong || strong.tagName !== 'STRONG' || el.firstChild !== strong) return;
    const label = strong.textContent.trim().replace(/[.:]\s*$/, '');
    // Numbered leads ("1. …") are unambiguously section headers — keep them even when the
    // sentence runs long. Only the length cap (which guards against stray bold emphasis) applies
    // to un-numbered leads.
    const numbered = /^\d+\.\s/.test(label);
    if (!label || (!numbered && label.length > 90)) return;
    el.id = 'sec-' + i;
    // Tidy an over-long lead-in for the jump list: cut at the first clause break, else ellipsize.
    let display = label;
    if (label.length > 72) {
      const head = label.slice(0, 72);
      const comma = head.lastIndexOf(', ');
      display = (comma > 24 ? head.slice(0, comma) : head.replace(/\s+\S*$/, '')) + '…';
    }
    secs.push({ id: el.id, label: display });
  });
  if (secs.length < 3) return;
  const toc = document.createElement('nav');
  toc.className = 'toc';
  toc.setAttribute('aria-label', 'In this edition');
  toc.innerHTML = '<div class="toc-h">In this edition</div><ul>' +
    secs.map(s => `<li><a href="#" data-toc="${s.id}">${esc(s.label)}</a></li>`).join('') + '</ul>';
  body.parentNode.insertBefore(toc, body);
  const links = {};
  toc.querySelectorAll('[data-toc]').forEach(a => {
    links[a.dataset.toc] = a;
    a.addEventListener('click', e => {
      e.preventDefault();
      const t = document.getElementById(a.dataset.toc);
      if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
  // scroll-spy: highlight the section currently near the top
  if ('IntersectionObserver' in window) {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (en.isIntersecting) {
          Object.values(links).forEach(l => l.classList.remove('active'));
          if (links[en.target.id]) links[en.target.id].classList.add('active');
        }
      });
    }, { rootMargin: '-84px 0px -70% 0px' });
    secs.forEach(s => { const el = document.getElementById(s.id); if (el) obs.observe(el); });
  }
}

// wrap $CASHTAG tokens in the rendered body so tickers pop (text nodes only; skips links/code)
function styleCashtags(scope) {
  const walker = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      const p = n.parentNode;
      if (!p) return NodeFilter.FILTER_REJECT;
      const t = p.nodeName;
      if (t === 'A' || t === 'CODE' || t === 'PRE' || (p.classList && p.classList.contains('cashtag'))) return NodeFilter.FILTER_REJECT;
      return /\$[A-Z]{1,5}\b/.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const targets = [];
  let node;
  while ((node = walker.nextNode())) targets.push(node);
  targets.forEach(t => {
    const s = t.nodeValue, frag = document.createDocumentFragment(), re = /\$[A-Z]{1,5}\b/g;
    let last = 0, m;
    while ((m = re.exec(s))) {
      if (m.index > last) frag.appendChild(document.createTextNode(s.slice(last, m.index)));
      const span = document.createElement('span');
      span.className = 'cashtag';
      span.textContent = m[0];
      span.dataset.cash = m[0];
      frag.appendChild(span);
      last = m.index + m[0].length;
    }
    if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
    t.parentNode.replaceChild(frag, t);
  });
}

function idFromHref(href) {
  let m = href.match(/\/read\/([a-z0-9]+)/i); if (m) return m[1];
  m = href.match(/\/status\/(\d+)/); if (m) return m[1];
  return null;
}

function enhance(scope) {
  scope.querySelectorAll('a').forEach(a => {
    const href = a.getAttribute('href') || '';
    if (href.startsWith('#/')) {                 // internal briefing link
      a.classList.add('xlink');
      a.addEventListener('click', e => { e.preventDefault(); go(href); });
      return;
    }
    const id = idFromHref(href);
    if (id && DEEP_IDS.has(id)) {
      a.classList.add('cite-zoom');
      a.addEventListener('click', e => { e.preventDefault(); openDrawer(id, href); });
    } else {
      a.classList.add('cite-plain');
      a.target = '_blank'; a.rel = 'noopener';
    }
  });
}

/* ---------- deep-dive drawer ---------- */

async function openDrawer(id, href) {
  const tag = document.querySelector('#drawer .drawer-tag');
  if (tag) tag.textContent = 'Zoom-in';        // restore (openWhatIs may have changed it)
  const src = document.getElementById('drawerSource');
  src.style.display = '';
  src.href = href;
  const body = document.getElementById('drawerBody');
  body.innerHTML = '<p class="empty">Loading deep-dive…</p>';
  openDrawerShell();
  const md = await getDeep(id);
  if (md == null) {
    body.innerHTML = `<p class="empty">No zoom-in has been written for this source yet. Use the ` +
      `<strong>open original ↗</strong> link above to read it at the source.</p>`;
  } else {
    body.innerHTML = marked.parse(md);
  }
  body.scrollTop = 0;
}

// open the drawer and move focus into it; remember the trigger so we can restore focus on close
function openDrawerShell() {
  elDrawer()._trigger = document.activeElement;
  elDrawer().classList.add('open');
  elDrawer().setAttribute('aria-hidden', 'false');
  elScrim().hidden = false;
  const closeBtn = document.getElementById('drawerClose');
  if (closeBtn) closeBtn.focus();
}

function closeDrawer() {
  if (!elDrawer().classList.contains('open')) return;
  elDrawer().classList.remove('open');
  elDrawer().setAttribute('aria-hidden', 'true');
  elScrim().hidden = true;
  const t = elDrawer()._trigger;
  elDrawer()._trigger = null;
  if (t && typeof t.focus === 'function') t.focus();   // restore focus to the trigger
}

/* ---------- data access (embedded or fetched) ---------- */

async function getBody(day) {
  if (day.body != null) return day.body;
  return fetchText(day.path);
}
async function getDeep(id) {
  if (DEEP) return DEEP[id] != null ? DEEP[id] : null;
  try { return await fetchText(`deep-dives/${id}.md`); }
  catch (e) { return null; }
}

/* ---------- topbar (brand + channel nav) + theme ---------- */

function topbar(opts) {
  const minimal = !!(opts && opts.minimal);
  const sep = '<span class="sep">·</span>';
  const onCalls = (location.hash || '') === '#/calls';
  const links = sep + CHANNELS.map(c =>
    `<a class="chan${c.key === activeKey && !onCalls ? ' active' : ''}" data-chan="${c.key}" href="#/${c.key}">${esc(c.label)}` +
    `${channelHasNew(c) ? '<span class="ndot" aria-label="new editions"></span>' : ''}</a>`
  ).join(sep) +
    (CALLS.length ? sep + `<a class="chan${onCalls ? ' active' : ''}" href="#/calls">Scoreboard</a>` : '');
  const nav = minimal ? '' : `<nav class="chan-nav">${links}</nav>`;
  return `<header class="topbar${minimal ? ' minimal' : ''}">
      <a class="brand" data-home href="#/" title="Alpha Funnel home">Alpha&nbsp;Funnel</a>
      ${nav}
      <div class="spacer"></div>
      <button class="icon-btn" data-search title="Search (press /)" aria-label="Search editions">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><line x1="15.2" y1="15.2" x2="21" y2="21" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button class="sub-btn" data-subscribe title="Subscribe by RSS" aria-label="Subscribe by RSS">Subscribe</button>
      <a class="x-link" href="https://x.com/KairosLLM" target="_blank" rel="noopener"
         title="@KairosLLM on X" aria-label="X (@KairosLLM)">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor"
          d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </a>
      <button class="theme-toggle" data-theme-toggle title="Toggle light / dark"
        aria-label="Toggle light or dark theme"
        aria-pressed="${document.documentElement.getAttribute('data-theme') === 'dark'}">
        <span class="t-ico" aria-hidden="true"></span></button></header>`;
}

function wireTopbar() {
  document.querySelectorAll('#app [data-chan]').forEach(a => {
    a.addEventListener('click', e => { e.preventDefault(); goChannel(a.dataset.chan); });
  });
  const back = document.querySelector('#app [data-back]');
  if (back) back.addEventListener('click', e => { e.preventDefault(); go('#/' + activeKey); });
  const home = document.querySelector('#app [data-home]');
  if (home) home.addEventListener('click', e => { e.preventDefault(); goHome(); });
  const tt = document.querySelector('#app [data-theme-toggle]');
  if (tt) tt.addEventListener('click', toggleTheme);
  const sub = document.querySelector('#app [data-subscribe]');
  if (sub) sub.addEventListener('click', openSubscribe);
  const srch = document.querySelector('#app [data-search]');
  if (srch) srch.addEventListener('click', openSearch);
}

function initTheme() {
  let t = null;
  try { t = localStorage.getItem('af-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    // no stored choice: follow the OS (the toggle still wins once used)
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', cur);
  const tt = document.querySelector('#app [data-theme-toggle]');
  if (tt) tt.setAttribute('aria-pressed', String(cur === 'dark'));
  try { localStorage.setItem('af-theme', cur); } catch (e) {}
}

/* ---------- utils ---------- */

function cap(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
async function fetchText(path) {
  const r = await fetch(encodeURI(path), { cache: 'no-store' });
  if (!r.ok) throw new Error(r.status + ' ' + path);
  return r.text();
}
async function fetchJSON(path) { return JSON.parse(await fetchText(path)); }

// PWA: register the service worker on the served site (silently ignored on file://)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

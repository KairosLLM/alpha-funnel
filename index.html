l, "resolved_edition": null}, {"id": "2026-07-28-AM-realrates-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "macro", "ticker": null, "name": "AI complex derating", "kind": "thesis", "call": "The proximate cause of the AI selloff is roughly 50 basis points of higher real rates driven by Warsh indicating hikes and planning balance-sheet runoff, and the market is ahead of analysts, who have not yet cut semis EPS estimates.", "direction": "short", "levels": "~50bps higher real rates", "due": "2026-10-31", "attribution": "Alex Corrino", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-AM-rates-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "macro", "ticker": null, "name": "Long-end yields", "kind": "catalyst", "call": "The 30-year Treasury ended last week at 5.17 percent, its highest weekly close since July 2007, and the hyperscaler CDS basket widened another 3bps to a record.", "direction": "short", "levels": "30-year 5.17 percent", "due": "2026-10-31", "attribution": "Charlie Bilello and zerohedge", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-AM-oil-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "macro", "ticker": null, "name": "Oil range", "kind": "thesis", "call": "Oil oscillates in a $70 to $110 range while mediated US-Iran talks continue with no real concessions on the Strait of Hormuz, against Macquarie modelling a glut on a deal before the midterms.", "direction": "neutral", "levels": "$70-110 range", "due": "2026-11-03", "attribution": "Anas Alhajji", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-AM-netanyahu-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "news", "ticker": null, "name": "Trump-Netanyahu meeting", "kind": "catalyst", "call": "Trump hosts Netanyahu today after praising Turkey and criticising Israel, with Netanyahu reportedly bringing intelligence on Iran's Pickaxe Mountain nuclear facility, and Polymarket pricing a hug at 31 percent.", "direction": "event", "levels": "hug at 31 percent", "due": "2026-07-28", "attribution": "zerohedge and Polymarket", "status": "hit", "resolution": "The meeting happened. Netanyahu arrived 11:01am ET; Trump's separate Zelensky talks had begun at 9:47am.", "resolved_edition": "2026-07-28-PM"}, {"id": "2026-07-28-AM-memory-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "stocks", "ticker": null, "name": "Memory supply", "kind": "thesis", "call": "The memory supply story is intact at 75/25, raised from 70/30, because contract prices ran up 90 to 95 percent quarter over quarter with capacity sold out for the year and no meaningful new fabs until late 2027.", "direction": "long", "levels": "DRAM +90-95 pct QoQ", "due": "2026-12-31", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-AM-industrials-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "macro", "ticker": null, "name": "Sector rotation", "kind": "thesis", "call": "The money leaving megacap tech since June went into industrials rather than financials or energy, with Caterpillar, GE Vernova, GE Aerospace, RTX, Eaton and Boeing named, and the Russell 2000 up since June while the Nasdaq topped.", "direction": "long", "levels": null, "due": "2026-12-31", "attribution": "BowTied Bull, corroborated by Yardeni Research", "status": "open", "resolution": "Marked against, not resolved. On July 28 XLI fell while the Dow rose one percent, and Caterpillar fell on data-centre exposure while Deere rose. One session does not settle a call dated to 2026-12-31, so it stays open.", "resolved_edition": null}, {"id": "2026-07-28-AM-fed-2", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "investing", "ticker": null, "name": "July FOMC", "kind": "catalyst", "call": "Four institutions on three sides of the same meeting: Kalshi 73 percent hold, aixbt reads 33 percent hike, Polymarket 73 percent no change and 26 percent hike, Citadel Securities expects a hike, Citigroup expects a hold.", "direction": "event", "levels": "Kalshi 73 hold, Polymarket 26 hike", "due": "2026-07-29", "attribution": "Kalshi, Polymarket, Citadel and Citigroup", "status": "hit", "resolution": "Kalshi, Polymarket and Citigroup were right on the hold. Citadel Securities, which had flipped its forecast to a hike, was wrong, and the hike price never got above 26 to 27 percent.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-28-AM-fed-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "investing", "ticker": null, "name": "July FOMC", "kind": "thesis", "call": "A hold is 78/22, revised UP from 75/25 this morning because Kalshi's hold leg recovered to 77 from an intraday 75 and Bespoke's hike odds fell to 29, which outweighs Citadel Securities' hike position and CME's just-under-40. A statement hawkish enough to move the tape is 55/45, revised down from 60/40. Revised in place across the 07-28 AM and PM editions rather than appended, to stop the six-entry pileup on one decision.", "direction": "neutral", "levels": "hold 75/25, hawkish statement 60/40", "due": "2026-07-29", "attribution": "house", "status": "hit", "resolution": "Both legs landed. The hold came in at 78/22 and the hawkish-statement leg at 55/45, and Warsh delivered the pause with none of the relief. Citadel Securities, whose hike position I weighed against, was wrong.", "resolved_edition": "2026-07-29-PM", "revised_edition": "2026-07-28-PM"}, {"id": "2026-07-28-AM-anthropic-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "stocks", "ticker": null, "name": "Anthropic IPO timing", "kind": "catalyst", "call": "Anthropic filed to go public on June 1 targeting an October Nasdaq listing near $965 billion, which places the open-weights position paper four months ahead of an offering whose valuation rests on a closed moat.", "direction": "event", "levels": "~$965B target", "due": "2026-10-31", "attribution": "sudoingX", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-AM-abqaiq-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "macro", "ticker": null, "name": "Abqaiq strike scale", "kind": "thesis", "call": "The Abqaiq strike reported on July 27 was inflated by two accounts recirculating September 14 2019 articles, photographs and Saudi Energy Minister statements as current. Attacks did occur and are nothing relative to 2019.", "direction": "event", "levels": null, "due": "2026-08-15", "attribution": "Anas Alhajji", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-AM-SPCX-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "stocks", "ticker": "$SPCX", "name": "SpaceX", "kind": "catalyst", "call": "SpaceX closed at its lowest price ever, red in 13 of its last 16 sessions, with earnings August 4 and a lockup on August 6 freeing 911 million insider shares.", "direction": "short", "levels": "lockup Aug 6, 911M shares", "due": "2026-08-06", "attribution": "Vest Exchange", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-AM-SKHY-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "stocks", "ticker": null, "name": "SK Hynix", "kind": "level", "call": "A decisive technical breakdown in SK Hynix points at 1 to 1.1 million won, another 35 to 40 percent lower, consistent with $SMH in the 335 to 400 range over the next several months.", "direction": "short", "levels": "target 1-1.1M won, SMH 335-400", "due": "2026-12-31", "attribution": "John Galt", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-AM-RKLB-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "stocks", "ticker": null, "name": "Starship reusability", "kind": "thesis", "call": "Mastering Starship reusability this year would raise ARK's 2031 revenue and EBIT expectations roughly threefold and 2036 by six to seven times, because reusable versus disposable is $100 against $570 per kilogram to orbit.", "direction": "long", "levels": "$100/kg vs $570/kg", "due": "2027-12-31", "attribution": "Brett Winton of ARK", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-AM-NVDA-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "stocks", "ticker": "$NVDA", "name": "Nvidia", "kind": "catalyst", "call": "The cost of insuring Nvidia's debt surged to a record after reports it is discussing more than $750 billion of AI infrastructure financing tied to OpenAI, triple the $250 billion Ohio figure previously reported.", "direction": "short", "levels": "CDS at record, financing >$750B", "due": "2026-10-31", "attribution": "Walter Bloomberg via the Market list", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-AM-MU-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "stocks", "ticker": "$MU", "name": "Micron", "kind": "level", "call": "Micron breached the 902 right shoulder and closed just under it, and needs 955 or better to repair the structure.", "direction": "neutral", "levels": "902 broken, 955 to repair", "due": "2026-08-29", "attribution": "MentoviaX", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-28-AM-HOOD-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "investing", "ticker": "$HOOD", "name": "Robinhood", "kind": "catalyst", "call": "Robinhood reports Wednesday after the close, with Bernstein and Piper Sandler both modelling roughly $150 million of event-contract revenue against about $104 million in the first quarter, enough to pass crypto as a revenue line for the first time.", "direction": "long", "levels": "$150M vs $104M, target $160", "due": "2026-07-29", "attribution": "Gautam Chhugani of Bernstein", "status": "hit", "resolution": "Event contracts printed $156 million on 13.6 billion contracts and became the second-largest transaction line, passing crypto at $100 million and equities at $129 million.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-28-AM-CXMT-1", "date": "2026-07-28", "edition": "2026-07-28-AM", "channel": "stocks", "ticker": null, "name": "CXMT", "kind": "thesis", "call": "CXMT holds 6 to 9 percent of global DRAM shipments against Samsung's 36 and SK Hynix's 29, needs at least 15 percent to compete long term per Counterpoint, is not projected to reach it even by 2028, and runs costs more than 30 percent higher per bit.", "direction": "neutral", "levels": "6-9 pct share, 15 pct needed", "due": "2028-12-31", "attribution": "Melvin citing Counterpoint Research", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-oil-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "macro", "ticker": null, "name": "Oil", "kind": "thesis", "call": "The bombing pause does not fix supply, because countries other than America must dip deeper into shrinking stocks, pushing prices higher as thinning buffers make future shortages more likely. Goldman sees above $120 next quarter if Hormuz does not ease.", "direction": "long", "levels": "SPR at 311M barrels, above $120 target", "due": "2026-10-31", "attribution": "The Economist and Goldman Sachs", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-killswitch-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "macro", "ticker": null, "name": "AI Kill Switch Act", "kind": "catalyst", "call": "The AI Kill Switch Act, introduced July 23 by Ted Lieu and Nathaniel Moran, would let Homeland Security throttle or shut down systems above $100 million in training compute or $500 million in annual model revenue.", "direction": "event", "levels": "thresholds $100M compute, $500M revenue", "due": "2026-12-31", "attribution": "AI Central", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-iran-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "macro", "ticker": null, "name": "Iran talks", "kind": "catalyst", "call": "Trump says the United States is in very deep talks with Iran with not much time, and will return to very powerful military action if they fail.", "direction": "event", "levels": null, "due": "2026-08-31", "attribution": "Trump via Channel 12", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-fed-2", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "investing", "ticker": null, "name": "July FOMC", "kind": "catalyst", "call": "Hike odds sit near 36 percent for Wednesday with September above 50 percent, up from 18 percent a week ago, while Kalshi still calls a fifth straight hold at 3.50 to 3.75 percent without publishing a number.", "direction": "event", "levels": "36 percent hike, September above 50", "due": "2026-07-29", "attribution": "Barchart, Arbitrage Andy and Kalshi", "status": "hit", "resolution": "No hike, so the 36 percent price was wrong-side and Kalshi's fifth-straight-hold call at 3.50 to 3.75 percent was exactly right. September above 50 percent did not survive the meeting, falling to roughly 57 percent after the press conference.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-27-PM-fed-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "investing", "ticker": null, "name": "July FOMC", "kind": "thesis", "call": "A hold is 80/20, revised down from 85/15, and a statement hawkish enough to move the tape is 60/40, revised up from 45/55, because there is no dot plot this meeting so the statement and Warsh's first press conference are the only instruments.", "direction": "neutral", "levels": "hold 80/20, hawkish statement 60/40", "due": "2026-07-29", "attribution": "house", "status": "hit", "resolution": "Both legs landed. Hold at 80/20, and the hawkish-statement leg revised up to 60/40 was the right direction, since the statement and Warsh's first full press conference were the only instruments and both read hard.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-27-PM-datacenter-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "stocks", "ticker": null, "name": "Data centre overbuild", "kind": "thesis", "call": "If a price-performance curve minimises AI power requirements, a lot of data centres get turned into pickleball courts, the dark-fiber outcome, even though utilisation scales as expected.", "direction": "short", "levels": null, "due": "2029-12-31", "attribution": "Mark Cuban", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-clarity-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "macro", "ticker": null, "name": "CLARITY Act", "kind": "catalyst", "call": "Senate floor math already rules out passage before the August 10 recess absent time agreements that are not coming, though an initial vote is still expected before August 7. Kalshi prices passage into law this year at 40 percent.", "direction": "event", "levels": "Kalshi 40 percent, initial vote before Aug 7", "due": "2026-08-10", "attribution": "Brendan Pedersen", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-bigtech-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "macro", "ticker": null, "name": "Hyperscaler off-balance-sheet debt", "kind": "thesis", "call": "Nikkei Asia puts roughly $1.65 trillion of off-balance-sheet obligations across Alphabet, Microsoft, Amazon, Meta and Oracle against about $1.35 trillion of reported debt, with Meta's at $420 billion, three times what it reports.", "direction": "short", "levels": "$1.65T off balance sheet vs $1.35T reported", "due": "2027-06-30", "attribution": "Nikkei Asia via Prof G Markets", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-abqaiq-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "macro", "ticker": null, "name": "Abqaiq strike", "kind": "catalyst", "call": "Saudi Aramco's Abqaiq stabilisation plant, handling 5 to 7 percent of global oil supply, was struck by drones with fires at the facility and the East-West Pumping Station. Riyadh blamed Iran-backed groups in Iraq and reserves the right to respond.", "direction": "event", "levels": "5-7 percent of global supply", "due": "2026-08-15", "attribution": "The Hormuz Letter and zerohedge", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-XRP-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "crypto", "ticker": "$XRP", "name": "Ripple", "kind": "level", "call": "Kalshi traders forecast Ripple at $1.30 this year, against Ripple president Monica Long saying institutional demand is unlike anything ever seen with no figure attached.", "direction": "neutral", "levels": "$1.30", "due": "2026-12-31", "attribution": "Kalshi", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-SNDK-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "stocks", "ticker": "$SNDK", "name": "SanDisk", "kind": "thesis", "call": "Morgan Stanley warns memory contract prices peak in late 2026, and the rebuttal is $42 billion of remaining performance obligations on multiyear deals with price floors near $0.29 per gigabyte, so a pricing peak is not an earnings peak.", "direction": "long", "levels": "floors near $0.29/GB, $42B RPO", "due": "2026-12-31", "attribution": "Shay Boloor", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-NVDA-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "stocks", "ticker": "$NVDA", "name": "Nvidia", "kind": "catalyst", "call": "Nvidia's CDS spreads are widening on the reported $250 billion guarantee of OpenAI's Ohio campus, and the stock broke below $200.", "direction": "short", "levels": "below $200", "due": "2026-10-31", "attribution": "Kyle Reidhead", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-MU-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "stocks", "ticker": "$MU", "name": "Micron", "kind": "thesis", "call": "The memory shortage survives CXMT at 70/30 because frontier open models are a memory demand story, K3 needing roughly 1.4 terabytes to load at 4-bit against HBM sold out through 2027, but the multiple does not survive the Chinese supply narrative.", "direction": "long", "levels": "fell 6.1 percent below $1T market cap", "due": "2026-10-31", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-MSTR-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "investing", "ticker": "$MSTR", "name": "Strategy", "kind": "catalyst", "call": "Strategy sold $1.27 billion of stock over three weeks and bought zero bitcoin for a fourth straight week, trading near 0.6 times the coins behind it, with 843,775 coins at an average cost of $75,476 roughly $8.5 billion underwater. Q2 lands Thursday after the close.", "direction": "event", "levels": "0.6x NAV, avg cost $75,476", "due": "2026-07-30", "attribution": "Milk Road", "status": "hit", "resolution": "The quarter landed Thursday after the close. The zero-buying leg did not hold, since bitcoin holdings rose 11 percent on the quarter and dollar reserves rose 12. Reported figures are thin, with no revenue or earnings against the roughly $3.07 expected reaching anyone.", "resolved_edition": "2026-07-31-AM"}, {"id": "2026-07-27-PM-HOOD-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "investing", "ticker": "$HOOD", "name": "Robinhood", "kind": "thesis", "call": "Prediction markets pass crypto as a Robinhood revenue line for the first time in Q2, on roughly $150 million of event-contract revenue against about $104 million in Q1, with a $160 target.", "direction": "long", "levels": "$150M vs $104M, target $160", "due": "2026-07-29", "attribution": "Gautam Chhugani of Bernstein and Piper Sandler", "status": "hit", "resolution": "Event-contract revenue printed $156 million against the roughly $150 million modelled, up more than tenfold, and passed both crypto at $100 million and equities at $129 million.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-27-PM-GOOGL-2", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "stocks", "ticker": "$GOOGL", "name": "Alphabet", "kind": "thesis", "call": "Roughly half of Google Cloud's 82 percent growth is estimated to come from OpenAI and Anthropic, both venture-funded and cash-flow negative, which is a concentration risk nobody has disclosed a figure for.", "direction": "short", "levels": null, "due": "2027-01-31", "attribution": "Ed Elson", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-GOOGL-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "stocks", "ticker": "$GOOGL", "name": "Alphabet", "kind": "catalyst", "call": "Berkshire's latest 13F shows another $10 billion of Alphabet, nearly tripling the stake, as the stock crossed a $4 trillion market cap.", "direction": "long", "levels": "crossed $4T", "due": "2026-11-15", "attribution": "Berkshire 13F via Fin Tek", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-BTC-2", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "crypto", "ticker": "$BTC", "name": "Bitcoin", "kind": "thesis", "call": "Kalshi traders price a 55 percent chance Bitcoin hits $50,000 before $100,000.", "direction": "short", "levels": "55 percent, $50k before $100k", "due": "2026-12-31", "attribution": "Kalshi", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-PM-BTC-1", "date": "2026-07-27", "edition": "2026-07-27-PM", "channel": "crypto", "ticker": "$BTC", "name": "Bitcoin", "kind": "level", "call": "No durable bottom is confirmed and a retest of $52,000 to $58,000 is possible, with the Fed decision and Strategy's Q2 earnings as the catalysts.", "direction": "short", "levels": "retest band 52,000-58,000", "due": "2026-09-30", "attribution": "Nansen", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-AM-skhynix-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "investing", "ticker": null, "name": "SK Hynix", "kind": "catalyst", "call": "SK Hynix reports earnings Tuesday July 28 around 8pm ET, into a $500 billion-plus partnership with Nvidia and a stock down roughly 20 percent from its peak.", "direction": "event", "levels": null, "due": "2026-07-28", "attribution": "Jose Najarro", "status": "hit", "resolution": "SK Hynix reported revenue of $54.6 billion against $57.7 billion expected and operating profit of $41.6 billion against $44.2 billion, missing both lines while setting records at a 76 percent operating margin, revenue up 257 percent and profit up 557 percent. The stock fell 9 percent and took Micron and SanDisk with it.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-27-AM-samsung-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "investing", "ticker": null, "name": "Samsung", "kind": "catalyst", "call": "Samsung reports Wednesday July 29, days after signing roughly $200 billion with Broadcom across memory and foundry over five years including a 2-nanometer foundry commitment.", "direction": "event", "levels": null, "due": "2026-07-29", "attribution": "Jose Najarro", "status": "hit", "resolution": "Samsung reported revenue of $118.1 billion against $119.2 billion expected, a miss, with record operating profit of $61.7 billion against $60.8 billion expected, up 1,814 percent, and guided to strong second-half memory demand.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-27-AM-iran-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "news", "ticker": null, "name": "US-Iran ceasefire", "kind": "catalyst", "call": "Polymarket prices a signed US-Iran ceasefire this month at 55 percent after Omani officials travelled to Tehran and strikes halted.", "direction": "event", "levels": "55 percent", "due": "2026-07-31", "attribution": "Polymarket", "status": "miss", "resolution": "Missed. July ended with nothing signed. Trump ordered a fresh attack aimed at getting Tehran to surrender, with strikes possible over the weekend and Iran naming American energy infrastructure in its response plan.", "resolved_edition": "2026-07-31-PM"}, {"id": "2026-07-27-AM-fed-2", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "investing", "ticker": null, "name": "July FOMC", "kind": "thesis", "call": "A hold is 85/15 and a statement hawkish enough to move the tape is 45/55, revised down from 50/50 on Sunday because oil falling 7 percent removes the input that was forcing Warsh's hand.", "direction": "neutral", "levels": "hold 85/15, hawkish statement 45/55", "due": "2026-07-29", "attribution": "house", "status": "hit", "resolution": "The hold landed at 85/15. The second leg missed and I own it: I revised the hawkish-statement odds DOWN to 45/55 on Sunday because oil had fallen, and the statement read hawkish anyway.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-27-AM-fed-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "investing", "ticker": null, "name": "July FOMC", "kind": "catalyst", "call": "Three venues price the same July 29 decision differently: Kalshi 83 percent hold, Barchart 36 percent hike, Polymarket 17 percent hike.", "direction": "event", "levels": "Kalshi 83 hold / Barchart 36 hike / Polymarket 17 hike", "due": "2026-07-29", "attribution": "Kalshi, Barchart and Polymarket", "status": "hit", "resolution": "Kalshi's 83 percent hold was right. Barchart's 36 percent and Polymarket's 17 percent hike prices were both on the wrong side.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-27-AM-fauci-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "news", "ticker": null, "name": "Fauci testimony", "kind": "catalyst", "call": "Anthony Fauci is scheduled to testify before Senator Rand Paul on Wednesday July 29, the same day as the Fed decision.", "direction": "event", "levels": null, "due": "2026-07-29", "attribution": "Catherine Herridge", "status": "hit", "resolution": "Fauci appeared and invoked the Fifth Amendment rather than testify. Rand Paul says the committee will vote on contempt.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-27-AM-capex-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "stocks", "ticker": null, "name": "Hyperscaler capex", "kind": "thesis", "call": "The big five hyperscalers spend north of $600 billion on capex this year, up roughly a third from last year, most of it AI infrastructure.", "direction": "long", "levels": "$600B, up ~33 percent", "due": "2026-12-31", "attribution": "Nate B Jones", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-AM-TSLA-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "investing", "ticker": "$TSLA", "name": "Tesla", "kind": "level", "call": "Tesla hits 300 by Monday July 27, after two candles closed entirely outside the lower Bollinger band.", "direction": "short", "levels": "target 300", "due": "2026-07-27", "attribution": "Stocks with Josh", "status": "expired", "resolution": "Ungraded. The call came due and no Tesla price was reported anywhere, so there is no basis to settle it either way. A sourcing gap rather than a result.", "resolved_edition": "2026-07-27-PM"}, {"id": "2026-07-27-AM-NVDA-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "stocks", "ticker": "$NVDA", "name": "Nvidia", "kind": "thesis", "call": "Nvidia guaranteeing up to $250 billion of OpenAI's Ohio financing is a vendor underwriting its own order book, the Lucent and Nortel structure, so the demand signal stops being independent information.", "direction": "short", "levels": "guarantee up to $250B, project >$500B", "due": "2027-01-31", "attribution": "Douglas Swift", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-AM-MU-2", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "investing", "ticker": "$MU", "name": "Micron", "kind": "thesis", "call": "CXMT's debut does not touch the HBM shortage on any timeline that matters this quarter, so the memory thesis reprices on Samsung's Wednesday print rather than on the Chinese listing.", "direction": "long", "levels": null, "due": "2026-07-29", "attribution": "house", "status": "miss", "resolution": "The repricing did not wait for Samsung. Micron fell 6.1 percent below a trillion dollars on the CXMT debut plus China mass-producing domestic DUV tools, with ASML halted after an 8 percent drop and SanDisk down over 11 percent on a separate Morgan Stanley warning.", "resolved_edition": "2026-07-27-PM"}, {"id": "2026-07-27-AM-MU-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "investing", "ticker": "$MU", "name": "Micron", "kind": "level", "call": "Micron pivots on 906 and 972 after touching 960 overnight, with 991 the neckline to clear and stated targets of 1155 and 1186.", "direction": "long", "levels": "pivot 906/972, neckline 991, targets 1155/1186", "due": "2026-08-29", "attribution": "MentoviaX", "status": "miss", "resolution": "The breakdown invalidated the inverted head-and-shoulders setup outright, breaching the 902 right shoulder rather than triggering off the 991 neckline. The structure the levels described no longer exists, and the working frame is now 902 broken with 955 needed to repair.", "resolved_edition": "2026-07-28-AM"}, {"id": "2026-07-27-AM-MRVL-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "stocks", "ticker": "$MRVL", "name": "Marvell", "kind": "level", "call": "Marvell is down about 37 percent from its June 18 high and Melvin, who bought from $269 through $186, sees little room below $150 and expects earnings to reprice it.", "direction": "long", "levels": "floor ~150, bought 269 to 186", "due": "2026-09-30", "attribution": "Melvin", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-AM-LINK-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "crypto", "ticker": "$LINK", "name": "Chainlink", "kind": "thesis", "call": "Chainlink remains in tatters while its utility case has never been stronger, because price action lags utility in crypto.", "direction": "long", "levels": null, "due": "2026-10-31", "attribution": "Lark Davis", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-AM-GOOGL-2", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "stocks", "ticker": "$GOOGL", "name": "Alphabet", "kind": "catalyst", "call": "The SpaceX stake is marked at $94 billion as of June 30 with $80 billion unlocking in stages to December 8 and SpaceX down about 25 percent in a month, so the mark is stale in the wrong direction.", "direction": "event", "levels": "$94B mark, $80B unlock to Dec 8", "due": "2026-12-08", "attribution": "Ticker Symbol: YOU", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-AM-GOOGL-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "stocks", "ticker": "$GOOGL", "name": "Alphabet", "kind": "thesis", "call": "Alphabet signed $811 billion of future purchase agreements against $332 billion a quarter earlier, with about $200 billion due inside twelve months, and that obligation wall reprices the stock rather than merely worrying it.", "direction": "short", "levels": "obligations $811B, ~$200B due within 12 months", "due": "2026-10-31", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-AM-CXMT-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "macro", "ticker": null, "name": "CXMT", "kind": "thesis", "call": "The shortage driving DRAM and NAND up 60 percent or more per quarter does not end because a new Chinese supplier showed up, because CXMT's wafer output is capped near 290,000 to 320,000 against Samsung's 630,000 and its yields run about 42 percent below their mature process.", "direction": "long", "levels": "output 290-320k/mo, yields ~42 pct below", "due": "2026-12-31", "attribution": "Melvin", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-AM-BTC-2", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "crypto", "ticker": "$BTC", "name": "Bitcoin", "kind": "thesis", "call": "Whether Bitcoin bottoms at $58,000 or makes new lows turns on three factors: Strategy has stabilised, the Fed is open, the CLARITY Act is uncertain.", "direction": "neutral", "levels": "bottom vicinity 58,000", "due": "2026-09-30", "attribution": "Zach Pandl", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-AM-BTC-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "crypto", "ticker": "$BTC", "name": "Bitcoin", "kind": "thesis", "call": "Bitcoin gets rejected at the bear-market resistance band in late July or early August and then declines into an August-to-September window that was red in 2014, 2018 and 2022.", "direction": "short", "levels": "week range 63.7-67, weekly open 64.7", "due": "2026-09-30", "attribution": "Benjamin Cowen", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-27-AM-APP-1", "date": "2026-07-27", "edition": "2026-07-27-AM", "channel": "stocks", "ticker": "$APP", "name": "AppLovin", "kind": "catalyst", "call": "AppLovin reports Q2 on August 5, the first real scorecard on the fully opened ad platform, with the stock down more than 40 percent from its highs.", "direction": "event", "levels": null, "due": "2026-08-05", "attribution": "Milk Road", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-26-PM-oil-1", "date": "2026-07-26", "edition": "2026-07-26-PM", "channel": "macro", "ticker": null, "name": "Oil", "kind": "level", "call": "The oil fund hit $142.50 Thursday on its most overbought reading in three and a half months and should trade down toward roughly $130.", "direction": "short", "levels": "$142.50 high, target ~$130", "due": null, "attribution": "Heisenberg", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-26-PM-iran-1", "date": "2026-07-26", "edition": "2026-07-26-PM", "channel": "macro", "ticker": null, "name": "Patriot interceptor depletion", "kind": "thesis", "call": "The strike halt is a materiel constraint rather than diplomacy: more than 1,200 Patriot interceptors fired at over $4 million each, a stockpile the New York Times reports close to zero, and General Dan Caine warning that resuming major combat would fully deplete CENTCOM inventory.", "direction": "event", "levels": null, "due": "2026-09-30", "attribution": "New York Times via HormuzLetter", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-26-PM-hormuz-1", "date": "2026-07-26", "edition": "2026-07-26-PM", "channel": "stocks", "ticker": null, "name": "Hormuz normalisation", "kind": "catalyst", "call": "A wallet created yesterday put its entire $18,000 balance on Hormuz traffic returning to normal by August 31 for a payout above $121,000, pricing that outcome around 15 cents.", "direction": "event", "levels": "~15 cents", "due": "2026-08-31", "attribution": "Polymarket", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-26-PM-fed-3", "date": "2026-07-26", "edition": "2026-07-26-PM", "channel": "macro", "ticker": null, "name": "Warsh reaction function", "kind": "thesis", "call": "Warsh cannot cut into an oil shock and cannot hike hard into a weakening jobs market, so he holds and lets oil decide. The number that matters is the count of ships rather than the CPI print.", "direction": "neutral", "levels": "payrolls 57k vs 115k est; Sept hike odds ~82%", "due": "2026-09-30", "attribution": "BlackPantherCap", "status": "open", vels": "Steil next week vs Polymarket 38%", "due": "2026-08-07", "attribution": "Bryan Steil", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-26-PM-btc-2", "date": "2026-07-26", "edition": "2026-07-26-PM", "channel": "crypto", "ticker": null, "name": "Bitcoin", "kind": "thesis", "call": "The bottom is good enough rather than confirmed: $57,000 to $58,000 put Bitcoin in the bottom fifth percentile of its valuation history and at total production cost, so accumulate rather than wait. Filmed July 14, and it disagrees with Lark Davis on where the 200-week average sits, roughly $63,000 against 68,500.", "direction": "long", "levels": "200-week ~63k per this source", "due": null, "attribution": "Bitcoin Magazine Pro", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-26-PM-btc-1", "date": "2026-07-26", "edition": "2026-07-26-PM", "channel": "crypto", "ticker": null, "name": "Bitcoin", "kind": "level", "call": "Bitcoin is not safe under $66,000, with a clear path to the realised cap near $54,000 and $58,000 the level that gets it there fast.", "direction": "short", "levels": "under 66k; 58k trigger; 54k target", "due": null, "attribution": "Sykodelic", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-26-PM-NBIS-1", "date": "2026-07-26", "edition": "2026-07-26-PM", "channel": "stocks", "ticker": "$NBIS", "name": "Nebius", "kind": "thesis", "call": "Nebius over CoreWeave on the balance sheet: $9.3 billion of net cash against CoreWeave's $24.9 billion of debt, $536 million of quarterly interest and free cash flow not positive until 2029 or 2030, with $99.4 billion of CoreWeave obligations against a $50 billion cap.", "direction": "long", "levels": null, "due": "2027-07-26", "attribution": "Milk Road AI", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-26-PM-MU-3", "date": "2026-07-26", "edition": "2026-07-26-PM", "channel": "stocks", "ticker": "$MU  "Alphabet", "kind": "thesis", "call": "The $9.11 headline included roughly $99 billion of equity-stake gains, so operational earnings were about $2.85 and a slight miss, while the backlog went from $106 billion to $514 billion with ~$260 billion recognisable in twelve months. Capex is 70 to 75 percent likely to be value-accretive over three to five years.", "direction": "long", "levels": "OCF $39B vs capex $45B; backlog $514B", "due": "2029-07-26", "attribution": "Jordi Visser", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-26-PM-CRWV-1", "date": "2026-07-26", "edition": "2026-07-26-PM", "channel": "stocks", "ticker": "$CRWV", "name": "CoreWeave", "kind": "level", "call": "CoreWeave is the favourite AI name to sell puts against at $80 with an RSI of 35 and below its 50-day, selling the August 21 $75 put for $7.50 against 102 percent implied volatility, with the $65 strike at 21 delta as the safer version.", "direction": "long", "levels": "$80 spot; sell Aug 21 $75 put; safer $65", "due": "2026-08-21", "attribution": "Invest with Henry", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-26-PM-ADA-1", "date": "2026-07-26", "edition": "2026-07-26-PM", "channel": "crypto", "ticker": null, "name": "Cardano versus Solana", "kind": "thesis", "call": "Cardano is the overvalued one: 15,000 to 17,000 daily transactions and app fees of two to three thousand dollars a day against a $6 billion cap, versus Solana at over 100 million daily transactions and fees in the millions.", "direction": "short", "levels": null, "due": null, "attribution": "Lark Davis", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-26-AM-spx-1", "date": "2026-07-26", "edition": "2026-07-26-AM", "channel": "investing", "ticker": "$SPX", "name": "S&P 500", "kind": "level", "call": "The S&P needs to close above 7,499.36 on Friday to keep eleven straight green Julys, requiring about 1.18 percent over five session annel": "investing", "ticker": null, "name": "July 29 FOMC statement", "kind": "thesis", "call": "A hold is 70/30, but the statement reading hawkish enough to move markets is closer to 50/50, because oil up a third since the war began and 7.1 percent import prices leave no room to sound relaxed.", "direction": "neutral", "levels": null, "due": "2026-07-29", "attribution": "house", "status": "hit", "resolution": "Both legs landed. The Fed held, and Warsh's statement and press conference read hawkish enough to move the tape, with the S&P giving back a green session and the thirty-year breaking out.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-26-AM-fed-1", "date": "2026-07-26", "edition": "2026-07-26-AM", "channel": "investing", "ticker": null, "name": "July 29 FOMC", "kind": "catalyst", "call": "Polymarket has a 75 percent chance the Fed holds on Wednesday, with no venue pricing a cut, against import prices up 7.1 percent year over year and crude up from $68 to $90 since July 1.", "direction": "event", "levels": "Polymarket 75% hold", "due": "2026-07-29", "attribution": "Polymarket via WOLF", "status": "hit", "resolution": "Polymarket's 75 percent hold was correct and no venue needed its cut price.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-26-AM-eps-1", "date": "2026-07-26", "edition": "2026-07-26-AM", "channel": "stocks", "ticker": null, "name": "S&P earnings quality", "kind": "thesis", "call": "Blended earnings growth of 37.9 percent overstates the quarter, because three companies contributed $9 per share through accounting gains on venture investments and stripping those leaves 22 percent.", "direction": "neutral", "levels": null, "due": null, "attribution": "Ed Yardeni", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-26-AM-earnings-1", "date": "2026-07-26", "edition": "2026-07-26-AM", "channel": "investing", "ticker": null, "name": "Wednesday earnings collision", "kind": "catalyst", "call": "Microsoft, Meta, Robinhood, SoFi, Arm and Qualcomm all report on the same session as the Fed decision, with Apple, Amazon and Coinbase the day after.", "direction": "event", "levels": null, "due": "2026-07-30", "attribution": "StockSavvyShay", "status": "hit", "resolution": "The schedule held. Microsoft, Meta, Robinhood, Arm and Qualcomm all reported into the Fed decision, and Apple and Amazon followed Thursday after the close. Coinbase was the one name nobody covered.", "resolved_edition": "2026-07-30-PM"}, {"id": "2026-07-26-AM-clarity-1", "date": "2026-07-26", "edition": "2026-07-26-AM", "channel": "macro", "ticker": null, "name": "CLARITY Act", "kind": "catalyst", "call": "Both prediction markets moved up, Kalshi to 40 percent and Polymarket to 38, with Kalshi naming Trump's own crypto ventures as the biggest obstacle and even passage starting a 360-day implementation clock.", "direction": "event", "levels": "Kalshi 40%, Polymarket 38%", "due": "2026-08-07", "attribution": "Kalshi", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-26-AM-SKHY-1", "date": "2026-07-26", "edition": "2026-07-26-AM", "channel": "stocks", "ticker": null, "name": "SK Hynix", "kind": "thesis", "call": "The real memory supply threat is SK Hynix rather than China, on a roughly $800 billion mid-to-long-term Korean fab plan and a $26.5 billion Nasdaq listing, with pricing pressure landing in 2027 and beyond.", "direction": "short", "levels": null, "due": "2027-12-31", "attribution": "Rick Orford", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-26-AM-MU-2", "date": "2026-07-26", "edition": "2026-07-26-AM", "channel": "stocks", "ticker": "$MU", "name": "Micron", "kind": "level", "call": "Burry's Micron short averages between the $1,051 initiation and the $934 add, leaving him roughly flat with Micron at 961.", "direction": "short", "levels": "initiated 1051, added 934, spot 961", "due": null, "attribution": "Rick Orford", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-26-AM-MU-1", "date": "2026-07-26", "edition": "2026-07-26-AM", "channel": "stocks", "ticker": "$MU", "name": "Micron", "kind": "thesis", "call": "Micron's 16 agreements are take-or-pay with floor prices on 14 of them covering roughly $100 billion, so the contracted revenue survives a spot collapse. Falsified by a miss on the roughly $50 billion late-September guidance or any sign floor prices are being renegotiated.", "direction": "long", "levels": "~13x forward; falsification: Sept guidance ~$50B", "due": "2026-09-30", "attribution": "Rick Orford", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-26-AM-LIT-1", "date": "2026-07-26", "edition": "2026-07-26-AM", "channel": "crypto", "ticker": null, "name": "Lighter versus Hyperliquid", "kind": "thesis", "call": "Lighter is the catch-up trade against Hyperliquid on $700 million of daily volume versus $2 billion at a fraction of the market cap, after a first burn of over 15 million tokens.", "direction": "long", "levels": null, "due": null, "attribution": "Lark Davis", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-26-AM-HOOD-1", "date": "2026-07-26", "edition": "2026-07-26-AM", "channel": "investing", "ticker": "$HOOD", "name": "Robinhood", "kind": "thesis", "call": "Robinhood's chain passed 2 million monthly users and 150 million lifetime transactions, but only about $55 million of stock tokens traded in 24 hours with tokenized GameStop alone at $26.6 million, so the equity-token thesis is thinner than the chain growth.", "direction": "neutral", "levels": null, "due": "2026-07-29", "attribution": "aixbt", "status": "hit", "resolution": "Correct on the shape of it. Event contracts carried the quarter at $156 million while crypto fell 38 percent to $100 million, and no stock-token revenue line was broken out at all.", "resolved_edition": "2026-07-29-PM"}, {"id": "2026-07-26-AM-CXMT-1", "date": yond coding.", "direction": "long", "levels": null, "due": "2030-12-31", "attribution": "Milk Road AI", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-07-25-PM-memory-1", "date": "2026-07-25", "edition": "2026-07-25-PM", "channel": "stocks", "ticker": "$MU", "name": "Memory complex", "kind": "thesis", "call": "Memory multiples expand before they compress, revised back UP to 60/40 on 2026-08-05 after South Korean media reported CXMT refused Apple's request for mobile DRAM price cuts and insisted on prices at or above Samsung and SK Hynix, which is margin-seeking rather than share-seeking behaviour. Note the report is single-sourced and publicly contested. Was revised DOWN to 55/45 on 2026-08-03 from 65/35 after Reuters reported CXMT is considering a second Beijing DRAM fab taking its capacity past 600,000 wafers a month. Originally at roughly 65/35, because Micron has 14 take-or-pay agreements worth about $100 billion at floor prices covering roughly 20 percent of DRAM volume, which is a structural answer to the cycle turning. Reaffirmed at 65/35 on 2026-07-29 after the Fed and CXMT both landed. The trigger that flips it is ASML order detail rather than price action. Original reasoning: CXMT and the Fed are catalysts this week while linear attention is a two-year mechanism.", "direction": "long", "levels": "$SKHY ~4x, $MU ~6x, $SNDK ~7x 2027 earnings", "due": "2026-12-31", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null, "revised_edition": "2026-07-29-PM"}, {"id": "2026-07-25-PM-medtech-1", "date": "2026-07-25", "edition": "2026-07-25-PM", "channel": "stocks", "ticker": null, "name": "Medical devices", "kind": "thesis", "call": "Five medical-device buys and one wait: ABT at 16 times, DHR after a 14 percent drop on a beat-and-raise, ISRG down 17 percent on delivering 18 percent growth against a 14 guide, BSX down 50 percent on an 8-versus-10 trim, EW at $84 targeting $100, and MDT a wait.", "directi <script>
'use strict';
/* Alpha Funnel — multi-channel reader (Stocks & ETFs / Bitcoin & Crypto / Macro & Policy,
   plus the frozen Investing archive). The channel list is data, not code: it comes from
   manifest.json, which build_manifest.py fills from meta.CHANNELS.
   Works two ways from ONE codebase:
   - standalone briefings.html: a global `DATA` is embedded (days carry `body`, plus `deep`).
   - served site/: no DATA, so we fetch manifest.json and lazy-load bodies + deep-dives. */

const EMBEDDED = (typeof DATA !== 'undefined') ? DATA : null;

// labels for every topic across all channels (channel supplies its own order)
const TOPIC_LABEL = {
  // Stocks & ETFs
  'ai-infra': 'AI Infra', semis: 'Semis', software: 'Software', energy: 'Energy',
  healthcare: 'Healthcare', financials: 'Financials', consumer: 'Consumer',
  industrials: 'Industrials', etfs: 'ETFs',
  // Bitcoin & Crypto
  bitcoin: 'Bitcoin', ether: 'Ether', alts: 'Alts', 'etf-flows': 'ETF Flows',
  stablecoins: 'Stablecoins', treasuries: 'Treasury Cos', miners: 'Miners', equities: 'Equities',
  // Macro & Policy
  rates: 'Rates', inflation: 'Inflation', policy: 'Policy', geopolitics: 'Geopolitics',
  commodities: 'Commodities', dollar: 'Dollar', liquidity: 'Liquidity',
  // Investing archive (frozen) + retired News / AI & Tools archives
  macro: 'Macro', stocks: 'Stocks', crypto: 'Crypto', biotech: 'Biotech',
  models: 'Models', agents: 'Agents', tooling: 'Tooling', 'local-open': 'Local/Open',
  compute: 'Compute', pkm: 'PKM',
  politics: 'Politics', world: 'World', markets: 'Markets', health: 'Health', culture: 'Culture',
};
// label -> url key, derived from the manifest so it cannot drift from meta.CHANNELS
let LABEL_TO_KEY = {};
const TOP_ENTITIES = 15; // second-row chips shown before "show all"

let CHANNELS = [];             // [{key, label, topicOrder, secondLabel, days:[{id,date,edition,headline,subtitle,topics,entities,mentions?,path?,body?}]}]
let CALLS = [];                // calls ledger (state/calls.jsonl folded in by build_manifest.py)
let CH_BY_KEY = {};            // key -> channel object
let activeKey = null;          // current channel key
let DEEP_IDS = new Set();      // source ids that have a deep-dive available
let DEEP = null;               // standalone: {id: md}; served: null (fetch on demand)

let state = { filter: null, showAllEntities: false }; // filter = {kind:'topic'|'entity', value} | null
let SEEN = new Set();   // "key/id" of editions already opened (persisted to localStorage af-seen)
let ENTITY_INDEX = new Map();    // entity display name -> [{ch, d}] newest-first (built in init)
let SLUG_TO_ENTITY = new Map();  // url slug -> entity display name

const elDrawer = () => document.getElementById('drawer');
const elScrim = () => document.getElementById('scrim');

marked.setOptions({ breaks: false, gfm: true });

init();

async function init() {
  initTheme();
  try {
    let src;
    if (EMBEDDED) {
      src = EMBEDDED;
      DEEP = EMBEDDED.deep || {};
      DEEP_IDS = new Set(EMBEDDED.deepDives || Object.keys(DEEP));
    } else {
      src = await fetchJSON('manifest.json');
      DEEP_IDS = new Set(src.deepDives || []);
      DEEP = null;
    }
    CHANNELS = (src.channels || []).map(c => ({ ...c, days: (c.days || []).slice() }));
    CALLS = src.calls || [];
    // wikilinks name the channel by LABEL, routes use the key: build the map from the data
    LABEL_TO_KEY = Object.fromEntries(CHANNELS.map(c => [c.label, c.key]));
  } catch (e) {
    document.getElementById('app').innerHTML =
      `<div class="wrap"><p class="empty">Couldn't load the briefings. (${esc(String(e))})</p></div>`;
    return;
  }
  if (!CHANNELS.length) {
    document.getElementById('app').innerHTML =
      `<div class="wrap"><p class="empty">No channels found.</p></div>`;
    return;
  }
  // newest first within each channel: by date, then Deep-Dive (week's featured memo) > PM >
  // legacy all-day > AM. Mirrors meta.py SESSION_RANK — keep the two in lockstep.
  const RANK = { 'Deep-Dive': 4, PM: 3, '': 2, AM: 1 };
  CHANNELS.forEach(c => {
    c.days.sort((a, b) => b.date.localeCompare(a.date) || (RANK[b.edition] ?? 2) - (RANK[a.edition] ?? 2));
    CH_BY_KEY[c.key] = c;
  });
  buildEntityIndex();
  activeKey = CHANNELS[0].key; // default channel (Investing)
  loadSeen();

  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  elScrim().addEventListener('click', closeDrawer);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
  document.addEventListener('keydown', keyNav);
  document.addEventListener('keydown', trapTab);
  window.addEventListener('scroll', onReadScroll, { passive: true });
  const skip = document.querySelector('.skip');
  if (skip) skip.addEventListener('click', e => {
    e.preventDefault();
    const mn = document.getElementById('main');
    if (mn) { mn.focus(); mn.scrollIntoView(); }
  });
  window.addEventListener('hashchange', route);
  route();
}

/* ---------- "new since last visit" tracking (localStorage) ---------- */
function loadSeen() {
  let raw = null;
  try { raw = localStorage.getItem('af-seen'); } catch (e) {}
  if (raw == null) {
    // first ever visit: seed with every current edition so nothing shows as falsely "new"
    CHANNELS.forEach(c => c.days.forEach(d => SEEN.add(c.key + '/' + d.id)));
    persistSeen();
  } else {
    try { (JSON.parse(raw) || []).forEach(k => SEEN.add(k)); } catch (e) {}
  }
}
function persistSeen() { try { localStorage.setItem('af-seen', JSON.stringify([...SEEN])); } catch (e) {} }
function isNew(key, id) { return !SEEN.has(key + '/' + id); }
function markSeen(key, id) { if (isNew(key, id)) { SEEN.add(key + '/' + id); persistSeen(); } }
function channelHasNew(c) { return c.days.some(d => isNew(c.key, d.id)); }

function CH() { return CH_BY_KEY[activeKey] || CHANNELS[0]; }

/* ---------- routing ---------- */
// #/<channel>            -> that channel's list
// #/<channel>/<id>       -> a reading view (id = 2026-06-30 or 2026-06-30-PM)
function route() {
  closeDrawer();   // any open drawer (zoom / what-is-this / subscribe) shouldn't linger across nav
  // #/e/<slug> -> a cross-channel entity thread (all editions that mentioned it, chronological).
  const em = (location.hash || '').match(/^#\/e\/([a-z0-9-]+)$/);
  if (em && SLUG_TO_ENTITY.has(em[1])) {
    renderEntityThread(em[1]); window.scrollTo(0, 0);
    afterRoute(SLUG_TO_ENTITY.get(em[1]) + ' — all mentions'); return;
  }
  // #/calls -> the Scoreboard (open calls, catalyst calendar, settled calls with outcomes)
  if ((location.hash || '') === '#/calls') {
    renderScoreboard(); window.scrollTo(0, 0);
    afterRoute('Scoreboard'); return;
  }
  // Edition-token list mirrors meta.py edition_pattern — keep in lockstep (a token missing
  // here makes that edition's reading view silently fall back to the splash).
  const m = (location.hash || '').match(/^#\/([a-z-]+)(?:\/(\d{4}-\d{2}-\d{2}(?:-(?:AM|PM|Deep-Dive))?))?$/);
  if (m && CH_BY_KEY[m[1]]) {
    if (activeKey !== m[1]) { activeKey = m[1]; resetChannelState(); }
    if (m[2] && CH().days.some(d => d.id === m[2])) {
      renderRead(m[2]); window.scrollTo(0, 0);
      const d = CH().days.find(x => x.id === m[2]);
      afterRoute(d ? d.headline : 'Reading'); return;
    }
    renderList(); window.scrollTo(0, 0); afterRoute(CH().label + ' briefings'); return;
  }
  renderSplash();          // home / index is the splash landing
  window.scrollTo(0, 0);
  afterRoute('Alpha Funnel home');
}

// SPA a11y: announce the new view to screen readers and move focus to the main landmark
function afterRoute(label) {
  const live = document.getElementById('live');
  if (live) live.textContent = label;
  const bar = document.getElementById('readbar');   // reset progress bar when leaving a reading view
  if (bar && !/^#\/[a-z-]+\/.+/.test(location.hash || '')) bar.style.width = '0%';
  const mainEl = document.getElementById('main');
  if (mainEl) { try { mainEl.focus({ preventScroll: true }); } catch (e) { mainEl.focus(); } }
}

function resetChannelState() { state.filter = null; state.showAllEntities = false; }

// Edition suffix as HTML: Deep-Dive gets a styled badge (the week's featured memo), AM/PM stay
// plain text. Dates and edition tokens come from the build's own filename regex, so these label
// functions are HTML-safe by construction — call sites inject them WITHOUT esc().
function editionSuffixHtml(ed, sep) {
  if (!ed) return '';
  if (ed === 'Deep-Dive') return ' <span class="dd-badge">Deep-Dive</span>';
  return (sep || ' · ') + ed;
}

// "2026-06-30" + "PM" -> "2026-06-30 · PM"; legacy (no edition) -> just the date
function editionLabel(d, sep) { return d.date + editionSuffixHtml(d.edition, sep); }

// friendly splash date: "2026-07-01" + "PM" -> "Jul 1 · PM" (parsed manually to avoid TZ shifts)
// MONTHS is inlined (not a module const) because init() runs before top-level consts initialize.
function prettyDate(iso) {
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  return m ? MONTHS[+m[2] - 1] + ' ' + (+m[3]) : (iso || '');
}
function splashDateLabel(d) {
  return prettyDate(d.date) + editionSuffixHtml(d.edition);
}
// long friendly date for the reading-view kicker: "2026-07-01" + "PM" -> "July 1, 2026 · PM"
function prettyDateFull(iso) {
  const M = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
    'August', 'September', 'October', 'November', 'December'];
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  return m ? M[+m[2] - 1] + ' ' + (+m[3]) + ', ' + m[1] : (iso || '');
}
function readKicker(d) {
  return prettyDateFull(d.date) + editionSuffixHtml(d.edition);
}

function go(hash) { location.hash = hash; }
function goChannel(key) { if (key !== activeKey) go('#/' + key); }
function goHome() {
  if (location.hash === '' || location.hash === '#' || location.hash === '#/') {
    renderSplash(); window.scrollTo(0, 0);       // already home; just re-render
  } else {
    go('#/');                                     // hashchange -> route() -> renderSplash
  }
}
// Reading view: <- older edition, -> newer. List view: j/k move through editions (Enter opens natively).
function keyNav(e) {
  if (e.metaKey || e.ctrlKey || e.altKey || e.defaultPrevented) return;
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable)) return;
  if (elDrawer().classList.contains('open')) return;

  if (e.key === '/') { e.preventDefault(); openSearch(); return; }
  if (e.key === '?') { e.preventDefault(); openShortcuts(); return; }

  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const m = (location.hash || '').match(/^#\/([a-z-]+)\/(.+)$/);
    if (!m || !CH_BY_KEY[m[1]]) return;
    const days = CH_BY_KEY[m[1]].days;
    const i = days.findIndex(x => x.id === m[2]);
    if (i < 0) return;
    if (e.key === 'ArrowLeft' && days[i + 1]) go('#/' + m[1] + '/' + days[i + 1].id);
    if (e.key === 'ArrowRight' && days[i - 1]) go('#/' + m[1] + '/' + days[i - 1].id);
    return;
  }

  if (e.key === 'j' || e.key === 'k') {
    if (!/^#\/[a-z-]+$/.test(location.hash || '')) return;   // list view only
    const items = Array.from(document.querySelectorAll('#app .featured, #app .row'));
    if (!items.length) return;
    const cur = items.indexOf(document.activeElement);
    let next = cur === -1 ? (e.key === 'j' ? 0 : items.length - 1) : cur + (e.key === 'j' ? 1 : -1);
    next = Math.max(0, Math.min(items.length - 1, next));
    items[next].focus();
    e.preventDefault();
  }
}

// keep Tab focus inside the drawer while it is open (a11y focus-trap)
function trapTab(e) {
  if (e.key !== 'Tab' || !elDrawer().classList.contains('open')) return;
  const list = Array.from(elDrawer().querySelectorAll('a[href], button, [tabindex]:not([tabindex="-1"])'))
    .filter(el => el.offsetParent !== null);
  if (!list.length) return;
  const first = list[0], last = list[list.length - 1];
  if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
  else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
}

/* ---------- counts & filtering ---------- */

function countDaysWith(days, key, value) {
  return days.reduce((n, d) => n + ((d[key] || []).includes(value) ? 1 : 0), 0);
}

function topicChips() {
  const days = CH().days;
  const order = CH().topicOrder || [];
  const present = new Set();
  days.forEach(d => (d.topics || []).forEach(t => present.add(t)));
  const ordered = order.filter(t => present.has(t))
    .concat([...present].filter(t => !order.includes(t)).sort());
  return ordered.map(t => ({ value: t, label: TOPIC_LABEL[t] || cap(t), n: countDaysWith(days, 'topics', t) }));
}

function entityChips() {
  const days = CH().days;
  const present = new Set();
  days.forEach(d => (d.entities || []).forEach(t => present.add(t)));
  return [...present]
    .map(t => ({ value: t, label: t, n: countDaysWith(days, 'entities', t) }))
    .sort((a, b) => b.n - a.n || a.value.localeCompare(b.value));
}

function filteredDays() {
  const days = CH().days;
  if (!state.filter) return days;
  const { kind, value } = state.filter;
  const key = kind === 'topic' ? 'topics' : 'entities';
  return days.filter(d => (d[key] || []).includes(value));
}

/* ---------- entity history index (cross-channel threads) ----------
   Built once in init() from the in-memory CHANNELS. Every tagged entity gets a
   chronological trail of the editions that mentioned it, across all channels —
   the "story so far" for a ticker or name. Pure metadata: no bodies needed.
   (ENTITY_INDEX / SLUG_TO_ENTITY are declared up top so init() can populate them.) */

// Slugify an entity for the hash route: "$MU" -> "mu", "Strait of Hormuz" -> "strait-of-hormuz".
function entitySlug(name) {
  return String(name).toLowerCase().replace(/\$/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

function buildEntityIndex() {
  ENTITY_INDEX = new Map();
  SLUG_TO_ENTITY = new Map();
  CHANNELS.forEach(c => c.days.forEach(d => (d.entities || []).forEach(name => {
    if (!ENTITY_INDEX.has(name)) ENTITY_INDEX.set(name, []);
    ENTITY_INDEX.get(name).push({ ch: c, d });
  })));
  const RANK = { 'Deep-Dive': 4, PM: 3, '': 2, AM: 1 };
  for (const [name, list] of ENTITY_INDEX) {
    list.sort((a, b) => b.d.date.localeCompare(a.d.date) || (RANK[b.d.edition] ?? 2) - (RANK[a.d.edition] ?? 2));
    const slug = entitySlug(name);
    if (slug && !SLUG_TO_ENTITY.has(slug)) SLUG_TO_ENTITY.set(slug, name);   // first name wins on rare slug clash
  }
}

// Reading-view "Tracked" row: entity chips that deep-link to each entity's thread.
function entityMentionsRow(d) {
  const ents = (d.entities || []).filter(e => SLUG_TO_ENTITY.has(entitySlug(e)));
  if (!ents.length) return '';
  return `<div class="mentions"><span class="mentions-label">Tracked</span>` +
    ents.map(e => `<a class="ment" href="#/e/${entitySlug(e)}">${esc(e)}</a>`).join('') + `</div>`;
}

/* ---------- rising / cooling (mention momentum) ----------
   Entity mention-count delta over the newest 7 days vs the prior 7, within a channel.
   Anchored to the newest edition date (not wall-clock) so it is stable and testable. */
function risingEntities(days) {
  if (!days.length) return [];
  const DAY = 86400000;
  const anchor = new Date(days[0].date + 'T12:00:00');   // days are newest-first
  const cutThis = new Date(anchor.getTime() - 7 * DAY);
  const cutPrior = new Date(anchor.getTime() - 14 * DAY);
  const count = (from, to) => {
    const m = new Map();
    days.forEach(d => {
      const t = new Date(d.date + 'T12:00:00');
      if (t > from && t <= to) (d.entities || []).forEach(e => m.set(e, (m.get(e) || 0) + 1));
    });
    return m;
  };
  const now = count(cutThis, anchor), prior = count(cutPrior, cutThis);
  const names = new Set([...now.keys(), ...prior.keys()]);
  return [...names].map(e => ({ e, delta: (now.get(e) || 0) - (prior.get(e) || 0), now: now.get(e) || 0 }));
}

// Search snippet: ~150-char window around the first matching token, tokens marked. Input is
// raw text; we escape the slice THEN inject <mark> so bodies can't break out into markup.
function searchSnippet(text, toks) {
  const low = text.toLowerCase();
  let pos = -1;
  for (const t of toks) { const i = low.indexOf(t); if (i >= 0 && (pos < 0 || i < pos)) pos = i; }
  if (pos < 0) return '';
  const start = Math.max(0, pos - 60), end = Math.min(text.length, pos + 90);
  let s = esc((start > 0 ? '…' : '') + text.slice(start, end).replace(/\s+/g, ' ').trim() + (end < text.length ? '…' : ''));
  toks.forEach(t => {
    const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    s = s.replace(re, '<mark>$1</mark>');
  });
  return s;
}

function setFilter(kind, value) {
  if (state.filter && state.filter.kind === kind && state.filter.value === value) state.filter = null;
  else state.filter = { kind, value };
  const listHash = '#/' + activeKey;
  if (location.hash && location.hash !== listHash) go(listHash); // leave read view; route() renders
  else renderList();
}

/* ---------- splash / home ---------- */

/* Subscribe drawer — lists the RSS feed URLs with copy buttons (reuses the drawer shell). */
function feedBase() {
  if (typeof FEED_BASE !== 'undefined' && FEED_BASE) return FEED_BASE.replace(/\/$/, '');
  return location.origin + location.pathname.replace(/\/[^/]*$/, '');
}
function openSubscribe() {
  const base = feedBase();
  // derived from the live channel list so a channel split/retirement never leaves a dead feed link
  const feeds = [{ label: 'All channels', file: 'feed.xml' }]
    .concat(CHANNELS.map(c => ({ label: c.label, file: `feed-${c.key}.xml` })));
  const tag = document.querySelector('#drawer .drawer-tag');
  if (tag) tag.textContent = 'Subscribe';
  const src = document.getElementById('drawerSource');
  if (src) src.style.display = 'none';
  const rows = feeds.map(f => {
    const url = base + '/' + f.file;
    return `<div class="sub-row">
        <div class="sub-row-main"><span class="sub-name">${esc(f.label)}</span>
          <span class="sub-url">${esc(url)}</span></div>
        <button class="sub-copy" data-copy="${esc(url)}">Copy</button>
      </div>`;
  }).join('');
  const body = document.getElementById('drawerBody');
  body.innerHTML =
    '<p>Alpha Funnel publishes as RSS. Paste a feed URL into Readwise Reader (or any RSS app) and every new edition shows up automatically.</p>' +
    '<div class="sub-list">' + rows + '</div>' +
    '<p class="sub-hint">Use a single channel feed to follow just one beat.</p>';
  body.querySelectorAll('[data-copy]').forEach(b => {
    b.addEventListener('click', () => {
      const url = b.getAttribute('data-copy');
      const done = () => { b.textContent = 'Copied'; b.classList.add('done'); setTimeout(() => { b.textContent = 'Copy'; b.classList.remove('done'); }, 1400); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, done);
      else done();
    });
  });
  openDrawerShell();
  body.scrollTop = 0;
}

/* Quick-find: search headlines/subtitles/topics/entities across ALL channels (data is in memory). */
function openSearch() {
  const tag = document.querySelector('#drawer .drawer-tag');
  if (tag) tag.textContent = 'Search';
  const src = document.getElementById('drawerSource');
  if (src) src.style.display = 'none';
  const body = document.getElementById('drawerBody');
  body.innerHTML =
    '<input class="search-input" type="search" placeholder="Search all editions…" aria-label="Search all editions" autocomplete="off" spellcheck="false">' +
    '<div class="search-results" id="searchResults"></div>';
  const input = body.querySelector('.search-input');
  const results = body.querySelector('#searchResults');
  // Full-text where bodies are in memory (published standalone embeds them); metadata-only otherwise.
  const all = CHANNELS.flatMap(c => c.days.map(d => {
    const text = [d.headline, d.subtitle || '', d.body || ''].join('  ');
    return {
      ch: c, d, text,
      hay: (text + ' ' + (d.topics || []).map(t => TOPIC_LABEL[t] || t).join(' ') + ' ' + (d.entities || []).join(' ')).toLowerCase()
    };
  }));
  const render = () => {
    const q = input.value.trim().toLowerCase();
    const toks = q ? q.split(/\s+/) : [];
    let list = toks.length ? all.filter(x => toks.every(t => x.hay.includes(t))) : all;
    const total = list.length;
    list = list.slice(0, 25);
    if (!list.length) { results.innerHTML = '<p class="empty">No editions match.</p>'; return; }
    const count = q ? `<div class="sr-count">${total} edition${total === 1 ? '' : 's'} match${total === 1 ? 'es' : ''}</div>` : '';
    results.innerHTML = count + list.map(x => {
      const snip = q ? searchSnippet(x.text, toks) : '';
      return `<a class="sr-row" href="#/${x.ch.key}/${x.d.id}" data-go="#/${x.ch.key}/${x.d.id}">` +
        `<span class="sr-meta">${esc(x.ch.label)} · ${splashDateLabel(x.d)}</span>` +
        `<span class="sr-title">${esc(x.d.headline)}</span>` +
        (snip ? `<span class="sr-snip">${snip}</span>` : '') + `</a>`;
    }).join('');
    results.querySelectorAll('[data-go]').forEach(a =>
      a.addEventListener('click', e => { e.preventDefault(); closeDrawer(); go(a.dataset.go); }));
  };
  input.addEventListener('input', render);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const first = results.querySelector('[data-go]'); if (first) { e.preventDefault(); closeDrawer(); go(first.dataset.go); } }
  });
  render();
  openDrawerShell();
  setTimeout(() => input.focus(), 30);   // override the shell's focus-on-close-button
}

/* Keyboard shortcuts help (reuses the drawer). */
function openShortcuts() {

y tool. Welcome to the Bessent-Warsh era of Fed interdependence.\"", "the Fed": "\u2026facility lets foreign central banks borrow dollars against their Treasury holdings rather than dumping them. It is the Fed's plumbing for stopping a forced sale of US paper. A Treasury Secretary publicly asking for it to be enlarged is fiscal authority making a monetary request in the open, and neither institution\u2026", "Treasury": "\u2026it had agreed to reopen the Strait of Hormuz while CENTCOM redirected 35 vessels around it. This morning the Treasury Secretary said a deal might be signed by tomorrow. Everything else on the board moved off that one sentence.", "Iran": "Three days ago Iran was denying it had agreed to reopen the Strait of Hormuz while CENTCOM redirected 35 vessels around it. This morning the Treasury Secretary said a deal might be signed by tomorrow. Everything\u2026", "Qatar": "\u2026list, Scott Bessent said \"I think there's a chance we may have a deal today or tomorrow to open the strait,\" and Qatar has already prepared draft text for an agreement. Futures hit a record high on it. Oil rose 2 percent and then fell 2 percent inside the same session, with Brent for October at $81.50.", "Trump": "\u2026Alhajji timed the tape precisely: oil rose 2 percent, then fell 2 percent once Bessent spoke. Per 0xResearch, Trump's decision to postpone further strikes against Iran had already sent Brent down 4.7 percent on Monday.", "the CLARITY Act": "Confirmed and dated. The CLARITY Act cleared the House and Senate Banking, sits on the legislative calendar, and still has no scheduled vote with the recess on Saturday."}, "body": "**Headline:** Bessent says a Hormuz deal may land tomorrow, and oil gave up two percent\n**Subtitle:** Qatar has draft text ready, futures hit a record high on the headline, and the same Treasury Secretary spent the morning telling the Federal Reserve to upsize one of its own facilities.\n**Topics:** geopolitics, commodities, policy, dollar\n**Entities:** Bessent, Warsh, the Fed, Treasury, Iran, Qatar, the BOJ, Trump, the CLARITY Act, OPEC\n\nThree days ago Iran was denying it had agreed to reopen the Strait of Hormuz while CENTCOM redirected 35 vessels around it. This morning the Treasury Secretary said a deal might be signed by tomorrow. Everything else on the board moved off that one sentence.\n\n**Market context.** Per the [Financial Markets list](https://read.readwise.io/read/01kz6cqnpq9dmp04b2bmsam265), Scott Bessent said \"I think there's a chance we may have a deal today or tomorrow to open the strait,\" and Qatar has already prepared draft text for an agreement. Futures hit a record high on it. Oil rose 2 percent and then fell 2 percent inside the same session, with Brent for October at $81.50.\n\nThe domestic data was the quiet half and it was strong.\n\n| Print | Reading |\n|---|---|\n| July ISM Manufacturing | 55.6 percent, best since May 2022 |\n| ISM Prices Paid | 71.1, still elevated on tariff-driven input costs |\n| Atlanta Fed GDPNow, Q3 | raised from 5.0 to 6.2 percent |\n| US trade balance | negative $73.3 billion against negative $73.0 expected, prior negative $77.6 |\n\nAhead: payrolls Friday August 7, consensus 91,000 to 120,000 after June's 57,000 miss, then CPI on August 12.\n\n**The scoreboard.**\n- **Hit, and it was mine to publish.** I said yesterday the Camp David notepad reading \"buy Japanese yen $5-10 bil\" was deliberate rather than accidental. Confirmed from both sides. The New York Fed, acting for Treasury, sold euros to buy yen on Friday, both governments acknowledged it Monday, and USD/JPY fell from above 163 to around 156.\n- **Against, for a second day.** I went 65/35 on August 2 that oil would be higher two weeks out. Bessent is now negotiating the exact opposite. That call is losing and I am not going to dress it up.\n- **Confirmed and dated.** The CLARITY Act cleared the House and Senate Banking, sits on the legislative calendar, and still has no scheduled vote with the recess on Saturday.\n\n**1. The strait is being traded before it is open, and the draft text is the tell.** Per the [Financial Markets list](https://read.readwise.io/read/01kz6cqnpq9dmp04b2bmsam265), Anas Alhajji timed the tape precisely: oil rose 2 percent, then fell 2 percent once Bessent spoke. Per [0xResearch](https://read.readwise.io/read/01kz6h7hmswmxrpz3s7z05cfc3), Trump's decision to postpone further strikes against Iran had already sent Brent down 4.7 percent on Monday.\n\nSo the risk premium has come out in two steps on two statements, and neither of them is an open waterway. Qatar having draft text is the genuinely new fact, because a mediator does not circulate paper without a landing zone in view.\n\nThe cost of the closure is now measurable in fiscal terms. Alhajji counts **EU governments committing roughly 12 to 16 billion euros** in subsidies and measures to cushion the crisis and hold energy costs down. In most countries that spending prevented a recession, growth stayed very low anyway, and the borrowing still has to be repaid.\n\nMy lean, and it is a downgrade from Sunday. I am 60/40 that a Hormuz agreement is announced inside two weeks, up from roughly even, because Qatari draft text plus a US Treasury Secretary putting a date on it is a different state from either side making claims. The 40 is that Iran has denied three separate reopening reports in four days.\n\n**2. The Treasury Secretary spent the morning directing a Federal Reserve facility.** This is the item almost nobody priced. Per the [Crypto list](https://read.readwise.io/read/01kz6dcw3j4czybzarfkcqnb4g), Bessent's statement on the yen ran past the intervention itself and into instrument design.\n\nHis words. **\"We will not hesitate to participate in further joint intervention. The FIMA Repo Facility is an important backstop. We would encourage it to be upsized in the coming months.\"**\n\nJeff Park caught what that means and said it in one line: **\"FIMA is entirely a Fed tool, not a Treasury tool. Welcome to the Bessent-Warsh era of Fed interdependence.\"**\n\nHe is right and it matters more than the yen level. The Foreign and International Monetary Authorities repo facility lets foreign central banks borrow dollars against their Treasury holdings rather than dumping them. It is the Fed's plumbing for stopping a forced sale of US paper. A Treasury Secretary publicly asking for it to be enlarged is fiscal authority making a monetary request in the open, and neither institution corrected the other.\n\nBessent also went further than a stabilisation argument, saying Treasury \"strongly supports Japan's decisive market and monetary steps to correct the substantial undervaluation of the yen,\" and describing the Takaichi government as moving into a new phase of Abenomics. That is the United States endorsing a stronger yen, which tightens the cheapest funding pipe in global markets.\n\n**3. The economy printed strong and the index that watches it still says caution.** Per [Milk Road](https://read.readwise.io/read/01kz72dyx6b3k68vqx4mkdkqf6), July ISM at 55.6 percent answered the growth question in the clearest way available, GDPNow extended to 6.2 percent rather than retracing, and the stress score fell to its floor while the macro buffer sat at full strength. Oil held below $80, copper rose, freight costs fell and the curve steepened.\n\nAnd their posture stayed at caution at 75 percent exposure, for one reason. **Breadth on the market side fell 0.46 on the week to 0.18**, working directly against every other gain, even as the equal-weight S&P keeps outrunning the cap-weighted index and the rotation carries into August. The rotation is visible in prices and absent from the breadth score, and that gap is the only thing between here and a full risk-on posture.\n\nTheir three conditions to clear it are worth writing down: breadth stops falling, Friday's payrolls confirm a labour market under the ISM surge, and the August 12 CPI leaves six-month core flat. That last one is the live risk, because ISM Prices Paid at 71.1 is a tariff-driven pipeline warning that has not bled through yet.\n\nMohamed El-Erian adds the distributional caveat on the [Financial Markets list](https://read.readwise.io/read/01kz6cqnpq9dmp04b2bmsam265): more than 80 percent of reporters have beaten expectations, and releases like McDonald's this morning keep showing the K, with pressure concentrated on lower-income households.\n\n**4. CLARITY has four days and no floor time.** Per [Arbitrage Andy](https://read.readwise.io/read/01kz6vgs8kn7y01yk3amk43kcp), the bill has cleared the House and advanced through Senate Banking, and it is formally on the Senate legislative calendar, meaning it is eligible for a floor vote. It has no scheduled vote and Congress leaves for recess on Saturday.\n\nThe arithmetic is the whole story. Cloture needs 60 votes, so **roughly seven Democratic senators have to cross**. Some backed earlier committee versions and negotiations have since stalled on three things: ethics provisions covering government officials' own crypto activity, consumer protection language, and stablecoin-related banking concerns.\n\n**Polymarket prices 27 percent that it is signed into law this year.** That is the number to carry, and it is down from 82 percent in February.\n\nThe consequence if it lapses is not a price move, it is a jurisdictional vacuum. Without the bill the SEC and CFTC turf war stays unresolved and exchanges, token issuers and crypto businesses keep operating in legal limbo. I am 85/15 that no floor vote happens before the recess, and the more interesting question is whether September brings a rewrite or a shelving.\n"}]}], "deep": {"01kz6cqnpq9dmp04b2bmsam265": "# Financial Markets List, August 4 AM: Bessent Says The Strait May Reopen Tomorrow\n\n**Source:** The Financial Markets Twitter list, carrying zerohedge, Anas Alhajji, Scott Redler, Heisenberg, Mohamed El-Erian and others ([open original](https://read.readwise.io/read/01kz6cqnpq9dmp04b2bmsam265))\n\nThe digest that set the day. One quotation from the Treasury Secretary moved oil, equities and three separate trades built on the closure.\n\n## The Hormuz headline\n\nPer DeFiTracer relaying the statement, Scott Bessent said: **\"I THINK THERE'S A CHANCE WE MAY HAVE A DEAL TODAY OR TOMORROW TO OPEN THE STRAIT.\"** And **Qatar has already prepared a draft text** for a possible agreement.\n\nzerohedge's framing of the market response: **\"Futures Hit Record High As Oil Tumbles After Bessent Says Hormuz May 'Reopen Tomorrow'.\"**\n\nAnas Alhajji timed the tape precisely. **Oil rose 2 percent, then fell 2 percent after Bessent's statement**, with Brent for October settling at **$81.50** per Attaqa.\n\nThe draft text is the part that separates this from the previous four days of claims and denials. Iran has publicly denied three reopening reports since Sunday. A mediator circulating paper is a different signal from either principal making a statement, because Qatar does not spend its credibility on a document nobody will sign.\n\n## What the closure has already cost\n\nAlhajji's fiscal accounting is the most underrated item in the digest. **EU governments have committed roughly 12 to 16 billion euros** in fiscal measures and subsidies to cushion the 2026 Hormuz Crisis and lower energy costs for citizens. In most countries that spending prevented a recession, growth stayed very low regardless, and the borrowing now has to be repaid.\n\nHe also poses the question that decides the medium term for shipping: **can Saudi Arabia reroute all of its 6 million barrels a day of exports via the northern Red Sea**, and what are the limitations. Nobody has answered it, and that is why tanker rates have a floor under them independent of whether the strait opens.\n\n## The index levels\n\nScott Redler, who is the most specific technician on the list: **\"Mostly green arrows after a big post-Fed rally, with $SPX clearing the 7448 buy/DT line and pushing to 7610 yesterday. The index may be trying to leave its 10+ week range. Key now is whether it can hold above 7448 and keep building, with 7620 as the bigger level above.\"**\n\nTwo targets sit above that. Ryan Detrick notes **Frank Cappelleri's 7,680 target from late April is still alive**, and Investing.com carries **SocGen seeing the S&P at 8,000 as earnings strength broadens.**\n\nRedler's premarket board was four names: **$NVDA, $MU, $SPCX, $SNDK.**\n\n## The SpaceX borrow data\n\nThe single most actionable number in the digest, per zerohedge citing S3: **\"Massive SPCX shorting ahead of earnings: 95% of SpaceX stock available to borrow is out on loan, amounting to 34% short interest as percentage of the float.\"**\n\nHeisenberg adds the price path and the reflexive problem. The stock **hit an all-time low at $104 yesterday and traded $118 premarket**, and his read on positioning is worth the whole section: it is so obvious the stock goes down tomorrow that it becomes obvious not to short it, because everyone thinks it is obvious.\n\nThat is a crowded-short setup into a print where the sell side has no model, and it is a different risk from a directional view on the business.\n\n## Caterpillar\n\nPer Polymarket Money: **\"Caterpillar surges as quarterly sales top $20,000,000,000.00 for the first time amid the AI data center boom.\"** Heisenberg's reaction was three words and a question mark, that the AI boom is just getting started.\n\nThis is the picks-and-shovels version of the AI trade and it is cleaner than the neocloud version. Caterpillar sells generators, earthmoving and power equipment into the build, books revenue on delivery, and carries none of the residual-value exposure that makes the GPU-leasing arithmetic depend on what a chip is worth in 2032.\n\n## Apple as a defensive\n\nHeisenberg again, and this one fits the breadth data better than the megacap-leadership story does. Apple is **holding $300 after five straight down days and more than 13 percent peak to trough**, and it has been inversely tracking the Nasdaq proxy. His expectation is that once the Nasdaq takes a breather after its five-day run, defensive money rotates back into Apple for a bounce.\n\n## The macro prints\n\n**US Trade Balance: negative $73.3 billion against negative $73.0 expected, prior negative $77.6.**\n\nMohamed El-Erian on the earnings season: **over 80 percent of reporting companies have beaten expectations**, reinforcing a resilient-economy narrative, while releases including McDonald's this morning **highlight the \"K\" within that strength, with pressure on lower-income households.**\n\n## Two items that will matter later\n\n**Bitdeer shares jumped 23 percent on a 16-year AI and HPC data centre lease.** Sixteen years of contracted revenue reprices a miner as a landlord.\n\n**Polymarket is seeking investment at more than a $20 billion valuation**, and separately **gained exclusive US streaming rights to Serie A.** A prediction market buying live sports rights is a distribution strategy.\n\n## Sergey Brin, via Linas Beli\u016bnas\n\nA summary of a 29-minute unscripted Q&A at AGI House. The substantive points: specialised models are converging into one general system faster than predicted, with training on code and maths improving unrelated capabilities. One of the biggest leaps came from telling the model to think step by step, with no obvious reason it should work. Brin pushes back on superintelligence hype, notes that AI mastering a domain has never stopped humans improving at it, and thinks something close to transformers is probably enough for AGI. Inside Google **they are already using the AI to build the AI.**\n\n## What to discount\n\nThe usual promotional layer: a prop-firm thread, a trading-analytics product, a memecoin project posting repeatedly, and a housing-affordability lead magnet. Linda Raschke's \"Silver: Open Door to upside\" carries no level. Several Economist links are unrelated to markets.\n\n## The one variable that would change the call\n\nWhether the deal is signed or denied. Bessent has put a 24-to-48-hour clock on it and Qatar has text ready, so this resolves fast in either direction. If it lands, the Frontline, RTX and ExxonMobil complex gives back the rest of its war premium and the S&P gets a clean run at 7620. If Iran denies it a fourth time, oil gaps and the same three names are the only things that work. Watch Brent before equities, because it prices first.\n", "01kz6dcw3j4czybzarfkcqnb4g": "# Crypto List, August 4 AM: The SpaceX Preview And A Treasury Secretary Directing A Fed Facility\n\n**Source:** The Crypto Twitter list, carrying Kyle Reidhead, Scott Bessent, Jeff Park, Eric Balchunas and others ([open original](https://read.readwise.io/read/01kz6dcw3j4czybzarfkcqnb4g))\n\nTwo items here have nothing to do with crypto and are the most important things on the list: a full preview of the SpaceX print, and a Treasury statement that quietly crosses an institutional line.\n\n## Bessent's yen statement, in full\n\nWorth reading closely, because the operative sentence is not the one about the yen.\n\n**\"The Trump Administration delivers for America's trusted partners. Economic security is national security. And the U.S.-Japan alliance is built on both. Friday's coordinated foreign exchange actions countered disorderly yen movements. Treasury remains attentive and in close communication with our counterparts at MOF and BOJ. We will not hesitate to participate in further joint intervention. The FIMA Repo Facility is an important backstop. We would encourage it to be upsized in the coming months. We strongly support Japan's decisive market and monetary steps to correct the substantial undervaluation of the yen. The Takaichi government is moving into an exciting new phase of Abenomics, as nearly 15 years of powerful stimulus have created durable, robust underlying economic dynamics.\"**\n\nJeff Park caught what most readers skipped: **\"The funny thing about this tweet for those who didn't catch it is FIMA is entirely a Fed tool, not a Treasury tool. Welcome to the Bessent-Warsh era of 'Fed interdependence'.\"**\n\nHe is right and it is the story. The Foreign and International Monetary Authorities repo facility lets foreign central banks borrow dollars against Treasury holdings instead of selling them. It is Federal Reserve plumbing, designed precisely to stop a forced liquidation of US paper. A Treasury Secretary publicly requesting that a Fed facility be enlarged is fiscal authority making a monetary request in the open, and neither institution issued a correction.\n\nNote also what Bessent endorses: **a stronger yen.** Treasury \"strongly supports\" Japan correcting the yen's \"substantial undervaluation.\" A stronger yen tightens the cheapest funding channel in global markets, the same carry pipe that funds dollar risk assets.\n\n## The SpaceX preview, and it is the best one published\n\nKyle Reidhead's breakdown ahead of the first-ever earnings report. Expected **$6.8 billion of revenue and $10.9 billion of cash burn.** Six things he says move the stock:\n\n**1. Starlink ARPU.** Revenue per user **fell from $99 in 2023 to $66 last quarter**, and the street wants **$65.50**. His framing is the right one: if it holds, the cash cow is simply maturing. If it slips again and growth is coming only from cheaper subscribers, that is a different business. Starlink is still the main revenue driver.\n\n**2. xAI compute revenue.** SpaceX spent **$7.7 billion on AI capex last quarter, 76 percent of all company spending.** The market wants to know when the return arrives. The **Anthropic deal at $1.25 billion a month through 2029** proves they can sell compute, and any unannounced new contracts would be bullish. He calls this the fastest potential growth line.\n\n**3. Starship.** Cost per launch, cadence, and the path to full reusability. He does not expect surprises given the last flight's success.\n\n**4. Cursor and xAI users.** Whether this is meaningful revenue or a tool for X and Tesla.\n\n**5. Cash flow and guidance.** **Consensus EPS ranges from a $1.26 loss to a $0.33 profit**, which as he says is how little anyone actually knows.\n\n**6. X revenue.** Analysts expect roughly **$2.9 billion for 2026.**\n\nThen the kicker, and it is the part that matters more than the print: **earnings hit tonight, and the first big lockup, over $100 billion of stock, starts unlocking Thursday.** Even a good number can be met with supply 48 hours later.\n\nHe discloses he is bullish long term and building a position, and the post is a Milk Road PRO advertisement.\n\n## The Coldcard argument turns commercial\n\nEric Balchunas, who covers funds for Bloomberg: **\"NEW: Coldcard hack could spur greater migration to ETFs. What used to be seen as a bug by coiners (dorky boomer TradFi) may all the sudden seem like a feature (large, established financial institutions with decades of experience safeguarding client assets) esp vs a Canadian co w/ 5 employees.\"**\n\nThe five-employee detail is the rhetorical knife and it is also a fair point. Self-custody's promise was removing counterparty risk. What it actually did in this case was concentrate the risk in one small vendor's random number generator. That is counterparty risk with worse disclosure and no recourse.\n\n## Wells Fargo enters tokenization\n\nPer Andy: Wells Fargo is **rolling out tokenized deposits for enterprises and corporates** to have 24/7 access to business capital onchain. His read: **\"The banks know that they are in trouble, and they are moving rapidly to adopt tokenization.\"**\n\nHis honesty about the second-order effect is refreshing and worth quoting: **\"Very bullish, but I don't have the answer to your question of 'how does this affect [my bags]?' because I'm not really sure.\"** A money-centre bank issuing tokenized deposits validates the rails and does nothing obvious for any token.\n\n## The orbital-mechanics explainer\n\nAn unusually good primer from bobdbldr on why space companies need propulsion at all. The core point: **orbits are not addresses at different distances, they are different products.** Low orbit at 400 to 600 km gives millisecond latency and camera detail, so broadband constellations and imaging satellites live there. Geostationary at 35,786 km matches Earth's rotation so you hang over one hemisphere. Polar sun-synchronous orbits make today's image comparable with last week's. Around 20,000 km the geometry suits navigation.\n\nAnd the rule underneath: **in space you do not move by distance, you move by velocity change**, measured in kilometres per second. Reaching orbit costs about **9.4 km/s**, of which 7.7 is orbital velocity and the rest is lost fighting gravity and air. Propellant does not scale linearly, so a single-stage rocket would have to be **94 percent propellant by mass**, and that is why staging exists. His closing point is the one investors miss: **reuse did not change the physics, because propellant was never the expensive part, the hardware was.**\n\n## The one variable that would change the call\n\nFor SpaceX, the sequencing rather than the number. Reidhead has laid out six lines that move the stock and then noted that more than $100 billion unlocks two days later, which means a beat and a fall are entirely compatible. Watch Starlink ARPU against $65.50 for the business and watch Thursday's tape for the actual price discovery. For the Bessent item, watch whether the Fed says anything at all about FIMA sizing, because silence is itself the answer to whether the two institutions are coordinating.\n", "01kz6h7hmswmxrpz3s7z05cfc3": "# The Market Said No: Strategy Turns Seller And The Miners Decouple\n\n**Source:** 0xResearch (Blockworks), Joe Cho and Carlos ([open original](https://read.readwise.io/read/01kz6h7hmswmxrpz3s7z05cfc3))\n\nThe tightest read on Monday's crypto tape, and it contains the single most structurally important disclosure in the asset class right now.\n\n## The divergence\n\nMonday split the complex in half. **Bitcoin was flat at negative 0.02 percent while the Nasdaq gained 1.4 percent and the S&P added 1.2.**\n\n| Sector | Move |\n|---|---|\n| Crypto Miners | +9.6 percent |\n| Crypto Equities | +4.5 percent |\n| Modular | +2.8 percent |\n| Perps | +2.6 percent |\n| Oracle | +2.4 percent |\n| DeFi | +2.0 percent |\n| Launchpad | -2.9 percent |\n| Solana Eco | -3.3 percent |\n| DEXs | -5.7 percent |\n\nTheir own characterisation is the honest one: token performance was **\"fragmented, with strength concentrated in a limited number of sectors rather than a broad theme.\"** DEXs gave back a week that had included a 10.1 percent Thursday rally, and Solana Eco lost its position as the prior week's leader.\n\n## Strategy stops being the bid\n\nThis is the disclosure that matters, and it is buried near the end.\n\n**Strategy disclosed that it sold 1,638 BTC last week to fund preferred dividends and STRC buybacks. After four weeks without a purchase, Strategy returned to the market as a seller.**\n\n0xResearch's own framing gets it exactly right: this removes **\"the token market's most reliable structural buyer from the bid and leaves tokens to continue searching for a catalyst of their own.\"**\n\nThink about what that changes. For years Strategy functioned as a price-insensitive, permanently-bid buyer absorbing supply on every drawdown, and the market priced that floor whether or not anyone said so. It has now inverted. The mechanism is not sentiment, it is obligation: the preferred stack has to be serviced in dollars, and if the equity cannot be issued above net asset value, the coins fund the coupon. That is a treadmill that accelerates as the discount widens, and it does not respond to price levels.\n\n## The miners are no longer a Bitcoin trade\n\nTwelve of the thirteen constituents are higher over the past week, led by **CIFR at 24.9 percent, IREN at 20.8, and HUT at 19.3**, with four other names also posting double-digit gains.\n\nThe driver is explicitly contracts rather than hash price. The move **\"builds on the contract announcements we flagged on Friday, with IREN's $2.8B of AI-cloud deals and Hut 8's second $9.8B lease still working through the sector.\"**\n\nThat reprices the whole sector off a different curve. A miner with a signed multi-year AI lease is selling power, cooling and site access to a creditworthy tenant, and its equity should trade on lease duration and counterparty quality rather than on Bitcoin. Monday proved the split empirically: miners up 9.6 percent on a day Bitcoin did not move at all.\n\n## The macro backdrop, stated cleanly\n\nTwo things lifted everything except the tokens.\n\n**The yen.** On Friday **the New York Fed, acting on Treasury's behalf, sold euros to buy yen**, and both governments confirmed the operation on Monday. **USD/JPY subsequently fell from above 163 to around 156.**\n\nThat is the confirmation of the Camp David notepad photographed on July 31 reading \"buy Japanese yen $5-10 bil.\" The operation was real, coordinated and larger than the note implied.\n\n**Iran.** President Trump's decision to **postpone further strikes sent Brent down 4.7 percent** and eased inflation concerns.\n\n## The governance stress test\n\nA genuinely interesting episode with a small dollar figure and a large idea behind it.\n\nOn July 31 a malicious party submitted **UMBRA-004**, a proposal to transfer **1.57 million USDC**, effectively the entire treasury of the privacy project Umbra, to the attacker's wallet.\n\nUmbra is governed through **MetaDAO's decision markets** rather than token voting. Each proposal creates two conditional markets, PASS and FAIL, and the proposal executes only if PASS maintains a higher time-weighted average price than FAIL. The logic is that if the token is expected to be worth more with a proposal passed, it should pass.\n\nDraining the treasury was obviously bad for the token, so the PASS market priced below FAIL and the proposal died. No quorum fight, no whale coordination, no emergency multisig.\n\nWhy that is worth attention: governance attacks succeed against token voting when an attacker can rent or borrow enough votes, because voting counts tokens rather than pricing outcomes. A decision market makes the attack unprofitable rather than merely unpopular, since the attacker would have to buy the PASS market up against everyone with an economic interest in the token. This is the first consequential real-world test of that design.\n\n## Where to push back\n\nThe miner section is the one to hold loosely. Twelve of thirteen names rising in a week on two contract announcements is a sector-wide re-rating on company-specific news, and that pattern historically mean-reverts for the names that did not sign anything. 0xResearch does not distinguish between the miners with leases and the ones that just moved in sympathy, and that distinction is the entire trade.\n\nThe Strategy disclosure also deserves one caveat they do not add: 1,638 coins is small in absolute terms. The signal is the direction and the reason, not the size.\n\n## The one variable that would change the call\n\nWhether Strategy buys again. The entire structural argument rests on a treadmill that only runs while the equity trades below net asset value. If the premium returns and Strategy resumes issuing stock to buy coins, the most reliable bid in the market comes back and this week reads as a funding blip. If the discount persists and the next disclosure shows another sale, the market has permanently lost its buyer of last resort and every level below here has less underneath it than the last cycle. Watch the premium, not the coin count.\n", "01kz6vgs8kn7y01yk3amk43kcp": "# Is The Market Reset Over? The CLARITY Window Closes\n\n**Source:** Arbitrage Andy, letter 574 ([open original](https://read.readwise.io/read/01kz6vgs8kn7y01yk3amk43kcp))\n\nA mid-session letter whose value is entirely in one section: the clearest procedural account of where the CLARITY Act actually stands, four days before the Senate leaves.\n\n## The state of the bill\n\nThree facts, and the third is the one that decides it.\n\n- **The bill has already cleared the House and advanced through the Senate Banking Committee.**\n- **It is officially on the Senate legislative calendar, meaning it is eligible for a floor vote.**\n- **It still has no scheduled vote.**\n\n**Polymarket prices 27 percent that it is signed into law this year.**\n\n## The vote arithmetic\n\nTo overcome a filibuster the legislation needs **60 votes**, which means **roughly seven Democratic senators must ultimately support cloture**, the procedure that ends debate and forces a vote.\n\nA handful of Democrats supported earlier committee versions. Negotiations have since stalled on three specific things:\n\n- **Ethics provisions** surrounding government officials' own crypto activities, which the author flags pointedly as a Trump issue\n- **Consumer protection language**\n- **Stablecoin-related banking concerns**, where the early objections from Coinbase and the major banks originated\n\nThat third one is worth understanding because it is counterintuitive. Coinbase objecting to stablecoin banking language means the industry is not unified behind the bill, so the usual framing of crypto-versus-Washington is wrong. Parts of the industry are fighting each other inside the text.\n\n## What failure actually costs\n\nThe author is careful to separate price from structure, and he gets it right.\n\n**\"While I am pretty sure Bitcoin and Ethereum will likely remain driven primarily by macro liquidity, if this doesn't go through we will likely see companies like Coinbase, Robinhood, Circle could face renewed pressure as regulatory clarity is pushed further into the future.\"**\n\nHis diagnosis of the real cost: **\"For markets, the biggest risk here is this drawn out regulatory uncertainty. Without the CLARITY Act, the SEC/CFTC turf war remains largely unresolved, leaving exchanges, token issuers, and crypto businesses operating in a frustrating legal limbo.\"**\n\nThat is the correct read. The tokens trade on liquidity. The equities trade on jurisdiction. A failed vote is a repricing event for Coinbase, Robinhood and Circle and close to a non-event for Bitcoin.\n\nHis positioning advice is appropriately modest: have dry powder, be ready to move on a surprise catalyst between now and September or October, and expect the outcome either way to be tradeable.\n\n## The rest of the letter\n\nThe Coldcard section is set up and then paywalled at the point where it would answer its own question: do other cold-storage options carry the same risk? He confirms the scale at **$100 million-plus stolen** and frames it as a flaw in one of Bitcoin's most respected hardware wallets rather than an exchange or phishing failure.\n\nThe market framing at the top is thin but honest about causation: **\"Equities just ripped higher on easing geopolitical fears in the Middle East (or at least Trump saying they are easing).\"** That parenthetical is the most accurate thing anyone wrote about Monday and Tuesday, because nothing has actually changed in the Gulf except statements.\n\nHe also promises sections on Citadel's view of where the bull market stands and on which of his paid picks are working. Both are behind the subscription.\n\n## How to weigh it\n\nThe procedural detail on CLARITY is genuinely better than what the wire services carried, and the vote arithmetic is stated correctly rather than hand-waved. That is the reason to read it.\n\nEverything else is a newsletter funnel. Roughly half the letter is a table of contents for content that sits behind a paywall, and the market commentary that is free carries no levels, no positions and no dates. Treat the CLARITY section as reporting and the rest as marketing.\n\n## The one variable that would change the call\n\nCloture. Not the vote, the motion to file it. Cloture requires ripening time on the Senate floor, so a bill with no filed motion four days before a recess is arithmetically finished for this session regardless of stated intentions. If a motion appears tomorrow, the 27 percent is badly mispriced and Coinbase and Circle are the trades. If Friday arrives with the calendar untouched, the question stops being whether it passes in August and becomes whether September brings a rewrite or a quiet shelving, and the ethics provision is where to look for the answer.\n", "01kz72dyx6b3k68vqx4mkdkqf6": "# ISM Hit 55.6 Percent, So Why Still Caution?\n\n**Source:** Milk Road, macro letter by John Gillen ([open original](https://read.readwise.io/read/01kz72dyx6b3k68vqx4mkdkqf6))\n\nA weekly macro update built around a rules-based index, and the reason to read it is that the index disagreed with its own inputs and the author explains why instead of overriding it.\n\n## The prints\n\n**July ISM Manufacturing printed 55.6 percent, the best level since May 2022.** That answered the prior week's central question directly.\n\n**Atlanta Fed GDPNow's Q3 estimate extended from 5.0 to 6.2 percent** rather than retracing.\n\nInside their index, the real economy score moved from **negative 0.08 to positive 0.07**, the stress score **dropped to its floor at 0.00**, and the macro buffer sat at **full strength at 0.50.**\n\nThe market side agreed. Growth impulses **moved up 0.27 on the week**, **oil held below $80**, copper rose, freight costs fell and the **yield curve steepened**, while financial conditions at **0.31** absorbed the Fed's divided hold and the labour data without flinching.\n\nHis summary: the two pillars, economy and market, now agree on growth, and the divergence that had kept the index at caution is resolved.\n\n## And the posture stayed at caution anyway\n\n**Headline allocation posture: negative 0.16, CAUTION, 75 percent exposure.**\n\nThe single reason: **breadth on the market side fell 0.46 on the week to 0.18** and is working directly against every other gain.\n\nThe detail that makes this interesting rather than mechanical: **\"Even as the equal-weight S&P 500 continues to outrun the cap-weighted index and sector rotation carries into August. The rotation is visible in the market, but the breadth score still isn't registering it, and that gap is the only thing keeping the posture from going full RISK ON.\"**\n\nThat is an honest admission that the model may be lagging its own thesis. The rotation is happening in prices, and the breadth measure has not caught up. He does not override the model to fit the story. That is the correct discipline and also why the reading counts for something.\n\nIt also sits directly against the megacap-leadership argument circulating this week. An equal-weight index outrunning the cap-weighted one is the opposite of the generals leading.\n\n## The three conditions to go risk-on\n\nStated explicitly, dated, and gradeable.\n\n**1. Breadth stops declining** and starts reflecting the rotation signal.\n\n**2. Payrolls on August 7.** Consensus **91,000 to 120,000 after June's 57,000 miss.** This would confirm the ISM surge has a labour market underneath it.\n\n**3. CPI on August 12** leaves the six-month core direction flat. The risk he names is specific: **ISM Prices Paid at 71.1**, still historically elevated from tariff-driven input costs, is **\"an active pipeline warning that could turn the inflation axis positive and build stress fast if it starts bleeding through.\"**\n\nThat third condition is the one to watch. A manufacturing survey printing its best growth reading in four years while its own price component sits at 71.1 is the tariff pass-through problem stated in a single pair of numbers.\n\n## What the format gets right\n\nThe index is rules-based and published with its components, so the reader can see which pillar moved and by how much. When the output disagreed with the narrative, the author said so and explained the disagreement rather than quietly re-weighting. And the forward conditions carry dates, which makes the whole thing gradeable in a fortnight.\n\n## What to discount\n\nThe letter is a crypto newsletter and the macro section runs weekly regardless of whether the week produced anything, so there is a structural bias toward finding a story. The tone is deliberately jokey and the analytical density is lower than the numbers suggest. Roughly half the document is conference promotion, sponsor content, memes and a Vitalik photo.\n\nThe scores themselves are proprietary and unauditable. A reader cannot verify how breadth is constructed or why it fell 0.46, which means the headline conclusion rests on trust in a black box. The inputs he names are checkable and the composite is not.\n\nAlso on the tape, in their closing links: **Dave Weisberger arguing the Coldcard hack may actually be a gift to ETFs and custodians**, the third named voice reaching that conclusion in two days.\n\n## The one variable that would change the call\n\nFriday's payrolls, and specifically whether the number confirms or contradicts ISM. A print in the 91,000 to 120,000 consensus range alongside a 55.6 manufacturing survey makes the growth story coherent and leaves breadth as the only holdout. A second consecutive miss near June's 57,000 puts a strong manufacturing survey next to a deteriorating labour market. That combination usually resolves toward the labour data. Everything in this letter routes through that one release.\n", "01kz7qwryy365s4awdkprvf8zb": "# Stocks List, August 4 PM: AMD Beat And Fell Ten Percent, And Cuban Sold His Bitcoin\n\n**Source:** The Stocks Twitter list, carrying Con, SouthernValue, Milk Road Stocks and AskLivermore ([open original](https://read.readwise.io/read/01kz7qwryy365s4awdkprvf8zb))\n\nThe after-hours digest, and it carries three things that matter more than the day's tape: why a beat got sold, the arithmetic behind SpaceX's capacity plan, and the moment the digital-gold thesis lost its most quotable holder.\n\n## AMD beat and got sold ten percent\n\nPer Con, the sequence is instructive. AMD **released earnings, produced good numbers on paper, and fell about 10 percent after hours** having closed the regular session **up 7 percent near its highs.**\n\nHis diagnosis has two parts and both are checkable. Expectations were the problem, because AMD **had nearly tripled over the prior year and was up 140 percent year to date** going into the print. And the composition was wrong: **capex increased and free cash flow decreased**, which he flags as concerning for other AI names too.\n\nThe conclusion is the part with reach: **AI stocks now have to beat by a lot rather than merely beat** to keep the trend going.\n\nHe then acts on it, and the disclosure is unusually complete. He is **selling all his AI enabler positions** while staying in AI beneficiaries, distributors, crypto and robotics. His resistance levels: **$NBIS at $220 to $230, $MU at $900, $SIVE at $40.** His catalyst calendar: **$AAOI, $NET, $MTSI, $NBIS and $ASYS within days**, then Nvidia, Marvell and Micron in the following weeks. His reversal condition is stated: a quick break in structure to the upside and he buys back for a 5 to 10 percent loss.\n\nHe also notes that **Palantir beat** the same day and that is why everything rallied, while warning the read-through cuts both ways: if the market takes a PLTR beat as proof AI enablers will beat, a miss cascades harder.\n\nHis fear case is worth quoting because most people writing about the war have stopped: **\"a war usually lasts a long time. And if we actually had a war now, I don't think it'd be fully priced in. As people on both sides now act as this situation is a joke.\"**\n\n## The SpaceX funding arithmetic\n\nPer SouthernValue, and this is the best modelling on the list. Elon says **2GW of data centre capacity by the end of this year, up from about 1.4GW today, and close to 10GW next year, all Nvidia.**\n\n| Line | Figure |\n|---|---|\n| Implied capex at $50-60bn per GW | roughly $500 billion |\n| Cash on hand | about $100 billion |\n| Cash from operations, first half 2026 | $3 billion |\n| Anthropic and Google spot GPU deals | about $26 billion of annual recurring revenue |\n| Cursor, potential by year end | $10-12 billion of ARR |\n| Estimated exit-2026 forward operating cash | about $50 billion |\n| Residual funding gap | about $350 billion |\n\nHe notes the plan may be larger still, since Elon has also said he will build **15GW of utility power.** And he flags the churn risk explicitly: the Anthropic and Google revenue is **at risk of being churned off in early 2027, especially by Google as much cheaper internal capacity comes online.**\n\nHis conclusion is the one to carry: **\"I have to imagine $NVDA customer financing will come into play here.\"** Which puts SpaceX in the same vendor-financing structure as the OpenAI campus, with the chip supplier underwriting its own buyer.\n\n## The neocloud bear case, stated structurally\n\nPer Milk Road Stocks, and it is the cleanest version of this argument anyone has written.\n\nCompanies building data centres specifically for AI generate **mid to low single digit pre-tax returns on capital**. They essentially own real estate and lease it out. The neoclouds are **a layer worse because they are equipment leasing**: buy a chip from Nvidia, lease it to a hyperscaler or an AI lab, and the economics depend on whether the depreciation schedule works in your favour and whether you can keep getting chips at all.\n\nThen the structural principle, and it is the part to keep: **\"Any company that's a middleman in a supply chain should never trade at a higher multiple than the company that controls its supply.\"** Nvidia and TSMC control the supply. The neoclouds are price takers who accept terms rather than set them.\n\nTheir honest framing: this does not mean the trade cannot work, it means **the valuation ceiling is structurally lower than the narrative implies.** They also disclose that their own analysts disagree, with Melvin extremely bullish on neoclouds and Martin leaning bearish, and note **$NBIS up 14 percent** on the day.\n\n## Cuban sold, and the reason is the damage\n\nPer Milk Road Stocks, **Mark Cuban has sold the majority of his Bitcoin.**\n\nThe thesis he bought on: **\"It was a better version of gold than gold.\"** A hedge against fiat losing value, so when the dollar weakens Bitcoin should rise.\n\nThen the test arrived and failed. **During the Iran war, when geopolitical risk was spiking and the dollar was sliding, Bitcoin dropped. Gold went to records.** Their framing of why that should not have happened is right: Bitcoin is priced in dollars, so a falling dollar makes it cheaper for buyers everywhere and global demand should push it up. It did not.\n\nHe is **more disappointed in Bitcoin than in Ethereum**, having already written off memecoins entirely.\n\nWhy it travels past one portfolio, and this is the analytically important part: **\"The 'Bitcoin as digital gold' narrative has been the backbone of institutional adoption for years. It's the reason pension funds, family offices, and corporate treasuries started buying. If that hedge thesis is broken, the next buyer at these prices needs a different reason to hold.\"**\n\nTheir conclusion is blunt: **Bitcoin is still trading like a risk asset, correlates with tech stocks in a downturn, and does not decouple when it matters most. Gold does not have that problem.**\n\nNoLimit adds that **Jim Cramer says he has sold all of his remaining Bitcoin.**\n\n## The dispersion nobody is pricing\n\nPer AskLivermore, year-to-date performance across his book and the benchmarks:\n\n| Position | Year to date |\n|---|---|\n| His core portfolio | +5.49 percent |\n| $SPY | +2.59 percent |\n| $QQQ | -1.93 percent |\n| $XLK | -2.34 percent |\n| $SMH | -11.03 percent |\n\nSemiconductors down 11 percent while the broad index is up 2.59 is not a tech-led market, whatever the headline index does on any given day.\n\nHis posture is contrarian on sentiment rather than on price: **\"everyone is posting their screenshots again on X and turning bullish. This is when it's time for me to stay cautious short-term.\"** He is holding his technology names for now, sold Mastercard for a 13 percent gain, and recently added Arm and Marvell.\n\nHis next buys are the interesting part and they are all rate-sensitive rather than AI: **homebuilders, education providers, micro and small-business enablers, and aging-population REITs.**\n\n## What to discount\n\nTwo political posts with no market content, and the Milk Road items are subscription marketing with real analysis inside them, so the selection of which calls get shown is theirs.\n\n## The one variable that would change the call\n\nWhether the AMD reaction generalises. Con's thesis is that a modest beat is now a sell, and the calendar tests it immediately with $AAOI, $NET, $MTSI, $NBIS and $ASYS inside days and Nvidia behind them. If those beat and fall too, the market has repriced the bar for the whole complex and his derisking was early rather than wrong. If they beat and rally, AMD was a positioning reset in the one name that had tripled, and the capex-up cash-down detail was the specific problem rather than a sector signal.\n", "01kz9b2cvxwx0npaq44jby364v": "# Market List, August 5 PM: Iran And Oman Agreed The Route, Kashkari Wants A Hike Now\n\n**Source:** The Market Twitter list, carrying Walter Bloomberg, Gene Munster, Heisenberg, Jukan, Shay Boloor and Wayne Liang ([open original](https://read.readwise.io/read/01kz9b2cvxwx0npaq44jby364v))\n\nThe densest digest of the week. It contains the resolution of the Hormuz story, a hawkish turn at the Fed, and the first real evidence that the memory bear case may be backwards.\n\n## Hormuz, resolved in three consecutive posts\n\nIran's foreign ministry, via Walter Bloomberg within two minutes:\n\n- **\"GEOGRAPHIC CHARACTERISTICS OF THE ROUTE IN STRAIT OF HORMUZ AGREED BY IRAN AND OMAN\"**\n- **\"JOINT ANNOUNCEMENT BY OMAN AND IRAN IN FINAL STAGE IF 'CERTAIN THIRD PARTIES' DO NOT INTERFERE\"**\n- **\"IRAN-OMAN AGREEMENT 'IN ITSELF' DOES NOT MEAN THE STRAIT IS SECURE\"**\n\nRead those in order and the shape is clear. The route is settled, the announcement is imminent, and Tehran has written two escape clauses into the same statement. The third-party condition points at Washington and Jerusalem. The security caveat preserves the permissioned-corridor structure Iran described days earlier, now with a signature attached.\n\nNote also who closed it. Bessent named **Qatari** draft text the previous morning and put a 24-hour clock on it. The agreement arrived through **Oman**.\n\nSeparately: **Russia hit three cargo vessels in the Black Sea** the same day, per the Russian defence ministry. Shipping risk is not a single-theatre story.\n\n## The Fed turned hawkish in public\n\n**Neel Kashkari called for immediate rate hikes.** The Minneapolis Fed President, one of three who dissented from last week's hold, backed a 25 basis point move and **warned that delaying could force the Fed to tighten more aggressively if inflation becomes entrenched.**\n\nThe venue and the desks are now maximally split.\n\n| September | Position |\n|---|---|\n| Kalshi, hold | 49 percent |\n| Kalshi, 25bp hike | 47 percent |\n| Kalshi, more than 25bp | 2 percent |\n| BofA | 25bp in September, then October and December |\n| JPMorgan | Hold September, hike December |\n| Goldman | Hold, no more hikes |\n| Morgan Stanley | Hold through year-end |\n| Barclays | Hold through year-end |\n| Citi | Hold September, then cuts in October, December and January |\n\n**BofA chief executive Brian Moynihan** reiterated the three-hike forecast publicly, saying the labour market remains strong while inflation still needs to ease, and adding that spending patterns between higher- and lower-income consumers are converging.\n\n**Janet Yellen** supplied the counterweight: the labour market is functioning well and **no longer looks hot enough to fuel inflation**, and she is **surprised the Middle East conflict and higher oil prices have had such limited economic impact.**\n\nHeisenberg's read on the same data: now basically a coin flip on whether Warsh and company hike a quarter next month, with higher odds than last week.\n\n## Bank of America's target is done\n\n**\"BOFA: S&P 500 HITS 2026 TARGET.\"** The bank says the index has reached its 2026 target of **7,741**, with technicals suggesting extension toward **8,000, 8,234 and potentially 8,541**. It sees **7,500 as key support** and warns that weak August-to-October seasonality, stretched momentum, geopolitical risk and upcoming payroll and inflation data could limit gains.\n\nHeisenberg has the stretch measured, and it is the mirror of Sunday's Tesla setup: **for the first time since March 2024, the entire S&P candlestick body closed definitively outside the upper Bollinger band, and by a mile.**\n\nBanana3 carries an 8,300 year-end target, forecast when the index was at 6,300, and thinks the market needs a brief cool-off first.\n\n## SpaceX, modelled twice by Gene Munster\n\nHis first post handles the guidance. The company gave an **exiting-2026 revenue run rate of $100 billion**, which implies **December quarter revenue near $22 billion against $7.8 billion reported in June.** December revenue estimates went up about **17 percent** on it.\n\nHis second post extends it. Guidance calls for roughly **$8.5 billion of monthly revenue in December**, and the Street sits near **$100 billion for CY27, up 122 percent.** Munster thinks that is conservative: at 5 percent month-over-month growth off December he gets **$135 billion**.\n\nHe names his own uncertainties, and that is why the model repays reading. The launch business was only **8 percent of December sales** and is lumpy, and the Cursor business is growing month over month. And the real risk he raises then dismisses: the cloud contracts carry **90-day cancellation provisions**. His justification for waving it off is that **\"we're still in the top of the first when it comes to inference.\"**\n\nThat is a genuine leap. A revenue base built on 90-day cancellable contracts is not the same asset as one built on take-or-pay, and \"inference is early\" is a thesis rather than a contractual protection.\n\n## The memory story may be inverted\n\nPer Jukan relaying South Korean media, and this is the most consequential single-name item here:\n\n**Apple recently negotiated with CXMT over supply prices for mobile DRAM including LPDDR5X**, to ease manufacturing cost pressure on its next-generation iPhone and smart device lineup, **but CXMT rejected its request for price cuts.** CXMT instead **insisted on prices higher than or comparable to those offered by Samsung Electronics and SK Hynix.**\n\nIf accurate, that reverses the read the market took from CXMT doubling capacity earlier in the week. A new entrant with state backing that declines to undercut incumbents on a marquee account is optimising for margin, not share, and a price war is exactly what did not happen.\n\nThe honest caveat is supplied on the same list. The AI Investor, resharing it: **\"Seems like a fake news to me, doesnt past the smell test.\"** One media report, publicly disputed, so weight it accordingly.\n\n## The humanoid supply chain, all at once\n\nPer Wayne Liang, four national programmes moved in the same week:\n\n- **Mitsubishi** is converting an idle engine plant to build roughly **1,000 humanoids a month**\n- **Unitree** lists in a couple of weeks with **85 percent of 2025 shipments** and **more than $20 billion of subsidies**\n- **Hyundai** targets a few thousand a year via Boston Dynamics\n- **Tesla** is ramping Optimus\n\nHis trade: downstream flow benefits **$CCXI and Agility as the only US-listed pure-play**, with the honest disclosure that SPAC mergers are higher risk and higher reward.\n\nThe Mitsubishi detail is the one that reframes the sector. Converting an engine plant means the binding constraint is idle precision-manufacturing capacity rather than robotics research, which makes this an industrials question.\n\n## AMD, from the bull side\n\nPer Shay Boloor: Futurum reiterates **Buy on $AMD with an $800 price target**, raising its 2027 forecast to **$90 billion of revenue and $17.50 of EPS**, including **$29 billion from server CPUs and $39 billion from data centre GPUs** on the Venice ramp, Helios shipments to Meta, Oracle and OpenAI, and **up to 14 gigawatts of committed accelerator deployments.**\n\n## The cyber item worth filing\n\n**Major hedge funds including Citadel, Point72 and Two Sigma were targeted in a wave of sophisticated cyberattacks using AI-powered voice phishing** to trick employees into granting system access. Two Sigma blocked the attack and found no evidence of a breach. Experts warn AI is making large-scale attacks cheaper and easier.\n\nThat is an operational-risk story for the entire allocator complex, and it is the second AI-enabled attack vector to surface this week after the Coldcard seed-phrase brute-forcing.\n\n## Also present\n\n**Gold ripped.** Heisenberg: from roughly $370 to almost $392 on the tracking fund in two days, having flagged two days earlier that a big move felt close.\n\nPromotional filler includes two Mark Minervini workshop posts, and Boloor joking that his ten-week-old son bottom-ticked Nvidia. Lula calling a US visa move on Brazil's ambassador irresponsible is a real headline with no market consequence here.\n\n## The one variable that would change the call\n\nWhether the joint announcement survives the third-party clause. Iran has agreed a route and reserved the right to walk if others interfere, so the difference between a reopened strait and a paused negotiation is now a single statement from Washington or Jerusalem. Watch Brent, because it prices the announcement before equities do, and watch whether Iran's \"does not mean the strait is secure\" line gets repeated after the joint statement rather than before it.\n", "01kz9b9cmjc3ff1h5mx6ar8msj": "# Crypto List, August 5 PM: Goldilocks, Gold Above $4,300, And Bitcoin As A Sock Puppet\n\n**Source:** The Crypto Twitter list, carrying Milk Road Stocks, Kyle Reidhead, Melvin, Mandelbrot and The Kobeissi Letter ([open original](https://read.readwise.io/read/01kz9b9cmjc3ff1h5mx6ar8msj))\n\nA crypto list whose best material is about equities and gold. That is itself the story.\n\n## The Goldilocks case, with three checkable charts\n\nPer Milk Road Stocks, and the numbers are the reason to take it seriously rather than the framing.\n\n**ISM Manufacturing printed 55.6.** Above 50 is expansion, and at 55.6 it is the **strongest reading since May 2022 and the seventh straight month of expansion.**\n\n**S&P 500 net profit margins hit 16.7 percent.** That is the **highest FactSet has recorded since it began tracking the number in 2009.** Their point is the right one: companies are growing revenue and getting more profitable at the same time.\n\n**Inflation cooled** in the latest reading after several months of increases, and they attribute part of it to easing US-Iran tensions taking energy prices and inflation expectations down.\n\nGrowth accelerating while inflation falls is the textbook Goldilocks setup, and it is the honest explanation for why the equity tape looks the way it does.\n\nKyle Reidhead's version, delivered on Fox Business, extends it into a forecast: the economy is booming, earnings are crushing, **the war is probably ending**, inflation is coming down, and AI adoption is accelerating. His specific claim is that AI adoption is early, and that **by the end of this year the market realises how many tokens consumer and enterprise agents will consume, producing more infrastructure buildout than expected.** He expects both AI infrastructure and the AI application layer to finish the year strong.\n\nBoth posts are Milk Road PRO advertisements. The charts are real, the conclusion is a sales pitch, and the two can coexist.\n\n## Gold, the item that does not fit\n\nPer The Kobeissi Letter: **gold futures extended gains to 4 percent on the day and rose above $4,300 an ounce.**\n\nHold that against everything above. The war premium is leaving oil, the strait is being reopened, equities are printing records and profit margins are the best since 2009. Under a Goldilocks reading gold should be the one asset with nothing to do.\n\n## And the line that reconciles it, uncomfortably\n\n**Mike McGlone: \"Copper, gold, Bitcoin... they're all sock puppets to the S&P 500 right now.\"**\n\nThat is the sharpest single sentence on the list and it cuts against the crypto thesis harder than any bear case. If gold, copper and Bitcoin are all just expressions of equity risk appetite, then none of them is carrying independent information, and Bitcoin in particular has no bid of its own. It goes up when the Nasdaq goes up and it does not decouple when it matters.\n\nThe problem for Bitcoin specifically is that gold at least got paid. Same alleged sock-puppet status, 4 percent day.\n\n## Mandelbrot on positioning, and he is honest about the discomfort\n\n**\"Genuinely feeling uncertain here wrt to crypto majors\u2026 Definitely expect some knee jerk movement in the next 24-48 hours (which is probably a fakeout). My guess is the first move is up so just keep that in mind wrt positioning.\"**\n\nHis disclosure is complete: nothing on until October expiry, nimble on re-entries to August 21s. His invalidation is **65.8**.\n\nAnd the admission that makes it worth reading: **\"as much as I've been pounding the table on QQQ > BTC, Nasdaq up over 3% today does scream risk on and it would be pretty annoying to lose on a short term play on that backdrop.\"**\n\nThat is a named analyst carrying the equities-over-Bitcoin trade and saying out loud that a 3 percent index day makes it uncomfortable. He does not abandon it, the correct behaviour, but he does not pretend it is costless either.\n\n## The Morgan Stanley supply-chain map\n\nPer Melvin, a useful structural piece that has nothing to do with crypto. Morgan Stanley mapped the AI infrastructure value chain into owners and operators at the top and **seven build-out layers** underneath.\n\nAt the top: the hyperscalers, data centre REITs, private equity including Blackstone and Brookfield, enterprises, and neoclouds including CoreWeave and Nebius. These write the capex cheques.\n\nThe seven layers below, with the less obvious names being the point:\n\n- **Semi production:** Nvidia and AMD for GPUs, TSMC-adjacent foundries, ASML and Applied Materials for capital equipment, Micron and SK Hynix for memory\n- **Server components:** passives from **Yageo and Murata**, thermal from **Sanyo Denki**, PCB substrates from **Unimicron**\n- **Network:** InfiniBand and Ethernet from Nvidia and Arista, optical and DCI routing from **Cisco and Ciena**\n- **Internal power and cooling:** liquid cooling from **Vertiv and CoolIT**, power electronics from **Siemens and Eaton**, uninterruptible power supply from **ABB and Legrand**\n\nHis conclusion is the one worth keeping: **value no longer concentrates at the GPU layer.** Capex is being distributed across seven distinct physical layers, so the picks-and-shovels set has expanded well beyond Nvidia into cooling, grid infrastructure and power generation.\n\nMelvin discloses he is bullish AI infrastructure and links to his own portfolio, so treat the framing as interested and the map as useful.\n\n## What to discount\n\nA significant share of this list is not analysis. There is a post soliciting a phone-blast campaign against a sitting senator, several positioning teases with no content, and the usual subscription funnels. Nik's August positioning update is promised rather than delivered.\n\n## The one variable that would change the call\n\nWhether Bitcoin ever decouples. McGlone's sock-puppet framing is falsifiable in the cleanest possible way: a session where equities fall and Bitcoin holds, or where equities rip and Bitcoin does not follow. It has now had four consecutive chances to differentiate itself on a rising tape and taken none of them, while gold took its chance and ran 4 percent. Until that changes, the Nasdaq-over-Bitcoin trade Mandelbrot is carrying has the evidence on its side, and Reidhead's Goldilocks case is an argument for owning equities rather than an argument for owning crypto.\n", "01kz9mthc8c5ydpyk9fmaavswg": "# Is Galaxy's $85M Loss Actually Good? The Data Centre Switched On The Rent\n\n**Source:** Milk Road, written by Chevy Cassar with analysis from their lead analyst M0xt ([open original](https://read.readwise.io/read/01kz9mthc8c5ydpyk9fmaavswg))\n\nThe best crypto earnings analysis of the week, and the reason is that it ignores the headline number and goes straight to the segment that changed.\n\n## The headline loss is beta, not a business\n\nGalaxy Digital reported an **$85 million net loss** for Q2. Almost all of it sits in one place: the **Treasury and Corporate segment ran $78 million of negative adjusted EBITDA**, and nearly all of that was **unrealised losses**, meaning paper markdowns on tokens and investments Galaxy still holds and has not sold. Crypto prices fell in the quarter, so the value of Galaxy's own stack fell with them.\n\nTheir lead analyst told members to ignore that number **hours before the release**, a real call rather than a retrospective one. His framing: headline losses and firm-wide adjusted EBITDA are crypto-beta noise, and the story sits in two segments.\n\n## Segment one, and it is now a utility\n\nGalaxy took an old Bitcoin mining site in West Texas, spent years converting it into an AI data centre campus called **Helios**, and **leased it to CoreWeave for 15 years.** In Q2 it started charging rent.\n\n| Data centre segment | Q2 |\n|---|---|\n| Leasing revenue | $18.9 million, the first ever billed |\n| Adjusted gross profit | $20.1 million, up from $3.1 million in Q1 |\n| Adjusted EBITDA | $11.5 million, the segment's first positive quarter ever |\n| Phase I critical IT load in service | all 133 MW |\n| Guided Phase I billing from Q3 | roughly $80 million per quarter |\n| Project-level adjusted EBITDA margin | above 90 percent |\n\nCritical IT load is glossed properly in the source as the power that reaches the servers rather than the cooling around them, which matters because it is the billable unit.\n\nThe guidance is the news. Their analyst went in **looking for any comment framing Q3 near $60 million and got $80 million.** Q2 only captured part of Phase I because capacity was still being handed over during the quarter, so the full run rate had not landed yet.\n\nA 90 percent project-level margin on contracted rent under a 15-year lease is a utility. It deserves a completely different multiple from anything that mines, and this is the clearest single piece of evidence that the miner-to-landlord conversion is real rather than a narrative.\n\n## Segment two held up better than the asset class\n\n**Digital Assets adjusted gross profit came in at $66 million, up 34 percent quarter over quarter**, while **Galaxy's own trading volumes fell 7 percent and industry-wide volumes fell by double digits.** Segment adjusted EBITDA improved from negative $19 million to negative $11 million, which was the analyst's other checkpoint.\n\nGrowing gross profit 34 percent while your own volumes shrink means the mix improved, not the market. And Galaxy signed a multi-year agreement with **BNY, a custodian overseeing more than $60 trillion in assets**, to support staking on its digital asset platform.\n\n## The part nobody had scheduled: Texas froze the queue\n\nThis is the most consequential item in the letter and it is not about Galaxy's quarter at all.\n\nGalaxy's power pipeline now sits at **5,730 MW across Texas** after picking up three more sites. But **only 800 MW of that is contracted under an executed lease.** The other **4,930 MW is identified but uncontracted**, and most of it sits behind ERCOT's grid connection queue.\n\nThen, on **August 3, Governor Abbott ordered Texas regulators to audit every data centre in that queue before any more advance, with no completion deadline announced. ERCOT paused its Batch Zero study the same day.**\n\nThe scale of what is now stuck: **474 GW of connection requests waiting, against a grid whose record peak demand is roughly 91 GW.** More than five times the entire peak load of Texas is sitting in a queue that just stopped moving.\n\nThe letter draws the right conclusion in one line: it **caps how fast Galaxy's pipeline can grow, and makes the 830 MW already approved at Helios a lot more valuable.**\n\nThat is the trade. Every announced-but-unconnected megawatt in Texas just got repriced downward, and every already-approved megawatt became scarce.\n\n## The contrarian call, and it follows from the freeze\n\nTheir analyst goes directly against what his own readers want. Investors are asking for the next tenant on that 830 MW to be announced immediately. **He thinks they should stop asking**, because waiting means better terms on a lease that runs 15 years or more.\n\nWith the queue frozen, that is not patience for its own sake. It is a landlord holding the only approved inventory in the state.\n\n## The dilution, sized rather than gestured at\n\nThe honest risk: every phase needs an equity cheque from Galaxy on top of the debt. Working backward from the **Phase II funding terms**, the analyst sizes that requirement **near $1 billion across all three phases, against roughly $7 billion of levered free cash flow over the life of the leases.** On his numbers that is about a **35 percent return on the equity Galaxy puts in.**\n\nSizing the dilution against the cash flow it buys is the correct way to frame it, and most coverage of this sector does not bother.\n\n## Three things they say to watch\n\n1. Whether **Q3 leasing revenue actually lands near $80 million**\n2. Whether a **Phase I refinancing** shows up\n3. Whether that **830 MW finds a tenant**\n\nAll three are dated, checkable and specific, which makes this piece gradeable rather than merely persuasive.\n\n## Where to push back\n\nThe analysis is bullish and the outlet sells a subscription to the analyst whose calls it is showcasing, so the selection is theirs. The $80 million guidance is company guidance rather than a print, and Phase I revenue has been billed for exactly one partial quarter.\n\nThe bigger unexamined risk is counterparty. Helios is 15 years of contracted rent from **CoreWeave**, whose own economics are the weakest in the complex, carrying roughly $99 billion of obligations against a market capitalisation near $50 billion, term loans in the 11 to 15 percent range and no positive free cash flow projected until 2029. A 90 percent margin on a lease is only as good as the tenant's ability to pay it for fifteen years, and the letter never raises that.\n\n## Also in the issue\n\n**Mike McGlone: copper, gold, Bitcoin are all sock puppets to the S&P 500 right now.** That is the cleanest statement available of why Bitcoin has no independent bid.\n\n**Raoul Pal:** humans have been apex compute for 200,000 years and that era is now ending.\n\n**Lyn Alden:** the first person charged for insider trading around US military strikes was not a politician or an insider, it was a soldier.\n\n## The one variable that would change the call\n\nThe Q3 leasing print against $80 million. Everything bullish here rests on one quarter of partial billing plus company guidance, and the full-quarter number arrives in November. Land near $80 million at above 90 percent margin and Galaxy is a data centre landlord that happens to have a crypto desk attached, worth a utility multiple. Miss it materially and the conversion story goes back to being a promise. Watch the CoreWeave credit alongside it, because the lease is only worth what the tenant can service.\n"}, "deepDives": ["01kz6cqnpq9dmp04b2bmsam265", "01kz6dcw3j4czybzarfkcqnb4g", "01kz6h7hmswmxrpz3s7z05cfc3", "01kz6vgs8kn7y01yk3amk43kcp", "01kz72dyx6b3k68vqx4mkdkqf6", "01kz7qwryy365s4awdkprvf8zb", "01kz9b2cvxwx0npaq44jby364v", "01kz9b9cmjc3ff1h5mx6ar8msj", "01kz9mthc8c5ydpyk9fmaavswg"], "calls": [{"id": "2026-08-05-PM-sockpuppet-1", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "crypto", "ticker": "$BTC", "name": "No independent bid", "kind": "thesis", "call": "Copper, gold and Bitcoin are all sock puppets to the S&P 500 right now, so Bitcoin has no independent bid. A fourth consecutive session of the equity complex rising without it supports the reading. Mandelbrot expects a knee-jerk move over 24 to 48 hours, probably a fakeout with the first move up, invalidation at 65.8.", "direction": "neutral", "levels": "65.8 invalidation", "due": "2026-09-30", "attribution": "Mike McGlone, positioning from Mandelbrot", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-kashkari-1", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "macro", "ticker": null, "name": "Kashkari", "kind": "policy", "call": "Neel Kashkari said the Fed should begin raising rates now, backing 25 basis points and warning that delay could force more aggressive tightening if inflation becomes entrenched. He was one of three dissenters last week. BofA forecasts hikes in September, October and December; Citi forecasts a September hold then cuts in October, December and January.", "direction": "event", "levels": null, "due": "2026-12-31", "attribution": "Neel Kashkari via Walter Bloomberg", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-humanoid-1", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "stocks", "ticker": "$CCXI", "name": "Humanoid supply chain", "kind": "thesis", "call": "The humanoid constraint has moved to idle precision-manufacturing capacity. Mitsubishi is converting an idle engine plant to roughly 1,000 humanoids a month, Unitree lists within weeks holding 85 percent of 2025 shipments with more than $20 billion of subsidies, Hyundai targets a few thousand a year via Boston Dynamics, and Tesla is ramping Optimus. CCXI and Agility are the only US-listed pure-play, via a higher-risk SPAC structure.", "direction": "long", "levels": null, "due": "2027-06-30", "attribution": "Wayne Liang", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-hormuz-2", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "macro", "ticker": null, "name": "Hormuz announcement", "kind": "catalyst", "call": "A joint Iran-Oman announcement on the Strait of Hormuz is made inside a week, at 70/30, up from 60/40 on the route agreement. Iran's foreign ministry says the route geography is agreed and the announcement is in its final stage if certain third parties do not interfere, while adding the agreement in itself does not mean the strait is secure. The 30 is the third-party clause.", "direction": "event", "levels": "70/30", "due": "2026-08-12", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-gold-1", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "macro", "ticker": null, "name": "Gold", "kind": "thesis", "call": "Gold's bid is monetary rather than risk appetite, at 60/40 against Mike McGlone's view that copper, gold and Bitcoin are all sock puppets to the S&P 500. Gold futures rose more than 4 percent above $4,300 while the war premium left oil, equities printed records and margins hit a FactSet record. Equities and gold rising together for two sessions while oil falls is a monetary story.", "direction": "long", "levels": "60/40", "due": "2026-10-31", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-fed-1", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "macro", "ticker": null, "name": "September FOMC", "kind": "thesis", "call": "September is a hold at 55/45, down from near-certainty a month ago. Kashkari is publicly campaigning for an immediate 25bp hike after dissenting last week, Kalshi has hold at 49 and a hike at 47, and the hike looks like a question of timing rather than direction. Citi's cut scenario requires something to break that has not broken.", "direction": "neutral", "levels": "55/45", "due": "2026-09-30", "attribution": "house", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-disp-1", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "stocks", "ticker": null, "name": "Leadership dispersion", "kind": "thesis", "call": "Leadership is not tech despite a 3 percent Nasdaq day. Year to date SPY is up 2.59 percent while QQQ is down 1.93, XLK down 2.34 and SMH down 11.03. Next buys named are homebuilders, education providers, micro and small-business enablers and aging-population REITs, after selling Mastercard for a 13 percent gain and adding Arm and Marvell.", "direction": "neutral", "levels": null, "due": "2026-10-31", "attribution": "AskLivermore", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-cuban-1", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "crypto", "ticker": "$BTC", "name": "Digital gold thesis", "kind": "thesis", "call": "Mark Cuban sold the majority of his Bitcoin because the debasement hedge failed its test. During the Iran war geopolitical risk spiked and the dollar slid, and Bitcoin fell while gold went to records. He is reportedly more disappointed in Bitcoin than Ethereum. The digital-gold framing is the backbone of institutional adoption, so the next marginal buyer needs a different reason.", "direction": "short", "levels": null, "due": "2026-12-31", "attribution": "Mark Cuban via Milk Road", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-SPX-1", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "stocks", "ticker": null, "name": "S&P extension", "kind": "level", "call": "Bank of America says the S&P has hit its 2026 target of 7,741, with technicals pointing to 8,000, then 8,234 and potentially 8,541, and 7,500 as key support. It warns weak August-to-October seasonality, stretched momentum and Friday's payrolls could cap it. The entire S&P candle closed outside the upper Bollinger band for the first time since March 2024.", "direction": "long", "levels": "7500 support, 8000/8234/8541 targets", "due": "2026-12-31", "attribution": "Bank of America, Heisenberg on the Bollinger reading", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-SPCX-3", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "stocks", "ticker": "$SPCX", "name": "SpaceX 2027 revenue", "kind": "thesis", "call": "SpaceX 2027 revenue reaches about $135 billion against a Street near $100 billion, assuming 5 percent month-over-month growth off the guided $8.5 billion December month. The risk is that cloud contracts carry 90-day cancellation provisions, which Munster dismisses on the grounds that inference is in the top of the first.", "direction": "long", "levels": null, "due": "2028-03-31", "attribution": "Gene Munster", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-SPCX-2", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "stocks", "ticker": "$SPCX", "name": "SpaceX funding gap", "kind": "thesis", "call": "SpaceX has a roughly $350 billion funding gap and Nvidia customer financing has to fill it. Capacity goes from about 1.4GW today to 2GW by end-2026 and close to 10GW in 2027, all Nvidia, implying roughly $500 billion of capex at $50-60bn per gigawatt against $100 billion of cash and just $3 billion of first-half operating cash flow. Anthropic and Google spot GPU deals run about $26 billion of annual recurring revenue.", "direction": "short", "levels": null, "due": "2027-06-30", "attribution": "SouthernValue", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-GLXY-1", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "crypto", "ticker": "$GLXY", "name": "Galaxy Helios", "kind": "catalyst", "call": "Galaxy reported an $85 million net loss driven almost entirely by $78 million of negative adjusted EBITDA in Treasury and Corporate from unrealised markdowns, while the data centre segment turned profitable for the first time. Helios billed $18.9 million of first-ever leasing revenue, adjusted gross profit went from $3.1 million to $20.1 million, segment EBITDA was positive $11.5 million, and all 133MW of Phase I is in service. Guidance is roughly $80 million a quarter from Q3 at above 90 percent project margin.", "direction": "long", "levels": null, "due": "2026-11-30", "attribution": "Galaxy Digital via Milk Road", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-ERCOT-1", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "crypto", "ticker": null, "name": "Texas queue freeze", "kind": "catalyst", "call": "Governor Abbott ordered Texas regulators on August 3 to audit every data centre in the ERCOT interconnection queue before any more advance, with no completion deadline, and ERCOT paused its Batch Zero study the same day. There are 474 gigawatts of connection requests against a grid whose record peak demand is roughly 91 gigawatts. This caps pipeline growth and makes already-approved capacity scarce, including Galaxy's 830MW at Helios.", "direction": "event", "levels": null, "due": "2026-12-31", "attribution": "Milk Road relaying Abbott and ERCOT", "status": "open", "resolution": null, "resolved_edition": null}, {"id": "2026-08-05-PM-CXMT-1", "date": "2026-08-05", "edition": "2026-08-05-PM", "channel": "stocks", "ticker": "$MU", "name": "CXMT pricing", "kind": "catalyst", "call": "Apple negotiated with CXMT over mobile D
